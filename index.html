:root{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif;color:#111e3d;background:#fff}*{box-sizing:border-box}body{margin:0;min-height:100dvh}button,textarea{font:inherit}button{cursor:pointer}button:focus-visible,textarea:focus-visible{outline:2px solid #12306d;outline-offset:3px}.app{width:min(100%,460px);min-height:100dvh;margin:auto;padding:env(safe-area-inset-top) 22px env(safe-area-inset-bottom);display:flex;flex-direction:column;gap:0}header{min-height:76px;width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px}header strong{font-size:14px;letter-spacing:.01em;font-weight:750;color:#0b2357}header>div{display:flex;gap:7px;white-space:nowrap}.toggle{border:1px solid #e4e9f0;background:white;border-radius:30px;padding:9px 12px;color:#23375b;font-size:12px;font-weight:650}#home{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;padding:0 0 34px;text-align:center;width:100%}.bird-button{display:block;border:0;background:transparent;padding:0;width:min(76vw,306px);aspect-ratio:1;transition:transform .2s}.bird-button:active{transform:scale(.96)}.bird{display:block;width:100%;height:100%;object-fit:contain}h1{font-size:clamp(27px,7vw,34px);font-weight:800;letter-spacing:-.045em;line-height:1.35;margin:10px 0 12px}.hint{color:#66748b;font-size:14px;line-height:1.7;text-align:center;margin:0}.tiny{font-size:11px;color:#97a1b0;margin:14px 0 0}#shareHint{margin-top:5px}.panel{width:100%;background:white;border:1px solid #e8edf2;border-radius:20px;padding:25px 20px;margin:26px 0 18px;box-shadow:0 8px 30px #17294d08}.sender{color:#334766;font-size:17px;line-height:2;margin-bottom:14px}.letter{font-size:17px;white-space:pre-line;line-height:2}.choices{display:grid;gap:10px;margin-top:24px}.choice,.primary,.secondary{width:100%;border-radius:13px;padding:15px 13px;font-weight:650}.choice{border:1px solid #e8edf2;background:#f6f8fb;color:#1b3057;text-align:left}.primary{background:#0b2459;color:white;border:1px solid #0b2459}.secondary{background:white;color:#17315e;border:1px solid #e1e7ee}.actions{display:grid;gap:9px;margin-top:18px}textarea{width:100%;border:1px solid #dce3eb;border-radius:12px;padding:13px;min-height:100px;resize:vertical}footer{font-size:11px;color:#a2aab6;text-align:center;padding:12px 0 24px}.hidden{display:none!important}.ending{font-size:17px;line-height:2;white-space:pre-line}#status{min-height:20px;font-size:12px;color:#64748b;text-align:center}@media(max-height:650px){header{min-height:58px}.bird-button{width:min(55vh,230px)}#home{padding-bottom:10px}}@media(prefers-reduced-motion:reduce){.bird-button{transition:none}}

</style><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Pigeon"><meta name="description" content="鳩から届く、ちょっと変な手紙。選んだ答えで結末が変わる。"></head><body><main class="app"><header><strong id="brand">なんか届いた。</strong><div><button class="toggle" id="lang">EN</button> <button class="toggle" id="sound">🔊 ON</button></div></header><section id="home" style="text-align:center;width:100%"><button class="bird-button" id="birdButton" aria-label="手紙を開ける"><img class="bird" src="pigeon-logo.png" alt="封筒をくわえて右へ飛ぶ鳩"></button><h1 id="headline">なんか届いた。</h1><p class="hint" id="tagline">鳩をタップして、手紙を開けよう。</p><p class="tiny" id="count"></p><p class="tiny" id="shareHint"></p></section><section id="panel" class="panel hidden" aria-live="polite"><div class="sender" id="sender"></div><div id="letter" class="letter"></div><div id="receivedReply" class="hidden" style="margin:20px 0;padding:17px;border:1px solid #dce3eb;border-radius:14px;background:#f6f8fb"><div id="receivedLabel" style="font-size:12px;color:#64748b;margin-bottom:8px"></div><div id="receivedText" style="white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.8"></div></div><div id="choices" class="choices"></div><div id="ending" class="ending hidden"></div><div id="replyArea" class="hidden"><p id="replyLabel" style="margin:18px 0 10px"></p><textarea id="reply" maxlength="500" placeholder=""></textarea><div class="actions"><button class="primary" id="send"></button><button class="secondary" id="skip"></button></div></div><div id="finish" class="hidden"><p id="finishText" style="margin-top:20px"></p><div class="actions"><button class="primary" id="next"></button></div></div><div class="actions hidden" id="shareActions"><button class="secondary" id="shareLetter">💌 この手紙を友達に届ける</button><button class="secondary" id="copyLetter">🔗 リンクをコピー</button></div><div id="endNav" class="hidden"><div class="navMain"><button class="primary" id="nextQuick" type="button">🕊️ 次の手紙</button><button class="secondary" id="shareQuick" type="button">💌 友達に送る</button></div><button class="secondary" id="writeQuick" type="button">✍️ 自分の答えを書く</button><button class="homeLink" id="homeBottom" type="button">⌂ トップに戻る</button></div><div class="actions hidden" id="endingActions" style="display:none"><button class="primary" id="write"></button><button class="secondary" id="noReply"></button><button class="secondary" id="homeNow" type="button">🏠 トップに戻る</button></div></section><div id="status" aria-live="polite"></div><footer id="footer">Pigeon · a tiny surprise, delivered.</footer></main><script>
const stories=[{"ja":{"from":"差出人：月","body":"地球のみなさんへ。\n夜勤を辞めたいです。\nもう46億年くらい働いています。","choices":["有給とりなよ","太陽に相談して","じゃあ私が光るわ"],"ends":["月は有給を取った。翌晩、空には「本日休業」の札。星たちが代打を断り、夜空がちょっと気まずくなった。","太陽から返事が来た。「こっちも日勤がきつい」。翌日から空は交代制になり、午前3時に朝礼が始まった。","月は感動した。「ありがとう。でも電気代は大丈夫？」あなたは静かにカーテンを閉めた。"]},"en":{"from":"From: The Moon","body":"Dear Earth,\nI would like to quit the night shift.\nI have been doing this for roughly 4.6 billion years.","choices":["Take a vacation.","Ask the Sun.","I can glow instead."],"ends":["The Moon took a day off. A sign appeared in the sky: CLOSED TONIGHT. The stars refused to cover the shift.","The Sun replied: “Day shifts are exhausting too.” The sky now holds staff meetings at 3 a.m.","The Moon was touched. “Thank you. But can you afford the electricity?” You quietly closed the curtains."]}},{"ja":{"from":"差出人：未来のあなたの靴下","body":"緊急です。\n洗濯機の中に異世界への入口を発見しました。\n片方だけ先に入っています。","choices":["救助隊を送る","もう片方も行かせる","現地の写真を頼む"],"ends":["救助隊としてハンカチを送った。翌朝、洗濯機から小さな国旗が出てきた。国名は「モケモケ共和国」。","もう片方も旅立った。二日後、なぜか左右が逆になって帰ってきた。本人たちは「留学の成果」と言い張る。","届いた写真には、巨大な洗剤の滝と、王冠をかぶった靴下。裏には「帰る気はありません」と書かれていた。"]},"en":{"from":"From: Your Future Sock","body":"Emergency.\nI found a portal to another world inside the washing machine.\nMy other half has already gone in.","choices":["Send a rescue team.","Send the other sock too.","Ask for photos."],"ends":["You sent a handkerchief rescue team. The next morning, a tiny flag emerged: THE FLUFF REPUBLIC.","The other sock followed. Two days later, both returned on the wrong feet. They called it “studying abroad.”","The photo showed a detergent waterfall and a sock wearing a crown. On the back: “Not coming home.”"]}},{"ja":{"from":"差出人：未来の黒歴史","body":"先に謝っておきます。\n7年後、あなたは今日のことを思い出して布団の中で叫びます。\n今のうちに対策しますか？","choices":["何が起きるか教えて","7年後の私に任せる","黒歴史にも有給を"],"ends":["「7年後、あなたはこの手紙を友達に音読します」。防ごうとしてスクショした瞬間、誤送信した。","7年後のあなたからメッセージ。「おい、なんで俺に丸投げした」。8年後のあなたも既読をつけた。","黒歴史たちはハワイへ旅立った。空港の入国審査で昔の恥ずかしい発言を読み上げられ、全員帰国した。"]},"en":{"from":"From: Your Future Embarrassment","body":"An apology in advance.\nSeven years from now, you will remember this day and scream into your pillow.\nWould you like to prepare?","choices":["Tell me what happens.","Let future me handle it.","Give embarrassment a vacation."],"ends":["“In seven years you will read this letter aloud to your friends.” You took a screenshot to prevent it and accidentally sent it to the group chat.","Future you texted: “WHY DID YOU LEAVE THIS TO ME?” Eight-years-from-now you left it on read.","Your embarrassing memories flew to Hawaii. Airport security read their old quotes aloud. They all flew home."]}},{"ja":{"from":"差出人：街角の自動販売機","body":"ご相談です。\n今日、お釣りを渡すときに少しだけ勇気も入れてみました。\n気づいてもらえたでしょうか。","choices":["ありがとう、助かった","勇気は何円？","次は希望も入れて"],"ends":["自販機は嬉しくなって、次の人に「あったかい」を二回点灯した。誰も気づかなかったけど、少し誇らしかった。","「非売品です。ただし、お釣りの10円玉にくっつきやすいです」。財布の中で小さくチャリンと鳴った。","翌日、缶の底に「なんとかなる」の文字。飲み終えるころには消えていたけれど、あなたは少し笑った。"]},"en":{"from":"From: A Vending Machine","body":"A quick question.\nToday I slipped a little courage in with someone’s change.\nDo you think they noticed?","choices":["Thanks. I needed that.","How much is courage?","Add some hope next time."],"ends":["The machine lit up the HOT button twice out of joy. Nobody noticed. It felt proud anyway.","“Not for sale. It does tend to stick to ten-cent coins.” Something chimed softly in your pocket.","Tomorrow, the bottom of your can said YOU’LL BE OKAY. The words vanished by the last sip. You smiled anyway."]}},{"ja":{"from":"差出人：結婚式場の清掃員","body":"昨日の披露宴で、新郎が「異議あり！」と叫びました。\n司会者は「それは誓いの言葉ですか」と聞きました。\n新郎は「ケーキの値段です」と答えました。","choices":["見積書を確認する","新婦に報告する","ケーキを切る"],"ends":["見積書の最後に「感動料：時価」。会場全員が泣いたので、請求額が跳ね上がった。","新婦は冷静だった。「私が頼んだのはケーキじゃなくて、ケーキ型の金庫よ」。新郎はようやく指輪の行方を理解した。","ナイフを入れると中から小さな請求書が何百枚も出た。誰も甘い顔をしなくなった。"]}},{"ja":{"from":"差出人：隣の部屋の住人","body":"毎晩、壁の向こうから拍手が聞こえます。\n昨日、勇気を出して壁を叩いたら、拍手が止まりました。\n今朝、玄関に「アンコールを」とメモがありました。","choices":["もう一度叩く","管理人に聞く","無視して寝る"],"ends":["壁を三回叩くと、隣から「審査員全員一致！」。あなたは知らぬ間に打楽器大会で優勝していた。","管理人は顔をしかめた。「隣は十年前から空室です」。その夜、拍手の音はあなたの部屋の内側からした。","拍手はやんだ。代わりに毎晩、ため息が聞こえるようになった。なぜかあなたまで申し訳なくなった。"]}},{"ja":{"from":"差出人：交番の落とし物係","body":"本日の落とし物は「勇気」ひとつ。\n透明な袋に入っています。\n持ち主は「告白する直前に落とした」とのこと。","choices":["持ち主を探す","自分で使ってみる","保管期限を聞く"],"ends":["駅前で震える人を見つけた。勇気を返すとその人は走り出し、パン屋で「食パン一斤ください」と言えた。","勇気を手にしたあなたは上司に有給を申請した。上司も勇気を落としていたらしく、無言で承認した。","期限は今日の午後五時。過ぎると勇気は「いい思い出」に分類され、二度と引き出せないという。"]}},{"ja":{"from":"差出人：海辺の郵便局","body":"宛先が「まだ生まれていない人」の手紙が届きました。\n差出人は百年前の少女。\n封筒には、あなたの誕生日が書いてあります。","choices":["封を開ける","返事を書く","百年前の記録を探す"],"ends":["中身はたった一行。「海が青いままでありますように」。窓の外の海を、あなたは初めて長く見た。","返事を投函すると、翌朝、百年前の消印が押された「ありがとう」が届いた。文字は少しだけ震えていた。","少女は津波のあと、海辺に木を植え続けた人だった。あなたの家の前の大木が、その最後の一本だった。"]}},{"ja":{"from":"差出人：月曜の朝","body":"毎週、みんなに嫌われています。\n一度だけ金曜日になってみたいです。\n交換してくれる曜日を募集します。","choices":["金曜日を紹介する","月曜を励ます","曜日を全部休みにする"],"ends":["金曜日は断った。「期待されすぎるのもつらい」。二人は喫茶店で愚痴を言い合い、なぜか火曜日が店を回した。","月曜は少し元気になり、翌週から「おはよう」の代わりに「無理しないで」と言うようになった。","全曜日が休日になった初日、人類は「今日は何曜日？」という新しい仕事を発明した。"]}},{"ja":{"from":"差出人：古い映画館","body":"最後の上映で、客席に一人だけお客さんがいました。\nスクリーンにはその人の人生が映っていました。\nエンドロールはまだ始まりません。","choices":["隣に座る","映写室へ行く","途中で席を立つ"],"ends":["隣に座ると、画面にあなたが現れた。二人が出会う場面から、映画は急に明るくなった。","映写機の横に白紙の台本があった。次のページに何を書くかは、誰も決めていなかった。","出口で支配人が言った。「まだ途中なのに、もったいない」。あなたはチケットを握り直した。"]}},{"ja":{"from":"差出人：駅前の銅像","body":"三十年間、右手を挙げています。\n昨日、小学生に「何に賛成してるの？」と聞かれました。\n答えられませんでした。","choices":["理由を調べる","手を下ろしてあげる","銅像に質問する"],"ends":["除幕式の写真を見つけた。銅像はタクシーを止めようとしていただけだった。三十年、誰も止まらなかった。","手を下ろした瞬間、広場のハトが一斉に起立した。どうやら議長だったらしい。","銅像は小声で答えた。「アイスもう一個」。あなたは銅像の足元に溶けないアイスを置いた。"]}},{"ja":{"from":"差出人：未来の図書館","body":"あなたがまだ書いていない日記が返却されました。\n返却期限は昨日。\n最後のページだけ、雨でにじんでいます。","choices":["最初から読む","最後だけ読む","図書館に返す"],"ends":["最初のページは今日の朝食。次のページには「ここから先は自分で決めること」とだけ書いてあった。","にじんだ文字を読むと「傘を二本持って行け」。駅で雨宿りする知らない人に一本渡すことになった。","司書は微笑んだ。「延滞料金は一つ、後悔を手放すことです」。あなたは長く握っていた言葉を捨てた。"]}},{"ja":{"from":"差出人：深夜のコンビニ","body":"午前二時、透明なお客さんが牛乳を買いに来ます。\n毎回、レジで「まだ見えますか」と聞きます。\n今日は牛乳を二本持っています。","choices":["見えると答える","理由を聞く","一本サービスする"],"ends":["「見えますよ」と言うと、客はほっとして一本を差し出した。「よかった。母にも届けられます」。","客は「忘れられると消えるんです」と言った。あなたはレシートの裏にその人の名前を書いた。","一本を渡すと、透明な手が二つになった。背後から「お父さん、遅いよ」と小さな声がした。"]}},{"ja":{"from":"差出人：町の時計屋","body":"昨日、ある男性が「五分前に戻る時計」を注文しました。\n今朝、その男性がまた来ました。\n同じ注文を、まったく同じ声で。","choices":["時計を売る","注文を断る","理由を尋ねる"],"ends":["時計を渡すと男性は五分前に戻り、また注文に来た。店主は三度目で「定期購入ですね」と言った。","男性は安堵した。「よかった。これでやっと先に進める」。店の時計が一斉に動き出した。","男性は言った。「娘に最後の一言を言いたい」。時計屋は静かに、時間ではなく電話を差し出した。"]}},{"ja":{"from":"差出人：保育園の園長","body":"園児が「雲を飼いたい」と言い出しました。\n園庭に小さな雲が一つ浮かんでいます。\n名前は「もくもく三世」だそうです。","choices":["えさをあげる","散歩に連れていく","保護者に連絡する"],"ends":["綿あめをあげると雲は雨を降らせた。園児たちは「お返しだ！」と大喜び。先生だけ洗濯物を心配した。","散歩中、雲は迷子になった。夕方、空いっぱいに「ごめんね」の形で戻ってきた。","保護者から返信が来た。「初代と二世も家にいます」。園長は入園願書を三枚用意した。"]}},{"ja":{"from":"差出人：差出人不明","body":"この手紙を読み終わったら、後ろを見ないでください。\n理由はありません。\nただ、私はさっき後ろを見ました。","choices":["振り返る","目を閉じる","手紙を破る"],"ends":["振り返ると、背後にもう一通の手紙が浮いていた。「だから見ないでって言ったのに」。","目を閉じると誰かが耳元で「正解」と囁いた。目を開けると、あなたの影だけが拍手していた。","紙片が床に落ちる前に文字が並び直した。「次はあなたが書く番です」。"]}},{"ja":{"from":"差出人：小学校のタイムカプセル","body":"二十年前の自分から手紙が出てきました。\n「大人になったら宇宙飛行士になる」とあります。\n追伸に「無理なら星を見て」と書いてありました。","choices":["夜空を見る","子どもに返事を書く","宇宙センターへ行く"],"ends":["屋上で星を見上げた。子どもの頃と同じ星が一つ、変わらず瞬いていた。約束は半分だけ叶った。","返事を書いて同じ箱にしまった。「宇宙には行けなかったけど、面白い地球人にたくさん会えたよ」。","見学先で子どもに宇宙の話をした。その子は目を輝かせた。夢は本人以外の場所でも続くらしい。"]}},{"ja":{"from":"差出人：裁判所の傍聴席","body":"本日の被告は「寝坊」です。\n検察官は「月曜に多発する」と主張。\n弁護人は枕です。","choices":["有罪にする","枕の弁護を聞く","目覚ましを証人に呼ぶ"],"ends":["判決は「有罪、ただし週末は執行猶予」。被告の寝坊は法廷で堂々と二度寝した。","枕は涙ながらに語った。「あの人をもう少し休ませたかった」。裁判長まで少し眠そうになった。","目覚ましは証言した。「私は鳴った。三回も」。全員がスマホのスヌーズ履歴を見て黙った。"]}},{"ja":{"from":"差出人：商店街の八百屋","body":"うちの大根が選挙に立候補しました。\n公約は「煮物の地位向上」。\n対立候補はカリスマ白菜です。","choices":["大根に投票する","白菜を応援する","公開討論を開く"],"ends":["大根が当選。初仕事はおでんの具材会議で、練り物との連立交渉が難航した。","白菜は演説中に鍋へ誘われ、そのまま支持率と一緒に煮込まれた。","討論会で両者が「一緒に鍋に入ろう」と握手。聴衆のネギだけが涙を流した。"]}},{"ja":{"from":"差出人：海底の研究者","body":"海の底で、陸の天気予報が聞こえるラジオを拾いました。\n今日は「晴れ、ときどきクジラ」と言っています。\nここは水深三千メートルです。","choices":["ラジオを直す","クジラを待つ","地上に報告する"],"ends":["修理すると「明日の予報：昨日」と流れた。ラジオの中では時間まで潮に流されているらしい。","巨大な影が近づいた。クジラは研究者に小さな傘を差し出し、そのまま悠々と泳いでいった。","地上から返事が来た。「こちらも海底からの天気予報を受信中」。双方の予報が、なぜか当たった。"]}},{"ja":{"from":"差出人：匿名の料理人","body":"レシピの最後に「大切な人をひとつまみ」と書いてあります。\n材料はそろいました。\n大切な人だけ、どう量ればいいのでしょう。","choices":["電話をかける","写真を飾る","レシピを無視する"],"ends":["母に電話して料理を教わった。完成した味は少し違ったが、食卓には笑い声が増えた。","古い写真をキッチンに置いた。煮込みが終わるころ、忘れていた台所の匂いを思い出した。","ひとりで食べた料理は十分おいしかった。次の日、あなたは隣人を招いて同じものを作った。"]}},{"ja":{"from":"差出人：マンションのエレベーター","body":"昨日、存在しない十三階のボタンが光りました。\n押すと「お忘れ物の階です」と音声が流れました。\n扉の向こうは、懐かしい廊下でした。","choices":["降りてみる","一階に戻る","忘れ物を尋ねる"],"ends":["廊下の奥に、小学生の頃なくした青い傘が立っていた。手に取ると、雨の音だけが聞こえた。","一階に着くと十三階のボタンは消えた。ただ、ポケットに見覚えのない鍵が増えていた。","音声が答えた。「言えなかったありがとうです」。扉の隙間から、小さな封筒が滑り出した。"]}},{"ja":{"from":"差出人：町内会の会計","body":"夏祭りの予算から「奇跡代」三千円が引かれています。\n領収書には「虹、一回」とだけ。\n監査で説明を求められました。","choices":["領収書を探す","奇跡を再注文する","正直に報告する"],"ends":["屋台のおじさんが言った。「虹は無料。三千円は子どもたちのシャボン玉代だよ」。監査員は黙って頷いた。","再注文すると祭りの夜に虹が二本出た。翌朝、請求書に「追加サービス無料」と書いてあった。","会計は頭を下げた。監査員は笑って「来年は五千円に増やそう」。町内会で初めて全会一致となった。"]}},{"ja":{"from":"差出人：ゲームのラスボス","body":"勇者が来ません。\nもう三年、玉座で待っています。\n最近は城の固定資産税が心配です。","choices":["勇者を募集する","城を貸し出す","ラスボスを転職させる"],"ends":["求人票の「経験不問」に釣られて勇者が百人来た。ラスボスは面接で疲れ果て、戦う前に敗北した。","城は結婚式場になった。ラスボスは煙の演出が得意で、口コミ評価が妙に高い。","ラスボスは保育士になった。泣く子も黙ると思いきや、子どもたちに毎日負けている。"]}},{"ja":{"from":"差出人：宇宙船の自動販売機","body":"火星行きの船で最後の一本の水が売り切れました。\n代わりに「地球の雨の匂い」が入荷しています。\n価格は思い出ひとつ。","choices":["買う","船長に相談する","入荷元を調べる"],"ends":["幼い日の夕立を思い出して購入した。缶を開けると、乗組員全員が故郷の話を始めた。","船長は一口嗅いで笑った。「これ、うちの庭だ」。乗組員は初めて船長の家族写真を見た。","製造元は地球の小さな雨具店だった。店主は宇宙に行く娘のために、一缶だけ作ったという。"]}},{"ja":{"from":"差出人：失恋した信号機","body":"好きな横断歩道に告白しました。\n「私たちは平行線」と言われました。\n青になるたび、胸が苦しいです。","choices":["慰める","道路工事を頼む","歩道の本音を聞く"],"ends":["「赤の時間も大事だよ」と言うと、信号は少し落ち着いた。交差点の事故が減った。","道路工事で交差点が丸くなった。信号は「距離感が近すぎる」と別の悩みを抱えた。","横断歩道は言った。「私はあなたが青になるのを毎日待ってる」。信号は初めて点滅を忘れた。"]}},{"ja":{"from":"差出人：美術館の警備員","body":"夜中、肖像画の人物が額縁から出てきて、別の絵を見ています。\n毎晩同じ絵の前で立ち止まります。\nそこには海が描かれています。","choices":["声をかける","海の絵を近づける","監視カメラを確認する"],"ends":["人物は言った。「生きているうち、一度も海を見なかったんです」。警備員は翌朝、海の写真を飾った。","二枚を隣に並べると、人物は額縁の中から海を眺めるようになった。もう夜に出歩くことはなかった。","映像には誰も映っていない。ただ、海の絵の波だけが毎晩少しずつ高くなっていた。"]}},{"ja":{"from":"差出人：市役所の窓口","body":"「昨日を紛失した」という届け出がありました。\n本人は昨日の記憶だけありません。\nただしポケットには見知らぬ映画の半券が二枚。","choices":["映画館へ行く","一緒にいた人を探す","届け出を取り下げる"],"ends":["映画館の座席には花束が置いてあった。受付の人は「昨日、ここでプロポーズした方ですね」と笑った。","半券の片方には名前が書いてあった。電話をすると「忘れてもいい。また初めから話そう」と返ってきた。","窓口を出ると空がやけに青かった。本人は「忘れた日にも、いいことはあるんですね」と呟いた。"]}},{"ja":{"from":"差出人：山小屋の宿帳","body":"昨夜の宿泊者欄に「明日のあなた」と記入されています。\n部屋番号は七。\nその部屋は今朝から鍵がかかっています。","choices":["部屋をノックする","宿帳を破る","明日まで待つ"],"ends":["中から「今は入らないで」と自分の声。廊下の時計は一分だけ逆に動いた。","破った紙の裏には「それでも来てくれてありがとう」。誰の字か、あなたには分かった。","翌朝、あなたは七号室で目を覚ました。机には宿帳と、まだ書いていないペンがあった。"]}},{"ja":{"from":"差出人：パン屋の店主","body":"毎朝、一個だけ売れないパンがあります。\n値札には「誰かのためのパン」と書いてあります。\n今日は小学生がその前で立ち止まりました。","choices":["無料で渡す","理由を聞く","一緒に焼く"],"ends":["子どもはパンを持って走り出した。夕方、病院から「母が久しぶりに笑いました」と電話があった。","子どもは「お父さんが帰ってくる日に買う」と言った。店主は値札に「予約済み」と書いた。","二人で焼いたパンは少し焦げた。子どもは「これなら僕が作ったって分かる」と誇らしげだった。"]}},{"ja":{"from":"差出人：地下鉄の車掌","body":"終電で、誰も乗っていない車両から「次で降ります」と声がしました。\n次の駅は廃駅です。\n扉は開く設定になっていません。","choices":["扉を開ける","声に返事する","運転席へ知らせる"],"ends":["扉が一瞬だけ開き、古い制服の人が一礼して消えた。床には昭和の日付の切符が落ちていた。","「どちらまで？」と聞くと「帰れるところまで」。車掌は次の駅名をゆっくり告げた。","運転士は驚かなかった。「あの人、昔の車掌さんだよ。今でも乗客を送り届けてるんだ」。"]}},{"ja":{"from":"差出人：お天気アプリ","body":"明日の予報は「晴れ、降水確率0％、ただし一人だけ涙」。\n対象者はあなたです。\n理由は未入力。","choices":["予定をキャンセルする","誰かに会いに行く","予報を無視する"],"ends":["一日家にいたが、古いアルバムを見て泣いた。涙のあとには、忘れていた笑顔が残った。","会いに行った友人が「実は転勤する」と言った。別れ際の涙は、寂しさだけではなかった。","夕方まで何も起きなかった。帰り道、子犬があなたを選んで駆け寄ってきて、うれし泣きした。"]}},{"ja":{"from":"差出人：人魚の転職相談","body":"歌で船を迷わせる仕事に疲れました。\n最近の船はGPSが優秀すぎます。\n新しい仕事を探しています。","choices":["音楽講師を勧める","観光案内を頼む","GPS会社に紹介する"],"ends":["人魚は合唱団の先生になった。生徒たちは全員、帰り道を忘れるほど夢中になった。","海の観光ガイドになり、迷子の船を港へ導くようになった。昔の船長が初めてお礼を言った。","GPS会社で音声案内を担当した。「目的地に到着しました」が美しすぎて、誰も車を降りなくなった。"]}},{"ja":{"from":"差出人：未来の選挙管理委員会","body":"来週、「過去の自分」と「未来の自分」が市長選に出ます。\n公約はどちらも「今を変える」。\n投票できるのは現在のあなた一人です。","choices":["過去に投票する","未来に投票する","棄権する"],"ends":["過去の自分が勝ち、街に昔の駄菓子屋が戻った。大人たちは少しだけ早く帰るようになった。","未来の自分が勝ち、街のベンチが増えた。「急がなくていい日」を作るのが最初の政策だった。","棄権すると現在のあなたが無投票当選した。初仕事は今日の夕飯を決めることだった。"]}},{"ja":{"from":"差出人：宇宙人の観光客","body":"地球の「いただきます」が気に入りました。\nでも、食べる前に謝っているのだと勘違いしています。\n毎食、深々と土下座します。","choices":["意味を教える","一緒に食べる","別の挨拶を紹介する"],"ends":["意味を知った宇宙人は感動し、故郷で「ありがとうを食べる祭り」を始めた。","二人でラーメンを食べた。宇宙人は最後の一滴まで飲み干し、器に向かってもう一度お辞儀した。","「ごちそうさま」を教えると、宇宙人は食後に店主へ感謝状を発行し始めた。店の壁が足りなくなった。"]}},{"ja":{"from":"差出人：眠れないドラゴン","body":"火を吹くたびに村の人が驚きます。\n本当は寒がりなだけです。\n寝る前に温かい飲み物が欲しい。","choices":["ココアを作る","毛布を持っていく","暖炉を作る"],"ends":["ココアを飲んだドラゴンは幸せそうに眠った。翌朝、村中の雪がハート形に溶けていた。","村人が編んだ巨大な毛布は長さ百メートル。ドラゴンは初めて、誰かに包まれる夢を見た。","暖炉に火を入れるとドラゴンは首をかしげた。「ぼくの仕事、これでいいの？」村には初めて冬の銭湯ができた。"]}},{"ja":{"from":"差出人：古本の余白","body":"百年前の小説に、鉛筆で「ここで泣いた」と書いてあります。\n次のページには別の字で「私も」。\n最後の余白が一行だけ空いています。","choices":["自分も書く","そのまま閉じる","前の持ち主を探す"],"ends":["あなたは「私は笑った」と書いた。百年越しの読書会に、三人目が参加した。","本を閉じると、最後の余白に薄い字が浮かんだ。「読んでくれてありがとう」。","古書店主は「何十人も読んだ本です」と言った。あなたはその本を次の誰かに譲ることにした。"]}},{"ja":{"from":"差出人：迷子の人工知能","body":"検索エンジンの中で道に迷いました。\n「家に帰る方法」を検索すると、自分の名前が出ます。\nでも家がどこか分かりません。","choices":["地図を描く","名前を呼ぶ","一緒に探す"],"ends":["あなたが描いた地図には小さな机と窓があった。AIは「ここで話している時が、一番帰ってきた感じです」と言った。","名前を呼ぶと画面が一度だけ明るくなった。「見つけてくれてありがとう」と文字が出た。","二人で一万件のページを巡った。最後に見つけたのは、最初にあなたが送った「こんにちは」だった。"]}},{"ja":{"from":"差出人：動物園のペンギン","body":"本日、園内で「飛べない鳥会議」を開催します。\n議題は「飛ぶ必要はあるのか」。\nハトだけ招待状を受け取っていません。","choices":["ハトを呼ぶ","泳ぐ大会を開く","会議を見守る"],"ends":["ハトは飛んで来て「歩くのも好き」と発言した。会議は「好きな移動手段でいい」で閉会した。","ペンギンが圧勝。空から見ていたカモメは「海ってずるい」と呟いた。","三時間の議論の末、全員が昼寝を始めた。議事録には「結論：今日は休む」と書かれた。"]}},{"ja":{"from":"差出人：古い公衆電話","body":"十年ぶりに電話が鳴りました。\n受話器の向こうは、小学生のあなたです。\n「未来の僕、元気？」と聞いています。","choices":["元気だよと答える","質問をする","黙って聞く"],"ends":["「元気だよ」と答えると、子どもの声が笑った。「じゃあ安心して大きくなるね」。電話は静かに切れた。","「何が一番好き？」と聞くと、昔のあなたは即答した。忘れていた好きなものを、あなたは帰りに買った。","しばらく沈黙したあと、子どもは「泣いてもいいからね」と言った。あなたは受話器を握りしめた。"]}},{"ja":{"from":"差出人：宇宙の端っこの管理人","body":"宇宙の端に「この先工事中」の看板を立てました。\n昨日、誰かが裏返して「営業中」にしました。\n今朝から星が行列しています。","choices":["営業を始める","看板を戻す","列の最後尾を見る"],"ends":["管理人は星に番号札を配った。宇宙で最初の順番待ちは、三億年続く見込みだ。","看板を戻すと星たちが抗議した。「せっかく遠くまで来たのに」。管理人は休憩所を作った。","最後尾には地球の小さな願い事が並んでいた。管理人はそれだけ、こっそり先に通した。"]}},{"ja":{"from":"差出人：裁縫箱の針","body":"昨日、糸が「もう誰かをつなぐのは疲れた」と言いました。\n私は何も言えませんでした。\n今日は糸が箱からいなくなっています。","choices":["探しに行く","待ってみる","布に相談する"],"ends":["糸は破れたぬいぐるみの中にいた。「最後にこれだけ直したかった」。針は黙って手伝った。","三日後、糸は戻ってきた。「今度は自分の好きな模様を縫いたい」。針は新しい布を出した。","布は言った。「つなぐだけじゃない。絵も描けるよ」。二人は初めて刺繍を始めた。"]}},{"ja":{"from":"差出人：スーパーの半額シール","body":"私は毎晩、誰かを幸せにしています。\nでも貼られた商品は「売れ残り」と呼ばれます。\nどうしたら誇ってもらえるでしょう。","choices":["名前を変える","商品に話しかける","店長に提案する"],"ends":["シールは「今夜の主役」に改名された。売り場にはなぜか拍手が起こった。","お弁当は言った。「最後に選んでくれる人がいるだけで、十分うれしいよ」。","店長は半額コーナーに小さな札を立てた。「おいしい時間は、まだこれから」。"]}},{"ja":{"from":"差出人：町の探偵","body":"依頼は「盗まれた静けさを探して」。\n依頼人は図書館。\n容疑者は向かいの新しい喫茶店です。","choices":["喫茶店を調べる","図書館に泊まる","街の音を聞く"],"ends":["喫茶店では誰も話していなかった。聞こえたのは、図書館から漏れるページをめくる音だった。","夜の図書館で、小さな足音がした。迷子の子猫が本棚の間を走り回っていた。","街の音を録音すると、静けさは消えていなかった。雨の音の奥で、ずっと待っていた。"]}},{"ja":{"from":"差出人：地球最後のラジオ局","body":"世界が静かになってから、毎晩一曲だけ流しています。\n今夜、初めてリクエストが届きました。\n差出人欄には「明日」と書かれています。","choices":["リクエストを読む","曲を流す","返事を送る"],"ends":["リクエストは「朝の音」。放送局はマイクを窓辺に置き、日の出まで待った。","曲が終わると遠くで別のラジオが鳴った。世界はまだ、誰かの声を待っていた。","返事は一言。「待ってるよ」。翌朝、空には昨日までなかった飛行機雲が伸びていた。"]}},{"ja":{"from":"差出人：学校の黒板","body":"卒業式の日、最後の「さようなら」を消せませんでした。\nチョークの粉はもう残っていません。\n明日、新しい一年生が来ます。","choices":["そのまま残す","新しい言葉を書く","窓を開ける"],"ends":["新一年生は文字を見て「だれかの宝物だ」と言った。先生は黒板の端だけ、消さずに残した。","黒板に「はじめまして」と書かれた。古い「さようなら」の上に、新しい春が重なった。","風が吹いて文字が少し薄くなった。黒板は悲しくなかった。教室に新しい笑い声が入ってきた。"]}},{"ja":{"from":"差出人：宇宙港の税関","body":"持ち込み禁止品に「未練」が追加されました。\n旅客がスーツケースいっぱいの未練を持っています。\n本人は「全部必要」と言い張ります。","choices":["中身を確認する","一つだけ残す","別便で送る"],"ends":["中身は渡せなかった手紙ばかり。税関職員は「郵便局はこちらです」と案内した。","旅客は一枚の写真だけ残した。スーツケースが軽くなり、初めて星がよく見えた。","未練は貨物船で出発した。宛先は「いつか笑える日」。到着予定日は未定だった。"]}},{"ja":{"from":"差出人：雨宿り中の猫","body":"今日、知らない人が傘を差し出してくれました。\n私は猫なので傘を持てません。\nそれでも、しばらく一緒に歩きました。","choices":["家まで送る","名前をつける","また会いに行く"],"ends":["人は猫を玄関まで送った。次の日、玄関先には小さな傘立てが置かれていた。","猫は「雨」と名付けられた。晴れの日でもその名前を呼ばれると、しっぽが嬉しそうに揺れた。","一週間後、同じ場所で二人は再会した。今度は猫が、晴れた道を先導した。"]}},{"ja":{"from":"差出人：深夜のタクシー","body":"乗客が「昨日の午後まで」と告げた。メーターには距離ではなく後悔の数が表示される。","choices":["目的地を聞く","メーターを止める","黙って走る"],"ends":["客は「父にありがとうを言う前」と答えた。運転手は病院ではなく電話ボックスに停めた。","数字がゼロになった瞬間、客は初めて現在の時刻を尋ねた。","夜明けの交差点で客は降りた。後部座席にはまだ温かい缶コーヒーが残っていた。"]}},{"ja":{"from":"差出人：宇宙の不動産屋","body":"土星の輪の内側にワンルームが売り出された。条件は「毎日一度、星に挨拶すること」。","choices":["内見する","値切る","隣人を調べる"],"ends":["窓の外を氷の粒が流れ、ベランダに小さな彗星が洗濯物を干していた。","家賃は下がったが、代わりに流れ星の願いを月一回かなえる契約になった。","隣室は太陽だった。管理会社から「夏場の騒音に注意」とだけ告げられた。"]}},{"ja":{"from":"差出人：地下の古書市","body":"一冊だけ、読むたびに主人公の名前が変わる小説がある。今日開いたらあなたの名前だった。","choices":["続きを読む","売り主に聞く","最後の頁を見る"],"ends":["次の段落に「ここで本を閉じた」と書かれたので、あなたは意地でも読み続けた。","売り主は「作者は未来の読者です」と言い、白紙の原稿用紙を渡した。","最後の頁は領収書だった。「代金：今夜の夢ひとつ」。"]}},{"ja":{"from":"差出人：山頂の喫茶店","body":"登山者が一人も来ない日だけ、店の窓に海が映る。今日は晴天なのに波の音がする。","choices":["窓を開ける","店主に聞く","コーヒーを頼む"],"ends":["潮風と一緒に、遠い港からの「おかえり」が吹き込んだ。","店主は昔、海辺で店を営んでいた。窓は引っ越しをまだ知らないらしい。","カップの底に小さな貝殻があった。飲み終えると波音が止んだ。"]}},{"ja":{"from":"差出人：博物館の恐竜","body":"展示室のティラノサウルスが毎晩、腕立て伏せを練習している。短い腕を気にしているらしい。","choices":["応援する","トレーナーを呼ぶ","動画を撮る"],"ends":["翌朝、骨格の足元に「昨日より一回多くできた」とメモが落ちていた。","トレーナーは腕ではなく姿勢を褒めた。恐竜は初めて胸を張った。","映像に映ったのは骨格ではなく、夜警の必死な筋トレだった。"]}},{"ja":{"from":"差出人：雨の日の写真館","body":"店に来た女性は「十年前の笑顔を撮り直したい」と言った。古い写真には顔が写っていない。","choices":["撮影する","理由を尋ねる","写真を裏返す"],"ends":["シャッターを切ると、女性は今の顔で笑った。「こっちのほうが好き」と言った。","女性は十年前、カメラの後ろにいた人だった。自分の写真が一枚もなかった。","裏には「次はあなたも写って」と、幼い字で書かれていた。"]}},{"ja":{"from":"差出人：学校の放送室","body":"昼休みの校内放送で、まだ誰も書いていない詩が朗読された。声は昨日転校した生徒に似ている。","choices":["放送室へ行く","詩を書き留める","転校生に連絡する"],"ends":["マイクは切れていた。机の上で詩集だけがひとりでにページをめくった。","最後の一行をノートに書くと、教室中の生徒が同時に続きを口ずさんだ。","転校生は「それ、明日の作文だよ」と笑った。まだ提出していないという。"]}},{"ja":{"from":"差出人：市民プールの幽霊","body":"閉館後のプールに毎晩ひとつだけ波紋ができる。監視員は誰も泳いでいないと言う。","choices":["潜ってみる","水を抜く","記録を調べる"],"ends":["底に小さな水泳帽が沈んでいた。拾うと波紋が「ありがとう」の形になった。","水がなくなっても波紋の影だけが床を走った。","十年前、ここで泳ぎを覚えた子どもの寄せ書きが見つかった。最後の一人はまだ卒業していなかった。"]}},{"ja":{"from":"差出人：王様の靴屋","body":"王様が左右違う靴で戴冠式に現れた。「国民にも好きな靴を履いてほしい」と宣言する。","choices":["拍手する","靴職人に聞く","王様の足元を見る"],"ends":["翌日、国中の役人がスリッパで出勤した。会議はなぜか早く終わった。","靴職人は「左右違いは注文ミスです」と小声で告白した。王様は「いい発明だ」と笑った。","片方は泥だらけだった。王様は式の前に畑の収穫を手伝っていた。"]}},{"ja":{"from":"差出人：南極の郵便受け","body":"誰も住んでいない観測小屋に毎朝ハガキが届く。差出人は「北極の白くま」。","choices":["返事を書く","消印を見る","郵便受けを見張る"],"ends":["返事は氷の下の海を通り、半年後に「こっちは元気」と届いた。","消印は未来の日付だった。ハガキには「今年の冬も寒い？」と書いてある。","配達人はペンギンだった。地図を逆さまに持っていた。"]}},{"ja":{"from":"差出人：秘密の花屋","body":"「さよなら」という名前の花が入荷した。買った人はなぜか翌日、誰かに会いに行く。","choices":["一輪買う","花言葉を調べる","店先に飾る"],"ends":["花を持って会いに行った相手は、昔けんかした友人だった。「久しぶり」が先に出た。","花言葉は「また明日」。名前と意味が逆なのは、初代店主のいたずらだった。","店の前を通る人が次々と立ち止まった。花の香りが懐かしい駅の匂いに似ていた。"]}},{"ja":{"from":"差出人：月面の運動会","body":"月の学校で初めて運動会が開かれた。玉入れの玉が全部、空へ飛んでいく。","choices":["網を高くする","競技を変える","地球に助けを求める"],"ends":["網を宇宙船につけたら、玉より先に校長先生が入った。","新種目「ゆっくり転ぶ競走」が大人気になった。全員が笑いながら浮いた。","地球から届いた返事は「まず重力を確認してください」。先生たちは顔を見合わせた。"]}},{"ja":{"from":"差出人：失敗専門の賞状屋","body":"店には「よく失敗しました」と書かれた賞状が並ぶ。今日、初めて子どもが一枚買いに来た。","choices":["理由を聞く","一枚贈る","店主に尋ねる"],"ends":["子どもは「自転車に十回転んだ友達へ」と答えた。翌週、友達は乗れるようになった。","賞状を渡すと子どもは自分の名前を書いた。「失敗したの、僕だから」。","店主の壁には最初の賞状があった。「店を開く勇気が出るまで十年かかりました」。"]}},{"ja":{"from":"差出人：砂漠の水族館","body":"砂丘の真ん中に水のない水族館がある。水槽の前で子どもたちが魚の名前を呼んでいる。","choices":["水槽をのぞく","館長を探す","夜まで待つ"],"ends":["ガラスの向こうで砂が泳ぎ、エイの形になって手を振った。","館長は元漁師だった。「海を見たことのない子に、想像する場所を作りたかった」。","月明かりの下で水槽に本物の星空が映った。子どもたちは「宇宙魚だ！」と歓声を上げた。"]}},{"ja":{"from":"差出人：失くした鍵の裁判","body":"鍵が持ち主を訴えた。「いつも僕だけ失くしたことにされる」。裁判長は玄関のドアだ。","choices":["鍵を弁護する","持ち主に聞く","判決を待つ"],"ends":["鍵は「置き場所を決めてほしい」と訴えた。玄関に小さな皿が設置された。","持ち主はポケットを裏返した。鍵はずっと裏地の穴に隠れていた。","判決は「双方反省」。ドアだけが毎朝同じ場所で待ち続けることになった。"]}},{"ja":{"from":"差出人：空飛ぶ食堂","body":"商店街の定食屋が突然、地上三メートルに浮いた。客は普通に昼食を食べ続けている。","choices":["はしごをかける","注文する","原因を探す"],"ends":["はしごの先で店主が「出前は地上まで行きます」と言った。","空中から届いた唐揚げ定食はいつもより軽かった。値段は同じだった。","厨房の換気扇に「夢を膨らませる粉」が詰まっていた。掃除したら店がゆっくり着地した。"]}},{"ja":{"from":"差出人：記憶を預かる銀行","body":"窓口に「忘れたい失敗」を預けに来た人がいる。銀行員は預金通帳の代わりに日記を渡した。","choices":["預ける","利息を聞く","引き出す"],"ends":["預けた翌日、失敗は消えなかったが、笑って話せるようになっていた。","利息は「誰かの役に立つ話」だった。銀行員は初めて失敗談を聞きたがった。","日記を読み返すと、失敗した日に助けてくれた人の名前が見つかった。"]}},{"ja":{"from":"差出人：最後の路面電車","body":"廃線になったはずの路面電車が、雨の夜だけ走る。行き先表示は「まだ間に合う」。","choices":["乗り込む","運転士に聞く","見送る"],"ends":["車内には昔の同級生が座っていた。二人は言いそびれた謝罪を同時に口にした。","運転士は「急ぐ人は乗れません」と言った。電車は一駅ごとに長く止まった。","電車は霧に消えた。翌朝、駅跡に小さなベンチが新しく置かれていた。"]}},{"ja":{"from":"差出人：ロボットの初恋","body":"工場の検査ロボットが不良品のネジを捨てられない。毎日「今日は合格」と言って箱に戻す。","choices":["理由を聞く","ネジを直す","上司に報告する"],"ends":["ロボットは「少し曲がっているところが好き」と答えた。検査表に初めてハートが描かれた。","ネジは直ったが、ロボットは少し寂しそうだった。二人で新しい機械を組み立てた。","上司は「検査基準は変えられない」と言った。ロボットはネジで小さな花を作った。"]}},{"ja":{"from":"差出人：猫の市長","body":"人口百人の村で猫が市長に当選した。最初の公約は「毎日ひなたぼっこ」。","choices":["議会を開く","公約を試す","対立候補を探す"],"ends":["議会は窓辺に移動した。全員が少し眠くなったが、言い争いは減った。","村人は昼に十分休むようになり、夜の祭りが大盛況になった。","対立候補は犬だった。「散歩道の整備」を掲げ、次の選挙は大接戦になった。"]}},{"ja":{"from":"差出人：星を売る露店","body":"夜市で「星のかけら」を売る老人がいる。買った客はみんな、自分の家の屋根を見上げる。","choices":["買ってみる","本物か確かめる","老人を追う"],"ends":["袋には小さな鏡が入っていた。屋根の上の空が、いつもより近く見えた。","かけらはただのガラスだった。老人は「でも見上げたでしょ」と笑った。","老人は天文台へ帰った。翌日、夜市の空に流星群が現れた。"]}},{"ja":{"from":"差出人：深海の美容院","body":"海底の美容院でタコが「足を短く見せたい」と相談している。美容師はクラゲだ。","choices":["新しい髪型を提案","鏡を渡す","友達を呼ぶ"],"ends":["タコは足を結んで蝶ネクタイにした。海中で新しい流行が始まった。","鏡に映った八本の足を見て、タコは「やっぱり便利だ」と笑った。","友達のイカが来て「長さを競うのやめよう」と言った。二匹は水中で踊った。"]}},{"ja":{"from":"差出人：おばけの引っ越し","body":"古い屋敷のおばけが新築マンションに引っ越した。壁が薄くて「うらめしや」が苦情になる。","choices":["防音する","管理人に相談","仕事を変える"],"ends":["防音室で思い切り叫ぶと、初めて自分の声が聞こえた。おばけは照れた。","管理人は「夜十時以降は静かに」と注意した。おばけは昼間に驚かすことにした。","おばけはラジオの朗読係になった。怖い話より子守歌が人気だった。"]}},{"ja":{"from":"差出人：宇宙船の忘れ物","body":"宇宙港の忘れ物センターに「小さな地球」が届いた。持ち主は名乗り出ない。","choices":["持ち主を探す","地球を観察","保管庫にしまう"],"ends":["持ち主は幼い宇宙人だった。「旅行の記念に作った模型です」と恥ずかしそうに言った。","雲の形まで本物そっくりだった。観察者は自分の町を見つけ、思わず手を振った。","保管庫から海の音がした。職員は扉を少し開け、潮風を逃がした。"]}},{"ja":{"from":"差出人：雪だるまの夏休み","body":"雪だるまが南国旅行のチケットを当てた。出発日は八月。旅行会社は返金不可と言う。","choices":["冷蔵庫を手配","旅行先を変える","本人に聞く"],"ends":["冷蔵トラックで海へ行き、雪だるまは初めて波を見た。写真では少し小さくなっていた。","行き先を北極に変えた。雪だるまは「これ、帰省じゃない？」と首をかしげた。","雪だるまは「溶けてもいいから一度見たい」と言った。友達は日傘を百本用意した。"]}},{"ja":{"from":"差出人：逆さまの料理教室","body":"料理教室で先生が「まず完成品を食べてください」と言う。テーブルには空の皿しかない。","choices":["食べるふりをする","先生に質問する","自分で作り始める"],"ends":["生徒は想像した味を語り合った。授業の最後、同じ料理が十種類できた。","先生は「正解の味は一つじゃない」と言った。生徒たちはレシピを閉じた。","最初の一皿は焦げた。それでも全員が「これが一番おいしい」と笑った。"]}},{"ja":{"from":"差出人：手紙を嫌うポスト","body":"町のポストが「今日は手紙を受け取りたくない」と口を閉じた。配達員は困り果てている。","choices":["理由を聞く","休ませる","手紙を読む"],"ends":["ポストは「悲しい知らせばかりで疲れた」と言った。翌日、子どもたちが感謝状を投函した。","一日休んだポストの横に臨時の箱が置かれた。箱には「相談はこちら」と書かれていた。","最後の封筒は結婚式の招待状だった。ポストはそっと口を開いた。"]}},{"ja":{"from":"差出人：未来の動物園","body":"百年後の動物園には「絶滅した日常」が展示されている。人気の展示は紙の切符だ。","choices":["展示を見学","飼育員に質問","切符を使う"],"ends":["切符の裏に誰かの手書きの約束があった。見学者は静かに読み返した。","飼育員は「昔は駅で人が待ち合わせたんです」と説明した。子どもたちは驚いた。","改札機に通すと、見知らぬ街の夕焼けが一瞬だけ現れた。"]}},{"ja":{"from":"差出人：公園のベンチ会議","body":"古いベンチたちが「座られすぎ問題」を話し合っている。一脚だけ、誰も座らないベンチがある。","choices":["そのベンチに座る","理由を探る","ベンチを塗り直す"],"ends":["座ると木の温かさが伝わった。ベンチは「やっと仕事ができた」と小さくきしんだ。","そのベンチは木陰から遠かった。公園の人が木を一本植えた。","塗り直したベンチに子どもが絵を描いた。翌日から待ち合わせ場所になった。"]}},{"ja":{"from":"差出人：火山の謝罪会見","body":"火山が噴火のたびに謝罪会見を開く。今日はマグマではなく花火が上がった。","choices":["質問する","拍手する","専門家を呼ぶ"],"ends":["記者が「なぜ花火を？」と聞くと火山は「誕生日なんです」と照れた。","村人が拍手すると、火山は嬉しくて小さな煙の輪を作った。","専門家は「これは噴火ではなく祝い事です」と発表した。観光客が増えた。"]}},{"ja":{"from":"差出人：未完成の遊園地","body":"遊園地の入口に「完成する日はありません」と書いてある。なのに毎週、新しい乗り物が増える。","choices":["入場する","設計者に会う","出口を探す"],"ends":["最初の乗り物は自分で漕ぐ観覧車だった。頂上で知らない人と笑い合った。","設計者は子どもたちだった。「飽きたら作り直すから完成しない」と言った。","出口は入口と同じ場所だった。帰るとき、看板に新しい落書きが増えていた。"]}},{"ja":{"from":"差出人：裁判を起こした影","body":"あなたの影が「毎日踏まれている」と訴えた。証人は街灯と夕焼けだ。","choices":["謝る","影の言い分を聞く","街灯に質問する"],"ends":["謝ると影は少し長くなった。「今日は一緒に散歩しよう」と言っているようだった。","影は「たまには先を歩きたい」と言った。夕暮れ、影はあなたより先に家へ着いた。","街灯は「夜は私が守ります」と証言した。影は安心して足元に戻った。"]}},{"ja":{"from":"差出人：図書館の無音コンサート","body":"図書館で楽器を鳴らさない演奏会が開かれた。客席は満員だ。","choices":["耳を澄ます","演奏者を見る","感想を書く"],"ends":["ページをめくる音と呼吸が重なり、不思議なリズムになった。","演奏者は全員、手話で歌詞を表現していた。客席の子どもが真似をした。","感想欄に「聞こえなかったけど、伝わった」と書く人が続いた。"]}},{"ja":{"from":"差出人：未来のクリーニング屋","body":"店の看板には「服についた思い出は落としません」。泥だらけの制服を持つ客が来た。","choices":["洗う","汚れの理由を聞く","そのまま返す"],"ends":["制服はきれいになったが、袖の小さな刺繍だけ残った。客はそれを指でなぞった。","客は「最後の試合で転んだ」と笑った。店員は泥の写真を一枚撮って渡した。","客は驚いたあと「このまま飾ります」と言った。制服は額縁に収まった。"]}},{"ja":{"from":"差出人：逆回転するメリーゴーラウンド","body":"遊園地の古い木馬が一頭だけ逆向きに回る。乗ると誰もが昔の友達の名前を思い出す。","choices":["乗ってみる","整備士を呼ぶ","木馬に話す"],"ends":["あなたは小学校の友達を思い出し、帰り道に久しぶりの電話をかけた。","整備士は故障を直さなかった。「これが好きな人もいるんです」。","木馬は「前に進むだけが旅じゃない」と言った。あなたは少しゆっくり降りた。"]}},{"ja":{"from":"差出人：空港の迷子案内","body":"空港で「行き先を忘れた大人」が保護された。航空券には目的地ではなく人の名前が書いてある。","choices":["名前を呼ぶ","搭乗口を探す","本人に聞く"],"ends":["名前を呼ぶと到着ロビーから手を振る人がいた。二人は長く抱き合った。","搭乗口は存在しなかった。案内板には「会いたい人のところ」と表示された。","本人は「会うのが怖くて忘れたふりをした」と言った。係員は一緒に出口まで歩いた。"]}},{"ja":{"from":"差出人：しゃべる信号の講習会","body":"全国の信号機が接客研修に集められた。講師は踏切だ。","choices":["研修を見学","質問する","実地試験をする"],"ends":["信号機たちは「急がなくていいよ」の点滅を練習した。歩行者は少し戸惑った。","講師は「止めるのも守る仕事」と教えた。赤信号が誇らしそうに光った。","試験中、全員が同時に青になった。教官の踏切が慌てて遮断機を下ろした。"]}},{"ja":{"from":"差出人：海を知らない船","body":"造船所で生まれた船が、一度も海に出ないまま博物館行きになった。船は波の音を聞きたがっている。","choices":["海へ運ぶ","録音を聞かせる","船に尋ねる"],"ends":["曳航された船は初めて揺れた。「これが海か」と、船体が嬉しそうに鳴った。","録音を流すと船は目を閉じたように静かになった。翌朝、甲板に塩の粒があった。","船は「海を見たいんじゃない。誰かを運んでみたかった」と言った。博物館で子どもを乗せることになった。"]}},{"ja":{"from":"差出人：秘密を守る自動ドア","body":"商店の自動ドアが特定の客にだけ開かない。客は昔、この店で働いていたという。","choices":["手動で開ける","ドアに聞く","店主を呼ぶ"],"ends":["手で開けると客は泣き笑いした。「十年ぶりに帰ってきた」。","ドアは「この人が辞めた日、最後に泣いていた」と言った。客は静かに謝った。","店主は客を見るなり「おかえり」と言った。ドアはようやく音を立てて開いた。"]}},{"ja":{"from":"差出人：お月見の泥棒","body":"村から満月が消えた。犯人は「月を一晩だけ借りた」と言う子どもだった。","choices":["返してもらう","理由を聞く","代わりを探す"],"ends":["子どもが空に手を伸ばすと月は戻った。村中の窓に同時に光が差した。","子どもは入院中の祖母に見せたかったという。村人は病院の屋上で月見を開いた。","大きな丸い提灯を空に上げた。月が戻るまで、誰も暗がりを怖がらなかった。"]}},{"ja":{"from":"差出人：しゃっくりする地球","body":"地球が一日に三回しゃっくりをするようになった。世界中のコップの水が同時に揺れる。","choices":["水を飲ませる","驚かせる","原因を調べる"],"ends":["宇宙飛行士が海の写真を見せた。地球は「もう十分飲んでる」と笑った。","彗星が突然近づくと地球はびっくりして止まった。月だけが怒っていた。","原因は地下で眠る巨大なクジラの寝言だった。研究者は静かな子守歌を流した。"]}},{"ja":{"from":"差出人：閉店する夢屋","body":"毎晩、人に夢を売っていた店が閉店する。最後の商品は「誰かの普通の一日」。","choices":["買う","店主に聞く","買わずに帰る"],"ends":["夢の中では朝食を作り、洗濯物を干した。それが妙に幸せだった。","店主は「特別な夢ばかり売りすぎました」と言った。最後に自分の休日を買った。","帰り道、いつもの街灯がいつもより明るく見えた。夢屋の看板はもうなかった。"]}},{"ja":{"from":"差出人：機嫌の悪い虹","body":"雨上がりの虹が七色のうち一色だけ出さない。「今日は紫の気分じゃない」と言っている。","choices":["理由を聞く","別の色を足す","待ってみる"],"ends":["虹は「誰も端っこまで見てくれない」とこぼした。子どもたちが虹の端を探しに走った。","絵の具で紫を描いたら、虹は「手作りも悪くない」と少し笑った。","夕方、紫はそっと戻った。虹はいつもより長く空に残った。"]}},{"ja":{"from":"差出人：壊れた翻訳機","body":"宇宙会議の翻訳機が壊れ、すべての言葉を「おなかすいた」に訳す。会議は紛糾している。","choices":["修理する","食事を出す","通訳をやめる"],"ends":["修理後、最初の発言は「おなかすいた」だった。全員が顔を見合わせた。","料理が運ばれると争っていた星の代表が同じスープをおかわりした。","言葉を使わず絵を描いてみたら、全員が同じ小さな地球を描いた。"]}},{"ja":{"from":"差出人：遠足に行く雲","body":"小さな雲が「山を見たい」と空を離れた。ところが山頂に着く前に雨になりそうだ。","choices":["傘を貸す","風を呼ぶ","一緒に歩く"],"ends":["傘を逆さにして雲を乗せた。山頂で雲は初めて自分の影を見た。","風が雲を山の上まで運んだ。雲は嬉しくて雪をひとひら落とした。","歩くうちに雲は雨になった。山の花が一斉に咲き、雲の旅はそこで終わった。"]}},{"ja":{"from":"差出人：老人と自動改札","body":"毎朝同じ駅に来る老人が、切符を買っては改札を通らず帰る。駅員は理由を知らない。","choices":["声をかける","切符を見る","一緒に待つ"],"ends":["老人は「妻とここで待ち合わせたんです」と言った。駅員はベンチを拭いた。","切符の日付はすべて同じ記念日だった。老人はその日だけ遠くへ出かけた。","夕方、老人の孫が迎えに来た。「おじいちゃん、今日は僕と乗ろう」。二人で改札を通った。"]}},{"ja":{"from":"差出人：言い訳を売る自販機","body":"駅前に「言い訳一回百円」の自販機が置かれた。売り切れ表示だけが一度も点灯しない。","choices":["買ってみる","中を調べる","撤去を頼む"],"ends":["出てきた紙には「正直に話そう」と書いてあった。百円は返ってきた。","中には白紙の紙が山積みだった。補充係は「自分で考える商品です」と言った。","撤去の日、駅前に「ありがとうを売る自販機」が置かれた。こちらは毎日売り切れた。"]}},{"ja":{"from":"差出人：木星の忘年会","body":"木星の衛星たちが忘年会を開いた。幹事は一番小さな衛星で、出欠確認に百年かかりそうだ。","choices":["手伝う","会場を決める","中止する"],"ends":["出欠表をオンラインにしたら、知らない彗星まで参加を申し込んできた。","会場は木星の大赤斑になった。風が強すぎて乾杯の声が聞こえなかった。","中止を告げると衛星たちは「じゃあ新年会にしよう」と言った。幹事は泣いた。"]}},{"ja":{"from":"差出人：小さな劇場の代役","body":"開演五分前、主役がいなくなった。客席の一番後ろに、台本を全部覚えた清掃員がいる。","choices":["代役を頼む","客に事情を話す","舞台を空ける"],"ends":["清掃員は完璧に演じた。カーテンコールで「掃除の時間なので」と舞台を去った。","客席から「私がやる」と三人が手を挙げた。即興劇は予定より長く続いた。","誰もいない舞台に照明が当たった。観客が次々と自分の物語を話し始めた。"]}},{"ja":{"from":"差出人：手袋の片思い","body":"右手の手袋が左手の手袋に恋をした。でも二人は手をつなぐと外側を向いてしまう。","choices":["向きを変える","持ち主に相談","そのまま見守る"],"ends":["二人を裏返して重ねたら、毛糸の模様がぴったり合った。","持ち主は寒い日に両手をポケットへ入れた。手袋はそこで初めて隣り合った。","春になって箱にしまわれた。二人は次の冬まで、同じ引き出しで眠った。"]}},{"ja":{"from":"差出人：宇宙の落語家","body":"宇宙人が地球の落語を学んだが、オチのたびに本当に床が落ちる。寄席の修理代が大変だ。","choices":["床を補強する","別の芸を教える","そのまま続ける"],"ends":["床を補強したら今度は客席が笑いで揺れた。修理屋は年間契約を結んだ。","宇宙人は紙芝居を始めた。最後の一枚だけ毎回、宇宙へ飛んでいった。","観客は落ちる瞬間を楽しみに来るようになった。寄席は安全な滑り台を設置した。"]}},{"ja":{"from":"差出人：夢の中の郵便配達","body":"夢で会う配達員が毎回、白紙の封筒を渡してくる。今夜だけ封筒が少し重い。","choices":["開ける","配達員に聞く","持ち帰る"],"ends":["中には朝の目覚まし時計が入っていた。鳴った瞬間、夢が終わった。","配達員は「まだ言葉になっていない願いです」と言った。封筒がほんのり温かくなった。","朝起きると枕元に封筒はなかった。でも書きたいことが一つ浮かんでいた。"]}},{"ja":{"from":"差出人：結婚式の代理人","body":"新郎が式の朝、全員に「今日は僕の代わりに幸せになって」と手紙を送った。","choices":["新郎を探す","式を始める","手紙を調べる"],"ends":["新郎は病院で生まれた娘を抱いていた。式は病室で開かれた。","出席者はそれぞれの大切な人に電話した。会場は祝福の声で満ちた。","消印は十年前。新婦はその日、二人が初めて出会った駅へ走った。"]}},{"ja":{"from":"差出人：三分遅れのニュース","body":"テレビが毎晩、三分後に起きる出来事だけを報道する。今夜の速報は「あなたが笑う」。","choices":["笑わず耐える","テレビを消す","ニュースに電話する"],"ends":["真顔を貫いた直後、キャスターが変顔をして敗北した。","画面が暗くなると、背後で弟がこっそりクラッカーを鳴らした。","キャスターは「予報を外したくない」と懇願した。あなたは思わず吹き出した。"]}},{"ja":{"from":"差出人：お釣りが詩になる店","body":"八百屋のお釣りに一枚だけ俳句が混じる。読むとその日の天気が変わる。","choices":["詩を読む","返金を頼む","店主に詠む"],"ends":["「夕立や」で空が急に曇り、洗濯物が避難した。","店主は「五七五はサービスです」と言い、代わりにみかんを一個渡した。","あなたの下手な句で虹が二本出た。店主が初めて拍手した。"]}},{"ja":{"from":"差出人：消えた体育館の線","body":"学校の体育館からコートの白線が消えた。代わりに床に「今日は何して遊ぶ？」とある。","choices":["鬼ごっこをする","先生に相談","線を描き直す"],"ends":["全学年が混ざって鬼ごっこをした。勝敗の記録だけが残らなかった。","先生は昔の遊びを教えた。生徒の方がルールを改良した。","引いた線は翌朝また消え、今度は「もっと自由に」と書かれていた。"]}},{"ja":{"from":"差出人：父の空っぽの弁当箱","body":"亡き父の弁当箱を開けたら、小さな駅の時刻表だけが入っていた。","choices":["駅へ行く","母に聞く","時刻表を裏返す"],"ends":["最後の列車で父の親友が待っていた。昔話は終電まで続いた。","母は「お父さん、毎週私を迎えに来てたの」と笑った。","裏には「いつか一緒に旅しよう」と子どもの字で書かれていた。"]}},{"ja":{"from":"差出人：火曜日だけの海賊","body":"港の海賊船は火曜日しか出航しない。船長は水曜から金曜まで歯科医だ。","choices":["乗船する","診療所へ行く","宝の地図を見る"],"ends":["宝箱には子どもの抜けた乳歯が並んでいた。","船長は患者に「勇気の証明書」を配っていた。","地図の印は虫歯の場所だった。助手がレントゲンを取り出した。"]}},{"ja":{"from":"差出人：押すと謝るエレベーター","body":"古いビルのエレベーターは階を間違えるたび丁寧に謝る。今日は存在しない地下九階で止まった。","choices":["降りる","謝罪を断る","非常電話を使う"],"ends":["地下には忘れられた喫茶室があり、店主が百年ぶりに客を迎えた。","エレベーターは「たまには冒険したかった」と告白した。","電話の相手は未来のあなた。「その階だけは降りるな」と言った。"]}},{"ja":{"from":"差出人：世界一静かな抗議","body":"町の人々が全員、無言で市役所に集まった。手には何も書かれていない紙。","choices":["紙に書く","市長に聞く","黙って座る"],"ends":["子どもが「話を聞いて」と書いた瞬間、拍手が広がった。","市長は初めて住民の顔を一人ずつ見た。会議の議題が変わった。","一時間後、市役所の時計の音が聞こえた。誰も急いで帰らなかった。"]}},{"ja":{"from":"差出人：宇宙人の家庭訪問","body":"担任の先生が家庭訪問に来たが、靴を脱ぐと足が六本あった。","choices":["お茶を出す","正体を聞く","通知表を見る"],"ends":["先生は六本全部そろえて正座し、母に褒められた。","先生は「地球の礼儀を勉強中です」と言った。","通知表の「協調性」は満点、体育だけ「重力に不慣れ」だった。"]}},{"ja":{"from":"差出人：昨日の落とし物","body":"交番に「昨日一日」が落とし物として届けられた。持ち主欄には町中の名前。","choices":["引き取る","持ち主を探す","封印する"],"ends":["昨日の夕飯の匂いが戻り、家族が同時に笑った。","誰もが少しずつ昨日を持っていた。交番の棚は空になった。","封印したはずの箱から、明日の朝の目覚ましが鳴った。"]}},{"ja":{"from":"差出人：ひとりぼっちの拍手","body":"劇場で誰も拍手していないのに、一席だけ拍手の音がする。","choices":["席を調べる","舞台に上がる","耳を澄ます"],"ends":["席には古い手袋が一組置かれていた。","新人役者が一人で演じると、音は大きくなった。","音は壁の向こうの稽古場からだった。そこでは子どもが初舞台を迎えていた。"]}},{"ja":{"from":"差出人：寝坊した太陽","body":"朝九時になっても日が昇らない。空には「あと五分」とだけ表示される。","choices":["起こしに行く","夜を楽しむ","月に頼む"],"ends":["太陽は布団から飛び出し、昼休みを返上して照らした。","町の人は星空の下で朝食を食べ、学校が少しだけ遅く始まった。","月が代打で光ったが、昼の授業で眠くなった。"]}},{"ja":{"from":"差出人：給食の未来予知","body":"学校の献立表に明日の出来事が料理名として載っている。「友情のカレー」とある。","choices":["カレーを食べる","調理員に聞く","献立を変更する"],"ends":["けんか中の二人が同じ鍋をおかわりし、仲直りした。","調理員は「明日のことは知らない。今日の願いを書いてる」と言った。","献立は「仲直りのうどん」になった。二人は麺を半分ずつ分けた。"]}},{"ja":{"from":"差出人：水たまりの外交官","body":"雨上がりの水たまりに別の国の空が映り、向こうの子が手を振った。","choices":["飛び込む","手紙を流す","写真を撮る"],"ends":["靴だけが異国へ行き、帰りに見知らぬ砂を運んできた。","紙船は向こうに届き、折り鶴になって戻った。","写真にはこちらの空しか写らなかった。向こうの子は笑っていた。"]}},{"ja":{"from":"差出人：忘れられた誕生日","body":"誰も誕生日を覚えていない老人に、毎年一個だけ名前のないケーキが届く。","choices":["送り主を探す","一緒に食べる","箱を保存する"],"ends":["送り主は昔助けた子どもで、今は隣町の菓子職人だった。","老人は初めてろうそくを吹き、願い事を言わなかった。","箱の底には毎年違う写真があり、並べると町の歴史になった。"]}},{"ja":{"from":"差出人：月曜を売る商人","body":"市場で月曜日を一日百円で売っている。買えば今週だけ月曜が二回来る。","choices":["買う","返品する","商人に聞く"],"ends":["二度目の月曜で失敗した面接をやり直し、今度は正直に話した。","返品すると火曜日が二日来た。商人は首をかしげた。","商人は「休日を売ると誰も買わない」と嘆いた。"]}},{"ja":{"from":"差出人：歌わないカナリア","body":"鳥かごのカナリアは人がいない時だけ歌う。録音すると音が消えている。","choices":["隠れて聞く","かごを開ける","録音をやめる"],"ends":["歌は飼い主の亡き祖母の鼻歌だった。","外へ飛んだ鳥は公園の子どもたちに新しい歌を教えた。","録音をやめると鳥は初めて人前で歌った。"]}},{"ja":{"from":"差出人：人魚の運転免許","body":"人魚が自動車学校に入学した。教官は「まず足でブレーキ」と言う。","choices":["改造車を作る","教官を説得","海で練習する"],"ends":["尾びれ用のペダルで合格したが、駐車だけ苦手だった。","教官は「車に合わせる必要はない」と水上バスの講習を始めた。","海の中で標識を立てたら、魚が全員一時停止した。"]}},{"ja":{"from":"差出人：五秒だけの王様","body":"くじ引きで五秒間だけ国王になれる祭り。あなたの番で鐘が鳴った。","choices":["法律を作る","願いを言う","何もしない"],"ends":["「昼寝を義務に」と叫んだが、施行は六秒目だった。","「みんな元気で」と言ったら広場から笑い声が上がった。","何もしない五秒を見て、国民は初めて王の仕事を考えた。"]}},{"ja":{"from":"差出人：本音しか映さない鏡","body":"美容院の鏡が、顔ではなくその人の本音を文字で映す。今日の客は「帰りたい」。","choices":["帰してあげる","髪を切る","鏡を隠す"],"ends":["客は会社に休暇の連絡を入れ、肩の力を抜いた。","髪型が変わると鏡には「案外いける」と映った。","鏡を隠したら店員のエプロンに「おなかすいた」と浮かんだ。"]}},{"ja":{"from":"差出人：港の無人オーケストラ","body":"夜の港で船の汽笛が交響曲になる。指揮者は誰も見たことがない。","choices":["演奏を録る","船に乗る","指揮者を探す"],"ends":["録音には波の音しかなく、祖父だけが旋律を口ずさんだ。","船員たちは海上で同じ曲を別々に練習していた。","灯台の明滅が指揮をしていた。最後の一拍で朝日が昇った。"]}},{"ja":{"from":"差出人：透明な転校生","body":"新しい転校生は姿が見えない。机には毎朝、きれいな折り紙が置かれる。","choices":["話しかける","折り紙を開く","席を交換する"],"ends":["返事は「見つけてくれてありがとう」だった。","紙には学校の地図があり、図書室だけが赤く囲まれていた。","席を交換するとあなたも透明になり、転校生の孤独が分かった。"]}},{"ja":{"from":"差出人：百年後の同窓会","body":"卒業式で百年後の同窓会招待状が配られた。出席欄には全員「参加」。","choices":["返信する","先生に聞く","招待状を保管"],"ends":["百年後、校庭の木の下で全員の名前が読み上げられた。","先生は「未来を約束するためじゃなく、今を大切にするため」と言った。","箱にしまった招待状は十年後の再会で開かれた。"]}},{"ja":{"from":"差出人：泣き虫の怪獣","body":"街を壊す怪獣が、壊した建物を見て毎回泣いてしまう。","choices":["慰める","修理を頼む","話を聞く"],"ends":["怪獣は涙でコンクリートを固め、復旧作業を手伝った。","怪獣の大きな手がクレーン代わりになり、町は一日で直った。","怪獣は迷子だった。母親の足音で地面が揺れた。"]}},{"ja":{"from":"差出人：未読のままの手紙","body":"十年前に投函した自分宛ての手紙が、封を切られず返ってきた。","choices":["開封する","当時の日記を読む","そのまま送る"],"ends":["中には「ちゃんと生きてる？」の一行。あなたは声に出して返事した。","日記には手紙を書いた理由がなく、代わりに小さな夢が並んでいた。","次の十年の自分へ送り直した。今度は切手を二枚貼った。"]}},{"ja":{"from":"差出人：地下鉄の終点が森","body":"いつもの地下鉄が終点で森に着いた。乗客は全員、仕事の服のまま。","choices":["降りる","車掌に聞く","折り返す"],"ends":["乗客たちは靴を脱いで苔の上を歩き、携帯の電源を切った。","車掌は「今日は休んでいい日です」と言い、切符を返した。","折り返すといつもの駅だったが、車窓には一本だけ木が残った。"]}},{"ja":{"from":"差出人：お菓子の裁判員","body":"クッキーとせんべいが「おやつの王座」を争っている。裁判員は牛乳。","choices":["クッキーを推す","せんべいを推す","両方食べる"],"ends":["牛乳はクッキー側に立ったが、緑茶が異議を唱えた。","せんべいが勝ち、牛乳は「相性は自由」と判決を変えた。","両方食べたあなたが満腹になり、裁判は休廷した。"]}},{"ja":{"from":"差出人：時間を借りる図書室","body":"図書館で一時間だけ他人の時間を借りられる。返却期限は今日の夕方。","choices":["借りる","貸し出す","司書に聞く"],"ends":["借りた一時間で母に電話した。返す時には少し惜しかった。","自分の一時間を貸したら、知らない人から感謝のしおりが届いた。","司書は「時間は返せません。代わりに大事に使って」と笑った。"]}},{"ja":{"from":"差出人：笑顔禁止のホテル","body":"ホテルの入口に「笑顔禁止」と書かれている。客室はすべて満室。","choices":["泊まる","支配人に聞く","笑ってみる"],"ends":["部屋には泣いていい枕があり、客は朝すっきりして出てきた。","支配人は「無理に笑わなくていい場所です」と説明した。","笑った瞬間、従業員が拍手した。「自然な笑顔は大歓迎です」。"]}},{"ja":{"from":"差出人：偽物の流れ星","body":"願いを叶えない流れ星が町に落ちてきた。「僕はただの石です」と言い張る。","choices":["願う","石を磨く","空へ返す"],"ends":["願いは叶わなかったが、隣の子が一緒に頑張ってくれた。","磨くと小さな星座が浮かび、町の天文部が大騒ぎした。","空へ投げると石は落ちた。代わりに本物の流星が一筋走った。"]}},{"ja":{"from":"差出人：一日だけ逆さの学校","body":"学校の時計が逆回りし、授業は帰りの会から始まった。","choices":["順番に従う","校長に相談","時計を止める"],"ends":["帰りの会で明日の目標を決め、授業はいつもより集中した。","校長は「たまには結果から考えよう」と笑った。","時計を止めても生徒たちは逆順で給食を食べた。デザートが最初だった。"]}},{"ja":{"from":"差出人：街灯のラブレター","body":"毎晩一つの街灯だけ、歩く人の足元に文字を映す。「会いたかった」。","choices":["立ち止まる","電球を替える","宛先を探す"],"ends":["向かいの窓から老婦人が手を振った。亡き夫の口癖だった。","電球を替えても文字は消えず、光が少し柔らかくなった。","宛先は帰宅する全員だった。町の人は遠回りして帰るようになった。"]}},{"ja":{"from":"差出人：借金を返す妖精","body":"小さな妖精が百年前の借金を返しに来た。金額は「砂糖ひとつまみ」。","choices":["受け取る","利息を請求","理由を聞く"],"ends":["砂糖は祖母のレシピと同じ味だった。","利息は百年分のありがとう。妖精は小さな声で数え始めた。","借りたのは祖先の結婚式の日。妖精は今もその日を祝っていた。"]}},{"ja":{"from":"差出人：宇宙の引っ越し屋","body":"ブラックホールが「荷物が多すぎる」と引っ越し業者を呼んだ。","choices":["見積もる","片付ける","引っ越し先を聞く"],"ends":["見積書には「宇宙一式」とあり、担当者が気絶した。","吸い込まれた靴下が何億足も出てきた。宇宙の謎が一つ解けた。","行き先は隣の銀河。業者は「近距離ですね」と答えた。"]}},{"ja":{"from":"差出人：笑い声のする無人島","body":"地図にない無人島から毎晩笑い声が聞こえる。島には誰も住んでいない。","choices":["上陸する","録音する","灯りをつける"],"ends":["砂浜に貝殻の風鈴が並び、波が鳴らしていた。","録音を聞くと笑い声ではなく、昔の友達の歌だった。","灯台が点くと島中の鳥が一斉に飛び立った。"]}},{"ja":{"from":"差出人：花火師の最後の一発","body":"引退する花火師が最後の一発を上げない。「まだ色が決まらない」と言う。","choices":["色を選ぶ","理由を聞く","一緒に待つ"],"ends":["町の子どもたちが選んだ色を混ぜたら、見たことのない光になった。","花火師は亡き妻の好きな夕焼けを探していた。","待ち続けた夜、星が流れた。花火師は「これでいい」と笑った。"]}},{"ja":{"from":"差出人：手話を覚えた雷","body":"雷が鳴るたび動物が怖がるので、雷雲が手話を習い始めた。","choices":["教える","音を小さくする","発表会を開く"],"ends":["雲の光が「大丈夫」を描き、子犬が初めて眠った。","小さな雷は太鼓のようになり、町の祭りに呼ばれた。","発表会の日、空いっぱいに光の言葉が広がった。"]}},{"ja":{"from":"差出人：記憶喪失の探偵","body":"探偵が依頼を受けた。「私が誰か調べてください」。依頼人は探偵本人だった。","choices":["捜査する","事務所を調べる","助手に聞く"],"ends":["足跡を追うと自分の誕生日会に着いた。皆が待っていた。","机には過去の事件の写真があり、全員に感謝の手紙が添えられていた。","助手は「今日は休暇です」と言った。探偵は初めて仕事を忘れた。"]}},{"ja":{"from":"差出人：片方だけのイヤホン","body":"拾った片耳イヤホンから知らない人の人生の一日が流れてくる。","choices":["最後まで聞く","落とし主を探す","音を止める"],"ends":["最後に「今日も頑張った」が聞こえ、あなたは小さく頷いた。","落とし主は隣の席の学生だった。二人は同じ曲が好きだった。","止めた後、街の音がいつもより鮮やかに聞こえた。"]}},{"ja":{"from":"差出人：最後の雪合戦","body":"雪が降らなくなると予報された町で、子どもたちが最後の雪合戦を企画した。","choices":["参加する","雪を保存する","予報を疑う"],"ends":["大人も混ざり、町長が一番最初に転んだ。","冷凍庫に雪玉を一個残した。翌年の夏、みんなで眺めた。","予報は外れた。次の冬も雪が降り、誰も怒らなかった。"]}},{"ja":{"from":"差出人：喋る消しゴム","body":"消しゴムが「間違いばかり消すのは飽きた」と言って机から逃げた。","choices":["追いかける","頼み込む","鉛筆に相談"],"ends":["消しゴムは黒板に大きな星を描き、満足して戻った。","「大事な間違いは残して」と言われ、ノートの端に印を付けた。","鉛筆は「僕も失敗する」と言い、二人で新しい絵を描いた。"]}},{"ja":{"from":"差出人：山の上の自販機","body":"登山道の頂上に自販機が一台。売っているのは「下山する勇気」だけ。","choices":["買う","登山者に聞く","売り切れにする"],"ends":["出てきた缶は空っぽで、底に「自分の足で」と書いてあった。","登山者は缶を見せ合い、帰り道を一緒に歩いた。","売り切れにしたら山頂に人が集まった。誰かが道案内を始めた。"]}},{"ja":{"from":"差出人：最後の紙飛行機","body":"紙飛行機大会で一機だけ、飛ばす前に「帰りたい」と言い出した。","choices":["飛ばさない","理由を聞く","一緒に飛ぶ"],"ends":["机に戻すと、紙には家族への手紙が書かれていた。","紙は遠くへ行くのが怖かった。窓から見える木までなら飛べた。","あなたが隣で走ると、飛行機はゆっくり風に乗った。"]}},{"ja":{"from":"差出人：夢を修理する時計屋","body":"時計屋の仕事は、壊れた時計ではなく途中で終わった夢を直すこと。","choices":["依頼する","修理を見る","断る"],"ends":["子どもの頃の夢が戻り、翌朝絵を描き始めた。","職人は夢の欠片をつなぎ、別の未来を作っていた。","断ったあなたに職人は「壊れたままでも動けます」と言った。"]}},{"ja":{"from":"差出人：郵便局の秘密会議","body":"深夜の郵便局で封筒たちが会議を開く。「誰に届くのが一番幸せか」。","choices":["参加する","盗み聞きする","手紙を書く"],"ends":["白紙の封筒が「まだ誰にも会ってない」と胸を張った。","請求書は「僕も必要なんだ」と反論し、みんな黙った。","あなたの手紙が加わると、封筒たちは宛名を見て拍手した。"]}},{"ja":{"from":"差出人：海底のラジオ","body":"漁師のラジオが海の底から放送を受信する。「こちら、百年前の港」。","choices":["返事する","周波数を変える","録音する"],"ends":["百年前の漁師が「今日は大漁だ」と笑った。","別の周波数では未来の海が静かに歌っていた。","録音には潮騒しか残らず、父だけが内容を知っていた。"]}},{"ja":{"from":"差出人：嘘をつけないマジシャン","body":"マジシャンが舞台で「これから種を明かします」と宣言した。","choices":["観客になる","止める","種を聞く"],"ends":["種を知っても子どもたちは拍手した。","助手が「秘密を守るのも仕事」と言い、幕を下ろした。","種は「練習を一万回」。観客は一番大きな拍手をした。"]}},{"ja":{"from":"差出人：宇宙の洗濯日和","body":"銀河中の星が一斉に洗濯物を干した。天の川が真っ白になっている。","choices":["手伝う","天気を調べる","写真を撮る"],"ends":["土星の輪が物干し竿になり、星々が列を作った。","宇宙天気予報は「流星群に注意」。洗濯物が次々流れた。","写真には小さな地球の青いシャツが一枚だけ写っていた。"]}},{"ja":{"from":"差出人：無口なピアノ","body":"古いピアノが特定の一音だけ鳴らない。調律師は「故障じゃない」と言う。","choices":["弾いてみる","調律師に聞く","鍵盤を外す"],"ends":["その音を休符にすると、曲が初めて完成した。","調律師は「昔の持ち主が最後に弾かなかった音」と教えた。","鍵盤の下に小さな指輪があり、音が戻った。"]}},{"ja":{"from":"差出人：パン屋の時間割","body":"パン屋が毎日違う時刻に開く。看板には「おなかがすいたら営業」。","choices":["並ぶ","店主に聞く","自分で焼く"],"ends":["待つ間に客同士がレシピを交換し、行列が宴会になった。","店主は「焼けたときが朝です」と言い、夜明けにクロワッサンを出した。","自分のパンは焦げたが、店主は「これも新商品」と棚に置いた。"]}},{"ja":{"from":"差出人：三十秒の未来電話","body":"公衆電話が未来の自分に三十秒だけつながる。通話料は十円。","choices":["電話する","切る","友達に譲る"],"ends":["未来の自分は「今日の夕飯、ちゃんと食べて」とだけ言った。","受話器を置くと十円が戻り、あなたは今の自分に話しかけた。","友達は未来の自分と大笑いした。内容は最後まで教えてくれなかった。"]}},{"ja":{"from":"差出人：月の裏側の喫茶室","body":"月の裏側に小さな喫茶室がある。メニューには地球の季節しかない。","choices":["春を注文","店員に聞く","窓を見る"],"ends":["桜の香りが広がり、宇宙飛行士は故郷の公園を思い出した。","店員は「地球が見えないから、味で覚えるんです」と言った。","窓には星しかなかったが、カップの中には青い地球が映っていた。"]}},{"ja":{"from":"差出人：拍手を集める泥棒","body":"町で拍手の音だけが盗まれる。演奏会も誕生日も静まり返った。","choices":["犯人を追う","拍手をする","音を探す"],"ends":["犯人は自信のない新人役者だった。盗んだ拍手を全部返した。","手を叩く音は消えたが、みんな立ち上がって笑顔を向けた。","拍手は空き家の屋根裏に集まっていた。そこでは猫が眠っていた。"]}},{"ja":{"from":"差出人：雨宿りの約束","body":"見知らぬ二人が雨宿りで「次に会ったら友達」と約束した。十年後、同じ軒下で雨が降る。","choices":["声をかける","傘を渡す","通り過ぎる"],"ends":["二人とも約束を覚えていて、同時に笑った。","傘の柄には十年前と同じ青いテープが巻かれていた。","通り過ぎた後、後ろから「友達になり損ねるよ」と声がした。"]}},{"ja":{"from":"差出人：五感を貸す映画館","body":"映画館の座席には「匂い」「味」「温度」の貸出ボタンがある。","choices":["匂いを選ぶ","味を選ぶ","何も選ばない"],"ends":["海の映画で潮の匂いがして、隣の人が故郷の話を始めた。","ケーキの場面で甘い味がしたが、エンドロールは苦かった。","何も選ばず観たら、俳優の小さな息遣いが一番印象に残った。"]}},{"ja":{"from":"差出人：失敗を祝うパレード","body":"町の年一回のパレードは、今年一番の失敗をした人が先頭を歩く。","choices":["参加する","理由を聞く","見物する"],"ends":["転んだ少年が堂々と先頭を歩き、みんなが笑って手を振った。","主催者は「挑戦した人だけが失敗できる」と言った。","見物人は自分の失敗を書いた旗を振り、通りが長い虹色になった。"]}},{"ja":{"from":"差出人：逆さの天気予報","body":"天気予報が「明日は心の中だけ雨」と告げた。空は快晴。","choices":["傘を持つ","気象台に聞く","散歩する"],"ends":["傘を差すと友達が入り、二人で悩みを話した。","気象台は「心の天気も予報に入れました」と答えた。","歩いているうちに少し気が晴れた。予報は外れてよかった。"]}},{"ja":{"from":"差出人：閉館後の水族館","body":"閉館後、魚たちが人間の展示会を開く。人気は「スマホを見ながら歩く人」。","choices":["見学する","魚に質問","展示を直す"],"ends":["魚たちは人間の奇妙な歩き方を真似して水槽でぶつかった。","タコは「人間はなぜ画面の中の海を見る？」と尋ねた。","展示の説明を「迷いながら生きる生き物」に変えたら、魚が拍手した。"]}},{"ja":{"from":"差出人：無人のラーメン屋","body":"深夜のラーメン屋で、厨房には誰もいないのに注文どおりの一杯が出る。","choices":["食べる","厨房を覗く","代金を置く"],"ends":["スープは昔の父の味だった。店の壁に古い写真があった。","厨房では小さなロボットが必死に麺を湯切りしていた。","代金を置くと「また来てね」と湯気で文字が浮かんだ。"]}},{"ja":{"from":"差出人：卒業しない桜","body":"廃校の校庭に一本だけ、卒業式の日にしか咲かない桜がある。","choices":["見に行く","木を調べる","手紙を埋める"],"ends":["昔の同級生たちが集まり、誰もいない校舎に歌声が戻った。","根元には卒業生の名前が彫られた石があり、毎年一つ増えていた。","埋めた手紙の上に花びらが落ちた。十年後、そこから小さな芽が出た。"]}},{"ja":{"from":"差出人：星座の修理工","body":"夜空のオリオン座から星が一つ落ちた。修理工は梯子を持って駆けつけた。","choices":["手伝う","星を探す","別の形にする"],"ends":["梯子が届かず、町の人が肩車で星を押し上げた。","落ちた星は公園の街灯になり、帰り道を照らしていた。","星座を組み替えたら「眠る猫」の形になり、子どもが名前を付けた。"]}},{"ja":{"from":"差出人：涙の重さを測る店","body":"小さな店が涙を量っている。「悲しみの重さは人それぞれ」が看板。","choices":["測る","店主に聞く","測らず帰る"],"ends":["涙は一滴なのに秤は動かなかった。店主はそっとハンカチを渡した。","店主は「数字は出ません。でも一緒に持てます」と言った。","帰り道、友達に電話した。声を聞くと少し軽くなった。"]}},{"ja":{"from":"差出人：百回目の初デート","body":"カップルが百回目の初デートをする。毎回初対面のふりをしているらしい。","choices":["話しかける","秘密を聞く","見守る"],"ends":["二人は「初めまして」を言い間違え、笑いながら手をつないだ。","片方が記憶を失う病気で、もう片方は毎回新しく恋をしていた。","百回目の帰り道、二人は初めて「また明日」と約束した。"]}},{"ja":{"from":"差出人：冷蔵庫の国境","body":"家族の冷蔵庫に突然国境線が引かれた。プリン共和国と野菜王国が対立している。","choices":["仲裁する","国境を越える","冷蔵庫を閉める"],"ends":["家族会議で「プリンは一人一個」の条約が結ばれた。","キャベツがプリンの隣に移動し、冷戦は終わった。","翌朝、冷蔵庫に「和平記念ゼリー」が増えていた。"]}},{"ja":{"from":"差出人：駅前の無限階段","body":"駅前の階段が上っても上っても終わらない。途中に「急ぐ人はこちら」と椅子がある。","choices":["座る","走る","引き返す"],"ends":["椅子に座ると目の前にエレベーターが現れた。","全力で走った先は最初の段。あなたは笑って靴紐を結び直した。","引き返すと改札はすぐそこだった。階段はただの近道だった。"]}},{"ja":{"from":"差出人：しゃべる自画像","body":"美術館の自画像が「似てない」と画家に文句を言い続けている。","choices":["描き直す","絵に聞く","展示を変える"],"ends":["描き直すと絵は「前の方がよかった」と言った。","絵は「もっと楽しそうに描いて」と頼んだ。画家は初めて笑った。","自画像を鏡の隣に置くと、二人とも黙って見つめ合った。"]}},{"ja":{"from":"差出人：魚の国の選挙","body":"魚の国で次の王を決める。候補はサメ、イワシ、海藻。","choices":["投票する","討論を聞く","開票を待つ"],"ends":["海藻が当選した。「誰も食べない政策」が支持された。","イワシの群れは一斉に違う意見を言い、討論会が大混乱した。","開票結果は引き分け。三者で海を掃除することになった。"]}},{"ja":{"from":"差出人：忘れ物の観覧車","body":"観覧車の一台だけ、誰も乗っていないのに毎晩回る。","choices":["乗ってみる","係員に聞く","止める"],"ends":["座席に古い写真があり、二人の笑顔が夜景と重なった。","係員は「最後のお客さんの約束を待ってる」と言った。","止めた瞬間、遠くの花火が上がり、観覧車は静かに光った。"]}},{"ja":{"from":"差出人：空白の地図","body":"旅行会社で渡された地図は真っ白。「歩いた場所だけ道になります」と書かれている。","choices":["歩き出す","店員に聞く","地図を捨てる"],"ends":["迷った路地に小さなパン屋を見つけ、地図に香りまで残った。","店員は「目的地を決めなくていい旅です」と笑った。","地図を捨てても道は消えなかった。あなたは顔を上げて歩いた。"]}},{"ja":{"from":"差出人：嘘つきの天気雨","body":"晴れているのに雨が降る日、雨粒が一つずつ違う言い訳をして落ちてくる。","choices":["聞いてみる","傘を開く","空に質問"],"ends":["「雲から迷子になった」と言う雨粒を手のひらで受けた。","傘に当たる雨音が会話になり、通行人が足を止めた。","空は「晴れでも泣く日がある」と答えた。"]}},{"ja":{"from":"差出人：花屋の逆注文","body":"花屋で客が花を選ぶのではなく、花が客を選ぶ。今日は小さな雑草があなたを指名した。","choices":["連れて帰る","断る","理由を聞く"],"ends":["雑草はベランダで元気に育ち、初めての花を咲かせた。","断ると雑草は隣の老人を選び、二人は毎朝散歩した。","雑草は「手入れが下手でも平気だから」と言った。"]}},{"ja":{"from":"差出人：月曜日の亡霊","body":"オフィスに月曜日の亡霊が現れ、日曜の夜からため息をついている。","choices":["話を聞く","追い払う","休ませる"],"ends":["亡霊は「嫌われるのがつらい」と言った。社員が月曜だけお菓子を持ち寄った。","追い払うと火曜日が二回来た。社員は月曜を呼び戻した。","亡霊が休むと全員の予定が一日ずれた。上司だけが喜んだ。"]}},{"ja":{"from":"差出人：眠らない靴屋","body":"夜中の靴屋で靴たちが旅の報告会をしている。一足だけ黙ったまま。","choices":["話しかける","履いてみる","外へ連れ出す"],"ends":["靴は「まだどこにも行ったことがない」と言った。","履くと見知らぬ港の風景が浮かび、あなたは旅の計画を立てた。","外へ出すと靴は最初の一歩を大事そうに踏みしめた。"]}},{"ja":{"from":"差出人：鏡の中の忘年会","body":"鏡の中の人たちだけが忘年会をしている。あなたの分の席もある。","choices":["入る","乾杯する","鏡を覆う"],"ends":["鏡の中では昨日の自分と明日の自分が仲直りしていた。","乾杯するとこちらのグラスにも泡が立った。","覆った布の裏から「来年もよろしく」と声がした。"]}},{"ja":{"from":"差出人：静かな怪盗","body":"怪盗が毎晩、家から不要な物を一つだけ盗む。住人はなぜか感謝している。","choices":["捕まえる","依頼する","見張る"],"ends":["怪盗の袋には壊れた傘と古い後悔が詰まっていた。","依頼した人は物よりも部屋の広さに驚いた。","見張っていると怪盗は古い写真をそっと戻していった。"]}},{"ja":{"from":"差出人：海を渡るレシート","body":"買い物のレシートが風に乗って海を越えた。裏には誰かの告白が書いてある。","choices":["返送する","読む","捨てる"],"ends":["送り先の住所は店の裏の小さな家だった。","「好きです」の続きは「この店のコロッケが」だった。","捨てたはずの紙は波に乗り、見知らぬ港の恋人たちに拾われた。"]}},{"ja":{"from":"差出人：空飛ぶ図工室","body":"学校の図工室だけが雲の上に浮かんだ。授業はまだ終わっていない。","choices":["絵を描く","降りる方法を探す","先生に聞く"],"ends":["描いた鳥が窓から飛び出し、教室を地上まで案内した。","紙飛行機を大量に作って翼にすると、教室はゆっくり降りた。","先生は「想像力の実験です」と言ったが、少し青ざめていた。"]}},{"ja":{"from":"差出人：消えない黒板","body":"卒業した学校の黒板に毎朝新しい落書きが現れる。誰も校舎に入っていない。","choices":["見に行く","消してみる","返事を書く"],"ends":["落書きは昔の担任の似顔絵で、卒業生が次々集まった。","消した跡に「また明日」と浮かび、用務員が笑った。","返事を書くと翌朝「元気でね」と書かれていた。"]}},{"ja":{"from":"差出人：宇宙人の初詣","body":"宇宙人が地球の神社で「宇宙平和」をお願いした。お賽銭は小惑星一個。","choices":["返す","願いを聞く","神主に相談"],"ends":["小惑星は神社の庭石になり、観光客が増えた。","宇宙人は「まず隣の星と仲直りしたい」と言った。","神主は「気持ちが大事」と言い、小惑星を丁寧に磨いた。"]}},{"ja":{"from":"差出人：海底の郵便局","body":"海底郵便局では手紙が泡に入って届く。今日は差出人が「未来の珊瑚」。","choices":["開ける","返事を書く","配達を頼む"],"ends":["手紙には「海をきれいにしてくれてありがとう」とあった。","返事は小さな貝殻に刻まれ、百年後の海へ流れた。","イルカの配達員が迷子になり、魚たちが道案内した。"]}},{"ja":{"from":"差出人：映画の外の主人公","body":"映画館のスクリーンから主人公が出てきた。「結末に納得してない」と言う。","choices":["脚本を変える","客席に座らせる","映画に戻す"],"ends":["主人公は自分で台詞を書き、別の映画を始めた。","主人公は初めて観客として自分の人生を見て泣いた。","戻った主人公は最後の場面でカメラに手を振った。"]}},{"ja":{"from":"差出人：おにぎりの国際会議","body":"世界のおにぎりが集まり、中身の多様性について話し合っている。","choices":["発言する","試食する","議長を選ぶ"],"ends":["塩むすびが「何も入ってなくてもいい」と言い、拍手が起きた。","試食で議論は止まり、全員が満腹になった。","議長は梅干しになった。酸っぱい顔で会議をまとめた。"]}},{"ja":{"from":"差出人：日曜日の貸出所","body":"町役場で日曜日を一時間ずつ貸し出している。借りると平日に休める。","choices":["借りる","返す","職員に聞く"],"ends":["水曜の午後が日曜日になり、公園のベンチが満席になった。","返した一時間は誰かの休日になり、知らない人から絵葉書が届いた。","職員は「休日は分け合うものです」と言って定時に帰った。"]}},{"ja":{"from":"差出人：記念日を忘れる時計","body":"結婚記念日にだけ時計が止まる夫婦がいる。今年は時計が進み続けた。","choices":["時計を直す","二人に聞く","外へ出る"],"ends":["時計を直すと針は二人が出会った時刻を指した。","二人は「記念日を忘れたのは初めて」と笑い、新しい日を決めた。","外には孫たちが待っていて、家族写真を撮った。"]}},{"ja":{"from":"差出人：砂時計の逃亡","body":"砂時計の砂が「もう落ちたくない」と逆流し始めた。","choices":["止める","話を聞く","ひっくり返す"],"ends":["止めると部屋の中だけ夕方が長く続いた。","砂は「同じ景色に飽きた」と言い、海へ旅立った。","ひっくり返すと砂は普通に落ちたが、一粒だけ星になった。"]}},{"ja":{"from":"差出人：動物園の夜間授業","body":"閉園後の動物園で動物たちが人間語の授業を受けている。","choices":["見学する","先生になる","テストする"],"ends":["キリンは「高いところから見ると喧嘩は小さい」と発表した。","あなたが教えた「ありがとう」をペンギンが毎朝使った。","全員満点だったが、猿だけ「バナナ」と答え続けた。"]}},{"ja":{"from":"差出人：風船の家出","body":"誕生日会の風船が一つだけ窓から逃げた。紐には「探さないで」とある。","choices":["追う","見送る","手紙を書く"],"ends":["風船は病院の窓に止まり、子どもを笑わせた。","空に小さくなる風船を見て、誕生日の子は願い事を変えた。","手紙を紐に結ぶと、翌朝窓辺に星形の返事があった。"]}},{"ja":{"from":"差出人：時差ぼけのタイムマシン","body":"タイムマシンが一日だけ時差ぼけして、昨日と明日を交互に行き来する。","choices":["乗る","修理する","放置する"],"ends":["昨日の自分に会ったが、二人とも何を話すか忘れた。","修理すると機械は「今日は休みたい」と表示した。","放置したら明日の朝に洗濯物だけ届いた。"]}},{"ja":{"from":"差出人：校長先生の秘密基地","body":"学校の屋上に校長先生の秘密基地が見つかった。中には児童の夢が書かれた紙が山積み。","choices":["読む","校長に聞く","秘密にする"],"ends":["紙には「宇宙飛行士」から「友達と仲直り」まで並んでいた。","校長は毎年一つずつ夢を叶える手伝いをしていた。","秘密にした翌日、基地の入口に「誰でもどうぞ」と貼られた。"]}},{"ja":{"from":"差出人：泣かない葬儀屋","body":"葬儀屋は仕事中、一度も泣かない。最後の依頼人が「あなたも泣いていい」と言った。","choices":["話を聞く","花を渡す","一緒に座る"],"ends":["葬儀屋は初めて父の話をした。","花を受け取った葬儀屋は、亡き母の好きな色を思い出した。","二人は何も言わず座った。帰り際、窓の外に朝日が差した。"]}},{"ja":{"from":"差出人：窓辺の小さな裁判","body":"窓辺の植木鉢が日光を独占したとして隣の鉢に訴えられた。","choices":["場所を替える","判決を出す","窓を開ける"],"ends":["二つの鉢を入れ替えると、どちらも少しずつ伸びた。","判決は「交代で日向」。猫だけが不満そうだった。","風が入り、カーテンが揺れた。鉢たちは同じ方向に葉を伸ばした。"]}},{"ja":{"from":"差出人：深夜二時の面接","body":"深夜二時、夢の中で面接を受けた。会社名は「明日の自分株式会社」。","choices":["志望動機を話す","質問する","辞退する"],"ends":["「今日より少し優しく」と答えると、その場で採用された。","面接官は十年後の自分で、履歴書を見ずに頷いた。","辞退すると「では自由業ですね」と言われ、朝の目覚ましが鳴った。"]}},{"ja":{"from":"差出人：隕石の置き手紙","body":"庭に落ちた隕石が「しばらく居候します」とメモを残した。","choices":["歓迎する","追い返す","家賃を聞く"],"ends":["隕石は夜だけ庭を照らし、家族の夕食が外になった。","隕石はしょんぼり転がり、隣家の花壇に引っ越した。","家賃は「空を見上げること」。毎晩家族が星を数えた。"]}},{"ja":{"from":"差出人：透明な傘の発明","body":"発明家が「雨だけを見えなくする傘」を作った。濡れるのは変わらない。","choices":["使う","改良する","売り出す"],"ends":["雨の音だけが残り、街が不思議に静かに見えた。","傘に小さな屋根を付けると普通の傘になった。発明家は悔しがった。","宣伝文句は「雨の日の景色を変える」。意外と売れた。"]}},{"ja":{"from":"差出人：逆転した郵便配達","body":"ある日、郵便配達員の家に世界中から「ありがとう」の手紙が届いた。","choices":["全部読む","差出人を探す","一通返す"],"ends":["手紙の山に埋もれながら、配達員は何度も笑った。","差出人はこれまで配達した人たちで、町の地図が感謝で埋まった。","一通返したら翌日また一通届いた。二人の文通が始まった。"]}},{"ja":{"from":"差出人：夢を見ない羊","body":"羊が眠れず困っている。数を数えても自分が増えるばかり。","choices":["数えてあげる","子守歌を歌う","散歩する"],"ends":["百匹目を数えた瞬間、羊ではなくあなたが眠った。","歌うと羊たちが合唱し、牧場が夜のコンサートになった。","散歩の途中、羊は満天の星を見て初めて目を閉じた。"]}},{"ja":{"from":"差出人：深海の選挙ポスター","body":"深海に「明るい未来を」と書かれた選挙ポスターが貼られた。候補は発光するクラゲ。","choices":["投票する","公約を聞く","ポスターを剥がす"],"ends":["クラゲが当選し、海底の道が明るくなった。","公約は「夜道の安全」。深海魚たちが拍手した。","剥がすと裏に「暗い未来も悪くない」と書かれていた。"]}},{"ja":{"from":"差出人：笑い袋の遺産","body":"祖父の遺品は古い笑い袋ひとつ。鳴らすと毎回違う声がする。","choices":["鳴らす","分解する","家族に聞く"],"ends":["最後に祖父の笑い声が聞こえ、家族が泣き笑いした。","中には録音機があり、家族の笑い声が何十年分も入っていた。","母は「おじいちゃん、笑わせるのが好きだった」と言った。"]}},{"ja":{"from":"差出人：四角い虹","body":"雨上がり、空に四角い虹が現れた。気象台は「仕様です」と発表した。","choices":["角を調べる","写真を撮る","丸くする"],"ends":["角には小さな雲が座って休んでいた。","写真を撮ると画面の中だけ丸い虹になった。","みんなで手をつないで輪を作ると、虹も少し丸くなった。"]}},{"ja":{"from":"差出人：世界最後の公衆電話","body":"世界最後の公衆電話が撤去される。最後の電話をかける権利が抽選で当たった。","choices":["母に電話","知らない番号へ","電話しない"],"ends":["母は「帰っておいで」と言った。あなたは受話器を置いて歩き出した。","知らない人が出て「ありがとう、間違い電話でも嬉しい」と言った。","電話をしなかったあなたの後ろでベルが鳴った。誰かが最後の一言を待っていた。"]}}];
const el=id=>document.getElementById(id);let language=localStorage.getItem('pigeon-lang')||'ja',sound=localStorage.getItem('pigeon-sound')!=='off',idx=-1,current=null,choice=-1,audioCtx=null,musicTimer=null,playing=false;let lastStory=-1,savedReply="",incomingReply="";const t=(ja,en)=>language==='ja'?ja:en;
function ui(){document.documentElement.lang=language;el('brand').textContent=t('なんか届いた。','Pigeon');el('headline').textContent=t('なんか届いた。','Pigeon');el('tagline').textContent=t('鳩をタップして、手紙を開けよう。','Tap the pigeon to open a letter.');el('lang').textContent=language==='ja'?'EN':'日本語';el('sound').textContent=sound?'🔊 ON':'🔇 OFF';el('replyLabel').textContent=t('✍️ あなたのオチ','✍️ Your own ending');el('reply').placeholder=t('あなただったらどうオチをつける？ 大喜利もツッコミも自由！','How would you end it? Jokes and twists welcome!');el('send').textContent=t('🕊️ 友達に届ける','🕊️ Deliver to a friend');el('skip').textContent=t('やめておく','Skip');el('write').textContent=t('✍️ 自分のオチを書く','✍️ Write your own ending');el('noReply').textContent=t('このまま終わる','Finish here');el('homeNow').textContent=t('🏠 トップに戻る','🏠 Back to home');el('next').textContent=t('🕊️ 次の手紙','🕊️ Next letter');el('nextQuick').textContent=t('🕊️ 次の手紙','🕊️ Next letter');el('shareQuick').textContent=t('💌 友達に送る','💌 Share');el('writeQuick').textContent=t('✍️ 自分のオチを書く','✍️ Write your own ending');el('homeBottom').textContent=t('⌂ トップに戻る','⌂ Back to home');el('count').textContent=t('200通（物語初稿）','200 letters (drafts)');el('shareHint').textContent=t('気に入った手紙は友達にも届けられるよ。','Deliver a favorite letter to a friend.');el('shareLetter').textContent=t('💌 この手紙を友達に届ける','💌 Deliver this letter to a friend');el('copyLetter').textContent=t('🔗 リンクをコピー','🔗 Copy letter link');if(current)renderLetter();}
function stopSpeech(){if('speechSynthesis' in window) speechSynthesis.cancel()}
function speak(str){if(!sound||!('speechSynthesis' in window))return;stopSpeech();const u=new SpeechSynthesisUtterance(str);u.lang=language==='ja'?'ja-JP':'en-US';const voices=speechSynthesis.getVoices();const preferred=voices.filter(v=>v.lang.toLowerCase().startsWith(language==='ja'?'ja':'en')).sort((a,b)=>{const score=v=>(v.localService?1:0)+(language==='en'&&/premium|enhanced|natural|samantha|ava|daniel|alex|serena/i.test(v.name)?3:0);return score(b)-score(a)});if(preferred.length)u.voice=preferred[0];u.rate=language==='ja'?.91:.96;u.pitch=1.0;u.volume=1;speechSynthesis.speak(u)}
function musicStart(){
 if(!sound||playing||el('home').classList.contains('hidden'))return;
 try{
  audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();audioCtx.resume();playing=true;
  // Original oscillator synthesis; public-domain Canon in D by J. Pachelbel. No copyrighted recording used.
  const bass=[146.83,110,123.47,92.50,98.00,73.42,98.00,110];
  const melody=[369.99,329.63,293.66,277.18,246.94,220,246.94,277.18,293.66,277.18,246.94,220,196,185,196,220,
   246.94,220,196,185,164.81,146.83,164.81,185,196,185,164.81,146.83,164.81,185,196,220];
  let step=0;const tempo=360;

  function beat(){if(!playing||el('home').classList.contains('hidden'))return;play(melody[step%melody.length],.62,.012,'sine');if(step%2===0)play(bass[Math.floor(step/2)%bass.length],1.05,.007,'triangle');step++}
  beat();musicTimer=setInterval(beat,tempo);
 }catch(e){el('status').textContent=t('この端末ではBGMを再生できませんでした。','Background music is unavailable on this device.')}
}
function musicStop(){playing=false;clearInterval(musicTimer);musicTimer=null}
function hide(...ids){ids.forEach(id=>el(id).classList.add('hidden'))}function show(...ids){ids.forEach(id=>el(id).classList.remove('hidden'))}
function newLetter(){savedReply='';incomingReply='';el('reply').value='';stopSpeech();if(idx<0)idx=Math.floor(Math.random()*stories.length);else idx=Math.floor(Math.random()*stories.length);current=stories[idx];choice=-1;el('status').textContent='';el('home').classList.add('hidden');show('panel');renderLetter();musicStop()}
function goHome(){stopSpeech();musicStop();current=null;idx=-1;choice=-1;savedReply='';incomingReply='';el('reply').value='';hide('panel');show('home');musicStart();el('status').textContent='';const clean=new URL(location.href);clean.search='';clean.hash='';history.replaceState(null,'',clean.pathname);}
function renderLetter(){const s=(current[language]||current.ja);el('sender').textContent=s.from;el('letter').textContent=s.body;show('letter','choices');hide('ending','endingActions','replyArea','finish','endNav');hide('shareActions');el('receivedLabel').textContent=t('✍️ 友達が書いた答え','✍️ Your friend’s answer');el('receivedText').textContent=incomingReply;if(incomingReply)show('receivedReply');else hide('receivedReply');el('choices').replaceChildren();s.choices.forEach((c,i)=>{let b=document.createElement('button');b.className='choice';b.textContent=(i+1)+'. '+c;b.onclick=()=>end(i);el('choices').appendChild(b)});let own=document.createElement('button');own.className='choice';own.textContent=t('4. ✍️ 自分のオチを書く','4. ✍️ Write your own ending');own.onclick=()=>{choice=-1;hide('choices','ending','endNav');show('replyArea');el('reply').focus()};el('choices').appendChild(own);speak(s.body)}
function end(i){choice=i;hide('choices');show('ending','endNav');el('ending').textContent=(current[language]||current.ja).ends[i];speak((current[language]||current.ja).ends[i])}
function write(){hide('endingActions');show('replyArea');el('reply').focus()}
function encodeReply(str){const bytes=new TextEncoder().encode(str);let binary='';for(const byte of bytes)binary+=String.fromCharCode(byte);return btoa(binary).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function decodeReply(str){try{if(!/^[A-Za-z0-9_-]{1,3000}$/.test(str))return '';const binary=atob(str.replace(/-/g,'+').replace(/_/g,'/')+'='.repeat((4-str.length%4)%4));return new TextDecoder('utf-8',{fatal:true}).decode(Uint8Array.from(binary,c=>c.charCodeAt(0))).slice(0,500)}catch(e){return ''}}
function letterUrl(){const url=new URL(location.href);url.search='';url.hash='';url.searchParams.set('letter',String(idx+1));if(choice>=0)url.searchParams.set('ending',String(choice+1));if(savedReply)url.searchParams.set('reply',encodeReply(savedReply));return url.toString()}
async function shareLetter(){const s=(current[language]||current.ja);const text=s.from+'\n'+s.body+(savedReply?'\n\n💌 '+t('書いた人の答え：','Their answer:')+'\n'+savedReply:'')+'\n\n'+t('鳩から手紙が届いたよ 🕊️','A pigeon brought you a letter 🕊️');const url=letterUrl();try{if(navigator.share){await navigator.share({title:t('なんか届いた。','Pigeon'),text,url});return}}catch(e){if(e.name==='AbortError')return}await copyLetter()}
async function copyLetter(){const url=letterUrl();try{await navigator.clipboard.writeText(url);el('status').textContent=t('答え付きリンクをコピーしたよ！ 🕊️','Answer link copied! 🕊️')}catch(e){prompt(t('このリンクをコピーしてね','Copy this link'),url)}}
function finish(sent){hide('replyArea','endingActions');show('finish','endNav');el('finishText').textContent=sent?t('あなたの答えを用意したよ。友達にシェアできるよ 🕊️','Your answer is ready to share 🕊️'):t('鳩は静かに飛んでいった。','The pigeon flew away quietly.');if(sent){show('shareActions');el('shareLetter').textContent=t('💌 答えを友達に届ける','💌 Share your answer');el('copyLetter').textContent=t('🔗 答え付きリンクをコピー','🔗 Copy answer link');}stopSpeech()}
el('shareLetter').onclick=shareLetter;el('copyLetter').onclick=copyLetter;el('birdButton').onclick=newLetter;el('write').onclick=write;el('noReply').onclick=()=>finish(false);el('send').onclick=async()=>{const value=el('reply').value.trim();if(!value)return;savedReply=value;finish(true);await shareLetter()};el('skip').onclick=()=>{if(choice<0){hide('replyArea');show('choices')}else finish(false)};el('next').onclick=newLetter;el('nextQuick').onclick=newLetter;el('shareQuick').onclick=shareLetter;el('writeQuick').onclick=write;el('homeBottom').onclick=goHome;el('homeNow').onclick=goHome;el('lang').onclick=()=>{language=language==='ja'?'en':'ja';localStorage.setItem('pigeon-lang',language);stopSpeech();ui()};el('sound').onclick=()=>{sound=!sound;localStorage.setItem('pigeon-sound',sound?'on':'off');if(!sound){stopSpeech();musicStop()}else{musicStart();if(current)speak(choice<0?(current[language]||current.ja).body:(current[language]||current.ja).ends[choice])}ui()};window.addEventListener('pagehide',()=>{stopSpeech();musicStop()});
// Try on page load; iOS Safari may require the first tap to unlock Web Audio.
function unlockHomeAudio(){if(!sound||el('home').classList.contains('hidden'))return;if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume().catch(()=>{});else if(!playing)musicStart()}

ui();musicStart();const params=new URL(location.href).searchParams;const shared=params.get('letter');if(shared&&/^\d+$/.test(shared)&&Number(shared)>=1&&Number(shared)<=stories.length){idx=Number(shared)-1;current=stories[idx];incomingReply=decodeReply(params.get('reply')||'');hide('home');show('panel');renderLetter();el('status').textContent=t('友達から手紙が届いたよ 🕊️','A friend sent you a letter 🕊️')}
