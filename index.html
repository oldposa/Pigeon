</style><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Pigeon"><meta name="description" content="鳩から届く、ちょっと変な手紙。選んだ答えで結末が変わる。"></head><body><main class="app"><header><strong id="brand">なんか届いた。</strong><div><button class="toggle" id="lang">EN</button> <button class="toggle" id="sound">🔊 ON</button></div></header><section id="home" style="text-align:center;width:100%"><button class="bird-button" id="birdButton" aria-label="手紙を開ける"><img class="bird" src="pigeon-logo.png" alt="封筒をくわえて右へ飛ぶ鳩"></button><h1 id="headline">なんか届いた。</h1><p class="hint" id="tagline">鳩をタップして、手紙を開けよう。</p><p class="tiny" id="count"></p><button class="toggle" id="homeMusic" style="margin-top:14px" type="button">♫ カノンを再生</button><p class="tiny" id="shareHint"></p></section><section id="panel" class="panel hidden" aria-live="polite"><div class="sender" id="sender"></div><div id="letter" class="letter"></div><div id="receivedReply" class="hidden" style="margin:20px 0;padding:17px;border:1px solid #dce3eb;border-radius:14px;background:#f6f8fb"><div id="receivedLabel" style="font-size:12px;color:#64748b;margin-bottom:8px"></div><div id="receivedText" style="white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.8"></div></div><div id="choices" class="choices"></div><div id="ending" class="ending hidden"></div><div id="replyArea" class="hidden"><p id="replyLabel" style="margin:18px 0 10px"></p><textarea id="reply" maxlength="500" placeholder=""></textarea><div class="actions"><button class="primary" id="send"></button><button class="secondary" id="skip"></button></div></div><div id="finish" class="hidden"><p id="finishText" style="margin-top:20px"></p><div class="actions"><button class="primary" id="next"></button></div></div><div class="actions hidden" id="shareActions"><button class="secondary" id="shareLetter">💌 この手紙を友達に届ける</button><button class="secondary" id="copyLetter">🔗 リンクをコピー</button></div><div class="actions hidden" id="endingActions"><button class="primary" id="write"></button><button class="secondary" id="noReply"></button><button class="secondary" id="homeNow" type="button">🏠 トップに戻る</button></div></section><div id="status" aria-live="polite"></div><footer id="footer">Pigeon · a tiny surprise, delivered.</footer></main><script>
const stories=[{"ja":{"from":"差出人：月","body":"地球のみなさんへ。\n夜勤を辞めたいです。\nもう46億年くらい働いています。","choices":["有給とりなよ","太陽に相談して","じゃあ私が光るわ"],"ends":["月は有給を取った。翌晩、空には「本日休業」の札。星たちが代打を断り、夜空がちょっと気まずくなった。","太陽から返事が来た。「こっちも日勤がきつい」。翌日から空は交代制になり、午前3時に朝礼が始まった。","月は感動した。「ありがとう。でも電気代は大丈夫？」あなたは静かにカーテンを閉めた。"]},"en":{"from":"From: The Moon","body":"Dear Earth,\nI would like to quit the night shift.\nI have been doing this for roughly 4.6 billion years.","choices":["Take a vacation.","Ask the Sun.","I can glow instead."],"ends":["The Moon took a day off. A sign appeared in the sky: CLOSED TONIGHT. The stars refused to cover the shift.","The Sun replied: “Day shifts are exhausting too.” The sky now holds staff meetings at 3 a.m.","The Moon was touched. “Thank you. But can you afford the electricity?” You quietly closed the curtains."]}},{"ja":{"from":"差出人：未来のあなたの靴下","body":"緊急です。\n洗濯機の中に異世界への入口を発見しました。\n片方だけ先に入っています。","choices":["救助隊を送る","もう片方も行かせる","現地の写真を頼む"],"ends":["救助隊としてハンカチを送った。翌朝、洗濯機から小さな国旗が出てきた。国名は「モケモケ共和国」。","もう片方も旅立った。二日後、なぜか左右が逆になって帰ってきた。本人たちは「留学の成果」と言い張る。","届いた写真には、巨大な洗剤の滝と、王冠をかぶった靴下。裏には「帰る気はありません」と書かれていた。"]},"en":{"from":"From: Your Future Sock","body":"Emergency.\nI found a portal to another world inside the washing machine.\nMy other half has already gone in.","choices":["Send a rescue team.","Send the other sock too.","Ask for photos."],"ends":["You sent a handkerchief rescue team. The next morning, a tiny flag emerged: THE FLUFF REPUBLIC.","The other sock followed. Two days later, both returned on the wrong feet. They called it “studying abroad.”","The photo showed a detergent waterfall and a sock wearing a crown. On the back: “Not coming home.”"]}},{"ja":{"from":"差出人：未来の黒歴史","body":"先に謝っておきます。\n7年後、あなたは今日のことを思い出して布団の中で叫びます。\n今のうちに対策しますか？","choices":["何が起きるか教えて","7年後の私に任せる","黒歴史にも有給を"],"ends":["「7年後、あなたはこの手紙を友達に音読します」。防ごうとしてスクショした瞬間、誤送信した。","7年後のあなたからメッセージ。「おい、なんで俺に丸投げした」。8年後のあなたも既読をつけた。","黒歴史たちはハワイへ旅立った。空港の入国審査で昔の恥ずかしい発言を読み上げられ、全員帰国した。"]},"en":{"from":"From: Your Future Embarrassment","body":"An apology in advance.\nSeven years from now, you will remember this day and scream into your pillow.\nWould you like to prepare?","choices":["Tell me what happens.","Let future me handle it.","Give embarrassment a vacation."],"ends":["“In seven years you will read this letter aloud to your friends.” You took a screenshot to prevent it and accidentally sent it to the group chat.","Future you texted: “WHY DID YOU LEAVE THIS TO ME?” Eight-years-from-now you left it on read.","Your embarrassing memories flew to Hawaii. Airport security read their old quotes aloud. They all flew home."]}},{"ja":{"from":"差出人：街角の自動販売機","body":"ご相談です。\n今日、お釣りを渡すときに少しだけ勇気も入れてみました。\n気づいてもらえたでしょうか。","choices":["ありがとう、助かった","勇気は何円？","次は希望も入れて"],"ends":["自販機は嬉しくなって、次の人に「あったかい」を二回点灯した。誰も気づかなかったけど、少し誇らしかった。","「非売品です。ただし、お釣りの10円玉にくっつきやすいです」。財布の中で小さくチャリンと鳴った。","翌日、缶の底に「なんとかなる」の文字。飲み終えるころには消えていたけれど、あなたは少し笑った。"]},"en":{"from":"From: A Vending Machine","body":"A quick question.\nToday I slipped a little courage in with someone’s change.\nDo you think they noticed?","choices":["Thanks. I needed that.","How much is courage?","Add some hope next time."],"ends":["The machine lit up the HOT button twice out of joy. Nobody noticed. It felt proud anyway.","“Not for sale. It does tend to stick to ten-cent coins.” Something chimed softly in your pocket.","Tomorrow, the bottom of your can said YOU’LL BE OKAY. The words vanished by the last sip. You smiled anyway."]}},{"ja":{"from":"差出人：鳩労働組合","body":"緊急のお知らせです。\n配達員の鳩が「自分宛ての抗議文」を自分で配達しました。\n組合はこれを労働と認めるべきか審議中です。","choices":["有給を認める","代配を募集する","抗議文に返事を書く"],"ends":["有給申請は承認された。だが通知書の配達担当も鳩だった。","カラスが面接に来た。条件は「黒い封筒のみ」。鳩はしばらく考えた。","あなたは「いつもありがとう」と書いた。鳩は初めて手紙を届けず、胸ポケットにしまった。"]},"en":{"from":"From: Pigeon Workers Union","body":"Urgent notice.\nOur pigeon courier delivered a complaint letter addressed to himself.\nThe union is debating whether that counts as overtime.","choices":["Approve paid leave.","Hire a substitute.","Write back to the complaint."],"ends":["Paid leave was approved. The pigeon was assigned to deliver the approval notice.","A crow applied for the job. Its only demand: black envelopes. The pigeon needed a moment.","You wrote, THANK YOU FOR EVERYTHING. For once, the pigeon kept a letter instead of delivering it."]}},{"ja":{"from":"差出人：鳩労働組合","body":"重要なお知らせです。\n私の担当している「静かな時間」が、昨日から行方不明です。\n見つけた方は、そっと返してください。","choices":["探しに行く","捜索ポスターを作る","静かな時間を新しく作る"],"ends":["捜索の途中で、誰もいないベンチを見つけた。五分座ったら、探していたものはずっとそこにいた。","ポスターには「大声で探さないで」と書いた。翌朝、街中が小声になり、捜索本部が一番静かな場所になった。","あなたがスマホを伏せると、三秒だけ新しい静けさが生まれた。差出人はそれを瓶に入れて大事にした。"]},"en":{"from":"From: Pigeon Workers Union","body":"Important notice.\nThe quiet hour I look after has gone missing since yesterday.\nIf you find it, please return it gently.","choices":["Go looking for it.","Make a missing poster.","Create a new quiet hour."],"ends":["You found an empty bench and sat for five minutes. The thing you were looking for had been there all along.","The poster said PLEASE SEARCH QUIETLY. By morning the entire town was whispering.","You turned your phone face down. Three seconds of silence appeared, and the sender carefully bottled them."]}},{"ja":{"from":"差出人：鳩労働組合","body":"ご報告があります。\n昨日、うっかり未来から「ありがとう」を一個だけ先に受け取りました。\n誰のものかわからず困っています。","choices":["持ち主を探す","今すぐ使う","未来へ返送する"],"ends":["持ち主を探す掲示板には「ありがとう」を落とした人が百人集まった。結局みんなで分けた。","あなたは見知らぬ人に席を譲った。翌日、その人から「ありがとう」が届き、帳尻がぴったり合った。","未来から返事が来た。「返品不可。今日、誰かに親切にしておいて」。領収書だけが過去へ届いた。"]},"en":{"from":"From: Pigeon Workers Union","body":"A small incident to report.\nYesterday I accidentally received a thank-you from the future.\nI have no idea who it belongs to.","choices":["Find its owner.","Use it right now.","Return it to the future."],"ends":["A hundred people showed up claiming they had lost a thank-you. They decided to share it.","You gave a stranger your seat. The next day they thanked you, and the universe balanced its books.","The future replied: NO RETURNS. DO SOMETHING KIND TODAY. Only the receipt came back."]}},{"ja":{"from":"差出人：鳩労働組合","body":"内緒の相談です。\n今夜、私が一日だけ市長になることになりました。\n最初の条例を決めるのを手伝ってください。","choices":["昼寝を義務化","全員に手紙を配る","何もしない日を作る"],"ends":["昼寝条例の初日、議会は全員寝坊して開会できなかった。市民の支持率は過去最高だった。","全員に手紙を配ったら、返事が山ほど届いた。市役所は翌日から郵便局になった。","何もしない日ができた。市長だけは「何もしない日を守る仕事」が増え、ちょっと泣いた。"]},"en":{"from":"From: Pigeon Workers Union","body":"A confidential request.\nTonight I will be mayor for exactly one day.\nHelp me choose my first law.","choices":["Make naps mandatory.","Send everyone a letter.","Create a do-nothing day."],"ends":["On the first mandatory nap day, the council slept through its own meeting. Approval ratings soared.","Everyone received a letter. So many replies came back that city hall became a post office.","The do-nothing day was a hit. The mayor was the only one stuck working to enforce it."]}},{"ja":{"from":"差出人：鳩労働組合","body":"至急ご相談です。\n私のところに「まだ誰にも言ってない夢」が迷い込んできました。\n小さすぎて、ポケットから出てきません。","choices":["そっと応援する","夢に名前をつける","一緒に散歩する"],"ends":["「できるよ」と小声で言うと、夢は一センチ大きくなった。翌朝、靴の中に小さな勇気が入っていた。","夢は「とりあえず」と名付けられた。完璧じゃなくていいと気づいて、ようやくポケットから出てきた。","夢を連れて散歩したら、途中で転んだ。でも夢は笑って「これも旅の一部だね」と言った。"]},"en":{"from":"From: Pigeon Workers Union","body":"Urgent advice needed.\nAn unspoken dream wandered into my care.\nIt is so tiny that it refuses to leave my pocket.","choices":["Encourage it gently.","Give the dream a name.","Take it for a walk."],"ends":["You whispered YOU CAN DO IT. The dream grew an inch. In the morning, a little courage was tucked into your shoe.","You named it GOOD ENOUGH FOR NOW. It finally came out of hiding.","The dream tripped during your walk, then laughed. I GUESS THIS COUNTS AS AN ADVENTURE."]}},{"ja":{"from":"差出人：鳩労働組合","body":"苦情ではありません。\n今日、私の仕事に「笑ってはいけない瞬間」が一つ追加されました。\nところが、もう三回笑ってしまいました。","choices":["笑った理由を聞く","一緒に我慢する","笑っていい日に変える"],"ends":["理由は「真面目な会議に紛れ込んだアヒルの声」だった。あなたも吹き出し、会議は五分休憩になった。","二人で真顔を作った。三秒後、相手の真顔がおかしくて同時に笑った。引き分けだった。","今日だけ笑っていい日にした。なぜかみんな静かになったので、最後に自分でくしゃみの真似をした。"]},"en":{"from":"From: Pigeon Workers Union","body":"This is not a complaint.\nToday my job acquired a new DO NOT LAUGH moment.\nI have already laughed three times.","choices":["Ask what was so funny.","Try not to laugh together.","Declare a laugh-friendly day."],"ends":["A duck noise had interrupted a very serious meeting. You laughed too. The meeting took a five-minute break.","You both tried to keep a straight face. Three seconds later, you laughed at each other. A perfect tie.","You made laughter officially legal. Everyone went silent, so you had to make a fake sneeze to get things started."]}},{"ja":{"from":"差出人：駅の改札","body":"重要なお知らせです。\n私の担当している「静かな時間」が、昨日から行方不明です。\n見つけた方は、そっと返してください。","choices":["探しに行く","捜索ポスターを作る","静かな時間を新しく作る"],"ends":["捜索の途中で、誰もいないベンチを見つけた。五分座ったら、探していたものはずっとそこにいた。","ポスターには「大声で探さないで」と書いた。翌朝、街中が小声になり、捜索本部が一番静かな場所になった。","あなたがスマホを伏せると、三秒だけ新しい静けさが生まれた。差出人はそれを瓶に入れて大事にした。"]},"en":{"from":"From: Station Ticket Gate","body":"Important notice.\nThe quiet hour I look after has gone missing since yesterday.\nIf you find it, please return it gently.","choices":["Go looking for it.","Make a missing poster.","Create a new quiet hour."],"ends":["You found an empty bench and sat for five minutes. The thing you were looking for had been there all along.","The poster said PLEASE SEARCH QUIETLY. By morning the entire town was whispering.","You turned your phone face down. Three seconds of silence appeared, and the sender carefully bottled them."]}},{"ja":{"from":"差出人：駅の改札","body":"ご報告があります。\n昨日、うっかり未来から「ありがとう」を一個だけ先に受け取りました。\n誰のものかわからず困っています。","choices":["持ち主を探す","今すぐ使う","未来へ返送する"],"ends":["持ち主を探す掲示板には「ありがとう」を落とした人が百人集まった。結局みんなで分けた。","あなたは見知らぬ人に席を譲った。翌日、その人から「ありがとう」が届き、帳尻がぴったり合った。","未来から返事が来た。「返品不可。今日、誰かに親切にしておいて」。領収書だけが過去へ届いた。"]},"en":{"from":"From: Station Ticket Gate","body":"A small incident to report.\nYesterday I accidentally received a thank-you from the future.\nI have no idea who it belongs to.","choices":["Find its owner.","Use it right now.","Return it to the future."],"ends":["A hundred people showed up claiming they had る「静かな時間」が、昨日から行方不明です。\n見つけた方は、そっと返してください。","choices":["探しに行く","捜索ポスターを作る","静かな時間を新しく作る"],"ends":["捜索の途中で、誰もいないベンチを見つけた。五分座ったら、探していたものはずっとそこにいた。","ポスターには「大声で探さないで」と書いた。翌朝、街中が小声になり、捜索本部が一番静かな場所になった。","あなたがスマホを伏せると、三秒だけ新しい静けさが生まれた。差出人はそれを瓶に入れて大事にした。"]},"en":{"from":"From: Pool Lifeguard Chair","body":"Important notice.\nThe quiet hour I look after has gone missing since yesterday.\nIf you find it, please return it gently.","choices":["Go looking for it.","Make a missing poster.","Create a new quiet hour."],"ends":["You found an empty bench and sat for five minutes. The thing you were looking for had been there all along.","The poster said PLEASE SEARCH QUIETLY. By morning the entire town was whispering.","You turned your phone face down. Three seconds of silence appeared, and the sender carefully bottled them."]}},{"ja":{"from":"差出人：プールの監視台","body":"ご報告があります。\n昨日、うっかり未来から「ありがとう」を一個だけ先に受け取りました。\n誰のものかわからず困っています。","choices":["持ち主を探す","今すぐ使う","未来へ返送する"],"ends":["持ち主を探す掲示板には「ありがとう」を落とした人が百人集まった。結局みんなで分けた。","あなたは見知らぬ人に席を譲った。翌日、その人から「ありがとう」が届き、帳尻がぴったり合った。","未来から返事が来た。「返品不可。今日、誰かに親切にしておいて」。領収書だけが過去へ届いた。"]},"en":{"from":"From: Pool Lifeguard Chair","body":"A small incident to report.\nYesterday I accidentally received a thank-you from the future.\nI have no idea who it belongs to.","choices":["Find its owner.","Use it right now.","Return it to the future."],"ends":["A hundred people showed up claiming they had lost a thank-you. They decided to share it.","You gave a stranger your seat. The next day they thanked you, and the universe balanced its books.","The future replied: NO RETURNS. DO SOMETHING KIND TODAY. Only the receipt came back."]}},{"ja":{"from":"差出人：プールの監視台","body":"内緒の相談です。\n今夜、私が一日だけ市長になることになりました。\n最初の条例を決めるのを手伝ってください。","choices":["昼寝を義務化","全員に手紙を配る","何もしない日を作る"],"ends":["昼寝条例の初日、議会は全員寝坊して開会できなかった。市民の支持率は過去最高だった。","全員に手紙を配ったら、返事が山ほど届いた。市役所は翌日から郵便局になった。","何もしない日ができた。市長だけは「何もしない日を守る仕事」が増え、ちょっと泣いた。"]},"en":{"from":"From: Pool Lifeguard Chair","body":"A confidential r  minutes. The thing you were looking for had been there all along.","The poster said PLEASE SEARCH QUIETLY. By morning the entire town was whispering.","You turned your phone face down. Three seconds of silence appeared, and the sender carefully bottled them."]}},{"ja":{"from":"差出人：宇宙人の翻訳機","body":"ご報告があります。\n昨日、うっかり未来から「ありがとう」を一個だけ先に受け取りました。\n誰のものかわからず困っています。","choices":["持ち主を探す","今すぐ使う","未来へ返送する"],"ends":["持ち主を探す掲示板には「ありがとう」を落とした人が百人集まった。結局みんなで分けた。","あなたは見知らぬ人に席を譲った。翌日、その人から「ありがとう」が届き、帳尻がぴったり合った。","未来から返事が来た。「返品不可。今日、誰かに親切にしておいて」。領収書だけが過去へ届いた。"]},"en":{"from":"From: Alien Translator","body":"A small incident to report.\nYesterday I accidentally received a thank-you from the future.\nI have no idea who it belongs to.","choices":["Find its owner.","Use it right now.","Return it to the future."],"ends":["A hundred people showed up claiming they had lost a thank-you. They decided to share it.","You gave a stranger your seat. The next day they thanked you, and the universe balanced its books.","The future replied: NO RETURNS. DO SOMETHING KIND TODAY. Only the receipt came back."]}},{"ja":{"from":"差出人：宇宙人の翻訳機","body":"内緒の相談です。\n今夜、私が一日だけ市長になることになりました。\n最初の条例を決めるのを手伝ってください。","choices":["昼寝を義務化","全員に手紙を配る","何もしない日を作る"],"ends":["昼寝条例の初日、議会は全員寝坊して開会できなかった。市民の支持率は過去最高だった。","全員に手紙を配ったら、返事が山ほど届いた。市役所は翌日から郵便局になった。","何もしない日ができた。市長だけは「何もしない日を守る仕事」が増え、ちょっと泣いた。"]},"en":{"from":"From: Alien Translator","body":"A confidential request.\nTonight I will be mayor for exactly one day.\nHelp me choose my first law.","choices":["Make naps mandatory.","Send everyone a letter.","Create a do-nothing day."],"ends":["On the first mandatory nap day, the council slept through its own meeting. Approval ratings soared.","Everyone received a letter. So many replies came back that city hall became a post office.","The do-nothing day was a hit. The mayor was the only one stuck working to enforce it."]}},{"ja":{"from":"差出人：宇宙人の翻訳機","body":"至急ご相談です。\n私のところに「まだ誰にも言ってない夢」が迷い込んできました。\n小さすぎて、ポケットから出てきません。"," ced its books.","The future replied: NO RETURNS. DO SOMETHING KIND TODAY. Only the receipt came back."]}},{"ja":{"from":"差出人：明日の天気の代役","body":"内緒の相談です。\n今夜、私が一日だけ市長になることになりました。\n最初の条例を決めるのを手伝ってください。","choices":["昼寝を義務化","全員に手紙を配る","何もしない日を作る"],"ends":["昼寝条例の初日、議会は全員寝坊して開会できなかった。市民の支持率は過去最高だった。","全員に手紙を配ったら、返事が山ほど届いた。市役所は翌日から郵便局になった。","何もしない日ができた。市長だけは「何もしない日を守る仕事」が増え、ちょっと泣いた。"]},"en":{"from":"From: Tomorrow Weather Stand-In","body":"A confidential request.\nTonight I will be mayor for exactly one day.\nHelp me choose my first law.","choices":["Make naps mandatory.","Send everyone a letter.","Create a do-nothing day."],"ends":["On the first mandatory nap day, the council slept through its own meeting. Approval ratings soared.","Everyone received a letter. So many replies came back that city hall became a post office.","The do-nothing day was a hit. The mayor was the only one stuck working to enforce it."]}},{"ja":{"from":"差出人：明日の天気の代役","body":"至急ご相談です。\n私のところに「まだ誰にも言ってない夢」が迷い込んできました。\n小さすぎて、ポケットから出てきません。","choices":["そっと応援する","夢に名前をつける","一緒に散歩する"],"ends":["「できるよ」と小声で言うと、夢は一センチ大きくなった。翌朝、靴の中に小さな勇気が入っていた。","夢は「とりあえず」と名付けられた。完璧じゃなくていいと気づいて、ようやくポケットから出てきた。","夢を連れて散歩したら、途中で転んだ。でも夢は笑って「これも旅の一部だね」と言った。"]},"en":{"from":"From: Tomorrow Weather Stand-In","body":"Urgent advice needed.\nAn unspoken dream wandered into my care.\nIt is so tiny that it refuses to leave my pocket.","choices":["Encourage it gently.","Give the dream a name.","Take it for a walk."],"ends":["You whispered YOU CAN DO IT. The dream grew an inch. In the morning, a little courage was tucked into your shoe.","You named it GOOD ENOUGH FOR NOW. It finally came out of hiding.","The dream tripped during your walk, then laughed. I GUESS THIS COUNTS AS AN ADVENTURE."]}},{"ja":{"from":"差出人：明日の天気の代役","body":"苦情ではありません。\n今日、私の仕事に「笑ってはいけない瞬間」が一つ追加されました。\nところが、もう三回笑ってしまいました。","choices":["笑った理由を聞く","一緒に我慢する","笑っていい日に変える"],"ends":["理由は「真面目な会議に紛れ込んだアヒルの声」だった。あなたも吹き出し、会議は五分休憩になった。","二人で真顔を作った。三秒後、相手の真顔がおかしくて同時に笑った。引き分けだった。","今日だけ笑っていい日にした。なぜかみんな静かになったので、最後に自分でくしゃみの真似をした。"]},"en":{"from":"From: Tomorrow Weather Stand-In","body":"This is not a complaint.\nToday my job acquired a new DO NOT LAUGH moment.\nI have already laughed three times.","choices":["Ask what was so funny.","Try not to laugh together.","Declare a laugh-friendly day."],"ends":["A duck noise had interrupted a very serious meeting. You laughed too. The meeting took a five-minute break.","You both tried to keep a straight face. Three seconds later, you laughed at each other. A perfect tie.","You made laughter officially legal. Everyone went silent, so you had to make a fake sneeze to get things started."]}},{"ja":{"from":"差出人：鳩労働組合","body":"退職届の審査結果が届きました。\n「過去の退職届と内容が似ているため、再提出してください」\n退職理由は、毎日退職届を配達していることです。","choices":["審査基準を聞く","別の理由を書く","労組に相談する"],"ends":["審査員は鳩だった。しかも三年前から退職審査を辞めたがっていた。","「羽が筋肉痛」と書いたら、医療費の領収書まで配達することになった。","労組から返事が来た。「この相談は前回と類似しています」。鳩は静かに窓を閉めた。"]},"en":{"from":"From: Pigeon Workers Union","body":"Your resignation has been reviewed.\nREJECTED: Too similar to previous resignations.\nYour reason for quitting? Delivering resignation letters every day.","choices":["Ask about the rules.","Write a new reason.","Contact the union."],"ends":["The reviewer was another pigeon who had been trying to quit for three years.","You wrote MY WINGS HURT. Now you also had to deliver the medical bills.","The union replied: THIS COMPLAINT IS TOO SIMILAR TO YOUR LAST ONE. The pigeon closed the window."]}},{"ja":{"from":"差出人：鳩の人事部","body":"社長がAIで鳩を千羽作りました。\n「これで休めるね」と言われました。\nでも全員、初出勤日に同じ退職届を持ってきました。","choices":["一羽だけ説得する","退職届を受理する","社長に配達を頼む"],"ends":["一羽だけ残った。「僕は労組の代表です」。増員計画は逆効果だった。","千通の退職通知を印刷したところ、配送先が全部社長の自宅だった。","社長が初めて一通運んだ。「これ重いね」。鳩たちは拍手した。"]},"en":{"from":"From: Pigeon HR","body":"The boss generated a thousand AI pigeons.\nNOW YOU CAN REST, he said.\nEvery new pigeon arrived with the exact same resignation letter.","choices":["Persuade one pigeon.","Accept every resignation.","Ask the boss to deliver."],"ends":["One stayed behind. I REPRESENT THE UNION. Hiring had backfired.","You printed a thousand confirmations. All were addressed to the boss’s house.","The boss delivered one letter. WOW, THIS IS HEAVY. The pigeons applauded."]}},{"ja":{"from":"差出人：鳩の整形外科","body":"AIになった鳩が診察に来ました。\n「疲れないはずなのに羽が筋肉痛なんです」\n医者はカルテを見て首をかしげました。","choices":["原因を調べる","休暇を出す","開発者を呼ぶ"],"ends":["原因は一日千回の「送信」ボタン。鳩は初めて「下書き保存」を覚えた。","休暇届の配達係に鳩の名前が書かれていた。医者がそっと赤ペンで消した。","開発者は「リアルにしました」と胸を張った。医者は開発者に診断書を渡した。"]},"en":{"from":"From: Pigeon Orthopedics","body":"An AI pigeon came in for a checkup.\nI SHOULD NOT GET TIRED, BUT MY WINGS ARE SORE.\nThe doctor stared at the chart.","choices":["Investigate.","Grant some leave.","Call the developer."],"ends":["The cause was tapping SEND a thousand times a day. The pigeon discovered SAVE DRAFT.","The delivery assignment for its leave request had its own name on it. The doctor crossed it out.","The developer proudly said I MADE IT REALISTIC. The doctor handed the developer a medical bill."]}},{"ja":{"from":"差出人：鳩の未来","body":"十年後の鳩です。\n未来から一通だけ届けに来ました。\n封筒には「今すぐ開けないで」と書いてあります。","choices":["すぐ開ける","十年待つ","鳩に理由を聞く"],"ends":["中には「ほら、開けた」とだけ書かれていた。未来の鳩は勝ち誇った顔をした。","十年後、封筒には「十年間お疲れさま」とあった。差出人は今のあなた。","「中に休暇申請が入ってる。開けると仕事が増えるんだ」。あなたは封を戻した。"]},"en":{"from":"From: Future Pigeon","body":"I am the pigeon from ten years ahead.\nI have brought you one letter from the future.\nOn the envelope: DO NOT OPEN YET.","choices":["Open it now.","Wait ten years.","Ask the pigeon why."],"ends":["Inside was one sentence: KNEW YOU WOULD. Future pigeon looked smug.","Ten years later it said THANK YOU FOR WAITING. It was signed by your younger self.","IT IS MY LEAVE REQUEST. IF YOU OPEN IT, I GET MORE WORK. You put it away."]}},{"ja":{"from":"差出人：鳩の郵便局","body":"本日の最終便です。\n鳩があなたに手紙を差し出しました。\nでも宛名は「いつも頑張っている鳩へ」でした。","choices":["鳩に読んであげる","そっと渡す","一緒に開ける"],"ends":["「いつもありがとう」。それだけだった。鳩は一度だけ、配達先で泣いた。","鳩は手紙を胸にしまった。今日は返事を急がなくていいと知った。","中には小さな休暇券が一枚。期限はなし。鳩は初めて明日の予定を空欄にした。"]},"en":{"from":"From: Pigeon Post Office","body":"Last delivery of the day.\nThe pigeon handed you an envelope.\nBut it was addressed TO THE PIGEON WHO KEEPS TRYING.","choices":["Read it aloud.","Hand it over gently.","Open it together."],"ends":["It only said THANK YOU. For once, the pigeon cried at the delivery address.","The pigeon tucked the note close. For once, no reply was due.","Inside was a tiny vacation voucher with no expiry date. Tomorrow’s calendar stayed blank."]}}];
const el=id=>document.getElementById(id);let language=localStorage.getItem('pigeon-lang')||'ja',sound=localStorage.getItem('pigeon-sound')!=='off',idx=-1,current=null,choice=-1,audioCtx=null,musicTimer=null,playing=false;let lastStory=-1,savedReply="",incomingReply="";const t=(ja,en)=>language==='ja'?ja:en;
function ui(){document.documentElement.lang=language;el('brand').textContent=t('なんか届いた。','Pigeon');el('headline').textContent=t('なんか届いた。','Pigeon');el('tagline').textContent=t('鳩をタップして、手紙を開けよう。','Tap the pigeon to open a letter.');el('lang').textContent=language==='ja'?'EN':'日本語';el('sound').textContent=sound?'🔊 ON':'🔇 OFF';el('replyLabel').textContent=t('最後に、お返事を書く？','Want to write back?');el('reply').placeholder=t('なんでもどうぞ。笑','Anything you want.');el('send').textContent=t('🕊️ 友達に届ける','🕊️ Deliver to a friend');el('skip').textContent=t('やめておく','Skip');el('write').textContent=t('✍️ お返事を書く','✍️ Write back');el('noReply').textContent=t('このまま終わる','Finish here');el('homeNow').textContent=t('🏠 トップに戻る','🏠 Back to home');el('next').textContent=t('🏠 トップに戻る','🏠 Back to home');el('count').textContent=t('1,000通（物語初稿・重複調整中）','1,000 letters (drafts; editing in progress)');el('homeMusic').textContent=t('♫ カノンを再生 / 停止','♫ Play / pause Canon');el('shareHint').textContent=t('気に入った手紙は友達にも届けられるよ。','Deliver a favorite letter to a friend.');el('shareLetter').textContent=t('💌 この手紙を友達に届ける','💌 Deliver this letter to a friend');el('copyLetter').textContent=t('🔗 リンクをコピー','🔗 Copy letter link');if(current)renderLetter();}
function stopSpeech(){if('speechSynthesis' in window) speechSynthesis.cancel()}
function speak(str){if(!sound||!('speechSynthesis' in window))return;stopSpeech();const u=new SpeechSynthesisUtterance(str);u.lang=language==='ja'?'ja-JP':'en-US';const voices=speechSynthesis.getVoices();const preferred=voices.filter(v=>v.lang.toLowerCase().startsWith(language==='ja'?'ja':'en')).sort((a,b)=>{const score=v=>(v.localService?1:0)+(language==='en'&&/premium|enhanced|natural|samantha|ava|daniel|alex|serena/i.test(v.name)?3:0);return score(b)-score(a)});if(preferred.length)u.voice=preferred[0];u.rate=language==='ja'?.91:.96;u.pitch=1.0;u.volume=1;speechSynthesis.speak(u)}
function musicStart(){
 if(!sound||playing||el('home').classList.contains('hidden'))return;
 try{
  audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();audioCtx.resume();playing=true;
  // Original oscillator synthesis; public-domain Canon in D by J. Pachelbel. No copyrighted recording used.
  const bass=[146.83,110,123.47,92.50,98.00,73.42,98.00,110];
  const melody=[369.99,329.63,293.66,277.18,246.94,220,246.94,277.18,293.66,277.18,246.94,220,196,185,196,220,
   246.94,220,196,185,164.81,146.83,164.81,185,196,185,164.81,146.83,164.81,185,196,220];
  let step=0;const tempo=360;
  function play(freq,duration,vol,type){const now=audioCtx.currentTime,osc=audioCtx.createOscillator(),gain=audioCtx.createGain();osc.type=type;osc.frequency.setValueAtTime(freq,now);gain.gain.setValueAtTime(.0001,now);gain.gain.exponentialRampToValueAtTime(vol,now+.035);gain.gain.exponentialRampToValueAtTime(.0001,now+duration);osc.connect(gain).connect(audioCtx.destination);osc.start(now);osc.stop(now+duration+.03)}
  function beat(){if(!playing||el('home').classList.contains('hidden'))return;play(melody[step%melody.length],.62,.012,'sine');if(step%2===0)play(bass[Math.floor(step/2)%bass.length],1.05,.007,'triangle');step++}
  beat();musicTimer=setInterval(beat,tempo);
 }catch(e){el('status').textContent=t('この端末ではBGMを再生できませんでした。','Background music is unavailable on this device.')}
}
function musicStop(){playing=false;clearInterval(musicTimer);musicTimer=null}
function hide(...ids){ids.forEach(id=>el(id).classList.add('hidden'))}function show(...ids){ids.forEach(id=>el(id).classList.remove('hidden'))}
function newLetter(){savedReply='';incomingReply='';el('reply').value='';stopSpeech();if(idx<0)idx=Math.floor(Math.random()*stories.length);else idx=(idx+1+Math.floor(Math.random()*(stories.length-1)))%stories.length;current=stories[idx];choice=-1;el('home').classList.add('hidden');show('panel');renderLetter();musicStop()}
function goHome(){stopSpeech();musicStop();current=null;idx=-1;choice=-1;savedReply='';incomingReply='';el('reply').value='';hide('panel');show('home');musicStart();el('status').textContent='';const clean=new URL(location.href);clean.search='';clean.hash='';history.replaceState(null,'',clean.pathname);}
function renderLetter(){const s=current[language];el('sender').textContent=s.from;el('letter').textContent=s.body;show('letter','choices');hide('ending','endingActions','replyArea','finish');show('shareActions');el('receivedLabel').textContent=t('💌 友達からあなたへの返事','💌 A reply from your friend');el('receivedText').textContent=incomingReply;if(incomingReply)show('receivedReply');else hide('receivedReply');el('choices').replaceChildren();s.choices.forEach((c,i)=>{let b=document.createElement('button');b.className='choice';b.textContent=(i+1)+'. '+c;b.onclick=()=>end(i);el('choices').appendChild(b)});speak(s.body)}
function end(i){choice=i;hide('choices');show('ending','endingActions');el('ending').textContent=current[language].ends[i];speak(current[language].ends[i])}
function write(){hide('endingActions');show('replyArea');el('reply').focus()}
function encodeReply(str){const bytes=new TextEncoder().encode(str);let binary='';for(const byte of bytes)binary+=String.fromCharCode(byte);return btoa(binary).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function decodeReply(str){try{if(!/^[A-Za-z0-9_-]{1,3000}$/.test(str))return '';const binary=atob(str.replace(/-/g,'+').replace(/_/g,'/')+'='.repeat((4-str.length%4)%4));return new TextDecoder('utf-8',{fatal:true}).decode(Uint8Array.from(binary,c=>c.charCodeAt(0))).slice(0,500)}catch(e){return ''}}
function letterUrl(){const url=new URL(location.href);url.search='';url.hash='';url.searchParams.set('letter',String(idx+1));if(choice>=0)url.searchParams.set('ending',String(choice+1));if(savedReply)url.searchParams.set('reply',encodeReply(savedReply));return url.toString()}
async function shareLetter(){const s=current[language];const text=s.from+'\n'+s.body+(savedReply?'\n\n💌 '+t('あなたへの返事：','A reply for you:')+'\n'+savedReply:'')+'\n\n'+t('鳩から手紙が届いたよ 🕊️','A pigeon brought you a letter 🕊️');const url=letterUrl();try{if(navigator.share){await navigator.share({title:t('なんか届いた。','Pigeon'),text,url});return}}catch(e){if(e.name==='AbortError')return}await copyLetter()}
async function copyLetter(){const url=letterUrl();try{await navigator.clipboard.writeText(url);el('status').textContent=t('返事付きリンクをコピーしたよ！友達に送ってね 🕊️','Link copied! Send it to a friend 🕊️')}catch(e){prompt(t('このリンクをコピーしてね','Copy this link'),url)}}
function finish(sent){hide('replyArea','endingActions');show('finish');el('finishText').textContent=sent?t('返事を準備できたよ。下の「友達に届ける」を押してね 🕊️','Reply ready. Tap Deliver to a friend below 🕊️'):t('鳩は静かに飛んでいった。','The pigeon flew away quietly.');if(sent){el('shareLetter').textContent=t('💌 返事を友達に届ける','💌 Deliver your reply');el('copyLetter').textContent=t('🔗 返事付きリンクをコピー','🔗 Copy reply link');}stopSpeech()}
el('homeMusic').onclick=()=>{if(playing){musicStop()}else{if(!sound){sound=true;localStorage.setItem('pigeon-sound','on');ui()}musicStart()}};el('shareLetter').onclick=shareLetter;el('copyLetter').onclick=copyLetter;el('birdButton').onclick=newLetter;el('write').onclick=write;el('noReply').onclick=()=>finish(false);el('send').onclick=async()=>{const value=el('reply').value.trim();if(!value)return;savedReply=value;finish(true);await shareLetter()};el('skip').onclick=()=>finish(false);el('next').onclick=goHome;el('homeNow').onclick=goHome;el('lang').onclick=()=>{language=language==='ja'?'en':'ja';localStorage.setItem('pigeon-lang',language);stopSpeech();ui()};el('sound').onclick=()=>{sound=!sound;localStorage.setItem('pigeon-sound',sound?'on':'off');if(!sound){stopSpeech();musicStop()}else{musicStart();if(current)speak(choice<0?current[language].body:current[language].ends[choice])}ui()};window.addEventListener('pagehide',()=>{stopSpeech();musicStop()});ui();const params=new URL(location.href).searchParams;const shared=params.get('letter');if(shared&&/^\d+$/.test(shared)&&Number(shared)>=1&&Number(shared)<=stories.length){idx=Number(shared)-1;current=stories[idx];incomingReply=decodeReply(params.get('reply')||'');hide('home');show('panel');renderLetter();el('status').textContent=t('友達から手紙が届いたよ 🕊️','A friend sent you a letter 🕊️')}
