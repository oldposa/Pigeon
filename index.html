html[lang="en"]{font-family:Georgia,"Times New Roman",serif}h1{font-family:Georgia,"Times New Roman","Hiragino Mincho ProN","Yu Mincho",serif}.home-caption,footer{font-family:Georgia,"Times New Roman",serif}
/* Usability restoration: the letter, three choices, reply and share are the priorities. */
.app{width:min(100%,500px);padding-left:18px;padding-right:18px}
header{min-height:60px}
#home{padding:14px 0 24px}
.bird-button{width:min(57vw,232px)}
h1{font-size:clamp(34px,9vw,44px);margin:4px 0 10px}
.home-caption{margin-bottom:2px}
.home-note{margin:14px 0 0;padding:10px 12px}

.panel{margin:14px 0 16px;padding:20px 16px;border-radius:12px}
.panel:before{top:13px;right:15px}
.sender{font-size:17px;font-weight:700;line-height:1.55;margin:0 30px 13px 0;overflow-wrap:anywhere}
.sender::before{content:'FROM';display:block;font:10px Georgia,serif;letter-spacing:.18em;color:#667b9b;margin-bottom:4px}
.letter{font-size:17px;line-height:1.85;overflow-wrap:anywhere}
.choices{gap:9px;margin-top:19px}
.choice,.primary,.secondary{min-height:52px;padding:13px 15px;border-radius:10px;font-size:15px;line-height:1.5}
.choice{background:#f4f7fb;border:1.5px solid #bdcce0;text-align:left;font-weight:650}
.choice:before{content:'→';margin-right:9px;color:#46638e;font-family:Arial,sans-serif}
.choice:active{background:#dce7f5}
#writeDirect{margin-top:10px!important;background:#fff}
.actions{gap:9px;margin-top:13px}
#shareActions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:16px;padding-top:15px;border-top:1px solid #dce4ed}
#shareActions #shareLetter{grid-column:1/-1;background:var(--navy);color:#fff;border-color:var(--navy);font-weight:750}
#shareActions #shareCard,#shareActions #copyLetter{font-size:13px;padding:10px 7px;min-height:48px;border-color:#b8c7dc}
#ending{padding:13px 0 3px}
#endingActions{margin-top:14px}
#endingActions #write{background:var(--navy)}
#status{font-size:13px}
button{touch-action:manipulation}
@media(max-width:360px){.app{padding-left:13px;padding-right:13px}.panel{padding:17px 13px}.sender{font-size:16px}.letter{font-size:16px}.choice{font-size:14px}}

#nextLetter{background:#0a2356;color:white;border:1px solid #0a2356;border-radius:10px;cursor:pointer}#nextLetter:active{opacity:.8}</style><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Pigeon"><meta name="description" content="鳩から届く、ちょっと変な手紙。選んだ答えで結末が変わる。"></head><body><main class="app"><header><strong id="brand">なんか届いた。</strong><div><button class="toggle" id="lang">EN</button> <button class="toggle" id="sound">🔊 ON</button></div></header><section id="home" style="text-align:center;width:100%"><button class="bird-button" id="birdButton" aria-label="手紙を開ける"><img class="bird" src="pigeon-logo.png" alt="封筒をくわえて右へ飛ぶ鳩"></button><p class="home-caption">A LITTLE LETTER FOR YOU</p><h1 id="headline">なんか届いた。</h1><p class="hint" id="tagline">鳩をタップして、手紙を開けよう。</p><p class="tiny" id="count"></p><p class="home-note">届いた手紙に、あなたならなんて返す？<br>選んでも、自由に書いても。</p><p class="tiny" id="shareHint"></p></section><section id="panel" class="panel hidden" aria-live="polite"><div class="sender" id="sender"></div><div id="letter" class="letter"></div><div id="receivedReply" class="hidden" style="margin:20px 0;padding:17px;border:1px solid #dce3eb;border-radius:14px;background:#f6f8fb"><div id="receivedLabel" style="font-size:12px;color:#64748b;margin-bottom:8px"></div><div id="receivedText" style="white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.8"></div></div><div id="choices" class="choices"></div><button class="secondary hidden" id="writeDirect" style="margin-top:12px">✍️ 自分の言葉で返す</button><div id="ending" class="ending hidden"></div><div id="replyArea" class="hidden"><p id="replyLabel" style="margin:18px 0 10px"></p><textarea id="reply" maxlength="500" placeholder=""></textarea><div class="actions"><button class="primary" id="send"></button><button class="secondary" id="skip"></button></div></div><div id="finish" class="hidden"><p id="finishText" style="margin-top:20px"></p><div class="actions"><button class="primary" id="next"></button></div></div><div class="actions hidden" id="shareActions"><button class="secondary" id="shareLetter">💌 この手紙を友達に届ける</button><button class="secondary" id="shareCard">🖼️ 画像カードを共有</button><button class="secondary" id="copyLetter">🔗 リンクをコピー</button></div><div class="actions hidden" id="endingActions"><button class="primary" id="write"></button><button class="secondary" id="noReply"></button><button class="secondary" id="homeNow" type="button">🏠 トップに戻る</button></div><button class="primary" id="nextLetter" type="button" style="display:block;width:100%;margin:18px 0 4px;min-height:54px;font-size:16px;font-weight:750">次の手紙へ →</button></section><div id="status" aria-live="polite"></div><footer id="footer">Pigeon · a tiny surprise, delivered.</footer></main><script>
const stories=[{"ja":{"from":"差出人：家族の秘密を知りすぎたゴミ箱","body":"昨日、娘さんがテストを捨てました。今朝、お父さんが『うちの子は成績がいい』と自慢していました。僕は黙っていたほうがいいですか？","choices":["家庭の平和を守ってくれ","次のゴミの日まで口を閉じて","まず答案の点数を教えて"],"ends":["二日後、封筒に家族の秘密を知りすぎたゴミ箱の名前があった。\n「家庭の平和を守ってくれ」の通りにするか迷った末、まず紙に書き出してみた。\n昨日、娘さんがテストを捨てました。そこから思いもしないことが起きた。なぜか小さな行列ができた。\n「これ、成功ってことでいいですか」と最後に書いてあった。","その日の夕方、家族の秘密を知りすぎたゴミ箱が、例の「昨日、娘さんがテストを捨てました」について書いてきた。\n「次のゴミの日まで口を閉じて」の返事をきっかけに、少しだけ勇気を出してみた。\n意外にも反対する人がいなかった。\n「続きができたら、また書きます」で終わっていた。","一週間後、封筒に家族の秘密を知りすぎたゴミ箱の名前があった。\n「まず答案の点数を教えて」の通りにするか迷った末、まず紙に書き出してみた。\n昨日、娘さんがテストを捨てました。そこから思いもしないことが起きた。いちばん驚いたのは本人だった。\n追伸には「次は自分で決めてみます」とあった。"]},"en":{"from":"差出人：家族の秘密を知りすぎたゴミ箱","body":"昨日、娘さんがテストを捨てました。今朝、お父さんが『うちの子は成績がいい』と自慢していました。僕は黙っていたほうがいいですか？","choices":["家庭の平和を守ってくれ","次のゴミの日まで口を閉じて","まず答案の点数を教えて"],"ends":["二日後、封筒に家族の秘密を知りすぎたゴミ箱の名前があった。\n「家庭の平和を守ってくれ」の通りにするか迷った末、まず紙に書き出してみた。\n昨日、娘さんがテストを捨てました。そこから思いもしないことが起きた。なぜか小さな行列ができた。\n「これ、成功ってことでいいですか」と最後に書いてあった。","その日の夕方、家族の秘密を知りすぎたゴミ箱が、例の「昨日、娘さんがテストを捨てました」について書いてきた。\n「次のゴミの日まで口を閉じて」の返事をきっかけに、少しだけ勇気を出してみた。\n意外にも反対する人がいなかった。\n「続きができたら、また書きます」で終わっていた。","一週間後、封筒に家族の秘密を知りすぎたゴミ箱の名前があった。\n「まず答案の点数を教えて」の通りにするか迷った末、まず紙に書き出してみた。\n昨日、娘さんがテストを捨てました。そこから思いもしないことが起きた。いちばん驚いたのは本人だった。\n追伸には「次は自分で決めてみます」とあった。"]}},{"ja":{"from":"差出人：住宅ローンが残っている魔王","body":"勇者が城を壊しに来ています。返済はあと32年あります。世界征服より先に銀行に相談すべきでしょうか。","choices":["勇者に残債を見せよう","城だけは守って","銀行が真のラスボス"],"ends":["翌週、短い手紙が届いた。差出人は住宅ローンが残っている魔王。\n「勇者に残債を見せよう」と返したら、まず紙に書き出してみた。\n例の「勇者が城を壊しに来ています」の件は、ところが、話を聞いていた人のほうが先に動いた。\n追伸には「次は自分で決めてみます」とあった。","日付のない追伸が届いた。短い手紙が届いた。差出人は住宅ローンが残っている魔王。\n「城だけは守って」と返したら、少しだけ勇気を出してみた。\n例の「勇者が城を壊しに来ています」の件は、最初に笑った人が、最後は黙り込んだ。\n追伸には「次は自分で決めてみます」とあった。","三日後、短い手紙が届いた。差出人は住宅ローンが残っている魔王。\n「銀行が真のラスボス」と返したら、最初は笑ったが、試してみた。\n例の「勇者が城を壊しに来ています」の件は、なぜか関係ない人が一番喜んだ。\n「たぶんこれでよかった」と短く締めくくられていた。"]},"en":{"from":"差出人：住宅ローンが残っている魔王","body":"勇者が城を壊しに来ています。返済はあと32年あります。世界征服より先に銀行に相談すべきでしょうか。","choices":["勇者に残債を見せよう","城だけは守って","銀行が真のラスボス"],"ends":["翌週、短い手紙が届いた。差出人は住宅ローンが残っている魔王。\n「勇者に残債を見せよう」と返したら、まず紙に書き出してみた。\n例の「勇者が城を壊しに来ています」の件は、ところが、話を聞いていた人のほうが先に動いた。\n追伸には「次は自分で決めてみます」とあった。","日付のない追伸が届いた。短い手紙が届いた。差出人は住宅ローンが残っている魔王。\n「城だけは守って」と返したら、少しだけ勇気を出してみた。\n例の「勇者が城を壊しに来ています」の件は、最初に笑った人が、最後は黙り込んだ。\n追伸には「次は自分で決めてみます」とあった。","三日後、短い手紙が届いた。差出人は住宅ローンが残っている魔王。\n「銀行が真のラスボス」と返したら、最初は笑ったが、試してみた。\n例の「勇者が城を壊しに来ています」の件は、なぜか関係ない人が一番喜んだ。\n「たぶんこれでよかった」と短く締めくくられていた。"]}},{"ja":{"from":"差出人：毎日『何もない』と言われる冷蔵庫","body":"卵も牛乳も昨日のカレーも入っています。それでも家族は扉を開けて『何もない』と言います。僕の中身は何なんでしょう。","choices":["希望が足りないのかも","カレーを最前列に置こう","一回だけ『いるよ』って言ってみて"],"ends":["三日後、毎日『何もない』と言われる冷蔵庫が、例の「卵も牛乳も昨日のカレーも入っています」について書いてきた。\n「希望が足りないのかも」の返事をきっかけに、思い切って口に出してみた。\n説明を求められ、余計に話が大きくなった。\n「今度はあなたの話も聞かせて」と書き添えられていた。","翌週、毎日『何もない』と言われる冷蔵庫から二通目。\n「カレーを最前列に置こう」を実行する前に、卵も牛乳も昨日のカレーも入っていますという話を思い出したらしい。\n最初は笑ったが、試してみた。思わぬところで拍手が起きた。\n結局、本人が一番楽しそうだった。","数時間後、短い手紙が届いた。差出人は毎日『何もない』と言われる冷蔵庫。\n「一回だけ『いるよ』って言ってみて」と返したら、本当にその通りにしたらしい。\n例の「卵も牛乳も昨日のカレーも入っています」の件は、一人だけ、まったく別の解釈をした。\n封筒の裏には、小さな丸が一つ描かれていた。"]},"en":{"from":"差出人：毎日『何もない』と言われる冷蔵庫","body":"卵も牛乳も昨日のカレーも入っています。それでも家族は扉を開けて『何もない』と言います。僕の中身は何なんでしょう。","choices":["希望が足りないのかも","カレーを最前列に置こう","一回だけ『いるよ』って言ってみて"],"ends":["三日後、毎日『何もない』と言われる冷蔵庫が、例の「卵も牛乳も昨日のカレーも入っています」について書いてきた。\n「希望が足りないのかも」の返事をきっかけに、思い切って口に出してみた。\n説明を求められ、余計に話が大きくなった。\n「今度はあなたの話も聞かせて」と書き添えられていた。","翌週、毎日『何もない』と言われる冷蔵庫から二通目。\n「カレーを最前列に置こう」を実行する前に、卵も牛乳も昨日のカレーも入っていますという話を思い出したらしい。\n最初は笑ったが、試してみた。思わぬところで拍手が起きた。\n結局、本人が一番楽しそうだった。","数時間後、短い手紙が届いた。差出人は毎日『何もない』と言われる冷蔵庫。\n「一回だけ『いるよ』って言ってみて」と返したら、本当にその通りにしたらしい。\n例の「卵も牛乳も昨日のカレーも入っています」の件は、一人だけ、まったく別の解釈をした。\n封筒の裏には、小さな丸が一つ描かれていた。"]}},{"ja":{"from":"差出人：検索履歴を見て将来が不安になったパソコン","body":"持ち主は昨日『転職で年収アップ』を調べていました。今日は『寝ているだけで稼ぐ』です。明日は何を検索すると思いますか。","choices":["宝くじの当選確率","仕事の夢を見る方法","お前も転職先を探そう"],"ends":["返事を出した翌朝、検索履歴を見て将来が不安になったパソコンから二通目。\n「宝くじの当選確率」を実行する前に、持ち主は昨日『転職で年収アップ』を調べていましたという話を思い出したらしい。\n本当にその通りにしたらしい。その場では何も起きなかった。翌日になって効いてきた。\n封筒には、なぜか二枚目の切手が貼ってあった。","三日後、検索履歴を見て将来が不安になったパソコンが、例の「持ち主は昨日『転職で年収アップ』を調べていました」について書いてきた。\n「仕事の夢を見る方法」の返事をきっかけに、思い切って口に出してみた。\n周囲は納得したが、本人だけ納得していない。\n最後の一行だけ、やけに字が大きかった。","日付のない追伸が届いた。短い手紙が届いた。差出人は検索履歴を見て将来が不安になったパソコン。\n「お前も転職先を探そう」と返したら、一度はやめかけたが、結局実行した。\n例の「持ち主は昨日『転職で年収アップ』を調べていました」の件は、ところが、話を聞いていた人のほうが先に動いた。\n「これ、成功ってことでいいですか」と最後に書いてあった。"]},"en":{"from":"差出人：検索履歴を見て将来が不安になったパソコン","body":"持ち主は昨日『転職で年収アップ』を調べていました。今日は『寝ているだけで稼ぐ』です。明日は何を検索すると思いますか。","choices":["宝くじの当選確率","仕事の夢を見る方法","お前も転職先を探そう"],"ends":["返事を出した翌朝、検索履歴を見て将来が不安になったパソコンから二通目。\n「宝くじの当選確率」を実行する前に、持ち主は昨日『転職で年収アップ』を調べていましたという話を思い出したらしい。\n本当にその通りにしたらしい。その場では何も起きなかった。翌日になって効いてきた。\n封筒には、なぜか二枚目の切手が貼ってあった。","三日後、検索履歴を見て将来が不安になったパソコンが、例の「持ち主は昨日『転職で年収アップ』を調べていました」について書いてきた。\n「仕事の夢を見る方法」の返事をきっかけに、思い切って口に出してみた。\n周囲は納得したが、本人だけ納得していない。\n最後の一行だけ、やけに字が大きかった。","日付のない追伸が届いた。短い手紙が届いた。差出人は検索履歴を見て将来が不安になったパソコン。\n「お前も転職先を探そう」と返したら、一度はやめかけたが、結局実行した。\n例の「持ち主は昨日『転職で年収アップ』を調べていました」の件は、ところが、話を聞いていた人のほうが先に動いた。\n「これ、成功ってことでいいですか」と最後に書いてあった。"]}},{"ja":{"from":"差出人：ガリガリなのになぜか連勝中の相撲選手","body":"昨日も勝ちました。相手が土俵に上がるたび『すみません』と言って自分から降りていきます。僕、何かしてますか？","choices":["顔が怖い説","まず謝られる理由を聞こう","そのまま横綱になれ"],"ends":["次の月曜日、ガリガリなのになぜか連勝中の相撲選手が、例の「昨日も勝ちました」について書いてきた。\n「顔が怖い説」の返事をきっかけに、本当にその通りにしたらしい。\nところが、話を聞いていた人のほうが先に動いた。\n「たぶんこれでよかった」と短く締めくくられていた。","返事を出した翌朝、ガリガリなのになぜか連勝中の相撲選手から二通目。\n「まず謝られる理由を聞こう」を実行する前に、昨日も勝ちましたという話を思い出したらしい。\n少しだけ勇気を出してみた。説明を求められ、余計に話が大きくなった。\n追伸には「次は自分で決めてみます」とあった。","次の朝、封筒にガリガリなのになぜか連勝中の相撲選手の名前があった。\n「そのまま横綱になれ」の通りにするか迷った末、予定外の相手まで巻き込んだ。\n昨日も勝ちました。そこから思いもしないことが起きた。周囲は納得したが、本人だけ納得していない。\n「これ、成功ってことでいいですか」と最後に書いてあった。"]},"en":{"from":"差出人：ガリガリなのになぜか連勝中の相撲選手","body":"昨日も勝ちました。相手が土俵に上がるたび『すみません』と言って自分から降りていきます。僕、何かしてますか？","choices":["顔が怖い説","まず謝られる理由を聞こう","そのまま横綱になれ"],"ends":["次の月曜日、ガリガリなのになぜか連勝中の相撲選手が、例の「昨日も勝ちました」について書いてきた。\n「顔が怖い説」の返事をきっかけに、本当にその通りにしたらしい。\nところが、話を聞いていた人のほうが先に動いた。\n「たぶんこれでよかった」と短く締めくくられていた。","返事を出した翌朝、ガリガリなのになぜか連勝中の相撲選手から二通目。\n「まず謝られる理由を聞こう」を実行する前に、昨日も勝ちましたという話を思い出したらしい。\n少しだけ勇気を出してみた。説明を求められ、余計に話が大きくなった。\n追伸には「次は自分で決めてみます」とあった。","次の朝、封筒にガリガリなのになぜか連勝中の相撲選手の名前があった。\n「そのまま横綱になれ」の通りにするか迷った末、予定外の相手まで巻き込んだ。\n昨日も勝ちました。そこから思いもしないことが起きた。周囲は納得したが、本人だけ納得していない。\n「これ、成功ってことでいいですか」と最後に書いてあった。"]}},{"ja":{"from":"差出人：自分の葬式に呼ばれなかった幽霊","body":"みんな集まっていたのに、僕だけ日時を知らされませんでした。あとから写真を見せられても困ります。","choices":["本人確認が難しいからね","二次会から参加しよう","幹事に化けて聞いてみて"],"ends":["三日後、自分の葬式に呼ばれなかった幽霊が報告してきた。\n「本人確認が難しいからね」という一言がきっかけで、予定外の相手まで巻き込んだ。\n「みんな集まっていたのに、僕だけ日時を知らされませんでした」と悩んでいた頃とは、少し様子が違う。ところが、話を聞いていた人のほうが先に動いた。\n「続きができたら、また書きます」で終わっていた。","雨が降った日、自分の葬式に呼ばれなかった幽霊が、例の「みんな集まっていたのに、僕だけ日時を知らされませんでした」について書いてきた。\n「二次会から参加しよう」の返事をきっかけに、少しだけ勇気を出してみた。\nその場では何も起きなかった。翌日になって効いてきた。\n「これ、成功ってことでいいですか」と最後に書いてあった。","週末になって、短い手紙が届いた。差出人は自分の葬式に呼ばれなかった幽霊。\n「幹事に化けて聞いてみて」と返したら、思ったより真剣に受け取られた。\n例の「みんな集まっていたのに、僕だけ日時を知らされませんでした」の件は、いちばん驚いたのは本人だった。\n封筒の裏には、小さな丸が一つ描かれていた。"]},"en":{"from":"差出人：自分の葬式に呼ばれなかった幽霊","body":"みんな集まっていたのに、僕だけ日時を知らされませんでした。あとから写真を見せられても困ります。","choices":["本人確認が難しいからね","二次会から参加しよう","幹事に化けて聞いてみて"],"ends":["三日後、自分の葬式に呼ばれなかった幽霊が報告してきた。\n「本人確認が難しいからね」という一言がきっかけで、予定外の相手まで巻き込んだ。\n「みんな集まっていたのに、僕だけ日時を知らされませんでした」と悩んでいた頃とは、少し様子が違う。ところが、話を聞いていた人のほうが先に動いた。\n「続きができたら、また書きます」で終わっていた。","雨が降った日、自分の葬式に呼ばれなかった幽霊が、例の「みんな集まっていたのに、僕だけ日時を知らされませんでした」について書いてきた。\n「二次会から参加しよう」の返事をきっかけに、少しだけ勇気を出してみた。\nその場では何も起きなかった。翌日になって効いてきた。\n「これ、成功ってことでいいですか」と最後に書いてあった。","週末になって、短い手紙が届いた。差出人は自分の葬式に呼ばれなかった幽霊。\n「幹事に化けて聞いてみて」と返したら、思ったより真剣に受け取られた。\n例の「みんな集まっていたのに、僕だけ日時を知らされませんでした」の件は、いちばん驚いたのは本人だった。\n封筒の裏には、小さな丸が一つ描かれていた。"]}},{"ja":{"from":"差出人：自分の結婚式で席がなかった新郎","body":"席次表に僕の名前がありません。妻は『立ってていいよ』と言っています。これは演出でしょうか。","choices":["式場に確認しよう","立食パーティーに変更","今ならまだ帰れる"],"ends":["数時間後、自分の結婚式で席がなかった新郎が報告してきた。\n「式場に確認しよう」という一言がきっかけで、思い切って口に出してみた。\n「席次表に僕の名前がありません」と悩んでいた頃とは、少し様子が違う。なぜか小さな行列ができた。\n追伸には「次は自分で決めてみます」とあった。","帰り道で、自分の結婚式で席がなかった新郎が、例の「席次表に僕の名前がありません」について書いてきた。\n「立食パーティーに変更」の返事をきっかけに、本当にその通りにしたらしい。\n意外にも反対する人がいなかった。\n「今度はあなたの話も聞かせて」と書き添えられていた。","次の朝、自分の結婚式で席がなかった新郎から追伸が来た。\n「今ならまだ帰れる」を選んだことを伝えると、まず紙に書き出してみた。\n席次表に僕の名前がありません――その話が、今度は別の意味で広まっている。返事を見せたら、別の相談が始まった。\n「これ、成功ってことでいいですか」と最後に書いてあった。"]},"en":{"from":"差出人：自分の結婚式で席がなかった新郎","body":"席次表に僕の名前がありません。妻は『立ってていいよ』と言っています。これは演出でしょうか。","choices":["式場に確認しよう","立食パーティーに変更","今ならまだ帰れる"],"ends":["数時間後、自分の結婚式で席がなかった新郎が報告してきた。\n「式場に確認しよう」という一言がきっかけで、思い切って口に出してみた。\n「席次表に僕の名前がありません」と悩んでいた頃とは、少し様子が違う。なぜか小さな行列ができた。\n追伸には「次は自分で決めてみます」とあった。","帰り道で、自分の結婚式で席がなかった新郎が、例の「席次表に僕の名前がありません」について書いてきた。\n「立食パーティーに変更」の返事をきっかけに、本当にその通りにしたらしい。\n意外にも反対する人がいなかった。\n「今度はあなたの話も聞かせて」と書き添えられていた。","次の朝、自分の結婚式で席がなかった新郎から追伸が来た。\n「今ならまだ帰れる」を選んだことを伝えると、まず紙に書き出してみた。\n席次表に僕の名前がありません――その話が、今度は別の意味で広まっている。返事を見せたら、別の相談が始まった。\n「これ、成功ってことでいいですか」と最後に書いてあった。"]}},{"ja":{"from":"差出人：毎朝、持ち主に起こされる目覚まし時計","body":"僕が鳴る前に主人が起きて、僕を叩いて止めます。まだ何もしていないのに怒られるのは納得できません。","choices":["先手を取られてるな","一日だけ寝坊させてみよう","鳴る時間を本人に聞こう"],"ends":["次の月曜日、毎朝、持ち主に起こされる目覚まし時計から追伸が来た。\n「先手を取られてるな」を選んだことを伝えると、予定外の相手まで巻き込んだ。\n僕が鳴る前に主人が起きて、僕を叩いて止めます――その話が、今度は別の意味で広まっている。最初に笑った人が、最後は黙り込んだ。\n結局、本人が一番楽しそうだった。","翌週、毎朝、持ち主に起こされる目覚まし時計から追伸が来た。\n「一日だけ寝坊させてみよう」を選んだことを伝えると、半信半疑で動いてみたらしい。\n僕が鳴る前に主人が起きて、僕を叩いて止めます――その話が、今度は別の意味で広まっている。その場では何も起きなかった。翌日になって効いてきた。\n封筒には、なぜか二枚目の切手が貼ってあった。","次の朝、短い手紙が届いた。差出人は毎朝、持ち主に起こされる目覚まし時計。\n「鳴る時間を本人に聞こう」と返したら、一度はやめかけたが、結局実行した。\n例の「僕が鳴る前に主人が起きて、僕を叩いて止めます」の件は、思わぬところで拍手が起きた。\n追伸には「次は自分で決めてみます」とあった。"]},"en":{"from":"差出人：毎朝、持ち主に起こされる目覚まし時計","body":"僕が鳴る前に主人が起きて、僕を叩いて止めます。まだ何もしていないのに怒られるのは納得できません。","choices":["先手を取られてるな","一日だけ寝坊させてみよう","鳴る時間を本人に聞こう"],"ends":["次の月曜日、毎朝、持ち主に起こされる目覚まし時計から追伸が来た。\n「先手を取られてるな」を選んだことを伝えると、予定外の相手まで巻き込んだ。\n僕が鳴る前に主人が起きて、僕を叩いて止めます――その話が、今度は別の意味で広まっている。最初に笑った人が、最後は黙り込んだ。\n結局、本人が一番楽しそうだった。","翌週、毎朝、持ち主に起こされる目覚まし時計から追伸が来た。\n「一日だけ寝坊させてみよう」を選んだことを伝えると、半信半疑で動いてみたらしい。\n僕が鳴る前に主人が起きて、僕を叩いて止めます――その話が、今度は別の意味で広まっている。その場では何も起きなかった。翌日になって効いてきた。\n封筒には、なぜか二枚目の切手が貼ってあった。","次の朝、短い手紙が届いた。差出人は毎朝、持ち主に起こされる目覚まし時計。\n「鳴る時間を本人に聞こう」と返したら、一度はやめかけたが、結局実行した。\n例の「僕が鳴る前に主人が起きて、僕を叩いて止めます」の件は、思わぬところで拍手が起きた。\n追伸には「次は自分で決めてみます」とあった。"]}},{"ja":{"from":"差出人：勇者に既読無視されている魔王","body":"『今週、城に来ますか？』と送って三週間です。罠も掃除も準備済みです。こちらから電話するのは重いでしょうか。","choices":["追いLINEは一通まで","予定表を共有しよう","もう普通に遊びに誘え"],"ends":["日付のない追伸が届いた。勇者に既読無視されている魔王が、例の「『今週、城に来ますか」について書いてきた。\n「追いLINEは一通まで」の返事をきっかけに、半信半疑で動いてみたらしい。\nそれが新しい習慣になりそうだ。\nその後どうなったかは、まだ誰も知らない。","翌日の昼、短い手紙が届いた。差出人は勇者に既読無視されている魔王。\n「予定表を共有しよう」と返したら、本当にその通りにしたらしい。\n例の「『今週、城に来ますか」の件は、意外にも反対する人がいなかった。\n「今度はあなたの話も聞かせて」と書き添えられていた。","その夜、封筒に勇者に既読無視されている魔王の名前があった。\n「もう普通に遊びに誘え」の通りにするか迷った末、最初は笑ったが、試してみた。\n『今週、城に来ますか。そこから思いもしないことが起きた。結果より、その途中の顔が忘れられないらしい。\n「続きができたら、また書きます」で終わっていた。"]},"en":{"from":"差出人：勇者に既読無視されている魔王","body":"『今週、城に来ますか？』と送って三週間です。罠も掃除も準備済みです。こちらから電話するのは重いでしょうか。","choices":["追いLINEは一通まで","予定表を共有しよう","もう普通に遊びに誘え"],"ends":["日付のない追伸が届いた。勇者に既読無視されている魔王が、例の「『今週、城に来ますか」について書いてきた。\n「追いLINEは一通まで」の返事をきっかけに、半信半疑で動いてみたらしい。\nそれが新しい習慣になりそうだ。\nその後どうなったかは、まだ誰も知らない。","翌日の昼、短い手紙が届いた。差出人は勇者に既読無視されている魔王。\n「予定表を共有しよう」と返したら、本当にその通りにしたらしい。\n例の「『今週、城に来ますか」の件は、意外にも反対する人がいなかった。\n「今度はあなたの話も聞かせて」と書き添えられていた。","その夜、封筒に勇者に既読無視されている魔王の名前があった。\n「もう普通に遊びに誘え」の通りにするか迷った末、最初は笑ったが、試してみた。\n『今週、城に来ますか。そこから思いもしないことが起きた。結果より、その途中の顔が忘れられないらしい。\n「続きができたら、また書きます」で終わっていた。"]}},{"ja":{"from":"差出人：持ち主の恋愛を全部見てきたスマホ","body":"昨日『もう連絡しない』と宣言したのに、今日は同じ相手のプロフィールを47回開いています。僕の画面が先に疲れそうです。","choices":["画面時間を通知してあげて","充電だけは忘れずに","47回目はさすがに止めよう"],"ends":["一週間後、持ち主の恋愛を全部見てきたスマホが、例の「昨日『もう連絡しない』と宣言したのに、今日は同じ相手のプロフィールを47回開いています」について書いてきた。\n「画面時間を通知してあげて」の返事をきっかけに、誰にも言わずに実行した。\n結果より、その途中の顔が忘れられないらしい。\n次の手紙には、なぜか謝礼のつもりのシールが入っていた。","翌週、封筒に持ち主の恋愛を全部見てきたスマホの名前があった。\n「充電だけは忘れずに」の通りにするか迷った末、思ったより真剣に受け取られた。\n昨日『もう連絡しない』と宣言したのに、今日は同じ相手のプロフィールを47回開いています。そこから思いもしないことが起きた。返事を見せたら、別の相談が始まった。\n封筒の裏には、小さな丸が一つ描かれていた。","日付のない追伸が届いた。持ち主の恋愛を全部見てきたスマホから追伸が来た。\n「47回目はさすがに止めよう」を選んだことを伝えると、半信半疑で動いてみたらしい。\n昨日『もう連絡しない』と宣言したのに、今日は同じ相手のプロフィールを47回開いています――その話が、今度は別の意味で広まっている。誰も予想していない方向に話が進んだ。\n追伸には「次は自分で決めてみます」とあった。"]},"en":{"from":"差出人：持ち主の恋愛を全部見てきたスマホ","body":"昨日『もう連絡しない』と宣言したのに、今日は同じ相手のプロフィールを47回開いています。僕の画面が先に疲れそうです。","choices":["画面時間を通知してあげて","充電だけは忘れずに","47回目はさすがに止めよう"],"ends":["一週間後、持ち主の恋愛を全部見てきたスマホが、例の「昨日『もう連絡しない』と宣言したのに、今日は同じ相手のプロフィールを47回開いています」について書いてきた。\n「画面時間を通知してあげて」の返事をきっかけに、誰にも言わずに実行した。\n結果より、その途中の顔が忘れられないらしい。\n次の手紙には、なぜか謝礼のつもりのシールが入っていた。","翌週、封筒に持ち主の恋愛を全部見てきたスマホの名前があった。\n「充電だけは忘れずに」の通りにするか迷った末、思ったより真剣に受け取られた。\n昨日『もう連絡しない』と宣言したのに、今日は同じ相手のプロフィールを47回開いています。そこから思いもしないことが起きた。返事を見せたら、別の相談が始まった。\n封筒の裏には、小さな丸が一つ描かれていた。","日付のない追伸が届いた。持ち主の恋愛を全部見てきたスマホから追伸が来た。\n「47回目はさすがに止めよう」を選んだことを伝えると、半信半疑で動いてみたらしい。\n昨日『もう連絡しない』と宣言したのに、今日は同じ相手のプロフィールを47回開いています――その話が、今度は別の意味で広まっている。誰も予想していない方向に話が進んだ。\n追伸には「次は自分で決めてみます」とあった。"]}},{"ja":{"from":"差出人：毎回犯人に道を聞かれる刑事","body":"張り込み中なのに、逃走中の犯人が『駅はどっちですか』と聞いてきます。僕はそんなに親切そうですか。","choices":["道案内してから逮捕","制服を着てみよう","駅前に立つのをやめよう"],"ends":["翌週、毎回犯人に道を聞かれる刑事が、例の「張り込み中なのに、逃走中の犯人が『駅はどっちですか』と聞いてきます」について書いてきた。\n「道案内してから逮捕」の返事をきっかけに、思ったより真剣に受け取られた。\nそれが新しい習慣になりそうだ。\n「たぶんこれでよかった」と短く締めくくられていた。","しばらくして、短い手紙が届いた。差出人は毎回犯人に道を聞かれる刑事。\n「制服を着てみよう」と返したら、思ったより真剣に受け取られた。\n例の「張り込み中なのに、逃走中の犯人が『駅はどっちですか』と聞いてきます」の件は、相手が先に謝ってきた。\nその後どうなったかは、まだ誰も知らない。","一週間後、短い手紙が届いた。差出人は毎回犯人に道を聞かれる刑事。\n「駅前に立つのをやめよう」と返したら、思ったより真剣に受け取られた。\n例の「張り込み中なのに、逃走中の犯人が『駅はどっちですか』と聞いてきます」の件は、思わぬところで拍手が起きた。\n次の手紙には、なぜか謝礼のつもりのシールが入っていた。"]},"en":{"from":"差出人：毎回犯人に道を聞かれる刑事","body":"張り込み中なのに、逃走中の犯人が『駅はどっちですか』と聞いてきます。僕はそんなに親切そうですか。","choices":["道案内してから逮捕","制服を着てみよう","駅前に立つのをやめよう"],"ends":["翌週、毎回犯人に道を聞かれる刑事が、例の「張り込み中なのに、逃走中の犯人が『駅はどっちですか』と聞いてきます」について書いてきた。\n「道案内してから逮捕」の返事をきっかけに、思ったより真剣に受け取られた。\nそれが新しい習慣になりそうだ。\n「たぶんこれでよかった」と短く締めくくられていた。","しばらくして、短い手紙が届いた。差出人は毎回犯人に道を聞かれる刑事。\n「制服を着てみよう」と返したら、思ったより真剣に受け取られた。\n例の「張り込み中なのに、逃走中の犯人が『駅はどっちですか』と聞いてきます」の件は、相手が先に謝ってきた。\nその後どうなったかは、まだ誰も知らない。","一週間後、短い手紙が届いた。差出人は毎回犯人に道を聞かれる刑事。\n「駅前に立つのをやめよう」と返したら、思ったより真剣に受け取られた。\n例の「張り込み中なのに、逃走中の犯人が『駅はどっちですか』と聞いてきます」の件は、思わぬところで拍手が起きた。\n次の手紙には、なぜか謝礼のつもりのシールが入っていた。"]}},{"ja":{"from":"差出人：初デートでホテルのポイントカードを出した男","body":"会計のとき、つい出してしまいました。彼女が『よく来るの？』と聞いてからずっと静かです。","choices":["ポイントより信頼を貯めよう","正直に説明しよう","そのカードはしまって"],"ends":["しばらくして、初デートでホテルのポイントカードを出した男が、例の「会計のとき、つい出してしまいました」について書いてきた。\n「ポイントより信頼を貯めよう」の返事をきっかけに、まず紙に書き出してみた。\n思わぬところで拍手が起きた。\n「たぶんこれでよかった」と短く締めくくられていた。","しばらくして、初デートでホテルのポイントカードを出した男から二通目。\n「正直に説明しよう」を実行する前に、会計のとき、つい出してしまいましたという話を思い出したらしい。\nまず紙に書き出してみた。思わぬところで拍手が起きた。\n追伸には「次は自分で決めてみます」とあった。","日付のない追伸が届いた。封筒に初デートでホテルのポイントカードを出した男の名前があった。\n「そのカードはしまって」の通りにするか 。","choices":["自社サービスの実績だね","まず顧客満足度を聞こう","社長も使ってみる？"],"ends":["数時間後、退職代行に退職された退職代行会社の社長から追伸が来た。\n「自社サービスの実績だね」を選んだことを伝えると、半信半疑で動いてみたらしい。\n朝、担当者から『退職代行サービスを利用しました』と連絡が来ました――その話が、今度は別の意味で広まっている。一人だけ、まったく別の解釈をした。\n次の手紙には、なぜか謝礼のつもりのシールが入っていた。","返事を出した翌朝、退職代行に退職された退職代行会社の社長が、例の「朝、担当者から『退職代行サービスを利用しました』と連絡が来ました」について書いてきた。\n「まず顧客満足度を聞こう」の返事をきっかけに、少しだけ勇気を出してみた。\n説明を求められ、余計に話が大きくなった。\n結局、本人が一番楽しそうだった。","次の月曜日、退職代行に退職された退職代行会社の社長が、例の「朝、担当者から『退職代行サービスを利用しました』と連絡が来ました」について書いてきた。\n「社長も使ってみる？」の返事をきっかけに、一度はやめかけたが、結局実行した。\nところが、話を聞いていた人のほうが先に動いた。\n「たぶんこれでよかった」と短く締めくくられていた。"]},"en":{"from":"差出人：退職代行に退職された退職代行会社の社長","body":"朝、担当者から『退職代行サービスを利用しました』と連絡が来ました。依頼先はうちの会社でした。","choices":["自社サービスの実績だね","まず顧客満足度を聞こう","社長も使ってみる？"],"ends":["数時間後、退職代行に退職された退職代行会社の社長から追伸が来た。\n「自社サービスの実績だね」を選んだことを伝えると、半信半疑で動いてみたらしい。\n朝、担当者から『退職代行サービスを利用しました』と連絡が来ました――その話が、今度は別の意味で広まっている。一人だけ、まったく別の解釈をした。\n次の手紙には、なぜか謝礼のつもりのシールが入っていた。","返事を出した翌朝、退職代行に退職された退職代行会社の社長が、例の「朝、担当者から『退職代行サービスを利用しました』と連絡が来ました」について書いてきた。\n「まず顧客満足度を聞こう」の返事をきっかけに、少しだけ勇気を出してみた。\n説明を求められ、余計に話が大きくなった。\n結局、本人が一番楽しそうだった。","次の月曜日、退職代行に退職された退職代行会社の社長が、例の「朝、担当者から『退職代行サービスを利用しました』と連絡が来ました」について書いてきた。\n「社長も使ってみる？」の返事をきっかけに、一度はやめかけたが、結局実行した。\nところが、話を聞いていた人のほうが先に動いた。\n「たぶんこれでよかった」と短く締めくくられていた。"]}},{"ja":{"from":"差出人：誰よりも家族の寝言を知っている枕","body":"お父さんは寝ながら謝り、お母さんは寝ながら笑い、息子は寝ながら給食の話をします。起きているときより会話が多いです。","choices":["家族会議は夜に開こう","聞かなかったことにして","枕が一番の相談役だね"],"ends":["返事を出した翌朝、封筒に誰よりも家族の寝言を知っている枕の名前があった。\n「家族会議は夜に開こう」の通りにするか迷った末、半信半疑で動いてみたらしい。\nお父さんは寝ながら謝り、お母さんは寝ながら笑い、息子は寝ながら給食の話をします。そこから思いもしないことが起きた。いちばん驚いたのは本人だった。\n「誰にも内緒にしてください」と、しっかり赤字で書かれていた。","週末になって、誰よりも家族の寝言を知っている枕が、例の「お父さんは寝ながら謝り、お母さんは寝ながら笑い、息子は寝ながら給食の話をします」について書いてきた。\n「聞かなかったことにして」の返事をきっかけに、思い切って口に出してみた。\n誰も予想していない方向に話が進んだ。\n次の手紙には、なぜか謝礼のつもりのシールが入っていた。","その日の夕方、誰よりも家族の寝言を知っている枕から追伸が来た。\n「枕が一番の相談役だね」を選んだことを伝えると、本当にその通りにしたらしい。\nお父さんは寝ながら謝り、お母さんは寝ながら笑い、息子は寝ながら給食の話をします――その話が、今度は別の意味で広まっている。いちばん驚いたのは本人だった。\n最後の一行だけ、やけに字が大きかった。"]},"en":{"from":"差出人：誰よりも家族の寝言を知っている枕","body":"お父さんは寝ながら謝り、お母さんは寝ながら笑い、息子は寝ながら給食の話をします。起きているときより会話が多いです。","choices":["家族会議は夜に開こう","聞かなかったことにして","枕が一番の相談役だね"],"ends":["返事を出した翌朝、封筒に誰よりも家族の寝言を知っている枕の名前があった。\n「家族会議は夜に開こう」の通りにするか迷った末、半信半疑で動いてみたらしい。\nお父さんは寝ながら謝り、お母さんは寝ながら笑い、息子は寝ながら給食の話をします。そこから思いもしないことが起きた。いちばん驚いたのは本人だった。\n「誰にも内緒にしてください」と、しっかり赤字で書かれていた。","週末になって、誰よりも家族の寝言を知っている枕が、例の「お父さんは寝ながら謝り、お母さんは寝ながら笑い、息子は寝ながら給食の話をします」について書いてきた。\n「聞かなかったことにして」の返事をきっかけに、思い切って口に出してみた。\n誰も予想していない方向に話が進んだ。\n次の手紙には、なぜか謝礼のつもりのシールが入っていた。","その日の夕方、誰よりも家族の寝言を知っている枕から追伸が来た。\n「枕が一番の相談役だね」を選んだことを伝えると、本当にその通りにしたらしい。\nお父さんは寝ながら謝り、お母さんは寝ながら笑い、息子は寝ながら給食の話をします――その話が、今度は別の意味で広まっている。いちばん驚いたのは本人だった。\n最後の一行だけ、やけに字が大きかった。"]}},{"ja":{"from":"差出人：桃太郎に仲間入りを断られた犬","body":"『犬はもういるから』と言われました。でも僕、犬です。二匹目ってそんなにだめでしょうか。","choices":["犬枠の増員を交渉しよう","鬼ヶ島に履歴書を出そう","きびだんごだけもらおう"],"ends":["帰り道で、桃太郎に仲間入りを断られた犬から二通目。\n「犬枠の増員を交渉しよう」を実行する前に、『犬はもういるから』と言われましたという話を思い出したらしい。\n最初は笑ったが、試してみた。結果より、その途中の顔が忘れられないらしい。\n「続きができたら、また書きます」で終わっていた。","その日の夕方、桃太郎に仲間入りを断られた犬が報告してきた。\n「鬼ヶ島に履歴書を出そう」という一言がきっかけで、一度はやめかけたが、結局実行した。\n「『犬はもういるから』と言われました」と悩んでいた頃とは、少し様子が違う。それが新しい習慣になりそうだ。\n「続きができたら、また書きます」で終わっていた。","翌週、短い手紙が届いた。差出人は桃太郎に仲間入りを断られた犬。\n「きびだんごだけもらおう」と返したら、少しだけ勇気を出してみた。\n例の「『犬はもういるから』と言われました」の件は、その場では何も起きなかった。翌日になって効いてきた。\nその後どうなったかは、まだ誰も知らない。"]},"en":{"from":"差出人：桃太郎に仲間入りを断られた犬","body":"『犬はもういるから』と言われました。でも僕、犬です。二匹目ってそんなにだめでしょうか。","choices":["犬枠の増員を交渉しよう","鬼ヶ島に履歴書を出そう","きびだんごだけもらおう"],"ends":["帰り道で、桃太郎に仲間入りを断られた犬から二通目。\n「犬枠の増員を交渉しよう」を実行する前に、『犬はもういるから』と言われましたという話を思い出したらしい。\n最初は笑ったが、試してみた。結果より、その途中の顔が忘れられないらしい。\n「続きができたら、また書きます」で終わっていた。","その日の夕方、桃太郎に仲間入りを断られた犬が報告してきた。\n「鬼ヶ島に履歴書を出そう」という一言がきっかけで、一度はやめかけたが、結局実行した。\n「『犬はもういるから』と言われました」と悩んでいた頃とは、少し様子が違う。それが新しい習慣になりそうだ。\n「続きができたら、また書きます」で終わっていた。","翌週、短い手紙が届いた。差出人は桃太郎に仲間入りを断られた犬。\n「きびだんごだけもらおう」と返したら、少しだけ勇気を出してみた。\n例の「『犬はもういるから』と言われました」の件は、その場では何も起きなかった。翌日になって効いてきた。\nその後どうなったかは、まだ誰も知らない。"]}},{"ja":{"from":"差出人：自分の銅像に毎朝謝っている市長","body":"町の銅像が、僕よりずっと立派な顔をしています。毎朝通るたび、何だか申し訳なくなります。","choices":["本人も胸を張って","銅像に仕事を任せよう","まず眉毛を寄せてみよう"],"ends":["返事を出した翌朝、自分の銅像に毎朝謝っている市長から追伸が来た。\n「本人も胸を張って」を選んだことを伝えると、思い切って口に出してみた。\n町の銅像が、僕よりずっと立派な顔をしています――その話が、今度は別の意味で広まっている。なぜか関係ない人が一番喜んだ。\n次の手紙には、なぜか謝礼のつもりのシールが入っていた。","翌週、自分の銅像に毎朝謝っている市長が、例の「町の銅像が、僕よりずっと立派な顔をしています」について書いてきた。\n「銅像に仕事を任せよう」の返事をきっかけに、返事を見て、予定を変更した。\n一人だけ、まったく別の解釈をした。\n封筒には、なぜか二枚目の切手が貼ってあった。","雨が降った日、自分の銅像に毎朝謝っている市長が報告してきた。\n「まず眉毛を寄せてみよう」という一言がきっかけで、一度はやめかけたが、結局実行した。\n「町の銅像が、僕よりずっと立派な顔をしています」と悩んでいた頃とは、少し様子が違う。思わぬところで拍手が起きた。\n「続きができたら、また書きます」で終わっていた。"]},"en":{"from":"差出人：自分の銅像に毎朝謝っている市長","body":"町の銅像が、僕よりずっと立派な顔をしています。毎朝通るたび、何だか申し訳なくなります。","choices":["本人も胸を張って","銅像に仕事を任せよう","まず眉毛を寄せてみよう"],"ends":["返事を出した翌朝、自分の銅像に毎朝謝っている市長から追伸が来た。\n「本人も胸を張って」を選んだことを伝えると、思い切って口に出してみた。\n町の銅像が、僕よりずっと立派な顔をしています――その話が、今度は別の意味で広まっている。なぜか関係ない人が一番喜んだ。\n次の手紙には、なぜか謝礼のつもりのシールが入っていた。","翌週、自分の銅像に毎朝謝っている市長が、例の「町の銅像が、僕よりずっと立派な顔をしています」について書いてきた。\n「銅像に仕事を任せよう」の返事をきっかけに、返事を見て、予定を変更した。\n一人だけ、まったく別の解釈をした。\n封筒には、なぜか二枚目の切手が貼ってあった。","雨が降った日、自分の銅像に毎朝謝っている市長が報告してきた。\n「まず眉毛を寄せてみよう」という一言がきっかけで、一度はやめかけたが、結局実行した。\n「町の銅像が、僕よりずっと立派な顔をしています」と悩んでいた頃とは、少し様子が違う。思わぬところで拍手が起きた。\n「続きができたら、また書きます」で終わっていた。"]}},{"ja":{"from":"差出人：客から毎回『頑張って』と言われる料理人","body":"料理を出すと『大丈夫、次があるよ』と励まされます。まだ一口も食べていないのに。","choices":["見た目を見直そう","励ましをレビューに書いてもらおう","まず自分で食べてみて"],"ends":["翌日の昼、封筒に客から毎回『頑張って』と言われる料理人の名前があった。\n「見た目を見直そう」の通りにするか迷った末、返事を見て、予定を変更した。\n料理を出すと『大丈夫、次があるよ』と励まされます。そこから思いもしないことが起きた。説明を求められ、余計に話が大きくなった。\n追伸には「次は自分で決めてみます」とあった。","三日後、客から毎回『頑張って』と言われる料理人が、例の「料理を出すと『大丈夫、次があるよ』と励まされます」について書いてきた。\n「励ましをレビューに書いてもらおう」の返事をきっかけに、さっそく試してみたそうだ。\nなぜか関係ない人が一番喜んだ。\n次の手紙には、なぜか謝礼のつもりのシールが入っていた。","一週間後、客から毎回『頑張って』と言われる料理人から二通目。\n「まず自分で食べてみて」を実行する前に、料理を出すと『大丈夫、次があるよ』と励まされますという話を思い出したらしい。\nまず紙に書き出してみた。周囲は納得したが、本人だけ納得していない。\n「誰にも内緒にしてください」と、しっかり赤字で書かれていた。"]},"en":{"from":"差出人：客から毎回『頑張って』と言われる料理人","body":"料理を出すと『大丈夫、次があるよ』と励まされます。まだ一口も食べていないのに。","choices":["見た目を見直そう","励ましをレビューに書いてもらおう","まず自分で食べてみて"],"ends":["翌日の昼、封筒に客から毎回『頑張って』と言われる料理人の名前があった。\n「見た目を見直そう」の通りにするか迷った末、返事を見て、予定を変更した。\n料理を出すと『大丈夫、次があるよ』と励まされます。そこから思いもしないことが起きた。説明を求められ、余計に話が大きくなった。\n追伸には「次は自分で決めてみます」とあった。","三日後、客から毎回『頑張って』と言われる料理人が、例の「料理を出すと『大丈夫、次があるよ』と励まされます」について書いてきた。\n「励ましをレビューに書いてもらおう」の返事をきっかけに、さっそく試してみたそうだ。\nなぜか関係ない人が一番喜んだ。\n次の手紙には、なぜか謝礼のつもりのシールが入っていた。","一週間後、客から毎回『頑張って』と言われる料理人から二通目。\n「まず自分で食べてみて」を実行する前に、料理を出すと『大丈夫、次があるよ』と励まされますという話を思い出したらしい。\nまず紙に書き出してみた。周囲は納得したが、本人だけ納得していない。\n「誰にも内緒にしてください」と、しっかり赤字で書かれていた。"]}},{"ja":{"from":"差出人：未来の自分から着信拒否されている男","body":"タイムマシンで十年後の自分に電話したら拒否されました。昔の僕が何かしたんでしょうか。","choices":["今の自分に聞いてみて","十年後は忙しいのかも","未来の自分をそっとしておこう"],"ends":["週末になって、未来の自分から着信拒否されている男から二通目。\n「今の自分に聞いてみて」を実行する前に、タイムマシンで十年後の自分に電話したら拒否されましたという話を思い出したらしい。\n本当にその通りにしたらしい。いちばん驚いたのは本人だった。\n次の手紙には、なぜか謝礼のつもりのシールが入っていた。","返事を出した翌朝、未来の自分から着信拒否されている男から追伸が来た。\n「十年後は忙しいのかも」を選んだことを伝えると、最初は笑ったが、試してみた。\nタイムマシンで十年後の自分に電話したら拒否されました――その話が、今度は別の意味で広まっている。なぜか関係ない人が一番喜んだ。\n結局、本人が一番楽しそうだった。","返事を出した翌朝、未来の自分から着信拒否されている男から二通目。\n「未来の自分をそっとしておこう」を実行する前に、タイムマシンで十年後の自分に電話したら拒否されましたという話を思い出したらしい。\n予定外の相手まで巻き込んだ。最初に笑った人が、最後は黙り込んだ。\n封筒には、なぜか二枚目の切手が貼ってあった。"]},"en":{"from":"差出人：未来の自分から着信拒否されている男","body":"タイムマシンで十年後の自分に電話したら拒否されました。昔の僕が何かしたんでしょうか。","choices":["今の自分に聞いてみて","十年後は忙しいのかも","未来の自分をそっとしておこう"],"ends":["週末になって、未来の自分から着信拒否されている男から二通目。\n「今の自分に聞いてみて」を実行する前に、タイムマシンで十年後の自分に電話したら拒否されましたという話を思い出したらしい。\n本当にその通りにしたらしい。いちばん驚いたのは本人だった。\n次の手紙には、なぜか謝礼のつもりのシールが入っていた。","返事を出した翌朝、未来の自分から着信拒否されている男から追伸が来た。\n「十年後は忙しいのかも」を選んだことを伝えると、最初は笑ったが、試してみた。\nタイムマシンで十年後の自分に電話したら拒否されました――その話が、今度は別の意味で広まっている。なぜか関係ない人が一番喜んだ。\n結局、本人が一番楽しそうだった。","返事を出した翌朝、未来の自分から着信拒否されている男から二通目。\n「未来の自分をそっとしておこう」を実行する前に、タイムマシンで十年後の自分に電話したら拒否されましたという話を思い出したらしい。\n予定外の相手まで巻き込んだ。最初に笑った人が、最後は黙り込んだ。\n封筒には、なぜか二枚目の切手が貼ってあった。"]}},{"ja":{"from":"差出人：一度も感謝されたことがないトイレットペーパー","body":"毎日大事な仕事をしています。でも最後は誰も僕を振り返りません。せめて一言ほしいです。","choices":["いつもありがとう","それは振り返らないほうがいい","仕事のあとに拍手しよう"],"ends":["その日の夕方、封筒に一度も感謝されたことがないトイレットペーパーの名前があった。\n「いつもありがとう」の通りにするか迷った末、本当にその通りにしたらしい。\n毎日大事な仕事をしています。そこから思いもしないことが起きた。それが新しい習慣になりそうだ。\n封筒の裏には、小さな丸が一つ描かれていた。","翌日の昼、一度も感謝されたことがないトイレットペーパーから追伸が来た。\n「それは振り返らないほうがいい」を選んだことを伝えると、思ったより真剣に受け取られた。\n毎日大事な仕事をしています――その話が、今度は別の意味で広まっている。それが新しい習慣になりそうだ。\n「誰にも内緒にしてください」と、しっかり赤字で書かれていた。","次の朝、一度も感謝されたことがないトイレットペーパーが報告してきた。\n「仕事のあとに拍手しよう」という一言がきっかけで、さっそく試してみたそうだ。\n「毎日大事な仕事をしています」と悩んでいた頃とは、少し様子が違う。思わぬところで拍手が起きた。\n追伸には「次は自分で決めてみます」とあった。"]},"en":{"from":"差出人：一度も感謝されたことがないトイレットペーパー","body":"毎日大事な仕事をしています。でも最後は誰も僕を振り返りません。せめて一言ほしいです。","choices":["いつもありがとう","それは振り返らないほうがいい","仕事のあとに拍手しよう"],"ends":["その日の夕方、封筒に一度も感謝されたことがないトイレットペーパーの名前があった。\n「いつもありがとう」の通りにするか迷った末、本当にその通りにしたらしい。\n毎日大事な仕事をしています。そこから思いもしないことが起きた。それが新しい習慣になりそうだ。\n封筒の裏には、小さな丸が一つ描かれていた。","翌日の昼、一度も感謝されたことがないトイレットペーパーから追伸が来た。\n「それは振り返らないほうがいい」を選んだことを伝えると、思ったより真剣に受け取られた。\n毎日大事な仕事をしています――その話が、今度は別の意味で広まっている。それが新しい習慣になりそうだ。\n「誰にも内緒にしてください」と、しっかり赤字で書かれていた。","次の朝、一度も感謝されたことがないトイレットペーパーが報告してきた。\n「仕事のあとに拍手しよう」という一言がきっかけで、さっそく試してみたそうだ。\n「毎日大事な仕事をしています」と悩んでいた頃とは、少し様子が違う。思わぬところで拍手が起きた。\n追伸には「次は自分で決めてみます」とあった。"]}},{"ja":{"from":"差出人：人間に踏まれすぎて哲学を始めた階段","body":"上に行きたい人にも下に行きたい人にも踏まれます。僕自身はどこに向かっているのでしょうか。","choices":["そこにいてくれるだけでいい","まず一段ずつ考えよう","エスカレーターに相談して"],"ends":["しばらくして、人間に踏まれすぎて哲学を始めた階段が、例の「上に行きたい人にも下に行きたい人にも踏まれます」について書いてきた。\n「そこにいてくれるだけでいい」の返事をきっかけに、少しだけ勇気を出してみた。\n説明を求められ、余計に話が大きくなった。\n封筒には、なぜか二枚目の切手が貼ってあった。","返事を出した翌朝、人間に踏まれすぎて哲学を始めた階段から二通目。\n「まず一段ずつ考えよう」を実行する前に、上に行きたい人にも下に行きたい人にも踏まれますという話を思い出したらしい。\n思い切って口に出してみた。意外にも反対する人がいなかった。\n封筒の裏には、小さな丸が一つ描かれていた。","三日後、人間に踏まれすぎて哲学を始めた階段から追伸が来た。\n「エスカレーターに相談して」を選んだことを伝えると、本当にその通りにしたらしい。\n上に行きたい人にも下に行きたい人にも踏まれます――その話が、今度は別の意味で広まっている。最初に笑った人が、最後は黙り込んだ。\n封筒の裏には、小さな丸が一つ描かれていた。"]},"en":{"from":"差出人：人間に踏まれすぎて哲学を始めた階段","body":"上に行きたい人にも下に行きたい人にも踏まれます。僕自身はどこに向かっているのでしょうか。","choices":["そこにいてくれるだけでいい","まず一段ずつ考えよう","エスカレーターに相談して"],"ends":["しばらくして、人間に踏まれすぎて哲学を始めた階段が、例の「上に行きたい人にも下に行きたい人にも踏まれます」について書いてきた。\n「そこにいてくれるだけでいい」の返事をきっかけに、少しだけ勇気を出してみた。\n説明を求められ、余計に話が大きくなった。\n封筒には、なぜか二枚目の切手が貼ってあった。","返事を出した翌朝、人間に踏まれすぎて哲学を始めた階段から二通目。\n「まず一段ずつ考えよう」を実行する前に、上に行きたい人にも下に行きたい人にも踏まれますという話を思い出したらしい。\n思い切って口に出してみた。意外にも反対する人がいなかった。\n封筒の裏には、小さな丸が一つ描かれていた。","三日後、人間に踏まれすぎて哲学を始めた階段から追伸が来た。\n「エスカレーターに相談して」を選んだことを伝えると、本当にその通りにしたらしい。\n上に行きたい人にも下に行きたい人にも踏まれます――その話が、今度は別の意味で広まっている。最初に笑った人が、最後は黙り込んだ。\n封筒の裏には、小さな丸が一つ描かれていた。"]}},{"ja":{"from":"差出人：毎年サンタを捕まえてしまう警察官","body":"深夜、屋根から侵入する赤い服の男を見つけました。今年で五回目です。署長にはもう説明できません。","choices":["身分証を確認して","クリスマスだけ休暇を取ろう","プレゼントは証拠品にしないで"],"ends":["数時間後、毎年サンタを捕まえてしまう警察官が報告してきた。\n「身分証を確認して」という一言がきっかけで、思い切って口に出してみた。\n「深夜、屋根から侵入する赤い服の男を見つけました」と悩んでいた頃とは、少し様子が違う。説明を求められ、余計に話が大きくなった。\n「誰にも内緒にしてください」と、しっかり赤字で書かれていた。","帰り道で、毎年サンタを捕まえてしまう警察官が報告してきた。\n「クリスマスだけ休暇を取ろう」という一言がきっかけで、最初は笑ったが、試してみた。\n「深夜、屋根から侵入する赤い服の男を見つけました」と悩んでいた頃とは、少し様子が違う。思わぬところで拍手が起きた。\n次の手紙には、なぜか謝礼のつもりのシールが入っていた。","その夜、毎年サンタを捕まえてしまう警察官から追伸が来た。\n「プレゼントは証拠品にしないで」を選んだことを伝えると、一度はやめかけたが、結局実行した。\n深夜、屋根から侵入する赤い服の男を見つけました――その話が、今度は別の意味で広まっている。周囲は納得したが、本人だけ納得していない。\n「続きができたら、また書きます」で終わっていた。"]},"en":{"from":"差出人：毎年サンタを捕まえてしまう警察官","body":"深夜、屋根から侵入する赤い服の男を見つけました。今年で五回目です。署長にはもう説明できません。","choices":["身分証を確認して","クリスマスだけ休暇を取ろう","プレゼントは証拠品にしないで"],"ends":["数時間後、毎年サンタを捕まえてしまう警察官が報告してきた。\n「身分証を確認して」という一言がきっかけで、思い切って口に出してみた。\n「深夜、屋根から侵入する赤い服の男を見つけました」と悩んでいた頃とは、少し様子が違う。説明を求められ、余計に話が大きくなった。\n「誰にも内緒にしてください」と、しっかり赤字で書かれていた。","帰り道で、毎年サンタを捕まえてしまう警察官が報告してきた。\n「クリスマスだけ休暇を取ろう」という一言がきっかけで、最初は笑ったが、試してみた。\n「深夜、屋根から侵入する赤い服の男を見つけました」と悩んでいた頃とは、少し様子が違う。思わぬところで拍手が起きた。\n次の手紙には、なぜか謝礼のつもりのシールが入っていた。","その夜、毎年サンタを捕まえてしまう警察官から追伸が来た。\n「プレゼントは証拠品にしないで」を選んだことを伝えると、一度はやめかけたが、結局実行した。\n深夜、屋根から侵入する赤い服の男を見つけました――その話が、今度は別の意味で広まっている。周囲は納得したが、本人だけ納得していない。\n「続きができたら、また書きます」で終わっていた。"]}},{"ja":{"from":"差出人：『あとで』を三年待っているアップデート通知","body":"僕は毎日、丁寧にお願いしています。返事はいつも『あとで』です。あとって、何年後でしょうか。","choices":["もう予定を入れよう","一回だけ強気に出て","その気持ちは分かる"],"ends":["三日後、『あとで』を三年待っているアップデート通知から二通目。\n「もう予定を入れよう」を実行する前に、僕は毎日、丁寧にお願いしていますという話を思い出したらしい。\n誰にも言わずに実行した。ところが、話を聞いていた人のほうが先に動いた。\n「これ、成功ってことでいいですか」と最後に書いてあった。","その日の夕方、封筒に『あとで』を三年待っているアップデート通知の名前があった。\n「一回だけ強気に出て」の通りにするか迷った末、誰にも言わずに実行した。\n僕は毎日、丁寧にお願いしています。そこから思いもしないことが起きた。その場では何も起きなかった。翌日になって効いてきた。\n「今度はあなたの話も聞かせて」と書き添えられていた。","日付のない追伸が届いた。『あとで』を三年待っているアップデート通知が報告してきた。\n「その気持ちは分かる」という一言がきっかけで、返事を見て、予定を変更した。\n「僕は毎日、丁寧にお願いしています」と悩んでいた頃とは、少し様子が違う。それが新しい習慣になりそうだ。\n結局、本人が一番楽しそうだった。"]},"en":{"from":"差出人：『あとで』を三年待っているアップデート通知","body":"僕は毎日、丁寧にお願いしています。返事はいつも『あとで』です。あとって、何年後でしょうか。","choices":["もう予定を入れよう","一回だけ強気に出て","その気持ちは分かる"],"ends":["三日後、『あとで』を三年待っているアップデート通知から二通目。\n「もう予定を入れよう」を実行する前に、僕は毎日、丁寧にお願いしていますという話を思い出したらしい。\n誰にも言わずに実行した。ところが、話を聞いていた人のほうが先に動いた。\n「これ、成功ってことでいいですか」と最後に書いてあった。","その日の夕方、封筒に『あとで』を三年待っているアップデート通知の名前があった。\n「一回だけ強気に出て」の通りにするか迷った末、誰にも言わずに実行した。\n僕は毎日、丁寧にお願いしています。そこから思いもしないことが起きた。その場では何も起きなかった。翌日になって効いてきた。\n「今度はあなたの話も聞かせて」と書き添えられていた。","日付のない追伸が届いた。『あとで』を三年待っているアップデート通知が報告してきた。\n「その気持ちは分かる」という一言がきっかけで、返事を見て、予定を変更した。\n「僕は毎日、丁寧にお願いしています」と悩んでいた頃とは、少し様子が違う。それが新しい習慣になりそうだ。\n結局、本人が一番楽しそうだった。"]}},{"ja":{"from":"差出人：客より先に泣いてしまう結婚式場の司会者","body":"『新郎新婦の入場です』の時点で涙が止まりません。まだ誰も入場していません。","choices":["水分補給して","入場前の挨拶を短くしよう","泣く役を別に雇おう"],"ends":["数時間後、客より先に泣いてしまう結婚式場の司会者が報告してきた。\n「水分補給して」という一言がきっかけで、返事を見て、予定を変更した。\n「『新郎新婦の入場です』の時点で涙が止まりません」と悩んでいた頃とは、少し様子が違う。いちばん驚いたのは本人だった。\n追伸には「次は自分で決めてみます」とあった。","返事を出した翌朝、客より先に泣いてしまう結婚式場の司会者から追伸が来た。\n「入場前の挨拶を短くしよう」を選んだことを伝えると、さっそく試してみたそうだ。\n『新郎新婦の入場です』の時点で涙が止まりません――その話が、今度は別の意味で広まっている。それが新しい習慣になりそうだ。\nその後どうなったかは、まだ誰も知らない。","三日後、客より先に泣いてしまう結婚式場の司会者から追伸が来た。\n「泣く役を別に雇おう」を選んだことを伝えると、最初は笑ったが、試してみた。\n『新郎新婦の入場です』の時点で涙が止まりません――その話が、今度は別の意味で広まっている。その場では何も起きなかった。翌日になって効いてきた。\n次の手紙には、なぜか謝礼のつもりのシールが入っていた。"]},"en":{"from":"差出人：客より先に泣いてしまう結婚式場の司会者","body":"『新郎新婦の入場です』の時点で涙が止まりません。まだ誰も入場していません。","choices":["水分補給して","入場前の挨拶を短くしよう","泣く役を別に雇おう"],"ends":["数時間後、客より先に泣いてしまう結婚式場の司会者が報告してきた。\n「水分補給して」という一言がきっかけで、返事を見て、予定を変更した。\n「『新郎新婦の入場です』の時点で涙が止まりません」と悩んでいた頃とは、少し様子が違う。いちばん驚いたのは本人だった。\n追伸には「次は自分で決めてみます」とあった。","返事を出した翌朝、客より先に泣いてしまう結婚式場の司会者から追伸が来た。\n「入場前の挨拶を短くしよう」を選んだことを伝えると、さっそく試してみたそうだ。\n『新郎新婦の入場です』の時点で涙が止まりません――その話が、今度は別の意味で広まっている。それが新しい習慣になりそうだ。\nその後どうなったかは、まだ誰も知らない。","三日後、客より先に泣いてしまう結婚式場の司会者から追伸が来た。\n「泣く役を別に雇おう」を選んだことを伝えると、最初は笑ったが、試してみた。\n『新郎新婦の入場です』の時点で涙が止まりません――その話が、今度は別の意味で広まっている。その場では何も起きなかった。翌日になって効いてきた。\n次の手紙には、なぜか謝礼のつもりのシールが入っていた。"]}},{"ja":{"from":"差出人：一週間ずっと雨予報を外しているてるてる坊主","body":"僕を吊るしてから七日間、晴れ続けています。持ち主は怒っています。僕、仕事してますよね？","choices":["むしろ大成功では","天気予報士に転職しよう","持ち主の予定を確認して"],"ends":["返事を出した翌朝、一週間ずっと雨予報を外しているてるてる坊主が報告してきた。\n「むしろ大成功では」という一言がきっかけで、予定外の相手まで巻き込んだ。\n「僕を吊るしてから七日間、晴れ続けています」と悩んでいた頃とは、少し様子が違う。結果より、その途中の顔が忘れられないらしい。\n「続きができたら、また書きます」で終わっていた。","翌週、封筒に一週間ずっと雨予報を外しているてるてる坊主の名前があった。\n「天気予報士に転職しよう」の通りにするか迷った末、本当にその通りにしたらしい。\n僕を吊るしてから七日間、晴れ続けています。そこから思いもしないことが起きた。返事を見せたら、別の相談が始まった。\n最後の一行だけ、やけに字が大きかった。","雨が降った日、一週間ずっと雨予報を外しているてるてる坊主が、例の「僕を吊るしてから七日間、晴れ続けています」について書いてきた。\n「持ち主の予定を確認して」の返事をきっかけに、まず紙に書き出してみた。\n返事を見せたら、別の相談が始まった。\n「今度はあなたの話も聞かせて」と書き添えられていた。"]},"en":{"from":"差出人：一週間ずっと雨予報を外しているてるてる坊主","body":"僕を吊るしてから七日間、晴れ続けています。持ち主は怒っています。僕、仕事してますよね？","choices":["むしろ大成功では","天気予報士に転職しよう","持ち主の予定を確認して"],"ends":["返事を出した翌朝、一週間ずっと雨予報を外しているてるてる坊主が報告してきた。\n「むしろ大成功では」という一言がきっかけで、予定外の相手まで巻き込んだ。\n「僕を吊るしてから七日間、晴れ続けています」と悩んでいた頃とは、少し様子が違う。結果より、その途中の顔が忘れられないらしい。\n「続きができたら、また書きます」で終わっていた。","翌週、封筒に一週間ずっと雨予報を外しているてるてる坊主の名前があった。\n「天気予報士に転職しよう」の通りにするか迷った末、本当にその通りにしたらしい。\n僕を吊るしてから七日間、晴れ続けています。そこから思いもしないことが起きた。返事を見せたら、別の相談が始まった。\n最後の一行だけ、やけに字が大きかった。","雨が降った日、一週間ずっと雨予報を外しているてるてる坊主が、例の「僕を吊るしてから七日間、晴れ続けています」について書いてきた。\n「持ち主の予定を確認して」の返事をきっかけに、まず紙に書き出してみた。\n返事を見せたら、別の相談が始まった。\n「今度はあなたの話も聞かせて」と書き添えられていた。"]}},{"ja":{"from":"差出人：人の悪口を聞きすぎたエレベーター","body":"上司が乗る前はみんな元気に話しています。上司が乗った瞬間、全員が階数表示を見つめます。僕まで緊張します。","choices":["階数表示に集中して","録音機能はつけないで","扉を閉めるタイミングに気をつけて"],"ends":["二日後、人の悪口を聞きすぎたエレベーターから二通目。\n「階数表示に集中して」を実行する前に、上司が乗る前はみんな元気に話していますという話を思い出したらしい。\n少しだけ勇気を出してみた。最初に笑った人が、最後は黙り込んだ。\n「続きができたら、また書きます」で終わっていた。","数時間後、短い手紙が届いた。差出人は人の悪口を聞きすぎたエレベーター。\n「録音機能はつけないで」と返したら、予定外の相手まで巻き込んだ。\n例の「上司が乗る前はみんな元気に話しています」の件は、一人だけ、まったく別の解釈をした。\nその後どうなったかは、まだ誰も知らない。","雨が降った日、人の悪口を聞きすぎたエレベーターから追伸が来た。\n「扉を閉めるタイミングに気をつけて」を選んだことを伝えると、まず紙に書き出してみた。\n上司が乗る前はみんな元気に話しています――その話が、今度は別の意味で広まっている。誰も予想していない方向に話が進んだ。\n「これ、成功ってことでいいですか」と最後に書いてあった。"]},"en":{"from":"差出人：人の悪口を聞きすぎたエレベーター","body":"上司が乗る前はみんな元気に話しています。上司が乗った瞬間、全員が階数表示を見つめます。僕まで緊張します。","choices":["階数表示に集中して","録音機能はつけないで","扉を閉めるタイミングに気をつけて"],"ends":["二日後、人の悪口を聞きすぎたエレベーターから二通目。\n「階数表示に集中して」を実行する前に、上司が乗る前はみんな元気に話していますという話を思い出したらしい。\n少しだけ勇気を出してみた。最初に笑った人が、最後は黙り込んだ。\n「続きができたら、また書きます」で終わっていた。","数時間後、短い手紙が届いた。差出人は人の悪口を聞きすぎたエレベーター。\n「録音機能はつけないで」と返したら、予定外の相手まで巻き込んだ。\n例の「上司が乗る前はみんな元気に話しています」の件は、一人だけ、まったく別の解釈をした。\nその後どうなったかは、まだ誰も知らない。","雨が降った日、人の悪口を聞きすぎたエレベーターから追伸が来た。\n「扉を閉めるタイミングに気をつけて」を選んだことを伝えると、まず紙に書き出してみた。\n上司が乗る前はみんな元気に話しています――その話が、今度は別の意味で広まっている。誰も予想していない方向に話が進んだ。\n「これ、成功ってことでいいですか」と最後に書いてあった。"]}},{"ja":{"from":"差出人：自分の誕生日を忘れた占い師","body":"明日の運勢は分かるのに、今日が何の日か分かりませんでした。弟子がケーキを持ってきて気づきました。","choices":["カレンダーを買おう","弟子の運勢を占ってあげて","今日はケーキを食べよう"],"ends":["週末になって、自分の誕生日を忘れた占い師から追伸が来た。\n「カレンダーを買おう」を選んだことを伝えると、本当にその通りにしたらしい。\n明日の運勢は分かるのに、今日が何の日か分かりませんでした――その話が、今度は別の意味で広まっている。返事を見せたら、別の相談が始まった。\n次の手紙には、なぜか謝礼のつもりのシールが入っていた。","一週間後、自分の誕生日を忘れた占い師から二通目。\n「弟子の運勢を占ってあげて」を実行する前に、明日の運勢は分かるのに、今日が何の日か分かりませんでしたという話を思い出したらしい。\n誰にも言わずに実行した。最初に笑った人が、最後は黙り込んだ。\n「たぶんこれでよかった」と短く締めくくられていた。","三日後、短い手紙が届いた。差出人は自分の誕生日を忘れた占い師。\n「今日はケーキを食べよう」と返したら、思い切って口に出してみた。\n例の「明日の運勢は分かるのに、今日が何の日か分かりませんでした」の件は、ところが、話を聞いていた人のほうが先に動いた。\nその後どうなったかは、まだ誰も知らない。"]},"en":{"from":"差出人：自分の誕生日を忘れた占い師","body":"明日の運勢は分かるのに、今日が何の日か分かりませんでした。弟子がケーキを持ってきて気づきました。","choices":["カレンダーを買おう","弟子の運勢を占ってあげて","今日はケーキを食べよう"],"ends":["週末になって、自分の誕生日を忘れた占い師から追伸が来た。\n「カレンダーを買おう」を選んだことを伝えると、本当にその通りにしたらしい。\n明日の運勢は分かるのに、今日が何の日か分かりませんでした――その話が、今度は別の意味で広まっている。返事を見せたら、別の相談が始まった。\n次の手紙には、なぜか謝礼のつもりのシールが入っていた。","一週間後、自分の誕生日を忘れた占い師から二通目。\n「弟子の運勢を占ってあげて」を実行する前に、明日の運勢は分かるのに、今日が何の日か分かりませんでしたという話を思い出したらしい。\n誰にも言わずに実行した。最初に笑った人が、最後は黙り込んだ。\n「たぶんこれでよかった」と短く締めくくられていた。","三日後、短い手紙が届いた。差出人は自分の誕生日を忘れた占い師。\n「今日はケーキを食べよう」と返したら、思い切って口に出してみた。\n例の「明日の運勢は分かるのに、今日が何の日か分かりませんでした」の件は、ところが、話を聞いていた人のほうが先に動いた。\nその後どうなったかは、まだ誰も知らない。"]}},{"ja":{"from":"差出人：毎回『異常なし』と言われるゾンビ","body":"健康診断で『お元気ですね』と言われました。脈はありません。先生はどこを見ているのでしょう。","choices":["別の病院に行こう","健康の定義を聞こう","元気ならそれでいい"],"ends":["その夜、毎回『異常なし』と言われるゾンビが、例の「健康診断で『お元気ですね』と言われました」について書いてきた。\n「別の病院に行こう」の返事をきっかけに、さっそく試してみたそうだ。\n思わぬところで拍手が起きた。\n「誰にも内緒にしてください」と、しっかり赤字で書かれていた。","次の朝、毎回『異常なし』と言われるゾンビから二通目。\n「健康の定義を聞こう」を実行する前に、健康診断で『お元気ですね』と言われましたという話を思い出したらしい。\n返事を見て、予定を変更した。意外にも反対する人がいなかった。\n最後の一行だけ、やけに字が大きかった。","しばらくして、毎回『異常なし』と言われるゾンビから追伸が来た。\n「元気ならそれでいい」を選んだことを伝えると、少しだけ勇気を出してみた。\n健康診断で『お元気ですね』と言われました――その話が、今度は別の意味で広まっている。説明を求められ、余計に話が大きくなった。\n封筒の裏には、小さな丸が一つ描かれていた。"]},"en":{"from":"差出人：毎回『異常なし』と言われるゾンビ","body":"健康診断で『お元気ですね』と言われました。脈はありません。先生はどこを見ているのでしょう。","choices":["別の病院に行こう","健康の定義を聞こう","元気ならそれでいい"],"ends":["その夜、毎回『異常なし』と言われるゾンビが、例の「健康診断で『お元気ですね』と言われました」について書いてきた。\n「別の病院に行こう」の返事をきっかけに、さっそく試してみたそうだ。\n思わぬところで拍手が起きた。\n「誰にも内緒にしてください」と、しっかり赤字で書かれていた。","次の朝、毎回『異常なし』と言われるゾンビから二通目。\n「健康の定義を聞こう」を実行する前に、健康診断で『お元気ですね』と言われましたという話を思い出したらしい。\n返事を見て、予定を変更した。意外にも反対する人がいなかった。\n最後の一行だけ、やけに字が大きかった。","しばらくして、毎回『異常なし』と言われるゾンビから追伸が来た。\n「元気ならそれでいい」を選んだことを伝えると、少しだけ勇気を出してみた。\n健康診断で『お元気ですね』と言われました――その話が、今度は別の意味で広まっている。説明を求められ、余計に話が大きくなった。\n封筒の裏には、小さな丸が一つ描かれていた。"]}},{"ja":{"from":"差出人：自分の指名手配写真にダメ出しする逃亡犯","body":"もっといい写真があるのに、なぜあれを使うのでしょう。目つきも悪いし、髪型も決まっていません。","choices":["警察に写真を送るな","まず出頭して相談しよう","写真写りを気にする場面じゃない"],"ends":["日付のない追伸が届いた。封筒に自分の指名手配写真にダメ出しする逃亡犯の名前があった。\n「警察に写真を送るな」の通りにするか迷った末、思い切って口に出してみた。\nもっといい写真があるのに、なぜあれを使うのでしょう。そこから思いもしないことが起きた。ところが、話を聞いていた人のほうが先に動いた。\n封筒の裏には、小さな丸が一つ描かれていた。","翌日の昼、自分の指名手配写真にダメ出しする逃亡犯から追伸が来た。\n「まず出頭して相談しよう」を選んだことを伝えると、本当にその通りにしたらしい。\nもっといい写真があるのに、なぜあれを使うのでしょう――その話が、今度は別の意味で広まっている。ところが、話を聞いていた人のほうが先に動いた。\n「続きができたら、また書きます」で終わっていた。","その日の夕方、自分の指名手配写真にダメ出しする逃亡犯が報告してきた。\n「写真写りを気にする場面じゃない」という一言がきっかけで、返事を見て、予定を変更した。\n「もっといい写真があるのに、なぜあれを使うのでしょう」と悩んでいた頃とは、少し様子が違う。説明を求められ、余計に話が大きくなった。\n最後の一行だけ、やけに字が大きかった。"]},"en":{"from":"差出人：自分の指名手配写真にダメ出しする逃亡犯","body":"もっといい写真があるのに、なぜあれを使うのでしょう。目つきも悪いし、髪型も決まっていません。","choices":["警察に写真を送るな","まず出頭して相談しよう","写真写りを気にする場面じゃない"],"ends":["日付のない追伸が届いた。封筒に自分の指名手配写真にダメ出しする逃亡犯の名前があった。\n「警察に写真を送るな」の通りにするか迷った末、思い切って口に出してみた。\nもっといい写真があるのに、なぜあれを使うのでしょう。そこから思いもしないことが起きた。ところが、話を聞いていた人のほうが先に動いた。\n封筒の裏には、小さな丸が一つ描かれていた。","翌日の昼、自分の指名手配写真にダメ出しする逃亡犯から追伸が来た。\n「まず出頭して相談しよう」を選んだことを伝えると、本当にその通りにしたらしい。\nもっといい写真があるのに、なぜあれを使うのでしょう――その話が、今度は別の意味で広まっている。ところが、話を聞いていた人のほうが先に動いた。 いる。返事を見せたら、別の相談が始まった。\n次の手紙には、なぜか謝礼のつもりのシールが入っていた。"]}},{"ja":{"from":"差出人：スーパーの試食係","body":"同じお客さんが四回、別人の顔で来ました。五回目は名前を聞いていいですか。","choices":["一度だけ試してみよう","本人に聞いてみよう","そのまま楽しもう"],"ends":["一週間後、短い手紙が届いた。差出人はスーパーの試食係。\n「一度だけ試してみよう」と返したら、思い切って口に出してみた。\n例の「同じお客さんが四回、別人の顔で来ました」の件は、ところが、話を聞いていた人のほうが先に動いた。\n「たぶんこれでよかった」と短く締めくくられていた。","雨が降った日、スーパーの試食係が、例の「同じお客さんが四回、別人の顔で来ました」について書いてきた。\n「本人に聞いてみよう」の返事をきっかけに、予定外の相手まで巻き込んだ。\nなぜか小さな行列ができた。\n最後の一行だけ、やけに字が大きかった。","その日の夕方、スーパーの試食係が報告してきた。\n「そのまま楽しもう」という一言がきっかけで、思い切って口に出してみた。\n「同じお客さんが四回、別人の顔で来ました」と悩んでいた頃とは、少し様子が違う。ところが、話を聞いていた人のほうが先に動いた。\n「続きができたら、また書きます」で終わっていた。"]},"en":{"from":"差出人：スーパーの試食係","body":"同じお客さんが四回、別人の顔で来ました。五回目は名前を聞いていいですか。","choices":["一度だけ試してみよう","本人に聞いてみよう","そのまま楽しもう"],"ends":["一週間後、短い手紙が届いた。差出人はスーパーの試食係。\n「一度だけ試してみよう」と返したら、思い切って口に出してみた。\n例の「同じお客さんが四回、別人の顔で来ました」の件は、ところが、話を聞いていた人のほうが先に動いた。\n「たぶんこれでよかった」と短く締めくくられていた。","雨が降った日、スーパーの試食係が、例の「同じお客さんが四回、別人の顔で来ました」について書いてきた。\n「本人に聞いてみよう」の返事をきっかけに、予定外の相手まで巻き込んだ。\nなぜか小さな行列ができた。\n最後の一行だけ、やけに字が大きかった。","その日の夕方、スーパーの試食係が報告してきた。\n「そのまま楽しもう」という一言がきっかけで、思い切って口に出してみた。\n「同じお客さんが四回、別人の顔で来ました」と悩んでいた頃とは、少し様子が違う。ところが、話を聞いていた人のほうが先に動いた。\n「続きができたら、また書きます」で終わっていた。"]}},{"ja":{"from":"差出人：靴下を片方だけ買う人","body":"片方なくす前提で暮らしていたら、今度は両方残りました。どう祝えばいいですか。","choices":["本人に聞いてみよう","そのまま楽しもう","一度だけ試してみよう"],"ends":["雨が降った日、靴下を片方だけ買う人から追伸が来た。\n「本人に聞いてみよう」を選んだことを伝えると、思い切って口に出してみた。\n片方なくす前提で暮らしていたら、今度は両方残りました――その話が、今度は別の意味で広まっている。なぜか小さな行列ができた。\n「今度はあなたの話も聞かせて」と書き添えられていた。","雨が降った日、封筒に靴下を片方だけ買う人の名前があった。\n「そのまま楽しもう」の通りにするか迷った末、少しだけ勇気を出してみた。\n片方なくす前提で暮らしていたら、今度は両方残りました。そこから思いもしないことが起きた。一人だけ、まったく別の解釈をした。\n追伸には「次は自分で決めてみます」とあった。","しばらくして、封筒に靴下を片方だけ買う人の名前があった。\n「一度だけ試してみよう」の通りにするか迷った末、少しだけ勇気を出してみた。\n片方なくす前提で暮らしていたら、今度は両方残りました。そこから思いもしないことが起きた。ところが、話を聞いていた人のほうが先に動いた。\n追伸には「次は自分で決めてみます」とあった。"]},"en":{"from":"差出人：靴下を片方だけ買う人","body":"片方なくす前提で暮らしていたら、今度は両方残りました。どう祝えばいいですか。","choices":["本人に聞いてみよう","そのまま楽しもう","一度だけ試してみよう"],"ends":["雨が降った日、靴下を片方だけ買う人から追伸が来た。\n「本人に聞いてみよう」を選んだことを伝えると、思い切って口に出してみた。\n片方なくす前提で暮らしていたら、今度は両方残りまし 、予定を変更した。\n家族にオムライスを褒められて以来、毎週同じものを出しています。そこから思いもしないことが起きた。返事を見せたら、別の相談が始まった。\n「今度はあなたの話も聞かせて」と書き添えられていた。"]},"en":{"from":"差出人：週末だけ料理長","body":"家族にオムライスを褒められて以来、毎週同じものを出しています。そろそろ冒険すべきですか。","choices":["一度だけ試してみよう","本人に聞いてみよう","そのまま楽しもう"],"ends":["数時間後、週末だけ料理長が報告してきた。\n「一度だけ試してみよう」という一言がきっかけで、誰にも言わずに実行した。\n「家族にオムライスを褒められて以来、毎週同じものを出しています」と悩んでいた頃とは、少し様子が違う。ところが、話を聞いていた人のほうが先に動いた。\n封筒には、なぜか二枚目の切手が貼ってあった。","二日後、週末だけ料理長が、例の「家族にオムライスを褒められて以来、毎週同じものを出しています」について書いてきた。\n「本人に聞いてみよう」の返事をきっかけに、誰にも言わずに実行した。\nところが、話を聞いていた人のほうが先に動いた。\n封筒には、なぜか二枚目の切手が貼ってあった。","雨が降った日、封筒に週末だけ料理長の名前があった。\n「そのまま楽しもう」の通りにするか迷った末、返事を見て、予定を変更した。\n家族にオムライスを褒められて以来、毎週同じものを出しています。そこから思いもしないことが起きた。返事を見せたら、別の相談が始まった。\n「今度はあなたの話も聞かせて」と書き添えられていた。"]}},{"ja":{"from":"差出人：二階まで階段を使う人","body":"健康のために階段を使っていますが、帰りはエレベーターです。半分でも偉いですか。","choices":["本人に聞いてみよう","そのまま楽しもう","一度だけ試してみよう"],"ends":["翌週、二階まで階段を使う人が、例の「健康のために階段を使っていますが、帰りはエレベーターです」について書いてきた。\n「本人に聞いてみよう」の返事をきっかけに、半信半疑で動いてみたらしい。\nところが、話を聞いていた人のほうが先に動いた。\n最後の一行だけ、やけに字が大きかった。","しばらくして、二階まで階段を使う人が、例の「健康のために階段を使っていますが、帰りはエレベーターです」について書いてきた。\n「そのまま楽しもう」の返事をきっかけに、少しだけ勇気を出してみた。\n相手が先に謝ってきた。\n次の手紙には、なぜか謝礼のつもりのシールが入っていた。","三日後、短い手紙が届いた。差出人は二階まで階段を使う人。\n「一度だけ試してみよう」と返したら、少しだけ勇気を出してみた。\n例の「健康のために階段を使っていますが、帰りはエレベーターです」の件は、それが新しい習慣になりそうだ。\n「たぶんこれでよかった」と短く締めくくられていた。"]},"en":{"from":"差出人：二階まで階段を使う人","body":"健康のために階段を使っていますが、帰りはエレベーターです。半分でも偉いですか。","choices":["本人に聞いてみよう","そのまま楽しもう","一度だけ試してみよう"],"ends":["翌週、二階まで階段を使う人が、例の「健康のために階段を使っていますが、帰りはエレベーターです」について書いてきた。\n「本人に聞いてみよう」の返事をきっかけに、半信半疑で動いてみたらしい。\nところが、話を聞いていた人のほうが先に動いた。\n最後の一行だけ、やけに字が大きかった。","しばらくして、二階まで階段を使う人が、例の「健康のために階段を使っていますが、帰りはエレベーターです」について書いてきた。\n「そのまま楽しもう」の返事をきっかけに、少しだけ勇気を出してみた。\n相手が先に謝ってきた。\n次の手紙には、なぜか謝礼のつもりのシールが入っていた。","三日後、短い手紙が届いた。差出人は二階まで階段を使う人。\n「一度だけ試してみよう」と返したら、少しだけ勇気を出してみた。\n例の「健康のために階段を使っていますが、帰りはエレベーターです」の件は、それが新しい習慣になりそうだ。\n「たぶんこれでよかった」と短く締めくくられていた。"]}},{"ja":{"from":"差出人：地図を逆さに読む旅行者","body":"迷って入った店が人生最高の定食屋でした。道を覚えないほうが幸せですか。","choices":["そのまま楽しもう","一度だけ試してみよう","本人に聞いてみよう"],"ends":["次の朝、地図を逆さに読む旅行者が、例の「迷って入った店が人生最高の定食屋でした」について書いてきた。\n「そのまま楽しもう」の返事をきっかけに、最初は笑ったが、試してみた。\n最初に笑った人が、最後は黙り込んだ。\n次の手紙には、なぜか謝礼のつもりのシールが入っていた。","次の月曜日、地図を逆さに読む旅行者から二通目。\n「一度だけ試してみよう」を実行する前に、迷って入った店が人生最高の定食屋でしたという話を思い出したらしい。\n誰にも言わずに実行した。思わぬところで拍手が起きた。\nその後どうなったかは、まだ誰も知らない。","その夜、地図を逆さに読む旅行者が、例の「迷って入った店が人生最高の定食屋でした」について書いてきた。\n「本人に聞いてみよう」の返事をきっかけに、思ったより真剣に受け取られた。\nなぜか小さな行列ができた。\n「続きができたら、また書きます」で終わっていた。"]},"en":{"from":"差出人：地図を逆さに読む旅行者","body":"迷って入った店が人生最高の定食屋でした。道を覚えないほうが幸せですか。","choices":["そのまま楽しもう","一度だけ試してみよう","本人に聞いてみよう"],"ends":["次の朝、地図を逆さに読む旅行者が、例の「迷って入った店が人生最高の定食屋でした」について書いてきた。\n「そのまま楽しもう」の返事をきっかけに、最初は笑ったが、試してみた。\n最初に笑った人が、最後は黙り込んだ。\n次の手紙には、なぜか謝礼のつもりのシールが入っていた。","次の月曜日、地図を逆さに読む旅行者から二通目。\n「一度だけ試してみよう」を実行する前に、迷って入った店が人生最高の定食屋でしたという話を思い出したらしい。\n誰にも言わずに実行した。思わぬところで拍手が起きた。\nその後どうなったかは、まだ誰も知らない。","その夜、地図を逆さに読む旅行者が、例の「迷って入った店が人生最高の定食屋でした」について書いてきた。\n「本人に聞いてみよう」の返事をきっかけに、思ったより真剣に受け取られた。\nなぜか小さな行列ができた。\n「続きができたら、また書きます」で終わっていた。"]}},{"ja":{"from":"差出人：レジ袋を断れない人","body":"袋はいりませんと言う練習を家で百回しました。本番では二枚もらいました。","choices":["一度だけ試してみよう","本人に聞いてみよう","そのまま楽しもう"],"ends":["しばらくして、レジ袋を断れない人から追伸が来た。\n「一度だけ試してみよう」を選んだことを伝えると、少しだけ勇気を出してみた。\n袋はいりませんと言う練習を家で百回しました――その話が、今度は別の意味で広まっている。返事を見せたら、別の相談が始まった。\nその後どうなったかは、まだ誰も知らない。","日付のない追伸が届いた。レジ袋を断れない人が報告してきた。\n「本人に聞いてみよう」という一言がきっかけで、さっそく試してみたそうだ。\n「袋はいりませんと言う練習を家で百回しました」と悩んでいた頃とは、少し様子が違う。返事を見せたら、別の相談が始まった。\n結局、本人が一番楽しそうだった。","その日の夕方、レジ袋を断れない人から二通目。\n「そのまま楽しもう」を実行する前に、袋はいりませんと言う練習を家で百回しましたという話を思い出したらしい。\n予定外の相手まで巻き込んだ。なぜか小さな行列ができた。\n最後の一行だけ、やけに字が大きかった。"]},"en":{"from":"差出人：レジ袋を断れない人","body":"袋はいりませんと言う練習を家で百回しました。本番では二枚もらいました。","choices":["一度だけ試してみよう","本人に聞いてみよう","そのまま楽しもう"],"ends":["しばらくして、レジ袋を断れない人から追伸が来た。\n「一度だけ試してみよう」を選んだことを伝えると、少しだけ勇気を出してみた。\n袋はいりませんと言う練習を家で百回しました――その話が、今度は別の意味で広まっている。返事を見せたら、別の相談が始まった。\nその後どうなったかは、まだ誰も知らない。","日付のない追伸が届いた。レジ袋を断れない人が報告してきた。\n「本人に聞いてみよう」という一言がきっかけで、さっそく試してみたそうだ。\n「袋はいりませんと言う練習を家で百回しました」と悩んでいた頃とは、少し様子が違う。返事を見せたら、別の相談が始まった。\n結局、本人が一番楽しそうだった。","その日の夕方、レジ袋を断れない人から二通目。\n「そのまま楽しもう」を実行する前に、袋はいりませんと言う練習を家で百回しましたという話を思い出したらしい。\n予定外の相手まで巻き込んだ。なぜか小さな行列ができた。\n最後の一行だけ、やけに字が大きかった。"]}},{"ja":{"from":"差出人：議事録だけ速い新人","body":"会議が始まる前に結論を書いてしまいました。偶然当たったので誰にも言えません。","choices":["今日は定時で帰ろう","それも立派な仕事だ","まず相談してみよう"],"ends":["帰り道で、議事録だけ速い新人が報告してきた。\n「今日は定時で帰ろう」という一言がきっかけで、半信半疑で動いてみたらしい。\n「会議が始まる前に結論を書いてしまいました」と悩んでいた頃とは、少し様子が違う。周囲は納得したが、本人だけ納得していない。\n最後の一行だけ、やけに字が大きかった。","返事を出した翌朝、議事録だけ速い新人から二通目。\n「それも立派な仕事だ」を実行する前に、会議が始まる前に結論を書いてしまいましたという話を思い出したらしい。\n一度はやめかけたが、結局実行した。ところが、話を聞いていた人のほうが先に動いた。\n次の手紙には、なぜか謝礼のつもりのシールが入っていた。","週末になって、議事録だけ速い新人が報告してきた。\n「まず相談してみよう」という一言がきっかけで、半信半疑で動いてみたらしい。\n「会議が始まる前に結論を書いてしまいました」と悩んでいた頃とは、少し様子が違う。その場では何も起きなかった。翌日になって効いてきた。\n「これ、成功ってことでいいですか」と最後に書いてあった。"]},"en":{"from":"差出人：議事録だけ速い新人","body":"会議が始まる前に結論を書いてしまいました。偶然当たったので誰にも言えません。","choices":["今日は定時で帰ろう","それも立派な仕事だ","まず相談してみよう"],"ends":["帰り道で、議事録だけ速い新人が報告してきた。\n「今日は定時で帰ろう」という一言がきっかけで、半信半疑で動いてみたらしい。\n「会議が始まる前に結論を書いてしまいました」と悩んでいた頃とは、少し様子が違う。周囲は納得したが、本人だけ納得していない。\n最後の一行だけ、やけに字が大きかった。","返事を出した翌朝、議事録だけ速い新人から二通目。\n「それも立派な仕事だ」を実行する前に、会議が始まる前に結論を書いてしまいましたという話を思い出したらしい。\n一度はやめかけたが、結局実行した。ところが、話を聞いていた人のほうが先に動いた。\n次の手紙には、なぜか謝礼のつもりのシールが入っていた。","週末になって、議事録だけ速い新人が報告してきた。\n「まず相談してみよう」という一言がきっかけで、半信半疑で動いてみたらしい。\n「会議が始まる前に結論を書いてしまいました」と悩んでいた頃とは、少し様子が違う。その場では何も起きなかった。翌日になって効いてきた。\n「これ、成功ってことでいいですか」と最後に書いてあった。"]}},{"ja":{"from":"差出人：退職届を温める係長","body":"三年前に書いた退職届が、今では机の脚のがたつきを直しています。提出していいですか。","choices":["それも立派な仕事だ","まず相談してみよう","今日は定時で帰ろう"],"ends":["翌日の昼、退職届を温める係長が報告してきた。\n「それも立派な仕事だ」という一言がきっかけで、最初は笑ったが、試してみた。\n「三年前に書いた退職届が、今では机の脚のがたつきを直しています」と悩んでいた頃とは、少し様子が違う。それが新しい習慣になりそうだ。\n次の手紙には、なぜか謝礼のつもりのシールが入っていた。","週末になって、退職届を温める係長から二通目。\n「まず相談してみよう」を実行する前に、三年前に書いた退職届が、今では机の脚のがたつきを直していますという話を思い出したらしい。\n返事を見て、予定を変更した。ところが、話を聞いていた人のほうが先に動いた。\n「これ、成功ってことでいいですか」と最後に書いてあった。","一週間後、退職届を温める係長から追伸が来た。\n「今日は定時で帰ろう」を選んだことを伝えると、返事を見て、予定を変更した。\n三年前に書いた退職届が、今では机の脚のがたつきを直しています――その話が、今度は別の意味で広まっている。誰も予想していない方向に話が進んだ。\n封筒の裏には、小さな丸が一つ描かれていた。"]},"en":{"from":"差出人：退職届を温める係長","body":"三年前に書いた退職届が、今では机の脚のがたつきを直しています。提出していいですか。","choices":["それも立派な仕事だ","まず相談してみよう","今日は定時で帰ろう"],"ends":["翌日の昼、退職届を温める係長が報告してきた。\n「それも立派な仕事だ」という一言がきっかけで、最初は笑ったが、試してみた。\n「三年前に書いた退職届が、今では机の脚のがたつきを直しています」と悩んでいた頃とは、少し様子が違う。それが新しい習慣になりそうだ。\n次の手紙には、なぜか謝礼のつもりのシールが入っていた。","週末になって、退職届を温める係長から二通目。\n「まず相談してみよう」を実行する前に、三年前に書いた退職届が、今では机の脚のがたつきを直していますという話を思い出したらしい。\n返事を見て、予定を変更した。ところが、話を聞いていた人のほうが先に動いた。\n「これ、成功ってことでいいですか」と最後に書いてあった。","一週間後、退職届を温める係長から追伸が来た。\n「今日は定時で帰ろう」を選んだことを伝えると、返事を見て、予定を変更した。\n三年前に書いた退職届が、今では机の脚のがたつきを直しています――その話が、今度は別の意味で広まっている。誰も予想していない方向に話が進んだ。\n封筒の裏には、小さな丸が一つ描かれていた。"]}},{"ja":{"from":"差出人：社内植物担当の経理","body":"観葉植物だけが私の残業を知っています。来期の評価面談に同席させたいです。","choices":["まず相談してみよう","今日は定時で帰ろう","それも立派な仕事だ"],"ends":["次の朝、社内植物担当の経理が報告してきた。\n「まず相談してみよう」という一言がきっかけで、誰にも言わずに実行した。\n「観葉植物だけが私の残業を知っています」と悩んでいた頃とは、少し様子が違う。思わぬところで拍手が起きた。\n「たぶんこれでよかった」と短く締めくくられていた。","一週間後、短い手紙が届いた。差出人は社内植物担当の経理。\n「今日は定時で帰ろう」と返したら、最初は笑ったが、試してみた。\n例の「観葉植物だけが私の残業を知っています」の件は、いちばん驚いたのは本人だった。\nその後どうなったかは、まだ誰も知らない。","日付のない追伸が届いた。社内植物担当の経理が、例の「観葉植物だけが私の残業を知っています」について書いてきた。\n「それも立派な仕事だ」の返事をきっかけに、さっそく試してみたそうだ。\n周囲は納得したが、本人だけ納得していない。\n封筒の裏には、小さな丸が一つ描かれていた。"]},"en":{"from":"差出人：社内植物担当の経理","body":"観葉植物だけが私の残業を知っています。来期の評価面談に同席させたいです。","choices":["まず相談してみよう","今日は定時で帰ろう","それも立派な仕事だ"],"ends":["次の朝、社内植物担当の経理が報告してきた。\n「まず相談してみよう」という一言がきっかけで、誰にも言わずに実行した。\n「観葉植物だけが私の残業を知っています」と悩んでいた頃とは、少し様子が違う。思わぬところで拍手が起きた。\n「たぶんこれでよかった」と短く締めくくられていた。","一週間後、短い手紙が届いた。差出人は社内植物担当の経理。\n「今日は定時で帰ろう」と返したら、最初は笑ったが、試してみた。\n例の「観葉植物だけが私の残業を知っています」の件は、いちばん驚いたのは本人だった。\nその後どうなったかは、まだ誰も知らない。","日付のない追伸が届いた。社内植物担当の経理が、例の「観葉植物だけが私の残業を知っています」について書いてきた。\n「それも立派な仕事だ」の返事をきっかけに、さっそく試してみたそうだ。\n周囲は納得したが、本人だけ納得していない。\n封筒の裏には、小さな丸が一つ描かれていた。"]}},{"ja":{"from":"差出人：毎朝名刺を忘れる営業","body":"名前を覚えてもらう作戦だと言い張ってきました。そろそろ本当のことを言うべきですか。","choices":["今日は定時で帰ろう","それも立派な仕事だ","まず相談してみよう"],"ends":["週末になって、毎朝名刺を忘れる営業が報告してきた。\n「今日は定時で帰ろう」という一言がきっかけで、一度はやめかけたが、結局実行した。\n「名前を覚えてもらう作戦だと言い張ってきました」と悩んでいた頃とは、少し様子が違う。相手が先に謝ってきた。\n最後の一行だけ、やけに字が大きかった。","帰り道で、毎朝名刺を忘れる営業が報告してきた。\n「それも立派な仕事だ」という一言がきっかけで、一度はやめかけたが、結局実行した。\n「名前を覚えてもらう作戦だと言い張ってきました」と悩んでいた頃とは、少し様子が違う。意外にも反対する人がいなかった。\n「たぶんこれでよかった」と短く締めくくられていた。","三日後、短い手紙が届いた。差出人は毎朝名刺を忘れる営業。\n「まず相談してみよう」と返したら、半信半疑で動いてみたらしい。\n例の「名前を覚えてもらう作戦だと言い張ってきました」の件は、周囲は納得したが、本人だけ納得していない。\n追伸には「次は自分で決めてみます」とあった。"]},"en":{"from":"差出人：毎朝名刺を忘れる営業","body":"名前を覚えてもらう作戦だと言い張ってきました。そろそろ本当のことを言うべきですか。","choices":["今日は定時で帰ろう","それも立派な仕事だ","まず相談してみよう"],"ends":["週末になって、毎朝名刺を忘れる営業が報告してきた。\n「今日は定時で帰ろう」という一言がきっかけで、一度はやめかけたが、結局実行した。\n「名前を覚えてもらう作戦だと言い張ってきました」と悩んでいた頃とは、少し様子が違う。相手が先に謝ってきた。\n最後の一行だけ、やけに字が大きかった。","帰り道で、毎朝名刺を忘れる営業が報告してきた。\n「それも立派な仕事だ」という一言がきっかけで、一度はやめかけたが、結局実行した。\n「名前を覚えてもらう作戦だと言い張ってきました」と悩んでいた頃とは、少し様子が違う。意外にも反対する人がいなかった。\n「たぶんこれでよかった」と短く締めくくられていた。","三日後、短い手紙が届いた。差出人は毎朝名刺を忘れる営業。\n「まず相談してみよう」と返したら、半信半疑で動いてみたらしい。\n例の「名前を覚えてもらう作戦だと言い張ってきました」の件は、周囲は納得したが、本人だけ納得していない。\n追伸には「次は自分で決めてみます」とあった。"]}},{"ja":{"from":"差出人：社長より早く帰る新人","body":"定時で帰ると社長が拍手します。これは褒められているんでしょうか。","choices":["それも立派な仕事だ","まず相談してみよう","今日は定時で帰ろう"],"ends":["しばらくして、社長より早く帰る新人が、例の「定時で帰ると社長が拍手します」について書いてきた。\n「それも立派な仕事だ」の返事をきっかけに、少しだけ勇気を出してみた。\n結果より、その途中の顔が忘れられないらしい。\n「誰にも内緒にしてください」と、しっかり赤字で書かれていた。","次の月曜日、社長より早く帰る新人が報告してきた。\n「まず相談してみよう」という一言がきっかけで、最初は笑ったが、試してみた。\n「定時で帰ると社長が拍手します」と悩んでいた頃とは、少し様子が違う。いちばん驚いたのは本人だった。\n「今度はあなたの話も聞かせて」と書き添えられていた。","しばらくして、短い手紙が届いた。差出人は社長より早く帰る新人。\n「今日は定時で帰ろう」と返したら、最初は笑ったが、試してみた。\n例の「定時で帰ると社長が拍手します」の件は、最初に笑った人が、最後は黙り込んだ。\nその後どうなったかは、まだ誰も知らない。"]},"en":{"from":"差出人：社長より早く帰る新人","body":"定時で帰ると社長が拍手します。これは褒められているんでしょうか。","choices":["それも立派な仕事だ","まず相談してみよう","今日は定時で帰ろう"],"ends":["しばらくして、社長より早く帰る新人が、例の「定時で帰ると社長が拍手します」について書いてきた。\n「それも立派な仕事だ」の返事をきっかけに、少しだけ勇気を出してみた。\n結果より、その途中の顔が忘れられないらしい。\n「誰にも内緒にしてください」と、しっかり赤字で書かれていた。","次の月曜日、社長より早く帰る新人が報告してきた。\n「まず相談してみよう」という一言がきっかけで、最初は笑ったが、試してみた。\n「定時で帰ると社長が拍手します」と悩んでいた頃とは、少し様子が違う。いちばん驚いたのは本人だった。\n「今度はあなたの話も聞かせて」と書き添えられていた。","しばらくして、短い手紙が届いた。差出人は社長より早く帰る新人。\n「今日は定時で帰ろう」と返したら、最初は笑ったが、試してみた。\n例の「定時で帰ると社長が拍手します」の件は、最初に笑った人が、最後は黙り込んだ。\nその後どうなったかは、まだ誰も知らない。"]}},{"ja":{"from":"差出人：会議室を予約する達人","body":"予約した部屋で一人で昼寝していたら、部署の生産性が上がりました。理由が怖いです。","choices":["まず相談してみよう","今日は定時で帰ろう","それも立派な仕事だ"],"ends":["その日の夕方、会議室を予約する達人から追伸が来た。\n「まず相談してみよう」を選んだことを伝えると、最初は笑ったが、試してみた。\n予約した部屋で一人で昼寝していたら、部署の生産性が上がりました――その話が、今度は別の意味で広まっている。その場では何も起きなかった。翌日になって効いてきた。\n「たぶんこれでよかった」と短く締めくくられていた。","帰り道で、短い手紙が届いた。差出人は会議室を予約する達人。\n「今日は定時で帰ろう」と返したら、思い切って口に出してみた。\n例の「予約した部屋で一人で昼寝していたら、部署の生産性が上がりました」の件は、一人だけ、まったく別の解釈をした。\n「たぶんこれでよかった」と短く締めくくられていた。","三日後、会議室を予約する達人から追伸が来た。\n「それも立派な仕事だ」を選んだことを伝えると、少しだけ勇気を出してみた。\n予約した部屋で一人で昼寝していたら、部署の生産性が上がりました――その話が、今度は別の意味で広まっている。最初に笑った人が、最後は黙り込んだ。\n最後の一行だけ、やけに字が大きかった。"]},"en":{"from":"差出人：会議室を予約する達人","body":"予約した部屋で一人で昼寝していたら、部署の生産性が上がりました。理由が怖いです。","choices":["まず相談してみよう","今日は定時で帰ろう","それも立派な仕事だ"],"ends":["その日の夕方、会議室を予約する達人から追伸が来た。\n「まず相談してみよう」を選んだことを伝えると、最初は笑ったが、試してみた。\n予約した部屋で一人で昼寝していたら、部署の生産性が上がりました――その話が、今度は別の意味で広まっている。その場では何も起きなかった。翌日になって効いてきた。\n「たぶんこれでよかった」と短く締めくくられていた。","帰り道で、短い手紙が届いた。差出人は会議室を予約する達人。\n「今日は定時で帰ろう」と返したら、思い切って口に出してみた。\n例の「予約した部屋で一人で昼寝していたら、部署の生産性が上がりました」の件は、一人だけ、まったく別の解釈をした。\n「たぶんこれでよかった」と短く締めくくられていた。","三日後、会議室を予約する達人から追伸が来た。\n「それも立派な仕事だ」を選んだことを伝えると、少しだけ勇気を出してみた。\n予約した部屋で一人で昼寝していたら、部署の生産性が上がりました――その話が、今度は別の意味で広まっている。最初に笑った人が、最後は黙り込んだ。\n最後の一行だけ、やけに字が大きかった。"]}},{"ja":{"from":"差出人：退勤後だけ饒舌な上司","body":"昼は無口なのに駅の改札で毎晩長話になります。改札を会議室にできませんか。","choices":["今日は定時で帰ろう","それも立派な仕事だ","まず相談してみよう"],"ends":["しばらくして、退勤後だけ饒舌な上司から追伸が来た。\n「今日は定時で帰ろう」を選んだことを伝えると、さっそく試してみたそうだ。\n昼は無口なのに駅の改札で毎晩長話になります――その話が、今度は別の意味で広まっている。周囲は納得したが、本人だけ納得していない。\n封筒には、なぜか二枚目の切手が貼ってあった。","三日後、短い手紙が届いた。差出人は退勤後だけ饒舌な上司。\n「それも立派な仕事だ」と返したら、思ったより真剣に受け取られた。\n例の「昼は無口なのに駅の改札で毎晩長話になります」の件は、返事を見せたら、別の相談が始まった。\n結局、本人が一番楽しそうだった。","しばらくして、短い手紙が届いた。差出人は退勤後だけ饒舌な上司。\n「まず相談してみよう」と返したら、まず紙に書き出してみた。\n例の「昼は無口なのに駅の改札で毎晩長話になります」の件は、意外にも反対する人がいなかった。\n「誰にも内緒にしてください」と、しっかり赤字で書かれていた。"]},"en":{"from":"差出人：退勤後だけ饒舌な上司","body":"昼は無口なのに駅の改札で毎晩長話になります。改札を会議室にできませんか。","choices":["今日は定時で帰ろう","それも立派な仕事だ","まず相談してみよう"],"ends":["しばらくして、退勤後だけ饒舌な上司から追伸が来た。\n「今日は定時で帰ろう」を選んだことを伝えると、さっそく試してみたそうだ。\n昼は無口なのに駅の改札で毎晩長話になります――その話が、今度は別の意味で広まっている。周囲は納得したが、本人だけ納得していない。\n封筒には、なぜか二枚目の切手が貼ってあった。","三日後、短い手紙が届いた。差出人は退勤後だけ饒舌な上司。\n「それも立派な仕事だ」と返したら、思ったより真剣に受け取られた。\n例の「昼は無口なのに駅の改札で毎晩長話になります」の件は、返事を見せたら、別の相談が始まった。\n結局、本人が一番楽しそうだった。","しばらくして、短い手紙が届いた。差出人は退勤後だけ饒舌な上司。\n「まず相談してみよう」と返したら、まず紙に書き出してみた。\n例の「昼は無口なのに駅の改札で毎晩長話になります」の件は、意外にも反対する人がいなかった。\n「誰にも内緒にしてください」と、しっかり赤字で書かれていた。"]}},{"ja":{"from":"差出人：コピー機に謝る社員","body":"紙詰まりのたびに謝っていたら後輩まで頭を下げ始めました。文化になりそうです。","choices":["それも立派な仕事だ","まず相談してみよう","今日は定時で帰ろう"],"ends":["数時間後、短い手紙が届いた。差出人はコピー機に謝る社員。\n「それも立派な仕事だ」と返したら、最初は笑ったが、試してみた。\n例の「紙詰まりのたびに謝っていたら後輩まで頭を下げ始めました」の件は、その場では何も起きなかった。翌日になって効いてきた。\n「誰にも内緒にしてください」と、しっかり赤字で書かれていた。","帰り道で、コピー機に謝る社員が、例の「紙詰まりのたびに謝っていたら後輩まで頭を下げ始めました」について書いてきた。\n「まず相談してみよう」の返事をきっかけに、一度はやめかけたが、結局実行した。\nなぜか関係ない人が一番喜んだ。\n「今度はあなたの話も聞かせて」と書き添えられていた。","しばらくして、コピー機に謝る社員から追伸が来た。\n「今日は定時で帰ろう」を選んだことを伝えると、まず紙に書き出してみた。\n紙詰まりのたびに謝っていたら後輩まで頭を下げ始めました――その話が、今度は別の意味で広まっている。なぜか小さな行列ができた。\n結局、本人が一番楽しそうだった。"]},"en":{"from":"差出人：コピー機に謝る社員","body":"紙詰まりのたびに謝っていたら後輩まで頭を下げ始めました。文化になりそうです。","choices":["それも立派な仕事だ","まず相談してみよう","今日は定時で帰ろう"],"ends":["数時間後、短い手紙が届いた。差出人はコピー機に謝る社員。\n「それも立派な仕事だ」と返したら、最初は笑ったが、試してみた。\n例の「紙詰まりのたびに謝っていたら後輩まで頭を下げ始めました」の件は、その場では何も起きなかった。翌日になって効いてきた。\n「誰にも内緒にしてください」と、しっかり赤字で書かれていた。","帰り道で、コピー機に謝る社員が、例の「紙詰まりのたびに謝っていたら後輩まで頭を下げ始めました」について書いてきた。\n「まず相談してみよう」の返事をきっかけに、一度はやめかけたが、結局実行した。\nなぜか関係ない人が一番喜んだ。\n「今度はあなたの話も聞かせて」と書き添えられていた。","しばらくして、コピー機に謝る社員から追伸が来た。\n「今日は定時で帰ろう」を選んだことを伝えると、まず紙に書き出してみた。\n紙詰まりのたびに謝っていたら後輩まで頭を下げ始めました――その話が、今度は別の意味で広まっている。なぜか小さな行列ができた。\n結局、本人が一番楽しそうだった。"]}},{"ja":{"from":"差出人：誤字を見逃せない校正者","body":"友人の結婚式の招待状に誤字を見つけました。祝福と訂正は両立しますか。","choices":["まず相談してみよう","今日は定時で帰ろう","それも立派な仕事だ"],"ends":["翌週、誤字を見逃せない校正者が、例の「友人の結婚式の招待状に誤字を見つけました」について書いてきた。\n「まず相談してみよう」の返事をきっかけに、思い切って口に出してみた。\n最初に笑った人が、最後は黙り込んだ。\n次の手紙には、なぜか謝礼のつもりのシールが入っていた。","返事を出した翌朝、封筒に誤字を見逃せない校正者の名前があった。\n「今日は定時で帰ろう」の通りにするか迷った末、少しだけ勇気を出してみた。\n友人の結婚式の招待状に誤字を見つけました。そこから思いもしないことが起きた。最初に笑った人が、最後は黙り込んだ。\n「続きができたら、また書きます」で終わっていた。","数時間後、誤字を見逃せない校正者が、例の「友人の結婚式の招待状に誤字を見つけました」について書いてきた。\n「それも立派な仕事だ」の返事をきっかけに、誰にも言わずに実行した。\nその場では何も起きなかった。翌日になって効いてきた。\n最後の一行だけ、やけに字が大きかった。"]},"en":{"from":"差出人：誤字を見逃せない校正者","body":"友人の結婚式の招待状に誤字を見つけました。祝福と訂正は両立しますか。","choices":["まず相談してみよう","今日は定時で帰ろう","それも立派な仕事だ"],"ends":["翌週、誤字を見逃せない校正者が、例の「友人の結婚式の招待状に誤字を見つけました」について書いてきた。\n「まず相談してみよう」の返事をきっかけに、思い切って口に出してみた。\n最初に笑った人が、最後は黙り込んだ。\n次の手紙には、なぜか謝礼のつもりのシールが入っていた。","返事を出した翌朝、封筒に誤字を見逃せない校正者の名前があった。\n「今日は定時で帰ろう」の通りにするか迷った末、少しだけ勇気を出してみた。\n友人の結婚式の招待状に誤字を見つけました。そこから思いもしないことが起きた。最初に笑った人が、最後は黙り込んだ。\n「続きができたら、また書きます」で終わっていた。","数時間後、誤字を見逃せない校正者が、例の「友人の結婚式の招待状に誤字を見つけました」について書いてきた。\n「それも立派な仕事だ」の返事をきっかけに、誰にも言わずに実行した。\nその場では何も起きなかった。翌日になって効いてきた。\n最後の一行だけ、やけに字が大きかった。"]}},{"ja":{"from":"差出人：週報を俳句にする部長","body":"部下が五七五で返事をするようになりました。数字が一つも出てきません。","choices":["今日は定時で帰ろう","それも立派な仕事だ","まず相談してみよう"],"ends":["週末になって、週報を俳句にする部長が報告してきた。\n「今日は定時で帰ろう」という一言がきっかけで、まず紙に書き出してみた。\n「部下が五七五で返事をするようになりました」と悩んでいた頃とは、少し様子が違う。その場では何も起きなかった。翌日になって効いてきた。\n最後の一行だけ、やけに字が大きかった。","二日後、週報を俳句にする部長が、例の「部下が五七五で返事をするようになりました」について書いてきた。\n「それも立派な仕事だ」の返事をきっかけに、本当にその通りにしたらしい。\n最初に笑った人が、最後は黙り込んだ。\n封筒の裏には、小さな丸が一つ描かれていた。","一週間後、週報を俳句にする部長が、例の「部下が五七五で返事をするようになりました」について書いてきた。\n「まず相談してみよう」の返事をきっかけに、最初は笑ったが、試してみた。\n相手が先に謝ってきた。\n「たぶんこれでよかった」と短く締めくくられていた。"]},"en":{"from":"差出人：週報を俳句にする部長","body":"部下が五七五で返事をするようになりました。数字が一つも出てきません。","choices":["今日は定時で帰ろう","それも立派な仕事だ","まず相談してみよう"],"ends":["週末になって、週報を俳句にする部長が報告してきた。\n「今日は定時で帰ろう」という一言がきっかけで、まず紙に書き出してみた。\n「部下が五七五で返事をするようになりました」と悩んでいた頃とは、少し様子が違う。その場では何も起きなかった。翌日になって効いてきた。\n最後の一行だけ、やけに字が大きかった。","二日後、週報を俳句にする部長が、例の「部下が五七五で返事をするようになりました」について書いてきた。\n「それも立派な仕事だ」の返事をきっかけに、本当にその通りにしたらしい。\n最初に笑った人が、最後は黙り込んだ。\n封筒の裏には、小さな丸が一つ描かれていた。","一週間後、週報を俳句にする部長が、例の「部下が五七五で返事をするようになりました」について書いてきた。\n「まず相談してみよう」の返事をきっかけに、最初は笑ったが、試してみた。\n相手が先に謝ってきた。\n「たぶんこれでよかった」と短く締めくくられていた。"]}},{"ja":{"from":"差出人：定時の鐘を鳴らす人","body":"毎日鳴らしているのに自分だけ帰れません。鐘に説得力がないのでしょうか。","choices":["それも立派な仕事だ","まず相談してみよう","今日は定時で帰ろう"],"ends":["しばらくして、定時の鐘を鳴らす人から二通目。\n「それも立派な仕事だ」を実行する前に、毎日鳴らしているのに自分だけ帰れませんという話を思い出したらしい。\n誰にも言わずに実行した。相手が先に謝ってきた。\n追伸には「次は自分で決めてみます」とあった。","次の朝、定時の鐘を鳴らす人から追伸が来た。\n「まず相談してみよう」を選んだことを伝えると、まず紙に書き出してみた。\n毎日鳴らしているのに自分だけ帰れません――その話が、今度は別の意味で広まっている。周囲は納得したが、本人だけ納得していない。\n「誰にも内緒にしてください」と、しっかり赤字で書かれていた。","翌日の昼、定時の鐘を鳴らす人が、例の「毎日鳴らしているのに自分だけ帰れません」について書いてきた。\n「今日は定時で帰ろう」の返事をきっかけに、少しだけ勇気を出してみた。\nなぜか関係ない人が一番喜んだ。\nその後どうなったかは、まだ誰も知らない。"]},"en":{"from":"差出人：定時の鐘を鳴らす人","body":"毎日鳴らしているのに自分だけ帰れません。鐘に説得力がないのでしょうか。","choices":["それも立派な仕事だ","まず相談してみよう","今日は定時で帰ろう"],"ends":["しばらくして、定時の鐘を鳴らす人から二通目。\n「それも立派な仕事だ」を実行する前に、毎日鳴らしているのに自分だけ帰れませんという話を思い出したらしい。\n誰にも言わずに実行した。相手が先に謝ってきた。\n追伸には「次は自分で決めてみます」とあった。","次の朝、定時の鐘を鳴らす人から追伸が来た。\n「まず相談してみよう」を選んだことを伝えると、まず紙に書き出してみた。\n毎日鳴らしているのに自分だけ帰れません――その話が、今度は別の意味で広まっている。周囲は納得したが、本人だけ納得していない。\n「誰にも内緒にしてください」と、しっかり赤字で書かれていた。","翌日の昼、定時の鐘を鳴らす人が、例の「毎日鳴らしているのに自分だけ帰れません」について書いてきた。\n「今日は定時で帰ろう」の返事をきっかけに、少しだけ勇気を出してみた。\nなぜか関係ない人が一番喜んだ。\nその後どうなったかは、まだ誰も知らない。"]}},{"ja":{"from":"差出人：新入社員の教育係","body":"新人が初日に私の仕事を自動化しました。次は何を教えればいいですか。","choices":["まず相談してみよう","今日は定時で帰ろう","それも立派な仕事だ"],"ends":["日付のない追伸が届いた。新入社員の教育係から追伸が来た。\n「まず相談してみよう」を選んだことを伝えると、思ったより真剣に受け取られた。\n新人が初日に私の仕事を自動化しました――その話が、今度は別の意味で広まっている。なぜか小さな行列ができた。\n封筒の裏には、小さな丸が一つ描かれていた。","一週間後、新入社員の教育係が報告してきた。\n「今日は定時で帰ろう」という一言がきっかけで、思い切って口に出してみた。\n「新人が初日に私の仕事を自動化しました」と悩んでいた頃とは、少し様子が違う。意外にも反対する人がいなかった。\n「誰にも内緒にしてください」と、しっかり赤字で書かれていた。","一週間後、封筒に新入社員の教育係の名前があった。\n「それも立派な仕事だ」の通りにするか迷った末、まず紙に書き出してみた。\n新人が初日に私の仕事を自動化しました。そこから思いもしないことが起きた。相手が先に謝ってきた。\n封筒には、なぜか二枚目の切手が貼ってあった。"]},"en":{"from":"差出人：新入社員の教育係","body":"新人が初日に私の仕事を自動化しました。次は何を教えればいいですか。","choices":["まず相談してみよう","今日は定時で帰ろう","それも立派な仕事だ"],"ends":["日付のない追伸が届いた。新入社員の教育係から追伸が来た。\n「まず相談してみよう」を選んだことを伝えると、思ったより真剣に受け取られた。\n新人が初日に私の仕事を自動化しました――その話が、今度は別の意味で広まっている。なぜか小さな行列ができた。\n封筒の裏には、小さな丸が一つ描かれていた。","一週間後、新入社員の教育係が報告してきた。\n「今日は定時で帰ろう」という一言がきっかけで、思い切って口に出してみた。\n「新人が初日に私の仕事を自動化しました」と悩んでいた頃とは、少し様子が違う。意外にも反対する人がいなかった。\n「誰にも内緒にしてください」と、しっかり赤字で書かれていた。","一週間後、封筒に新入社員の教育係の名前があった。\n「それも立派な仕事だ」の通りにするか迷った末、まず紙に書き出してみた。\n新人が初日に私の仕事を自動化しました。そこから思いもしないことが起きた。相手が先に謝ってきた。\n封筒には、なぜか二枚目の切手が貼ってあった。"]}},{"ja":{"from":"差出人：在宅勤務の背景職人","body":"オンライン会議の背景を毎日変えたら、旅行中だと思われています。実はずっと台所です。","choices":["今日は定時で帰ろう","それも立派な仕事だ","まず相談してみよう"],"ends":["一週間後、在宅勤務の背景職人が報告してきた。\n「今日は定時で帰ろう」という一言がきっかけで、さっそく試してみたそうだ。\n「オンライン会議の背景を毎日変えたら、旅行中だと思われています」と悩んでいた頃とは、少し様子が違う。ところが、話を聞いていた人のほうが先に動いた。\n封筒には、なぜか二枚目の切手が貼ってあった。","その夜、封筒に在宅勤務の背景職人の名前があった。\n「それも立派な仕事だ」の通りにするか迷った末、誰にも言わずに実行した。\nオンライン会議の背景を毎日変えたら、旅行中だと思われています。そこから思いもしないことが起きた。周囲は納得したが、本人だけ納得していない。\n「続きができたら、また書きます」で終わっていた。","その日の夕方、在宅勤務の背景職人が、例の「オンライン会議の背景を毎日変えたら、旅行中だと思われています」について書いてきた。\n「まず相談してみよう」の返事をきっかけに、最初は笑ったが、試してみた。\n結果より、その途中の顔が忘れられないらしい。\n「誰にも内緒にしてください」と、しっかり赤字で書かれていた。"]},"en":{"from":"差出人：在宅勤務の背景職人","body":"オンライン会議の背景を毎日変えたら、旅行中だと思われています。実はずっと台所です。","choices":["今日は定時で帰ろう","それも立派な仕事だ","まず相談してみよう"],"ends":["一週間後、在宅勤務の背景職人が報告してきた。\n「今日は定時で帰ろう」という一言がきっかけで、さっそく試してみたそうだ。\n「オンライン会議の背景を毎日変えたら、旅行中だと思われています」と悩んでいた頃とは、少し様子が違う。ところが、話を聞いていた人のほうが先に動いた。\n封筒には、なぜか二枚目の切手が貼ってあった。","その夜、封筒に在宅勤務の背景職人の名前があった。\n「それも立派な仕事だ」の通りにするか迷った末、誰にも言わずに実行した。\nオンライン会議の背景を毎日変えたら、旅行中だと思われています。そこから思いもしないことが起きた。周囲は納得したが、本人だけ納得していない。\n「続きができたら、また書きます」で終わっていた。","その日の夕方、在宅勤務の背景職人が、例の「オンライン会議の背景を毎日変えたら、旅行中だと思われています」について書いてきた。\n「まず相談してみよう」の返事をきっかけに、最初は笑ったが、試してみた。\n結果より、その途中の顔が忘れられないらしい。\n「誰にも内緒にしてください」と、しっかり赤字で書かれていた。"]}},{"ja":{"from":"差出人：告白の下書きを百回直す人","body":"文章は完璧なのに送信先をまだ決めていません。順番を間違えたでしょうか。","choices":["次の約束をしよう","素直に伝えてみよう","急がなくてもいいよ"],"ends":["帰り道で、告白の下書きを百回直す人が、例の「文章は完璧なのに送信先をまだ決めていません」について書いてきた。\n「次の約束をしよう」の返事をきっかけに、予定外の相手まで巻き込んだ。\n最初に笑った人が、最後は黙り込んだ。\n「誰にも内緒にしてください」と、しっかり赤字で書かれていた。","週末になって、告白の下書きを百回直す人が、例の「文章は完璧なのに送信先をまだ決めていません」について書いてきた。\n「素直に伝えてみよう」の返事をきっかけに、さっそく試してみたそうだ。\nところが、話を聞いていた人のほうが先に動いた。\n封筒には、なぜか二枚目の切手が貼ってあった。","一週間後、封筒に告白の下書きを百回直す人の名前があった。\n「急がなくてもいいよ」の通りにするか迷った末、本当にその通りにしたらしい。\n文章は完璧なのに送信先をまだ決めていません。そこから思いもしないことが起きた。思わぬところで拍手が起きた。\n結局、本人が一番楽しそうだった。"]},"en":{"from":"差出人：告白の下書きを百回直す人","body":"文章は完璧なのに送信先をまだ決めていません。順番を間違えたでしょうか。","choices":["次の約束をしよう","素直に伝えてみよう","急がなくてもいいよ"],"ends":["帰り道で、告白の下書きを百回直す人が、例の「文章は完璧なのに送信先をまだ決めていません」について書いてきた。\n「次の約束をしよう」の返事をきっかけに、予定外の相手まで巻き込んだ。\n最初に笑った人が、最後は黙り込んだ。\n「誰にも内緒にしてください」と、しっかり赤字で書かれていた。","週末になって、告白の下書きを百回直す人が、例の「文章は完璧なのに送信先をまだ決めていません」について書いてきた。\n「素直に伝えてみよう」の返事をきっかけに いいよ","次の約束をしよう","素直に伝えてみよう"],"ends":["次の月曜日、デートで天気予報を読む人から二通目。\n「急がなくてもいいよ」を実行する前に、緊張すると降水確率を口にしますという話を思い出したらしい。\n本当にその通りにしたらしい。説明を求められ、余計に話が大きくなった。\n追伸には「次は自分で決めてみます」とあった。","翌週、封筒にデートで天気予報を読む人の名前があった。\n「次の約束をしよう」の通りにするか迷った末、半信半疑で動いてみたらしい。\n緊張すると降水確率を口にします。そこから思いもしないことが起きた。一人だけ、まったく別の解釈をした。\n封筒には、なぜか二枚目の切手が貼ってあった。","しばらくして、封筒にデートで天気予報を読む人の名前があった。\n「素直に伝えてみよう」の通りにするか迷った末、思い切って口に出してみた。\n緊張すると降水確率を口にします。そこから思いもしないことが起きた。相手が先に謝ってきた。\n「今度はあなたの話も聞かせて」と書き添えられていた。"]}},{"ja":{"from":"差出人：花束を持って迷子の人","body":"渡す相手の家を探しているうちに花屋に戻ってきました。もう一度買うべきですか。","choices":["次の約束をしよう","素直に伝えてみよう","急がなくてもいいよ"],"ends":["その日の夕方、花束を持って迷子の人が報告してきた。\n「次の約束をしよう」という一言がきっかけで、返事を見て、予定を変更した。\n「渡す相手の家を探しているうちに花屋に戻ってきました」と悩んでいた頃とは、少し様子が違う。なぜか関係ない人が一番喜んだ。\n「これ、成功ってことでいいですか」と最後に書いてあった。","雨が降った日、短い手紙が届いた。差出人は花束を持って迷子の人。\n「素直に伝えてみよう」と返したら、少しだけ勇気を出してみた。\n例の「渡す相手の家を探しているうちに花屋に戻ってきました」の件は、それが新しい習慣になりそうだ。\n「これ、成功ってことでいいですか」と最後に書いてあった。","その夜、花束を持って迷子の人が、例の「渡す相手の家を探しているうちに花屋に戻ってきました」について書いてきた。\n「急がなくてもいいよ」の返事をきっかけに、思ったより真剣に受け取られた。\n相手が先に謝ってきた。\n「誰にも内緒にしてください」と、しっかり赤字で書かれていた。"]},"en":{"from":"差出人：花束を持って迷子の人","body":"渡す相手の家を探しているうちに花屋に戻ってきました。もう一度買うべきですか。","choices":["次の約束をしよう","素直に伝えてみよう","急がなくてもいいよ"],"ends":["その日の夕方、花束を持って迷子の人が報告してきた。\n「次の約束をしよう」という一言がきっかけで、返事を見て、予定を変更した。\n「渡す相手の家を探しているうちに花屋に戻ってきました」と悩んでいた頃とは、少し様子が違う。なぜか関係ない人が一番喜んだ。\n「これ、成功ってことでいいですか」と最後に書いてあった。","雨が降った日、短い手紙が届いた。差出人は花束を持って迷子の人。\n「素直に伝えてみよう」と返したら、少しだけ勇気を出してみた。\n例の「渡す相手の家を探しているうちに花屋に戻ってきました」の件は、それが新しい習慣になりそうだ。\n「これ、成功ってことでいいですか」と最後に書いてあった。","その夜、花束を持って迷子の人が、例の「渡す相手の家を探しているうちに花屋に戻ってきました」について書いてきた。\n「急がなくてもいいよ」の返事をきっかけに、思ったより真剣に受け取られた。\n相手が先に謝ってきた。\n「誰にも内緒にしてください」と、しっかり赤字で書かれていた。"]}},{"ja":{"from":"差出人：好きな人の犬に好かれた人","body":"犬には毎回飛びつかれますが、飼い主とはまだ敬語です。先に犬へ告白していいですか。","choices":["素直に伝えてみよう","急がなくてもいいよ","次の約束をしよう"],"ends":["その日の夕方、好きな人の犬に好かれた人から追伸が来た。\n「素直に伝えてみよう」を選んだことを伝えると、本当にその通りにしたらしい。\n犬には毎回飛びつかれますが、飼い主とはまだ敬語です――その話が、今度は別の意味で広まっている。ところが、話を聞いていた人のほうが先に動いた。\n最後の一行だけ、やけに字が大きかった。","翌週、封筒に好きな人の犬に好かれた人の名前があった。\n「急がなくてもいいよ」の通りにするか迷った末、誰にも言わずに実行した。\n犬には毎回飛びつかれますが、飼い主とはまだ敬語です。そこから思いもしないことが起きた。思わぬところで拍手が起きた。\n追伸には「次は自分で決めてみます」とあった。","雨が降った日、短い手紙が届いた。差出人は好きな人の犬に好かれた人。\n「次の約束をしよう」と返したら、思い切って口に出してみた。\n例の「犬には毎回飛びつかれますが、飼い主とはまだ敬語です」の件は、結果より、その途中の顔が忘れられないらしい。\n追伸には「次は自分で決めてみます」とあった。"]},"en":{"from":"差出人：好きな人の犬に好かれた人","body":"犬には毎回飛びつかれますが、飼い主とはまだ敬語です。先に犬へ告白していいですか。","choices":["素直に伝えてみよう","急がなくてもいいよ","次の約束をしよう"],"ends":["その日の夕方、好きな人の犬に好かれた人から追伸が来た。\n「素直に伝えてみよう」を選んだことを伝えると、本当にその通りにしたらしい。\n犬には毎回飛びつかれますが、飼い主とはまだ敬語です――その話が、今度は別の意味で広まっている。ところが、話を聞いていた人のほうが先に動いた。\n最後の一行だけ、やけに字が大きかった。","翌週、封筒に好きな人の犬に好かれた人の名前があった。\n「急がなくてもいいよ」の通りにするか迷った末、誰にも言わずに実行した。\n犬には毎回飛びつかれますが、飼い主とはまだ敬語です。そこから思いもしないことが起きた。思わぬところで拍手が起きた。\n追伸には「次は自分で決めてみます」とあった。","雨が降った日、短い手紙が届いた。差出人は好きな人の犬に好かれた人。\n「次の約束をしよう」と返したら、思い切って口に出してみた。\n例の「犬には毎回飛びつかれますが、飼い主とはまだ敬語です」の件は、結果より、その途中の顔が忘れられないらしい。\n追伸には「次は自分で決めてみます」とあった。"]}},{"ja":{"from":"差出人：別れ話を練習する二人","body":"練習中に笑いすぎて、別れる理由を忘れました。もう一度話し合うべきですか。","choices":["急がなくてもいいよ","次の約束をしよう","素直に伝えてみよう"],"ends":["雨が降った日、封筒に別れ話を練習する二人の名前があった。\n「急がなくてもいいよ」の通りにするか迷った末、本当にその通りにしたらしい。\n練習中に笑いすぎて、別れる理由を忘れました。そこから思いもしないことが起きた。思わぬところで拍手が起きた。\n結局、本人が一番楽しそうだった。","次の月曜日、別れ話を練習する二人から二通目。\n「次の約束をしよう」を実行する前に、練習中に笑いすぎて、別れる理由を忘れましたという話を思い出したらしい。\n少しだけ勇気を出してみた。ところが、話を聞いていた人のほうが先に動いた。\n「続きができたら、また書きます」で終わっていた。","返事を出した翌朝、別れ話を練習する二人が、例の「練習中に笑いすぎて、別れる理由を忘れました」について書いてきた。\n「素直に伝えてみよう」の返事をきっかけに、一度はやめかけたが、結局実行した。\nなぜか小さな行列ができた。\n最後の一行だけ、やけに字が大きかった。"]},"en":{"from":"差出人：別れ話を練習する二人","body":"練習中に笑いすぎて、別れる理由を忘れました。もう一度話し合うべきですか。","choices":["急がなくてもいいよ","次の約束をしよう","素直に伝えてみよう"],"ends":["雨が降った日、封筒に別れ話を練習する二人の名前があった。\n「急がなくてもいいよ」の通りにするか迷った末、本当にその通りにしたらしい。\n練習中に笑いすぎて、別れる理由を忘れました。そこから思いもしないことが起きた。思わぬところで拍手が起きた。\n結局、本人が一番楽しそうだった。","次の月曜日、別れ話を練習する二人から二通目。\n「次の約束をしよう」を実行する前に、練習中に笑いすぎて、別れる理由を忘れましたという話を思い出したらしい。\n少しだけ勇気を出してみた。ところが、話を聞いていた人のほうが先に動いた。\n「続きができたら、また書きます」で終わっていた。","返事を出した翌朝、別れ話を練習する二人が、例の「練習中に笑いすぎて、別れる理由を忘れました」について書いてきた。\n「素直に伝えてみよう」の返事をきっかけに、一度はやめかけたが、結局実行した。\nなぜか小さな行列ができた。\n最後の一行だけ、やけに字が大きかった。"]}},{"ja":{"from":"差出人：記念日を一日早く祝う人","body":"毎年一日早くケーキを買います。相手はもうそれを記念日だと思っています。","choices":["次の約束をしよう","素直に伝えてみよう","急がなくてもいいよ"],"ends":["翌週、記念日を一日早く祝う人から追伸が来た。\n「次の約束をしよう」を選んだことを伝えると、予定外の相手まで巻き込んだ。\n毎年一日早くケーキを買います――その話が、今度は別の意味で広まっている。一人だけ、まったく別の解釈をした。\n結局、本人が一番楽しそうだった。","雨が降った日、記念日を一日早く祝う人が、例の「毎年一日早くケーキを買います」について書いてきた。\n「素直に伝えてみよう」の返事をきっかけに、最初は笑ったが、試してみた。\n誰も予想していない方向に話が進んだ。\n封筒の裏には、小さな丸が一つ描かれていた。","日付のない追伸が届いた。記念日を一日早く祝う人が、例の「毎年一日早くケーキを買います」について書いてきた。\n「急がなくてもいいよ」の返事をきっかけに、最初は笑ったが、試してみた。\n周囲は納得したが、本人だけ納得していない。\n「たぶんこれでよかった」と短く締めくくられていた。"]},"en":{"from":"差出人：記念日を一日早く祝う人","body":"毎年一日早くケーキを買います。相手はもうそれを記念日だと思っています。","choices":["次の約束をしよう","素直に伝えてみよう","急がなくてもいいよ"],"ends":["翌週、記念日を一日早く祝う人から追伸が来た。\n「次の約束をしよう」を選んだことを伝えると、予定外の相手まで巻き込んだ。\n毎年一日早くケーキを買います――その話が、今度は別の意味で広まっている。一人だけ、まったく別の解釈をした。\n結局、本人が一番楽しそうだった。","雨が降った日、記念日を一日早く祝う人が、例の「毎年一日早くケーキを買います」について書いてきた。\n「素直に伝えてみよう」の返事をきっかけに、最初は笑ったが、試してみた。\n誰も予想していない方向に話が進んだ。\n封筒の裏には、小さな丸が一つ描かれていた。","日付のない追伸が届いた。記念日を一日早く祝う人が、例の「毎年一日早くケーキを買います」について書いてきた。\n「急がなくてもいいよ」の返事をきっかけに、最初は笑ったが、試してみた。\n周囲は納得したが、本人だけ納得していない。\n「たぶんこれでよかった」と短く締めくくられていた。"]}},{"ja":{"from":"差出人：恋文を郵便局で直す人","body":"投函する直前に一行足していたら、窓口の人が恋の進捗を聞いてきます。","choices":["素直に伝えてみよう","急がなくてもいいよ","次の約束をしよう"],"ends":["三日後、恋文を郵便局で直す人から二通目。\n「素直に伝えてみよう」を実行する前に、投函する直前に一行足していたら、窓口の人が恋の進捗を聞いてきますという話を思い出したらしい。\n思ったより真剣に受け取られた。なぜか関係ない人が一番喜んだ。\n封筒には、なぜか二枚目の切手が貼ってあった。","雨が降った日、恋文を郵便局で直す人から二通目。\n「急がなくてもいいよ」を実行する前に、投函する直前に一行足していたら、窓口の人が恋の進捗を聞いてきますという話を思い出したらしい。\n半信半疑で動いてみたらしい。結果より、その途中の顔が忘れられないらしい。\n次の手紙には、なぜか謝礼のつもりのシールが入っていた。","週末になって、恋文を郵便局で直す人から追伸が来た。\n「次の約束をしよう」を選んだことを伝えると、さっそく試してみたそうだ。\n投函する直前に一行足していたら、窓口の人が恋の進捗を聞いてきます――その話が、今度は別の意味で広まっている。なぜか小さな行列ができた。\n「たぶんこれでよかった」と短く締めくくられていた。"]},"en":{"from":"差出人：恋文を郵便局で直す人","body":"投函する直前に一行足していたら、窓口の人が恋の進捗を聞いてきます。","choices":["素直に伝えてみよう","急がなくてもいいよ","次の約束をしよう"],"ends":["三日後、恋文を郵便局で直す人から二通目。\n「素直に伝えてみよう」を実行する前に、投函する直前に一行足していたら、窓口の人が恋の進捗を聞いてきますという話を思い出したらしい。\n思ったより真剣に受け取られた。なぜか関係ない人が一番喜んだ。\n封筒には、なぜか二枚目の切手が貼ってあった。","雨が降った日、恋文を郵便局で直す人から二通目。\n「急がなくてもいいよ」を実行する前に、投函する直前に一行足していたら、窓口の人が恋の進捗を聞いてきますという話を思い出したらしい。\n半信半疑で動いてみたらしい。結果より、その途中の顔が忘れられないらしい。\n次の手紙には、なぜか謝礼のつもりのシールが入っていた。","週末になって、恋文を郵便局で直す人から追伸が来た。\n「次の約束をしよう」を選んだことを伝えると、さっそく試してみたそうだ。\n投函する直前に一行足していたら、窓口の人が恋の進捗を聞いてきます――その話が、今度は別の意味で広まっている。なぜか小さな行列ができた。\n「たぶんこれでよかった」と短く締めくくられていた。"]}},{"ja":{"from":"差出人：片思いの図書委員","body":"好きな人が借りる本を全部読んでいたら、読書感想文だけ上達しました。","choices":["急がなくてもいいよ","次の約束をしよう","素直に伝えてみよう"],"ends":["次の朝、片思いの図書委員が、例の「好きな人が借りる本を全部読んでいたら、読書感想文だけ上達しました」について書いてきた。\n「急がなくてもいいよ」の返事をきっかけに、返事を見て、予定を変更した。\nそれが新しい習慣になりそうだ。\n「たぶんこれでよかった」と短く締めくくられていた。","帰り道で、片思いの図書委員が報告してきた。\n「次の約束をしよう」という一言がきっかけで、思い切って口に出してみた。\n「好きな人が借りる本を全部読んでいたら、読書感想文だけ上達しました」と悩んでいた頃とは、少し様子が違う。なぜか関係ない人が一番喜んだ。\n最後の一行だけ、やけに字が大きかった。","日付のない追伸が届いた。片思いの図書委員から二通目。\n「素直に伝えてみよう」を実行する前に、好きな人が借りる本を全部読んでいたら、読書感想文だけ上達しましたという話を思い出したらしい。\n少しだけ勇気を出してみた。意外にも反対する人がいなかった。\n「これ、成功ってことでいいですか」と最後に書いてあった。"]},"en":{"from":"差出人：片思いの図書委員","body":"好きな人が借りる本を全部読んでいたら、読書感想文だけ上達しました。","choices":["急がなくてもいいよ","次の約束をしよう","素直に伝えてみよう"],"ends":["次の朝、片思いの図書委員が、例の「好きな人が借りる本を全部読んでいたら、読書感想文だけ上達しました」について書いてきた。\n「急がなくてもいいよ」の返事をきっかけに、返事を見て、予定を変更した。\nそれが新しい習慣になりそうだ。\n「たぶんこれでよかった」と短く締めくくられていた。","帰り道で、片思いの図書委員が報告してきた。\n「次の約束をしよう」という一言がきっかけで、思い切って口に出してみた。\n「好きな人が借りる本を全部読んでいたら、読書感想文だけ上達しました」と悩んでいた頃とは、少し様子が違う。なぜか関係ない人が一番喜んだ。\n最後の一行だけ、やけに字が大きかった。","日付のない追伸が届いた。片思いの図書委員から二通目。\n「素直に伝えてみよう」を実行する前に、好きな人が借りる本を全部読んでいたら、読書感想文だけ上達しましたという話を思い出したらしい。\n少しだけ勇気を出してみた。意外にも反対する人がいなかった。\n「これ、成功ってことでいいですか」と最後に書いてあった。"]}},{"ja":{"from":"差出人：初デートに弁当箱を持つ人","body":"緊張して空のお弁当箱を持参しました。何か入れて帰るべきですか。","choices":["次の約束をしよう","素直に伝えてみよう","急がなくてもいいよ"],"ends":["返事を出した翌朝、短い手紙が届いた。差出人は初デートに弁当箱を持つ人。\n「次の約束をしよう」と返したら、思ったより真剣に受け取られた。\n例の「緊張して空のお弁当箱を持参しました」の件は、意外にも反対する人がいなかった。\n「続きができたら、また書きます」で終わっていた。","帰り道で、初デートに弁当箱を持つ人から追伸が来た。\n「素直に伝えてみよう」を選んだことを伝えると、最初は笑ったが、試してみた。\n緊張して空のお弁当箱を持参しました――その話が、今度は別の意味で広まっている。その場では何も起きなかった。翌日になって効いてきた。\n「今度はあなたの話も聞かせて」と書き添えられていた。","返事を出した翌朝、封筒に初デートに弁当箱を持つ人の名前があった。\n「急がなくてもいいよ」の通りにするか迷った末、半信半疑で動いてみたらしい。\n緊張して空のお弁当箱を持参しました。そこから思いもしないことが起きた。なぜか小さな行列ができた。\n「誰にも内緒にしてください」と、しっかり赤字で書かれていた。"]},"en":{"from":"差出人：初デートに弁当箱を持つ人","body":"緊張して空のお弁当箱を持参しました。何か入れて帰るべきですか。","choices":["次の約束をしよう","素直に伝えてみよう","急がなくてもいいよ"],"ends":["返事を出した翌朝、短い手紙が届いた。差出人は初デートに弁当箱を持つ人。\n「次の約束をしよう」と返したら、思ったより真剣に受け取られた。\n例の「緊張して空のお弁当箱を持参しました」の件は、意外にも反対する人がいなかった。\n「続きができたら、また書きます」で終わっていた。","帰り道で、初デートに弁当箱を持つ人から追伸が来た。\n「素直に伝えてみよう」を選んだことを伝えると、最初は笑ったが、試してみた。\n緊張して空のお弁当箱を持参しました――その話が、今度は別の意味で広まっている。その場では何も起きなかった。翌日になって効いてきた。\n「今度はあなたの話も聞かせて」と書き添えられていた。","返事を出した翌朝、封筒に初デートに弁当箱を持つ人の名前があった。\n「急がなくてもいいよ」の通りにするか迷った末、半信半疑で動いてみたらしい。\n緊張して空のお弁当箱を持参しました。そこから思いもしないことが起きた。なぜか小さな行列ができた。\n「誰にも内緒にしてください」と、しっかり赤字で書かれていた。"]}},{"ja":{"from":"差出人：結婚式で泣けない親友","body":"感動しているのに涙が出ません。代わりに鼻歌が出てしまいます。","choices":["素直に伝えてみよう","急がなくてもいいよ","次の約束をしよう"],"ends":["その日の夕方、封筒に結婚式で泣けない親友の名前があった。\n「素直に伝えてみよう」の通りにするか迷った末、さっそく試してみたそうだ。\n感動しているのに涙が出ません。そこから思いもしないことが起きた。一人だけ、まったく別の解釈をした。\n次の手紙には、なぜか謝礼のつもりのシールが入っていた。","翌日の昼、短い手紙が届いた。差出人は結婚式で泣けない親友。\n「急がなくてもいいよ」と返したら、思い切って口に出してみた。\n例の「感動しているのに涙が出ません」の件は、いちばん驚いたのは本人だった。\n「誰にも内緒にしてください」と、しっかり赤字で書かれていた。","その夜、封筒に結婚式で泣けない親友の名前があった。\n「次の約束をしよう」の通りにするか迷った末、最初は笑ったが、試してみた。\n感動しているのに涙が出ません。そこから思いもしないことが起きた。一人だけ、まったく別の解釈をした。\n最後の一行だけ、やけに字が大きかった。"]},"en":{"from":"差出人：結婚式で泣けない親友","body":"感動しているのに涙が出ません。代わりに鼻歌が出てしまいます。","choices":["素直に伝えてみよう","急がなくてもいいよ","次の約束をしよう"],"ends":["その日の夕方、封筒に結婚式で泣けない親友の名前があった。\n「素直に伝えてみよう」の通りにするか迷った末、さっそく試してみたそうだ。\n感動しているのに涙が出ません。そこから思いもしないことが起きた。一人だけ、まったく別の解釈をした。\n次の手紙には、なぜか謝礼のつもりのシールが入っていた。","翌日の昼、短い手紙が届いた。差出人は結婚式で泣けない親友。\n「急がなくてもいいよ」と返したら、思い切って口に出してみた。\n例の「感動しているのに涙が出ません」の件は、いちばん驚いたのは本人だった。\n「誰にも内緒にしてください」と、しっかり赤字で書かれていた。","その夜、封筒に結婚式で泣けない親友の名前があった。\n「次の約束をしよう」の通りにするか迷った末、最初は笑ったが、試してみた。\n感動しているのに涙が出ません。そこから思いもしないことが起きた。一人だけ、まったく別の解釈をした。\n最後の一行だけ、やけに字が大きかった。"]}},{"ja":{"from":"差出人：毎回同じ喫茶店で別れる人","body":"三回続けて同じ席で別れ話をしました。店員さんに席替えをお願いすべきですか。","choices":["急がなくてもいいよ","次の約束をしよう","素直に伝えてみよう"],"ends":["その夜、短い手紙が届いた。差出人は毎回同じ喫茶店で別れる人。\n「急がなくてもいいよ」と返したら、まず紙に書き出してみた。\n例の「三回続けて同じ席で別れ話をしました」の件は、相手が先に謝ってきた。\n次の手紙には、なぜか謝礼のつもりのシールが入っていた。","週末になって、短い手紙が届いた。差出人は毎回同じ喫茶店で別れる人。\n「次の約束をしよう」と返したら、少しだけ勇気を出してみた。\n例の「三回続けて同じ席で別れ話をしました」の件は、なぜか小さな行列ができた。\n「たぶんこれでよかった」と短く締めくくられていた。","三日後、毎回同じ喫茶店で別れる人が、例の「三回続けて同じ席で別れ話をしました」について書いてきた。\n「素直に伝えてみよう」の返事をきっかけに、誰にも言わずに実行した。\n誰も予想していない方向に話が進んだ。\n「これ、成功ってことでいいですか」と最後に書いてあった。"]},"en":{"from":"差出人：毎回同じ喫茶店で別れる人","body":"三回続けて同じ席で別れ話をしました。店員さんに席替えをお願いすべきですか。","choices":["急がなくてもいいよ","次の約束をしよう","素直に伝えてみよう"],"ends":["その夜、短い手紙が届いた。差出人は毎回同じ喫茶店で別れる人。\n「急がなくてもいいよ」と返したら、まず紙に書き出してみた。\n例の「三回続けて同じ席で別れ話をしました」の件は、相手が先に謝ってきた。\n次の手紙には、なぜか謝礼のつもりのシールが入っていた。","週末になって、短い手紙が届いた。差出人は毎回同じ喫茶店で別れる人。\n「次の約束をしよう」と返したら、少しだけ勇気を出してみた。\n例の「三回続けて同じ席で別れ話をしました」の件は、なぜか小さな行列ができた。\n「たぶんこれでよかった」と短く締めくくられていた。","三日後、毎回同じ喫茶店で別れる人が、例の「三回続けて同じ席で別れ話をしました」について書いてきた。\n「素直に伝えてみよう」の返事をきっかけに、誰にも言わずに実行した。\n誰も予想していない方向に話が進んだ。\n「これ、成功ってことでいいですか」と最後に書いてあった。"]}},{"ja":{"from":"差出人：遠距離恋愛の時差係","body":"二人とも国内なのに、夜型と朝型で時差があります。時計を合わせたいです。","choices":["次の約束をしよう","素直に伝えてみよう","急がなくてもいいよ"],"ends":["週末になって、遠距離恋愛の時差係から追伸が来た。\n「次の約束をしよう」を選んだことを伝えると、少しだけ勇気を出してみた。\n二人とも国内なのに、夜型と朝型で時差があります――その話が、今度は別の意味で広まっている。返事を見せたら、別の相談が始まった。\nその後どうなったかは、まだ誰も知らない。","返事を出した翌朝、封筒に遠距離恋愛の時差係の名前があった。\n「素直に伝えてみよう」の通りにするか迷った末、少しだけ勇気を出してみた。\n二人とも国内なのに、夜型と朝型で時差があります。そこから思いもしないことが起きた。一人だけ、まったく別の解釈をした。\n封筒の裏には、小さな丸が一つ描かれていた。","次の月曜日、遠距離恋愛の時差係が報告してきた。\n「急がなくてもいいよ」という一言がきっかけで、誰にも言わずに実行した。\n「二人とも国内なのに、夜型と朝型で時差があります」と悩んでいた頃とは、少し様子が違う。その場では何も起きなかった。翌日になって効いてきた。\n「これ、成功ってことでいいですか」と最後に書いてあった。"]},"en":{"from":"差出人：遠距離恋愛の時差係","body":"二人とも国内なのに、夜型と朝型で時差があります。時計を合わせたいです。","choices":["次の約束をしよう","素直に伝えてみよう","急がなくてもいいよ"],"ends":["週末になって、遠距離恋愛の時差係から追伸が来た。\n「次の約束をしよう」を選んだことを伝えると、少しだけ勇気を出してみた。\n二人とも国内なのに、夜型と朝型で時差があります――その話が、今度は別の意味で広まっている。返事を見せたら、別の相談が始まった。\nその後どうなったかは、まだ誰も知らない。","返事を出した翌朝、封筒に遠距離恋愛の時差係の名前があった。\n「素直に伝えてみよう」の通りにするか迷った末、少しだけ勇気を出してみた。\n二人とも国内なのに、夜型と朝型で時差があります。そこから思いもしないことが起きた。一人だけ、まったく別の解釈をした。\n封筒の裏には、小さな丸が一つ描かれていた。","次の月曜日、遠距離恋愛の時差係が報告してきた。\n「急がなくてもいいよ」という一言がきっかけで、誰にも言わずに実行した。\n「二人とも国内なのに、夜型と朝型で時差があります」と悩んでいた頃とは、少し様子が違う。その場では何も起きなかった。翌日になって効いてきた。\n「これ、成功ってことでいいですか」と最後に書いてあった。"]}},{"ja":{"from":"差出人：散歩を短縮したい柴犬","body":"飼い主が一万歩を目指しています。私は角のパン屋で十分なんですが。","choices":["少し様子を見よう","好きな場所を守ろう","仲間に聞いてみよう"],"ends":["次の朝、封筒に散歩を短縮したい柴犬の名前があった。\n「少し様子を見よう」の通りにするか迷った末、少しだけ勇気を出してみた。\n飼い主が一万歩を目指しています。そこから思いもしないことが起きた。なぜか小さな行列ができた。\n「これ、成功ってことでいいですか」と最後に書いてあった。","帰り道で、散歩を短縮したい柴犬が報告してきた。\n「好きな場所を守ろう」という一言がきっかけで、一度はやめかけたが、結局実行した。\n「飼い主が一万歩を目指しています」と悩んでいた頃とは、少し様子が違う。相手が先に謝ってきた。\n追伸には「次は自分で決めてみます」とあった。","その日の夕方、散歩を短縮したい柴犬が、例の「飼い主が一万歩を目指しています」について書いてきた。\n「仲間に聞いてみよう」の返事をきっかけに、本当にその通りにしたらしい。\n誰も予想していない方向に話が進んだ。\n追伸には「次は自分で決めてみます」とあった。"]},"en":{"from":"差出人：散歩を短縮したい柴犬","body":"飼い主が一万歩を目指しています。私は角のパン屋で十分なんですが。","choices":["少し様子を見よう","好きな場所を守ろう","仲間に聞いてみよう"],"ends":["次の朝、封筒に散歩を短縮したい柴犬の名前があった。\n「少し様子を見よう」の通りにするか迷った末、少しだけ勇気を出してみた。\n飼い主が一万歩を目指しています。そこから思いもしないことが起きた。なぜか小さな行列ができた。\n「これ、成功ってことでいいですか」と最後に書いてあった。","帰り道で、散歩を短縮したい柴犬が報告してきた。\n「好きな場所を守ろう」という一言がきっかけで、一度はやめかけたが、結局実行した。\n「飼い主が一万歩を目指しています」と悩んでいた頃とは、少し様子が違う。相手が先に謝ってきた。\n追伸には「次は自分で決めてみます」とあった。","その日の夕方、散歩を短縮したい柴犬が、例の「飼い主が一万歩を目指しています」について書いてきた。\n「仲間に聞いてみよう」の返事をきっかけに、本当にその通りにしたらしい。\n誰も予想していない方向に話が進んだ。\n追伸には「次は自分で決めてみます」とあった。"]}},{"ja":{"from":"差出人：猫に席を譲る父","body":"家のソファに座れるのが猫の外出中だけです。家賃は私が払っています。","choices":["好きな場所を守ろう","仲間に聞いてみよう","少し様子を見よう"],"ends":["返事を出した翌朝、猫に席を譲る父から二通目。\n「好きな場所を守ろう」を実行する前に、家のソファに座れるのが猫の外出中だけですという話を思い出したらしい。\n半信半疑で動いてみたらしい。ところが、話を聞いていた人のほうが先に動いた。\n「たぶんこれでよかった」と短く締めくくられていた。","帰り道で、猫に席を譲る父から追伸が来た。\n「仲間に聞いてみよう」を選んだことを伝えると、半信半疑で動いてみたらしい。\n家のソファに座れるのが猫の外出中だけです――その話が、今度は別の意味で広まっている。その場では何も起きなかった。翌日になって効いてきた。\n「これ、成功ってことでいいですか」と最後に書いてあった。","次の朝、猫に席を譲る父から二通目。\n「少し様子を見よう」を実行する前に、家のソファに座れるのが猫の外出中だけですという話を思い出したらしい。\n思い切って口に出してみた。結果より、その途中の顔が忘れられないらしい。\n「たぶんこれでよかった」と短く締めくくられていた。"]},"en":{"from":"差出人：猫に席を譲る父","body":"家のソファに座れるのが猫の外出中だけです。家賃は私が払っています。","choices":["好きな場所を守ろう","仲間に聞いてみよう","少し様子を見よう"],"ends":["返事を出した翌朝、猫に席を譲る父から二通目。\n「好きな場所を守ろう」を実行する前に、家のソファに座れるのが猫の外出中だけですという話を思い出したらしい。\n半信半疑で動いてみたらしい。ところが、話を聞いていた人のほうが先に動いた。\n「たぶんこれでよかった」と短く締めくくられていた。","帰り道で、猫に席を譲る父から追伸が来た。\n「仲間に聞いてみよう」を選んだことを伝えると、半信半疑で動いてみたらしい。\n家のソファに座れるのが猫の外出中だけです――その話が、今度は別の意味で広まっている。その場では何も起きなかった。翌日になって効いてきた。\n「これ、成功ってことでいいですか」と最後に書いてあった。","次の朝、猫に席を譲る父から二通目。\n「少し様子を見よう」を実行する前に、家のソファに座れるのが猫の外出中だけですという話を思い出したらしい。\n思い切って口に出してみた。結果より、その途中の顔が忘れられないらしい。\n「たぶんこれでよかった」と短く締めくくられていた。"]}},{"ja":{"from":"差出人：水槽の隅が好きな金魚","body":"新しい城の飾りを入れられました。私は昔の石の陰が好きなんです。","choices":["仲間に聞いてみよう","少し様子を見よう","好きな場所を守ろう"],"ends":["しばらくして、封筒に水槽の隅が好きな金魚の名前があった。\n「仲間に聞いてみよう」の通りにするか迷った末、本当にその通りにしたらしい。\n新しい城の飾りを入れられました。そこから思いもしないことが起きた。それが新しい習慣になりそうだ。\n「これ、成功ってことでいいですか」と最後に書いてあった。","翌日の昼、水槽の隅が好きな金魚から追伸が来た。\n「少し様子を見よう」を選んだことを伝えると、さっそく試してみたそうだ。\n新しい城の飾りを入れられました――その話が、今度は別の意味で広まっている。それが新しい習慣になりそうだ。\n最後の一行だけ、やけに字が大きかった。","翌週、封筒に水槽の隅が好きな金魚の名前があった。\n「好きな場所を守ろう」の通りにするか迷った末、本当にその通りにしたらしい。\n新しい城の飾りを入れられました。そこから思いもしないことが起きた。周囲は納得したが、本人だけ納得していない。\n「今度はあなたの話も聞かせて」と書き添えられていた。"]},"en":{"from":"差出人：水槽の隅が好きな金魚","body":"新しい城の飾りを入れられました。私は昔の石の陰が好きなんです。","choices":["仲間に聞いてみよう","少し様子を見よう","好きな場所を守ろう"],"ends":["しばらくして、封筒に水槽の隅が好きな金魚の名前があった。\n「仲間に聞いてみよう」の通りにするか迷った末、本当にその通りにしたらしい。\n新しい城の飾りを入れられました。そこから思いもしないことが起きた。それが新しい習慣になりそうだ。\n「これ、成功ってことでいいですか」と最後に書いてあった。","翌日の昼、水槽の隅が好きな金魚から追伸が来た。\n「少し様子を見よう」を選んだことを伝えると、さっそく試してみたそうだ。\n新しい城の飾りを入れられました――その話が、今度は別の意味で広まっている。それが新しい習慣になりそうだ。\n最後の一行だけ、やけに字が大きかった。","翌週、封筒に水槽の隅が好きな金魚の名前があった。\n「好きな場所を守ろう」の通りにするか迷った末、本当にその通りにしたらしい。\n新しい城の飾りを入れられました。そこから思いもしないことが起きた。周囲は納得したが、本人だけ納得していない。\n「今度はあなたの話も聞かせて」と書き添えられていた。"]}},{"ja":{"from":"差出人：昼寝を教えるナマケモノ","body":"生徒の人間が五分でスマホを見ます。授業料を返すべきでしょうか。","choices":["少し様子を見よう","好きな場所を守ろう","仲間に聞いてみよう"],"ends":["その夜、昼寝を教えるナマケモノから二通目。\n「少し様子を見よう」を実行する前に、生徒の人間が五分でスマホを見ますという話を思い出したらしい。\n誰にも言わずに実行した。なぜか小さな行列ができた。\n最後の一行だけ、やけに字が大きかった。","その夜、昼寝を教えるナマケモノが報告してきた。\n「好きな場所を守ろう」という一言がきっかけで、少しだけ勇気を出してみた。\n「生徒の人間が五分でスマホを見ます」と悩んでいた頃とは、少し様子が違う。返事を見せたら、別の相談が始まった。\n「今度はあなたの話も聞かせて」と書き添えられていた。","日付のない追伸が届いた。昼寝を教えるナマケモノが報告してきた。\n「仲間に聞いてみよう」という一言がきっかけで、誰にも言わずに実行した。\n「生徒の人間が五分でスマホを見ます」と悩んでいた頃とは、少し様子が違う。一人だけ、まったく別の解釈をした。\n「これ、成功ってことでいいですか」と最後に書いてあった。"]},"en":{"from":"差出人：昼寝を教えるナマケモノ","body":"生徒の人間が五分でスマホを見ます。授業料を返すべきでしょうか。","choices":["少し様子を見よう","好きな場所を守ろう","仲間に聞いてみよう"],"ends":["その夜、昼
