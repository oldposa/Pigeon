<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffffff"><title>なんか届いた。 | Pigeon</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif;color:#111e3d;background:#fff}*{box-sizing:border-box}body{margin:0;min-height:100dvh}button,textarea{font:inherit}button{cursor:pointer}button:focus-visible,textarea:focus-visible{outline:2px solid #12306d;outline-offset:3px}.app{width:min(100%,460px);min-height:100dvh;margin:auto;padding:env(safe-area-inset-top) 22px env(safe-area-inset-bottom);display:flex;flex-direction:column;gap:0}header{min-height:76px;width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px}header strong{font-size:14px;letter-spacing:.01em;font-weight:750;color:#0b2357}header>div{display:flex;gap:7px;white-space:nowrap}.toggle{border:1px solid #e4e9f0;background:white;border-radius:30px;padding:9px 12px;color:#23375b;font-size:12px;font-weight:650}#home{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;padding:0 0 34px;text-align:center;width:100%}.bird-button{display:block;border:0;background:transparent;padding:0;width:min(76vw,306px);aspect-ratio:1;transition:transform .2s}.bird-button:active{transform:scale(.96)}.bird{display:block;width:100%;height:100%;object-fit:contain}h1{font-size:clamp(27px,7vw,34px);font-weight:800;letter-spacing:-.045em;line-height:1.35;margin:10px 0 12px}.hint{color:#66748b;font-size:14px;line-height:1.7;text-align:center;margin:0}.tiny{font-size:11px;color:#97a1b0;margin:14px 0 0}#shareHint{margin-top:5px}.panel{width:100%;background:white;border:1px solid #e8edf2;border-radius:20px;padding:25px 20px;margin:26px 0 18px;box-shadow:0 8px 30px #17294d08}.sender{color:#77869a;font-size:12px;margin-bottom:14px}.letter{font-size:17px;white-space:pre-line;line-height:2}.choices{display:grid;gap:10px;margin-top:24px}.choice,.primary,.secondary{width:100%;border-radius:13px;padding:15px 13px;font-weight:650}.choice{border:1px solid #e8edf2;background:#f6f8fb;color:#1b3057;text-align:left}.primary{background:#0b2459;color:white;border:1px solid #0b2459}.secondary{background:white;color:#17315e;border:1px solid #e1e7ee}.actions{display:grid;gap:9px;margin-top:18px}textarea{width:100%;border:1px solid #dce3eb;border-radius:12px;padding:13px;min-height:100px;resize:vertical}footer{font-size:11px;color:#a2aab6;text-align:center;padding:12px 0 24px}.hidden{display:none!important}.ending{font-size:17px;line-height:2;white-space:pre-line}#status{min-height:20px;font-size:12px;color:#64748b;text-align:center}@media(max-height:650px){header{min-height:58px}.bird-button{width:min(55vh,230px)}#home{padding-bottom:10px}}@media(prefers-reduced-motion:reduce){.bird-button{transition:none}}
</style><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Pigeon"><meta name="description" content="鳩から届く、ちょっと変な手紙。選んだ答えで結末が変わる。"></head><body><main class="app"><header><strong id="brand">なんか届いた。</strong><div><button class="toggle" id="lang">EN</button> <button class="toggle" id="sound">🔊 ON</button></div></header><section id="home" style="text-align:center;width:100%"><button class="bird-button" id="birdButton" aria-label="手紙を開ける"><img class="bird" src="pigeon-logo.png" alt="封筒をくわえて右へ飛ぶ鳩"></button><h1 id="headline">なんか届いた。</h1><p class="hint" id="tagline">鳩をタップして、手紙を開けよう。</p><p class="tiny" id="count"></p><p class="tiny" id="shareHint"></p></section><section id="panel" class="panel hidden" aria-live="polite"><div class="sender" id="sender"></div><div id="letter" class="letter"></div><div id="choices" class="choices"></div><div id="ending" class="ending hidden"></div><div id="replyArea" class="hidden"><p id="replyLabel" style="margin:18px 0 10px"></p><textarea id="reply" maxlength="500" placeholder=""></textarea><div class="actions"><button class="primary" id="send"></button><button class="secondary" id="skip"></button></div></div><div id="finish" class="hidden"><p id="finishText" style="margin-top:20px"></p><div class="actions"><button class="primary" id="next"></button></div></div><div class="actions hidden" id="shareActions"><button class="secondary" id="shareLetter">💌 この手紙を友達に届ける</button><button class="secondary" id="copyLetter">🔗 リンクをコピー</button></div><div class="actions hidden" id="endingActions"><button class="primary" id="write"></button><button class="secondary" id="noReply"></button></div></section><div id="status" aria-live="polite"></div><footer id="footer">Pigeon · a tiny surprise, delivered.</footer></main><script>
const stories=[
{ja:{from:'差出人：月',body:'地球のみなさんへ。\n夜勤を辞めたいです。\nもう46億年くらい働いています。',choices:['有給とりなよ','太陽に相談して','じゃあ私が光るわ'],ends:['月は有給を取った。翌晩、空には「本日休業」の札。星たちが代打を断り、夜空がちょっと気まずくなった。','太陽から返事が来た。「こっちも日勤がきつい」。翌日から空は交代制になり、午前3時に朝礼が始まった。','月は感動した。「ありがとう。でも電気代は大丈夫？」あなたは静かにカーテンを閉めた。']},en:{from:'From: The Moon',body:'Dear Earth,\nI would like to quit the night shift.\nI have been doing this for roughly 4.6 billion years.',choices:['Take a vacation.','Ask the Sun.','I can glow instead.'],ends:['The Moon took a day off. A sign appeared in the sky: CLOSED TONIGHT. The stars refused to cover the shift.','The Sun replied: “Day shifts are exhausting too.” The sky now holds staff meetings at 3 a.m.','The Moon was touched. “Thank you. But can you afford the electricity?” You quietly closed the curtains.']}},
{ja:{from:'差出人：未来のあなたの靴下',body:'緊急です。\n洗濯機の中に異世界への入口を発見しました。\n片方だけ先に入っています。',choices:['救助隊を送る','もう片方も行かせる','現地の写真を頼む'],ends:['救助隊としてハンカチを送った。翌朝、洗濯機から小さな国旗が出てきた。国名は「モケモケ共和国」。','もう片方も旅立った。二日後、なぜか左右が逆になって帰ってきた。本人たちは「留学の成果」と言い張る。','届いた写真には、巨大な洗剤の滝と、王冠をかぶった靴下。裏には「帰る気はありません」と書かれていた。']},en:{from:'From: Your Future Sock',body:'Emergency.\nI found a portal to another world inside the washing machine.\nMy other half has already gone in.',choices:['Send a rescue team.','Send the other sock too.','Ask for photos.'],ends:['You sent a handkerchief rescue team. The next morning, a tiny flag emerged: THE FLUFF REPUBLIC.','The other sock followed. Two days later, both returned on the wrong feet. They called it “studying abroad.”','The photo showed a detergent waterfall and a sock wearing a crown. On the back: “Not coming home.”']}},
{ja:{from:'差出人：未来の黒歴史',body:'先に謝っておきます。\n7年後、あなたは今日のことを思い出して布団の中で叫びます。\n今のうちに対策しますか？',choices:['何が起きるか教えて','7年後の私に任せる','黒歴史にも有給を'],ends:['「7年後、あなたはこの手紙を友達に音読します」。防ごうとしてスクショした瞬間、誤送信した。','7年後のあなたからメッセージ。「おい、なんで俺に丸投げした」。8年後のあなたも既読をつけた。','黒歴史たちはハワイへ旅立った。空港の入国審査で昔の恥ずかしい発言を読み上げられ、全員帰国した。']},en:{from:'From: Your Future Embarrassment',body:'An apology in advance.\nSeven years from now, you will remember this day and scream into your pillow.\nWould you like to prepare?',choices:['Tell me what happens.','Let future me handle it.','Give embarrassment a vacation.'],ends:['“In seven years you will read this letter aloud to your friends.” You took a screenshot to prevent it and accidentally sent it to the group chat.','Future you texted: “WHY DID YOU LEAVE THIS TO ME?” Eight-years-from-now you left it on read.','Your embarrassing memories flew to Hawaii. Airport security read their old quotes aloud. They all flew home.']}},
{ja:{from:'差出人：街角の自動販売機',body:'ご相談です。\n今日、お釣りを渡すときに少しだけ勇気も入れてみました。\n気づいてもらえたでしょうか。',choices:['ありがとう、助かった','勇気は何円？','次は希望も入れて'],ends:['自販機は嬉しくなって、次の人に「あったかい」を二回点灯した。誰も気づかなかったけど、少し誇らしかった。','「非売品です。ただし、お釣りの10円玉にくっつきやすいです」。財布の中で小さくチャリンと鳴った。','翌日、缶の底に「なんとかなる」の文字。飲み終えるころには消えていたけれど、あなたは少し笑った。']},en:{from:'From: A Vending Machine',body:'A quick question.\nToday I slipped a little courage in with someone’s change.\nDo you think they noticed?',choices:['Thanks. I needed that.','How much is courage?','Add some hope next time.'],ends:['The machine lit up the HOT button twice out of joy. Nobody noticed. It felt proud anyway.','“Not for sale. It does tend to stick to ten-cent coins.” Something chimed softly in your pocket.','Tomorrow, the bottom of your can said YOU’LL BE OKAY. The words vanished by the last sip. You smiled anyway.']}}
];
const el=id=>document.getElementById(id);let language=localStorage.getItem('pigeon-lang')||'ja',sound=localStorage.getItem('pigeon-sound')!=='off',idx=-1,current=null,choice=-1,audioCtx=null,musicTimer=null,playing=false;let lastStory=-1;const t=(ja,en)=>language==='ja'?ja:en;
function ui(){document.documentElement.lang=language;el('brand').textContent=t('なんか届いた。','Pigeon');el('headline').textContent=t('なんか届いた。','Pigeon');el('tagline').textContent=t('鳩をタップして、手紙を開けよう。','Tap the pigeon to open a letter.');el('lang').textContent=language==='ja'?'EN':'日本語';el('sound').textContent=sound?'🔊 ON':'🔇 OFF';el('replyLabel').textContent=t('最後に、お返事を書く？','Want to write back?');el('reply').placeholder=t('なんでもどうぞ。笑','Anything you want.');el('send').textContent=t('🕊️ 送る','🕊️ Send');el('skip').textContent=t('やめておく','Skip');el('write').textContent=t('✍️ お返事を書く','✍️ Write back');el('noReply').textContent=t('このまま終わる','Finish here');el('next').textContent=t('🕊️ 次の手紙','🕊️ Next letter');el('count').textContent=t('公開準備版：5通の独立したお話','Release preview: 5 independent stories');el('shareHint').textContent=t('気に入った手紙は友達にも届けられるよ。','Deliver a favorite letter to a friend.');el('shareLetter').textContent=t('💌 この手紙を友達に届ける','💌 Deliver this letter to a friend');el('copyLetter').textContent=t('🔗 リンクをコピー','🔗 Copy letter link');if(current)renderLetter();}
function stopSpeech(){if('speechSynthesis' in window) speechSynthesis.cancel()}
function speak(str){if(!sound||!('speechSynthesis' in window))return;stopSpeech();const u=new SpeechSynthesisUtterance(str);u.lang=language==='ja'?'ja-JP':'en-US';const voices=speechSynthesis.getVoices();const preferred=voices.filter(v=>v.lang.toLowerCase().startsWith(language==='ja'?'ja':'en')).sort((a,b)=>{const score=v=>(v.localService?1:0)+(language==='en'&&/premium|enhanced|natural|samantha|ava|daniel|alex|serena/i.test(v.name)?3:0);return score(b)-score(a)});if(preferred.length)u.voice=preferred[0];u.rate=language==='ja'?.91:.96;u.pitch=1.0;u.volume=1;speechSynthesis.speak(u)}
function musicStart(){if(!sound||playing)return;try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();audioCtx.resume();playing=true;let n=0;function note(){if(!playing)return;const freqs=[261.63,329.63,392,329.63,293.66,349.23,440,349.23];const osc=audioCtx.createOscillator(),gain=audioCtx.createGain();osc.type='sine';osc.frequency.value=freqs[n++%freqs.length];gain.gain.setValueAtTime(.0001,audioCtx.currentTime);gain.gain.exponentialRampToValueAtTime(.012,audioCtx.currentTime+.05);gain.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+.45);osc.connect(gain).connect(audioCtx.destination);osc.start();osc.stop(audioCtx.currentTime+.5)}note();musicTimer=setInterval(note,660)}catch(e){el('status').textContent=t('この端末ではBGMを再生できませんでした。','Background music is unavailable on this device.')}}
function musicStop(){playing=false;clearInterval(musicTimer)}
function hide(...ids){ids.forEach(id=>el(id).classList.add('hidden'))}function show(...ids){ids.forEach(id=>el(id).classList.remove('hidden'))}
function newLetter(){stopSpeech();if(idx<0)idx=Math.floor(Math.random()*stories.length);else idx=(idx+1+Math.floor(Math.random()*(stories.length-1)))%stories.length;current=stories[idx];choice=-1;el('home').classList.add('hidden');show('panel');renderLetter();musicStart()}
function renderLetter(){const s=current[language];el('sender').textContent=s.from;el('letter').textContent=s.body;show('letter','choices');hide('ending','endingActions','replyArea','finish');show('shareActions');el('choices').replaceChildren();s.choices.forEach((c,i)=>{let b=document.createElement('button');b.className='choice';b.textContent=(i+1)+'. '+c;b.onclick=()=>end(i);el('choices').appendChild(b)});speak(s.body)}
function end(i){choice=i;hide('choices');show('ending','endingActions');el('ending').textContent=current[language].ends[i];speak(current[language].ends[i])}
function write(){hide('endingActions');show('replyArea');el('reply').focus()}
function letterUrl(){const url=new URL(location.href);url.searchParams.set('letter',String(idx+1));url.hash='';return url.toString()}async function shareLetter(){const s=current[language];const text=s.from+'\n'+s.body+'\n\n'+t('続きは鳩から届くよ 🕊️','Open the letter 🕊️');const url=letterUrl();try{if(navigator.share){await navigator.share({title:t('なんか届いた。','Pigeon'),text,url});return}}catch(e){if(e.name==='AbortError')return}await copyLetter()}async function copyLetter(){const url=letterUrl();try{await navigator.clipboard.writeText(url);el('status').textContent=t('リンクをコピーしたよ！友達に送ってね 🕊️','Link copied! Send it to a friend 🕊️')}catch(e){prompt(t('このリンクをコピーしてね','Copy this link'),url)}}function finish(sent){hide('replyArea','endingActions');show('finish');el('finishText').textContent=sent?t('お返事、届けました。クルッポー。','Delivered. Coo-coo!'):t('鳩は静かに飛んでいった。','The pigeon flew away quietly.');stopSpeech();if(sent)speak(el('finishText').textContent)}
el('shareLetter').onclick=shareLetter;el('copyLetter').onclick=copyLetter;el('birdButton').onclick=newLetter;el('write').onclick=write;el('noReply').onclick=()=>finish(false);el('send').onclick=()=>{if(!el('reply').value.trim())return;el('reply').value='';finish(true)};el('skip').onclick=()=>finish(false);el('next').onclick=newLetter;el('lang').onclick=()=>{language=language==='ja'?'en':'ja';localStorage.setItem('pigeon-lang',language);stopSpeech();ui()};el('sound').onclick=()=>{sound=!sound;localStorage.setItem('pigeon-sound',sound?'on':'off');if(!sound){stopSpeech();musicStop()}else{musicStart();if(current)speak(choice<0?current[language].body:current[language].ends[choice])}ui()};window.addEventListener('pagehide',()=>{stopSpeech();musicStop()});ui();const shared=new URL(location.href).searchParams.get('letter');if(shared&&/^\d+$/.test(shared)&&Number(shared)>=1&&Number(shared)<=stories.length){idx=Number(shared)-1;current=stories[idx];hide('home');show('panel');renderLetter();el('status').textContent=t('友達から手紙が届いたよ 🕊️','A friend sent you a letter 🕊️')}
</script></body></html>
