<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#dff2ff"><title>なんか届いた。 | Pigeon</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN',sans-serif;color:#24384a;background:#dff2ff}*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center}.app{width:min(100%,440px);min-height:100dvh;padding:24px 22px 36px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px}header{width:100%;display:flex;justify-content:space-between;align-items:center;font-size:13px;color:#526b7b}header strong{font-size:18px;color:#253e53}button{font:inherit;cursor:pointer}button:focus-visible,textarea:focus-visible{outline:3px solid #268ad4;outline-offset:3px}.toggle{border:0;background:#ffffff9c;border-radius:40px;padding:9px 13px;color:#39566a}.bird{width:min(78vw,290px);display:block;filter:drop-shadow(0 12px 12px #73a6c633);transition:transform .25s}.bird:hover{transform:translateY(-5px)}.bird-button{border:0;background:none;padding:0}.bird-button:active .bird{transform:translateY(3px)}h1{font-size:27px;letter-spacing:.04em;margin:0;text-align:center}p{line-height:1.8;margin:0}.hint{color:#577487;font-size:14px;text-align:center}.panel{width:100%;background:#fff;border-radius:24px;padding:24px 21px;box-shadow:0 12px 36px #5a9cc322}.sender{color:#738696;font-size:12px;margin-bottom:10px}.letter{font-size:17px;white-space:pre-line;line-height:1.95}.choices{display:grid;gap:10px;margin-top:22px}.choice,.primary,.secondary{width:100%;border-radius:16px;padding:15px 12px;border:0;font-weight:650}.choice{background:#e9f5ff;color:#244f72;text-align:left}.choice:hover{background:#d4eafa}.primary{background:#238ad2;color:white}.secondary{background:#f0f4f7;color:#466074}.actions{display:grid;gap:9px;margin-top:20px}textarea{width:100%;border:2px solid #dce9f2;border-radius:14px;padding:13px;min-height:100px;font:inherit;resize:vertical}footer{font-size:11px;color:#678398;text-align:center}.hidden{display:none!important}.tiny{font-size:12px;color:#6b8596;margin-top:10px}.ending{font-size:18px;line-height:1.95;white-space:pre-line}#status{min-height:18px;font-size:12px;color:#577487;text-align:center}@media(prefers-reduced-motion:reduce){.bird{transition:none}}
</style></head><body><main class="app"><header><strong id="brand">なんか届いた。</strong><div><button class="toggle" id="lang">EN</button> <button class="toggle" id="sound">🔊 ON</button></div></header><section id="home" style="text-align:center;width:100%"><button class="bird-button" id="birdButton" aria-label="手紙を開ける"><svg class="bird" viewBox="0 0 320 310" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="封筒をくわえた白い鳩"><ellipse cx="157" cy="287" rx="105" ry="12" fill="#91bdd6" opacity=".25"/><path d="M88 178Q29 153 40 94Q79 115 105 140" fill="#fff" stroke="#376f9b" stroke-width="5" stroke-linejoin="round"/><path d="M98 185Q34 192 33 139Q73 156 112 155" fill="#f1faff" stroke="#376f9b" stroke-width="5"/><path d="M98 210Q62 230 80 255Q117 244 131 224" fill="#f5fbff" stroke="#376f9b" stroke-width="5"/><ellipse cx="159" cy="179" rx="95" ry="83" fill="white" stroke="#376f9b" stroke-width="5"/><path d="M127 160Q144 116 201 141Q210 196 152 215Q116 206 127 160" fill="#d8efff" stroke="#376f9b" stroke-width="4"/><path d="M200 117Q196 64 244 55Q286 51 293 93Q297 131 260 151L233 169" fill="white" stroke="#376f9b" stroke-width="5"/><circle cx="266" cy="93" r="7" fill="#243d50"/><circle cx="269" cy="90" r="2" fill="white"/><path d="M289 109L317 117L287 129Z" fill="#f2a34e" stroke="#376f9b" stroke-width="3" stroke-linejoin="round"/><path d="M299 126L316 138L297 141Z" fill="#e88d4b" stroke="#376f9b" stroke-width="2"/><g transform="translate(259 136) rotate(13)"><rect x="0" y="0" width="49" height="34" rx="3" fill="#fff1d5" stroke="#bc9777" stroke-width="2"/><path d="M1 2L25 20L48 2" fill="none" stroke="#bc9777" stroke-width="2"/><circle cx="26" cy="20" r="4" fill="#e97d7d"/></g><path d="M144 253L140 273M176 255L180 274M128 274L150 274M169 275L191 275" stroke="#e49c55" stroke-width="5" stroke-linecap="round"/></svg></button><h1 id="headline">なんか届いた。</h1><p class="hint" id="tagline">鳩をタップして、手紙を開けよう。</p><p class="tiny" id="count"></p></section><section id="panel" class="panel hidden" aria-live="polite"><div class="sender" id="sender"></div><div id="letter" class="letter"></div><div id="choices" class="choices"></div><div id="ending" class="ending hidden"></div><div id="replyArea" class="hidden"><p id="replyLabel" style="margin:18px 0 10px"></p><textarea id="reply" maxlength="500" placeholder=""></textarea><div class="actions"><button class="primary" id="send"></button><button class="secondary" id="skip"></button></div></div><div id="finish" class="hidden"><p id="finishText" style="margin-top:20px"></p><div class="actions"><button class="primary" id="next"></button></div></div><div class="actions hidden" id="endingActions"><button class="primary" id="write"></button><button class="secondary" id="noReply"></button></div></section><div id="status" aria-live="polite"></div><footer id="footer">Pigeon · a tiny surprise, delivered.</footer></main><script>
const stories=[
{ja:{from:'差出人：月',body:'地球のみなさんへ。\n夜勤を辞めたいです。\nもう46億年くらい働いています。',choices:['有給とりなよ','太陽に相談して','じゃあ私が光るわ'],ends:['月は有給を取った。翌晩、空には「本日休業」の札。星たちが代打を断り、夜空がちょっと気まずくなった。','太陽から返事が来た。「こっちも日勤がきつい」。翌日から空は交代制になり、午前3時に朝礼が始まった。','月は感動した。「ありがとう。でも電気代は大丈夫？」あなたは静かにカーテンを閉めた。']},en:{from:'From: The Moon',body:'Dear Earth,\nI would like to quit the night shift.\nI have been doing this for roughly 4.6 billion years.',choices:['Take a vacation.','Ask the Sun.','I can glow instead.'],ends:['The Moon took a day off. A sign appeared in the sky: CLOSED TONIGHT. The stars refused to cover the shift.','The Sun replied: “Day shifts are exhausting too.” The sky now holds staff meetings at 3 a.m.','The Moon was touched. “Thank you. But can you afford the electricity?” You quietly closed the curtains.']}},
{ja:{from:'差出人：未来のあなたの靴下',body:'緊急です。\n洗濯機の中に異世界への入口を発見しました。\n片方だけ先に入っています。',choices:['救助隊を送る','もう片方も行かせる','現地の写真を頼む'],ends:['救助隊としてハンカチを送った。翌朝、洗濯機から小さな国旗が出てきた。国名は「モケモケ共和国」。','もう片方も旅立った。二日後、なぜか左右が逆になって帰ってきた。本人たちは「留学の成果」と言い張る。','届いた写真には、巨大な洗剤の滝と、王冠をかぶった靴下。裏には「帰る気はありません」と書かれていた。']},en:{from:'From: Your Future Sock',body:'Emergency.\nI found a portal to another world inside the washing machine.\nMy other half has already gone in.',choices:['Send a rescue team.','Send the other sock too.','Ask for photos.'],ends:['You sent a handkerchief rescue team. The next morning, a tiny flag emerged: THE FLUFF REPUBLIC.','The other sock followed. Two days later, both returned on the wrong feet. They called it “studying abroad.”','The photo showed a detergent waterfall and a sock wearing a crown. On the back: “Not coming home.”']}},
{ja:{from:'差出人：未来の黒歴史',body:'先に謝っておきます。\n7年後、あなたは今日のことを思い出して布団の中で叫びます。\n今のうちに対策しますか？',choices:['何が起きるか教えて','7年後の私に任せる','黒歴史にも有給を'],ends:['「7年後、あなたはこの手紙を友達に音読します」。防ごうとしてスクショした瞬間、誤送信した。','7年後のあなたからメッセージ。「おい、なんで俺に丸投げした」。8年後のあなたも既読をつけた。','黒歴史たちはハワイへ旅立った。空港の入国審査で昔の恥ずかしい発言を読み上げられ、全員帰国した。']},en:{from:'From: Your Future Embarrassment',body:'An apology in advance.\nSeven years from now, you will remember this day and scream into your pillow.\nWould you like to prepare?',choices:['Tell me what happens.','Let future me handle it.','Give embarrassment a vacation.'],ends:['“In seven years you will read this letter aloud to your friends.” You took a screenshot to prevent it and accidentally sent it to the group chat.','Future you texted: “WHY DID YOU LEAVE THIS TO ME?” Eight-years-from-now you left it on read.','Your embarrassing memories flew to Hawaii. Airport security read their old quotes aloud. They all flew home.']}},
{ja:{from:'差出人：街角の自動販売機',body:'ご相談です。\n今日、お釣りを渡すときに少しだけ勇気も入れてみました。\n気づいてもらえたでしょうか。',choices:['ありがとう、助かった','勇気は何円？','次は希望も入れて'],ends:['自販機は嬉しくなって、次の人に「あったかい」を二回点灯した。誰も気づかなかったけど、少し誇らしかった。','「非売品です。ただし、お釣りの10円玉にくっつきやすいです」。財布の中で小さくチャリンと鳴った。','翌日、缶の底に「なんとかなる」の文字。飲み終えるころには消えていたけれど、あなたは少し笑った。']},en:{from:'From: A Vending Machine',body:'A quick question.\nToday I slipped a little courage in with someone’s change.\nDo you think they noticed?',choices:['Thanks. I needed that.','How much is courage?','Add some hope next time.'],ends:['The machine lit up the HOT button twice out of joy. Nobody noticed. It felt proud anyway.','“Not for sale. It does tend to stick to ten-cent coins.” Something chimed softly in your pocket.','Tomorrow, the bottom of your can said YOU’LL BE OKAY. The words vanished by the last sip. You smiled anyway.']}}
];
const el=id=>document.getElementById(id);let language=localStorage.getItem('pigeon-lang')||'ja',sound=localStorage.getItem('pigeon-sound')!=='off',idx=-1,current=null,choice=-1,audioCtx=null,musicTimer=null,playing=false;const t=(ja,en)=>language==='ja'?ja:en;
function ui(){document.documentElement.lang=language;el('brand').textContent=t('なんか届いた。','Pigeon');el('headline').textContent=t('なんか届いた。','Pigeon');el('tagline').textContent=t('鳩をタップして、手紙を開けよう。','Tap the pigeon to open a letter.');el('lang').textContent=language==='ja'?'EN':'日本語';el('sound').textContent=sound?'🔊 ON':'🔇 OFF';el('replyLabel').textContent=t('最後に、お返事を書く？','Want to write back?');el('reply').placeholder=t('なんでもどうぞ。笑','Anything you want.');el('send').textContent=t('🕊️ 送る','🕊️ Send');el('skip').textContent=t('やめておく','Skip');el('write').textContent=t('✍️ お返事を書く','✍️ Write back');el('noReply').textContent=t('このまま終わる','Finish here');el('next').textContent=t('🕊️ 次の手紙','🕊️ Next letter');el('count').textContent=t('試作：5通の独立したお話','Prototype: 5 independent stories');if(current)renderLetter();}
function stopSpeech(){if('speechSynthesis' in window) speechSynthesis.cancel()}
function speak(str){if(!sound||!('speechSynthesis' in window))return;stopSpeech();const u=new SpeechSynthesisUtterance(str);u.lang=language==='ja'?'ja-JP':'en-US';u.rate=.91;u.pitch=1.05;u.volume=1;speechSynthesis.speak(u)}
function musicStart(){if(!sound||playing)return;try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();audioCtx.resume();playing=true;let n=0;function note(){if(!playing)return;const freqs=[261.63,329.63,392,329.63,293.66,349.23,440,349.23];const osc=audioCtx.createOscillator(),gain=audioCtx.createGain();osc.type='sine';osc.frequency.value=freqs[n++%freqs.length];gain.gain.setValueAtTime(.0001,audioCtx.currentTime);gain.gain.exponentialRampToValueAtTime(.012,audioCtx.currentTime+.05);gain.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+.45);osc.connect(gain).connect(audioCtx.destination);osc.start();osc.stop(audioCtx.currentTime+.5)}note();musicTimer=setInterval(note,660)}catch(e){el('status').textContent=t('この端末ではBGMを再生できませんでした。','Background music is unavailable on this device.')}}
function musicStop(){playing=false;clearInterval(musicTimer)}
function hide(...ids){ids.forEach(id=>el(id).classList.add('hidden'))}function show(...ids){ids.forEach(id=>el(id).classList.remove('hidden'))}
function newLetter(){stopSpeech();if(idx<0)idx=Math.floor(Math.random()*stories.length);else idx=(idx+1)%stories.length;current=stories[idx];choice=-1;el('home').classList.add('hidden');show('panel');renderLetter();musicStart()}
function renderLetter(){const s=current[language];el('sender').textContent=s.from;el('letter').textContent=s.body;show('letter','choices');hide('ending','endingActions','replyArea','finish');el('choices').replaceChildren();s.choices.forEach((c,i)=>{let b=document.createElement('button');b.className='choice';b.textContent=(i+1)+'. '+c;b.onclick=()=>end(i);el('choices').appendChild(b)});speak(s.body)}
function end(i){choice=i;hide('choices');show('ending','endingActions');el('ending').textContent=current[language].ends[i];speak(current[language].ends[i])}
function write(){hide('endingActions');show('replyArea');el('reply').focus()}
function finish(sent){hide('replyArea','endingActions');show('finish');el('finishText').textContent=sent?t('お返事、届けました。クルッポー。','Delivered. Coo-coo!'):t('鳩は静かに飛んでいった。','The pigeon flew away quietly.');stopSpeech();if(sent)speak(el('finishText').textContent)}
el('birdButton').onclick=newLetter;el('write').onclick=write;el('noReply').onclick=()=>finish(false);el('send').onclick=()=>{if(!el('reply').value.trim())return;el('reply').value='';finish(true)};el('skip').onclick=()=>finish(false);el('next').onclick=newLetter;el('lang').onclick=()=>{language=language==='ja'?'en':'ja';localStorage.setItem('pigeon-lang',language);stopSpeech();ui()};el('sound').onclick=()=>{sound=!sound;localStorage.setItem('pigeon-sound',sound?'on':'off');if(!sound){stopSpeech();musicStop()}else{musicStart();if(current)speak(choice<0?current[language].body:current[language].ends[choice])}ui()};window.addEventListener('pagehide',()=>{stopSpeech();musicStop()});ui();
</script></body></html>
