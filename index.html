"from":"差出人：庭を横切るだけのタヌキ","body":"毎晩同じ家の防犯カメラに映ります。住民にファンができたようです。","choices":["少し様子を見よう","好きな場所を守ろう","仲間に聞いてみよう"],"ends":["三日後、短い手紙が届いた。差出人は庭を横切るだけのタヌキ。\n「少し様子を見よう」と返したら、半信半疑で動いてみたらしい。\n例の「毎晩同じ家の防犯カメラに映ります」の件は、その場では何も起きなかった。翌日になって効いてきた。\nその後どうなったかは、まだ誰も知らない。","その日の夕方、庭を横切るだけのタヌキが、例の「毎晩同じ家の防犯カメラに映ります」について書いてきた。\n「好きな場所を守ろう」の返事をきっかけに、本当にその通りにしたらしい。\n最初に笑った人が、最後は黙り込んだ。\n「今度はあなたの話も聞かせて」と書き添えられていた。","その日の夕方、庭を横切るだけのタヌキが報告してきた。\n「仲間に聞いてみよう」という一言がきっかけで、さっそく試してみたそうだ。\n「毎晩同じ家の防犯カメラに映ります」と悩んでいた頃とは、少し様子が違う。意外にも反対する人がいなかった。\n追伸には「次は自分で決めてみます」とあった。"]},"en":{"from":"差出人：庭を横切るだけのタヌキ","body":"毎晩同じ家の防犯カメラに映ります。住民にファンができたようです。","choices":["少し様子を見よう","好きな場所を守ろう","仲間に聞いてみよう"],"ends":["三日後、短い手紙が届いた。差出人は庭を横切るだけのタヌキ。\n「少し様子を見よう」と返したら、半信半疑で動いてみたらしい。\n例の「毎晩同じ家の防犯カメラに映ります」の件は、その場では何も起きなかった。翌日になって効いてきた。\nその後どうなったかは、まだ誰も知らない。","その日の夕方、庭を横切るだけのタヌキが、例の「毎晩同じ家の防犯カメラに映ります」について書いてきた。\n「好きな場所を守ろう」の返事をきっかけに、本当にその通りにしたらしい。\n最初に笑った人が、最後は黙り込んだ。\n「今度はあなたの話も聞かせて」と書き添えられていた。","その日の夕方、庭を横切るだけのタヌキが報告してきた。\n「仲間に聞いてみよう」という一言がきっかけで、さっそく試してみたそうだ。\n「毎晩同じ家の防犯カメラに映ります」と悩んでいた頃とは、少し様子が違う。意外にも反対する人がいなかった。\n追伸には「次は自分で決めてみます」とあった。"]}},{"ja":{"from":"差出人：遠吠えが下手なオオカミ","body":"どうしても最後がくしゃみになります。群れが笑うので夜勤を辞めたいです。","choices":["好きな場所を守ろう","仲間に聞いてみよう","少し様子を見よう"],"ends":["その夜、遠吠えが下手なオオカミから二通目。\n「好きな場所を守ろう」を実行する前に、どうしても最後がくしゃみになりますという話を思い出したらしい。\n最初は笑ったが、試してみた。返事を見せたら、別の相談が始まった。\n「これ、成功ってことでいいですか」と最後に書いてあった。","翌週、封筒に遠吠えが下手なオオカミの名前があった。\n「仲間に聞いてみよう」の通りにするか迷った末、思い切って口に出してみた。\nどうしても最後がくしゃみになります。そこから思いもしないことが起きた。相手が先に謝ってきた。\n「これ、成功ってことでいいですか」と最後に書いてあった。","その夜、遠吠えが下手なオオカミから二通目。\n「少し様子を見よう」を実行する前に、どうしても最後がくしゃみになりますという話を思い出したらしい。\n一度はやめかけたが、結局実行した。なぜか小さな行列ができた。\n封筒の裏には、小さな丸が一つ描かれていた。"]},"en":{"from":"差出人：遠吠えが下手なオオカミ","body":"どうしても最後がくしゃみになります。群れが笑うので夜勤を辞めたいです。","choices":["好きな場所を守ろう","仲間に聞いてみよう","少し様子を見よう"],"ends":["その夜、遠吠えが下手なオオカミから二通目。\n「好きな場所を守ろう」を実行する前に、どうしても最後がくしゃみになりますという話を思い出したらしい。\n最初は笑ったが、試してみた。返事を見せたら、別の相談が始まった。\n「これ、成功ってことでいいですか」と最後に書いてあった。","翌週、封筒に遠吠えが下手なオオカミの名前があった。\n「仲間に聞いてみよう」の通りにするか迷った末、思い切って口に出してみた。\nどうしても最後がくしゃみになります。そこから思いもしないことが起きた。相手が先に謝ってきた。\n「これ、成功ってことでいいですか」と最後に書いてあった。","その夜、遠吠えが下手なオオカミから二通目。\n「少し様子を見よう」を実行する前に、どうしても最後がくしゃみになりますという話を思い出したらしい。\n一度はやめかけたが、結局実行した。なぜか小さな行列ができた。\n封筒の裏には、小さな丸が一つ描かれていた。"]}},{"ja":{"from":"差出人：都会に慣れたハト","body":"人間がベンチでパンを食べるたび、同僚が集まります。私はパンより静けさが好きです。","choices":["仲間に聞いてみよう","少し様子を見よう","好きな場所を守ろう"],"ends":["帰り道で、封筒に都会に慣れたハトの名前があった。\n「仲間に聞いてみよう」の通りにするか迷った末、思ったより真剣に受け取られた。\n人間がベンチでパンを食べるたび、同僚が集まります。そこから思いもしないことが起きた。思わぬところで拍手が起きた。\n最後の一行だけ、やけに字が大きかった。","翌日の昼、都会に慣れたハトが報告してきた。\n「少し様子を見よう」という一言がきっかけで、一度はやめかけたが、結局実行した。\n「人間がベンチでパンを食べるたび、同僚が集まります」と悩んでいた頃とは、少し様子が違う。一人だけ、まったく別の解釈をした。\n「今度はあなたの話も聞かせて」と書き添えられていた。","日付のない追伸が届いた。都会に慣れたハトが、例の「人間がベンチでパンを食べるたび、同僚が集まります」について書いてきた。\n「好きな場所を守ろう」の返事をきっかけに、思い切って口に出してみた。\n最初に笑った人が、最後は黙り込んだ。\n「たぶんこれでよかった」と短く締めくくられていた。"]},"en":{"from":"差出人：都会に慣れたハト","body":"人間がベンチでパンを食べるたび、同僚が集まります。私はパンより静けさが好きです。","choices":["仲間に聞いてみよう","少し様子を見よう","好きな場所を守ろう"],"ends":["帰り道で、封筒に都会に慣れたハトの名前があった。\n「仲間に聞いてみよう」の通りにするか迷った末、思ったより真剣に受け取られた。\n人間がベンチでパンを食べるたび、同僚が集まります。そこから思いもしないことが起きた。思わぬところで拍手が起きた。\n最後の一行だけ、やけに字が大きかった。","翌日の昼、都会に慣れたハトが報告してきた。\n「少し様子を見よう」という一言がきっかけで、一度はやめかけたが、結局実行した。\n「人間がベンチでパンを食べるたび、同僚が集まります」と悩んでいた頃とは、少し様子が違う。一人だけ、まったく別の解釈をした。\n「今度はあなたの話も聞かせて」と書き添えられていた。","日付のない追伸が届いた。都会に慣れたハトが、例の「人間がベンチでパンを食べるたび、同僚が集まります」について書いてきた。\n「好きな場所を守ろう」の返事をきっかけに、思い切って口に出してみた。\n最初に笑った人が、最後は黙り込んだ。\n「たぶんこれでよかった」と短く締めくくられていた。"]}},{"ja":{"from":"差出人：動物病院が好きなウサギ","body":"診察台に乗ると落ち着きます。飼い主のほうが毎回震えています。","choices":["少し様子を見よう","好きな場所を守ろう","仲間に聞いてみよう"],"ends":["雨が降った日、動物病院が好きなウサギから二通目。\n「少し様子を見よう」を実行する前に、診察台に乗ると落ち着きますという話を思い出したらしい。\n思ったより真剣に受け取られた。返事を見せたら、別の相談が始まった。\n「続きができたら、また書きます」で終わっていた。","その夜、動物病院が好きなウサギが、例の「診察台に乗ると落ち着きます」について書いてきた。\n「好きな場所を守ろう」の返事をきっかけに、一度はやめかけたが、結局実行した。\nそれが新しい習慣になりそうだ。\n追伸には「次は自分で決めてみます」とあった。","翌日の昼、短い手紙が届いた。差出人は動物病院が好きなウサギ。\n「仲間に聞いてみよう」と返したら、まず紙に書き出してみた。\n例の「診察台に乗ると落ち着きます」の件は、説明を求められ、余計に話が大きくなった。\nその後どうなったかは、まだ誰も知らない。"]},"en":{"from":"差出人：動物病院が好きなウサギ","body":"診察台に乗ると落ち着きます。飼い主のほうが毎回震えています。","choices":["少し様子を見よう","好きな場所を守ろう","仲間に聞いてみよう"],"ends":["雨が降った日、動物病院が好きなウサギから二通目。\n「少し様子を見よう」を実行する前に、診察台に乗ると落ち着きますという話を思い出したらしい。\n思ったより真剣に受け取られた。返事を見せたら、別の相談が始まった。\n「続きができたら、また書きます」で終わっていた。","その夜、動物病院が好きなウサギが、例の「診察台に乗ると落ち着きます」について書いてきた。\n「好きな場所を守ろう」の返事をきっかけに、一度はやめかけたが、結局実行した。\nそれが新しい習慣になりそうだ。\n追伸には「次は自分で決めてみます」とあった。","翌日の昼、短い手紙が届いた。差出人は動物病院が好きなウサギ。\n「仲間に聞いてみよう」と返したら、まず紙に書き出してみた。\n例の「診察台に乗ると落ち着きます」の件は、説明を求められ、余計に話が大きくなった。\nその後どうなったかは、まだ誰も知らない。"]}},{"ja":{"from":"差出人：最後の一個を譲るパン屋","body":"毎日最後のクロワッサンを誰かに譲っています。自分で食べる日は来ますか。","choices":["常連に聞いてみよう","今日の味を大事に","一口だけ試そう"],"ends":["帰り道で、最後の一個を譲るパン屋が報告してきた。\n「常連に聞いてみよう」という一言がきっかけで、最初は笑ったが、試してみた。\n「毎日最後のクロワッサンを誰かに譲っています」と悩んでいた頃とは、少し様子が違う。周囲は納得したが、本人だけ納得していない。\n封筒の裏には、小さな丸が一つ描かれていた。","三日後、最後の一個を譲るパン屋が、例の「毎日最後のクロワッサンを誰かに譲っています」について書いてきた。\n「今日の味を大事に」の返事をきっかけに、本当にその通りにしたらしい。\nなぜか小さな行列ができた。\n「誰にも内緒にしてください」と、しっかり赤字で書かれていた。","その日の夕方、最後の一個を譲るパン屋が、例の「毎日最後のクロワッサンを誰かに譲っています」について書いてきた。\n「一口だけ試そう」の返事をきっかけに、返事を見て、予定を変更した。\nなぜか小さな行列ができた。\n封筒の裏には、小さな丸が一つ描かれていた。"]},"en":{"from":"差出人：最後の一個を譲るパン屋","body":"毎日最後のクロワッサンを誰かに譲っています。自分で食べる日は来ますか。","choices":["常連に聞いてみよう","今日の味を大事に","一口だけ試そう"],"ends":["帰り道で、最後の一個を譲るパン屋が報告してきた。\n「常連に聞いてみよう」という一言がきっかけで、最初は笑ったが、試してみた。\n「毎日最後のクロワッサンを誰かに譲っています」と悩んでいた頃とは、少し様子が違う。周囲は納得したが、本人だけ納得していない。\n封筒の裏には、小さな丸が一つ描かれていた。","三日後、最後の一個を譲るパン屋が、例の「毎日最後のクロワッサンを誰かに譲っています」について書いてきた。\n「今日の味を大事に」の返事をきっかけに、本当にその通りにしたらしい。\nなぜか小さな行列ができた。\n「誰にも内緒にしてください」と、しっかり赤字で書かれていた。","その日の夕方、最後の一個を譲るパン屋が、例の「毎日最後のクロワッサンを誰かに譲っています」について書いてきた。\n「一口だけ試そう」の返事をきっかけに、返事を見て、予定を変更した。\nなぜか小さな行列ができた。\n封筒の裏には、小さな丸が一つ描かれていた。"]}},{"ja":{"from":"差出人：辛さを盛るカレー店主","body":"常連に辛くないと言い続けたら、店が消防署の近くに移転しました。","choices":["今日の味を大事に","一口だけ試そう","常連に聞いてみよう"],"ends":["次の朝、辛さを盛るカレー店主が、例の「常連に辛くないと言い続けたら、店が消防署の近くに移転しました」について書いてきた。\n「今日の味を大事に」の返事をきっかけに、少しだけ勇気を出してみた。\nその場では何も起きなかった。翌日になって効いてきた。\n最後の一行だけ、やけに字が大きかった。","翌日の昼、辛さを盛るカレー店主が、例の「常連に辛くないと言い続けたら、店が消防署の近くに移転しました」について書いてきた。\n「一口だけ試そう」の返事をきっかけに、まず紙に書き出してみた。\n意外にも反対する人がいなかった。\n「今度はあなたの話も聞かせて」と書き添えられていた。","返事を出した翌朝、辛さを盛るカレー店主から二通目。\n「常連に聞いてみよう」を実行する前に、常連に辛くないと言い続けたら、店が消防署の近くに移転しましたという話を思い出したらしい。\n思い切って口に出してみた。それが新しい習慣になりそうだ。\n「続きができたら、また書きます」で終わっていた。"]},"en":{"from":"差出人：辛さを盛るカレー店主","body":"常連に辛くないと言い続けたら、店が消防署の近くに移転しました。","choices":["今日の味を大事に","一口だけ試そう","常連に聞いてみよう"],"ends":["次の朝、辛さを盛るカレー店主が、例の「常連に辛くないと言い続けたら、店が消防署の近くに移転しました」について書いてきた。\n「今日の味を大事に」の返事をきっかけに、少しだけ勇気を出してみた。\nその場では何も起きなかった。翌日になって効いてきた。\n最後の一行だけ、やけに字が大きかった。","翌日の昼、辛さを盛るカレー店主が、例の「常連に辛くないと言い続けたら、店が消防署の近くに移転しました」について書いてきた。\n「一口だけ試そう」の返事をきっかけに、まず紙に書き出してみた。\n意外にも反対する人がいなかった。\n「今度はあなたの話も聞かせて」と書き添えられていた。","返事を出した翌朝、辛さを盛るカレー店主から二通目。\n「常連に聞いてみよう」を実行する前に、常連に辛くないと言い続けたら、店が消防署の近くに移転しましたという話を思い出したらしい。\n思い切って口に出してみた。それが新しい習慣になりそうだ。\n「続きができたら、また書きます」で終わっていた。"]}},{"ja":{"from":"差出人：具が多すぎるおにぎり職人","body":"握るたびに中身がはみ出します。もうおにぎりと呼べない気がします。","choices":["一口だけ試そう","常連に聞いてみよう","今日の味を大事に"],"ends":["日付のない追伸が届いた。具が多すぎるおにぎり職人から追伸が来た。\n「一口だけ試そう」を選んだことを伝えると、思ったより真剣に受け取られた。\n握るたびに中身がはみ出します――その話が、今度は別の意味で広まっている。ところが、話を聞いていた人のほうが先に動いた。\n「これ、成功ってことでいいですか」と最後に書いてあった。","しばらくして、具が多すぎるおにぎり職人から二通目。\n「常連に聞いてみよう」を実行する前に、握るたびに中身がはみ出しますという話を思い出したらしい。\nさっそく試してみたそうだ。説明を求められ、余計に話が大きくなった。\nその後どうなったかは、まだ誰も知らない。","その日の夕方、具が多すぎるおにぎり職人が、例の「握るたびに中身がはみ出します」について書いてきた。\n「今日の味を大事に」の返事をきっかけに、少しだけ勇気を出してみた。\nその場では何も起きなかった。翌日になって効いてきた。\n「続きができたら、また書きます」で終わっていた。"]},"en":{"from":"差出人：具が多すぎるおにぎり職人","body":"握るたびに中身がはみ出します。もうおにぎりと呼べない気がします。","choices":["一口だけ試そう","常連に聞いてみよう","今日の味を大事に"],"ends":["日付のない追伸が届いた。具が多すぎるおにぎり職人から追伸が来た。\n「一口だけ試そう」を選んだことを伝えると、思ったより真剣に受け取られた。\n握るたびに中身がはみ出します――その話が、今度は別の意味で広まっている。ところが、話を聞いていた人のほうが先に動いた。\n「これ、成功ってことでいいですか」と最後に書いてあった。","しばらくして、具が多すぎるおにぎり職人から二通目。\n「常連に聞いてみよう」を実行する前に、握るたびに中身がはみ出しますという話を思い出したらしい。\nさっそく試してみたそうだ。説明を求められ、余計に話が大きくなった。\nその後どうなったかは、まだ誰も知らない。","その日の夕方、具が多すぎるおにぎり職人が、例の「握るたびに中身がはみ出します」について書いてきた。\n「今日の味を大事に」の返事をきっかけに、少しだけ勇気を出してみた。\nその場では何も起きなかった。翌日になって効いてきた。\n「続きができたら、また書きます」で終わっていた。"]}},{"ja":{"from":"差出人：毎朝スープを変える母","body":"家族は全部「いつもの味」と言います。味覚より愛情を疑っています。","choices":["常連に聞いてみよう","今日の味を大事に","一口だけ試そう"],"ends":["三日後、毎朝スープを変える母が報告してきた。\n「常連に聞いてみよう」という一言がきっかけで、まず紙に書き出してみた。\n「家族は全部「いつもの味」と言います」と悩んでいた頃とは、少し様子が違う。なぜか小さな行列ができた。\nその後どうなったかは、まだ誰も知らない。","しばらくして、毎朝スープを変える母が報告してきた。\n「今日の味を大事に」という一言がきっかけで、本当にその通りにしたらしい。\n「家族は全部「いつもの味」と言います」と悩んでいた頃とは、少し様子が違う。なぜか小さな行列ができた。\n「続きができたら、また書きます」で終わっていた。","翌日の昼、短い手紙が届いた。差出人は毎朝スープを変える母。\n「一口だけ試そう」と返したら、予定外の相手まで巻き込んだ。\n例の「家族は全部「いつもの味」と言います」の件は、なぜか小さな行列ができた。\n封筒には、なぜか二枚目の切手が貼ってあった。"]},"en":{"from":"差出人：毎朝スープを変える母","body":"家族は全部「いつもの味」と言います。味覚より愛情を疑っています。","choices":["常連に聞いてみよう","今日の味を大事に","一口だけ試そう"],"ends":["三日後、毎朝スープを変える母が報告してきた。\n「常連に聞いてみよう」という一言がきっかけで、まず紙に書き出してみた。\n「家族は全部「いつもの味」と言います」と悩んでいた頃とは、少し様子が違う。なぜか小さな行列ができた。\nその後どうなったかは、まだ誰も知らない。","しばらくして、毎朝スープを変える母が報告してきた。\n「今日の味を大事に」という一言がきっかけで、本当にその通りにしたらしい。\n「家族は全部「いつもの味」と言います」と悩んでいた頃とは、少し様子が違う。なぜか小さな行列ができた。\n「続きができたら、また書きます」で終わっていた。","翌日の昼、短い手紙が届いた。差出人は毎朝スープを変える母。\n「一口だけ試そう」と返したら、予定外の相手まで巻き込んだ。\n例の「家族は全部「いつもの味」と言います」の件は、なぜか小さな行列ができた。\n封筒には、なぜか二枚目の切手が貼ってあった。"]}},{"ja":{"from":"差出人：パンの耳を集める学生","body":"節約のつもりが、パンの真ん中より高い容器を買ってしまいました。","choices":["今日の味を大事に","一口だけ試そう","常連に聞いてみよう"],"ends":["三日後、封筒にパンの耳を集める学生の名前があった。\n「今日の味を大事に」の通りにするか迷った末、思ったより真剣に受け取られた。\n節約のつもりが、パンの真ん中より高い容器を買ってしまいました。そこから思いもしないことが起きた。ところが、話を聞いていた人のほうが先に動いた。\n「誰にも内緒にしてください」と、しっかり赤字で書かれていた。","次の朝、パンの耳を集める学生が、例の「節約のつもりが、パンの真ん中より高い容器を買ってしまいました」について書いてきた。\n「一口だけ試そう」の返事をきっかけに、返事を見て、予定を変更した。\n最初に笑った人が、最後は黙り込んだ。\n封筒の裏には、小さな丸が一つ描かれていた。","週末になって、封筒にパンの耳を集める学生の名前があった。\n「常連に聞いてみよう」の通りにするか迷った末、誰にも言わずに実行した。\n節約のつもりが、パンの真ん中より高い容器を買ってしまいました。そこから思いもしないことが起きた。なぜか関係ない人が一番喜んだ。\n「これ、成功ってことでいいですか」と最後に書いてあった。"]},"en":{"from":"差出人：パンの耳を集める学生","body":"節約のつもりが、パンの真ん中より高い容器を買ってしまいました。","choices":["今日の味を大事に","一口だけ試そう","常連に聞いてみよう"],"ends":["三日後、封筒にパンの耳を集める学生の名前があった。\n「今日の味を大事に」の通りにするか迷った末、思ったより真剣に受け取られた。\n節約のつもりが、パンの真ん中より高い容器を買ってしまいました。そこから思いもしないことが起きた。ところが、話を聞いていた人のほうが先に動いた。\n「誰にも内緒にしてください」と、しっかり赤字で書かれていた。","次の朝、パンの耳を集める学生が、例の「節約のつもりが、パンの真ん中より高い容器を買ってしまいました」について書いてきた。\n「一口だけ試そう」の返事をきっかけに、返事を見て、予定を変更した。\n最初に笑った人が、最後は黙り込んだ。\n封筒の裏には、小さな丸が一つ描かれていた。","週末になって、封筒にパンの耳を集める学生の名前があった。\n「常連に聞いてみよう」の通りにするか迷った末、誰にも言わずに実行した。\n節約のつもりが、パンの真ん中より高い容器を買ってしまいました。そこから思いもしないことが起きた。なぜか関係ない人が一番喜んだ。\n「これ、成功ってことでいいですか」と最後に書いてあった。"]}},{"ja":{"from":"差出人：ラーメンの湯切りを研究する人","body":"練習しすぎてお湯を飛ばすだけで拍手されます。麺はまだ茹でていません。","choices":["一口だけ試そう","常連に聞いてみよう","今日の味を大事に"],"ends":["その日の夕方、ラーメンの湯切りを研究する人が、例の「練習しすぎてお湯を飛ばすだけで拍手されます」について書いてきた。\n「一口だけ試そう」の返事をきっかけに、思ったより真剣に受け取られた。\nところが、話を聞いていた人のほうが先に動いた。\n「誰にも内緒にしてください」と、しっかり赤字で書かれていた。","雨が降った日、ラーメンの湯切りを研究する人から追伸が来た。\n「常連に聞いてみよう」を選んだことを伝えると、予定外の相手まで巻き込んだ。\n練習しすぎてお湯を飛ばすだけで拍手されます――その話が、今度は別の意味で広まっている。一人だけ、まったく別の解釈をした。\nその後どうなったかは、まだ誰も知らない。","その日の夕方、短い手紙が届いた。差出人はラーメンの湯切りを研究する人。\n「今日の味を大事に」と返したら、思い切って口に出してみた。\n例の「練習しすぎてお湯を飛ばすだけで拍手されます」の件は、説明を求められ、余計に話が大きくなった。\n「誰にも内緒にしてください」と、しっかり赤字で書かれていた。"]},"en":{"from":"差出人：ラーメンの湯切りを研究する人","body":"練習しすぎてお湯を飛ばすだけで拍手されます。麺はまだ茹でていません。","choices":["一口だけ試そう","常連に聞いてみよう","今日の味を大事に"],"ends":["その日の夕方、ラーメンの湯切りを研究する人が、例の「練習しすぎてお湯を飛ばすだけで拍手されます」について書いてきた。\n「一口だけ試そう」の返事をきっかけに、思ったより真剣に受け取られた。\nところが、話を聞いていた人のほうが先に動いた。\n「誰にも内緒にしてください」と、しっかり赤字で書かれていた。","雨が降った日、ラーメンの湯切りを研究する人から追伸が来た。\n「常連に聞いてみよう」を選んだことを伝えると、予定外の相手まで巻き込んだ。\n練習しすぎてお湯を飛ばすだけで拍手されます――その話が、今度は別の意味で広まっている。一人だけ、まったく別の解釈をした。\nその後どうなったかは、まだ誰も知らない。","その日の夕方、短い手紙が届いた。差出人はラーメンの湯切りを研究する人。\n「今日の味を大事に」と返したら、思い切って口に出してみた。\n例の「練習しすぎてお湯を飛ばすだけで拍手されます」の件は、説明を求められ、余計に話が大きくなった。\n「誰にも内緒にしてください」と、しっかり赤字で書かれていた。"]}},{"ja":{"from":"差出人：味見で満腹になる料理人","body":"完成した料理を食べたことがありません。お客さんに味を聞くのが怖いです。","choices":["常連に聞いてみよう","今日の味を大事に","一口だけ試そう"],"ends":["次の朝、味見で満腹になる料理人が報告してきた。\n「常連に聞いてみよう」という一言がきっかけで、さっそく試してみたそうだ。\n「完成した料理を食べたことがありません」と悩んでいた頃とは、少し様子が違う。周囲は納得したが、本人だけ納得していない。\n「これ、成功ってことでいいですか」と最後に書いてあった。","返事を出した翌朝、味見で満腹になる料理人が報告してきた。\n「今日の味を大事に」という一言がきっかけで、誰にも言わずに実行した。\n「完成した料理を食べたことがありません」と悩んでいた頃とは、少し様子が違う。それが新しい習慣になりそうだ。\n封筒の裏には、小さな丸が一つ描かれていた。","次の朝、封筒に味見で満腹になる料理人の名前があった。\n「一口だけ試そう」の通りにするか迷った末、最初は笑ったが、試してみた。\n完成した料理を食べたことがありません。そこから思いもしないことが起きた。周囲は納得したが、本人だけ納得していない。\n結局、本人が一番楽しそうだった。"]},"en":{"from":"差出人：味見で満腹になる料理人","body":"完成した料理を食べたことがありません。お客さんに味を聞くのが怖いです。","choices":["常連に聞いてみよう","今日の味を大事に","一口だけ試そう"],"ends":["次の朝、味見で満腹になる料理人が報告してきた。\n「常連に聞いてみよう」という一言がきっかけで、 を大事に","一口だけ試そう","常連に聞いてみよう"],"ends":["帰り道で、封筒にコーヒーを冷ます喫茶店主の名前があった。\n「今日の味を大事に」の通りにするか迷った末、誰にも言わずに実行した。\n熱い飲み物が苦手なのに喫茶店を始めました。そこから思いもしないことが起きた。それが新しい習慣になりそうだ。\n封筒の裏には、小さな丸が一つ描かれていた。","翌日の昼、短い手紙が届いた。差出人はコーヒーを冷ます喫茶店主。\n「一口だけ試そう」と返したら、返事を見て、予定を変更した。\n例の「熱い飲み物が苦手なのに喫茶店を始めました」の件は、結果より、その途中の顔が忘れられないらしい。\n次の手紙には、なぜか謝礼のつもりのシールが入っていた。","翌週、コーヒーを冷ます喫茶店主が、例の「熱い飲み物が苦手なのに喫茶店を始めました」について書いてきた。\n「常連に聞いてみよう」の返事をきっかけに、まず紙に書き出してみた。\nなぜか小さな行列ができた。\n「続きができたら、また書きます」で終わっていた。"]},"en":{"from":"差出人：コーヒーを冷ます喫茶店主","body":"熱い飲み物が苦手なのに喫茶店を始めました。常連は私より気が長いです。","choices":["今日の味を大事に","一口だけ試そう","常連に聞いてみよう"],"ends":["帰り道で、封筒にコーヒーを冷ます喫茶店主の名前があった。\n「今日の味を大事に」の通りにするか迷った末、誰にも言わずに実行した。\n熱い飲み物が苦手なのに喫茶店を始めました。そこから思いもしないことが起きた。それが新しい習慣になりそうだ。\n封筒の裏には、小さな丸が一つ描かれていた。","翌日の昼、短い手紙が届いた。差出人はコーヒーを冷ます喫茶店主。\n「一口だけ試そう」と返したら、返事を見て、予定を変更した。\n例の「熱い飲み物が苦手なのに喫茶店を始めました」の件は、結果より、その途中の顔が忘れられないらしい。\n次の手紙には、なぜか謝礼のつもりのシールが入っていた。","翌週、コーヒーを冷ます喫茶店主が、例の「熱い飲み物が苦手なのに喫茶店を始めました」について書いてきた。\n「常連に聞いてみよう」の返事をきっかけに、まず紙に書き出してみた。\nなぜか小さな行列ができた。\n「続きができたら、また書きます」で終わっていた。"]}},{"ja":{"from":"差出人：プリンのカラメル係","body":"毎回苦くしすぎます。でも祖母だけは「大人の味」と言ってくれます。","choices":["一口だけ試そう","常連に聞いてみよう","今日の味を大事に"],"ends":["次の月曜日、プリンのカラメル係から二通目。\n「一口だけ試そう」を実行する前に、毎回苦くしすぎますという話を思い出したらしい。\n思ったより真剣に受け取られた。一人だけ、まったく別の解釈をした。\n封筒には、なぜか二枚目の切手が貼ってあった。","その日の夕方、プリンのカラメル係が、例の「毎回苦くしすぎます」について書いてきた。\n「常連に聞いてみよう」の返事をきっかけに、本当にその通りにしたらしい。\nその場では何も起きなかった。翌日になって効いてきた。\n封筒には、なぜか二枚目の切手が貼ってあった。","次の朝、プリンのカラメル係が報告してきた。\n「今日の味を大事に」という一言がきっかけで、まず紙に書き出してみた。\n「毎回苦くしすぎます」と悩んでいた頃とは、少し様子が違う。なぜか小さな行列ができた。\n封筒には、なぜか二枚目の切手が貼ってあった。"]},"en":{"from":"差出人：プリンのカラメル係","body":"毎回苦くしすぎます。でも祖母だけは「大人の味」と言ってくれます。","choices":["一口だけ試そう","常連に聞いてみよう","今日の味を大事に"],"ends":["次の月曜日、プリンのカラメル係から二通目。\n「一口だけ試そう」を実行する前に、毎回苦くしすぎますという話を思い出したらしい。\n思ったより真剣に受け取られた。一人だけ、まったく別の解釈をした。\n封筒には、なぜか二枚目の切手が貼ってあった。","その日の夕方、プリンのカラメル係が、例の「毎回苦くしすぎます」について書いてきた。\n「常連に聞いてみよう」の返事をきっかけに、本当にその通りにしたらしい。\nその場では何も起きなかった。翌日になって効いてきた。\n封筒には、なぜか二枚目の切手が貼ってあった。","次の朝、プリンのカラメル係が報告してきた。\n「今日の味を大事に」という一言がきっかけで、まず紙に書き出してみた。\n「毎回苦くしすぎます」と悩んでいた頃とは、少し様子が違う。なぜか小さな行列ができた。\n封筒には、なぜか二枚目の切手が貼ってあった。"]}},{"ja":{"from":"差出人：余った餃子の皮を数える人","body":"毎回具が一個分だけ足りません。家族は皮だけの餃子を楽しみにしています。","choices":["常連に聞いてみよう","今日の味を大事に","一口だけ試そう"],"ends":["帰り道で、余った餃子の皮を数える人から追伸が来た。\n「常連に聞いてみよう」を選んだことを伝えると、少しだけ勇気を出してみた。\n毎回具が一個分だけ足りません――その話が、今度は別の意味で広まっている。最初に笑った人が、最後は黙り込んだ。\n「誰にも内緒にしてください」と、しっかり赤字で書かれていた。","その日の夕方、余った餃子の皮を数える人から追伸が来た。\n「今日の味を大事に」を選んだことを伝えると、最初は笑ったが、試してみた。\n毎回具が一個分だけ足りません――その話が、今度は別の意味で広まっている。その場では何も起きなかった。翌日になって効いてきた。\n封筒には、なぜか二枚目の切手が貼ってあった。","その夜、封筒に余った餃子の皮を数える人の名前があった。\n「一口だけ試そう」の通りにするか迷った末、予定外の相手まで巻き込んだ。\n毎回具が一個分だけ足りません。そこから思いもしないことが起きた。返事を見せたら、別の相談が始まった。\n最後の一行だけ、やけに字が大きかった。"]},"en":{"from":"差出人：余った餃子の皮を数える人","body":"毎回具が一個分だけ足りません。家族は皮だけの餃子を楽しみにしています。","choices":["常連に聞いてみよう","今日の味を大事に","一口だけ試そう"],"ends":["帰り道で、余った餃子の皮を数える人から追伸が来た。\n「常連に聞いてみよう」を選んだことを伝えると、少しだけ勇気を出してみた。\n毎回具が一個分だけ足りません――その話が、今度は別の意味で広まっている。最初に笑った人が、最後は黙り込んだ。\n「誰にも内緒にしてください」と、しっかり赤字で書かれていた。","その日の夕方、余った餃子の皮を数える人から追伸が来た。\n「今日の味を大事に」を選んだことを伝えると、最初は笑ったが、試してみた。\n毎回具が一個分だけ足りません――その話が、今度は別の意味で広まっている。その場では何も起きなかった。翌日になって効いてきた。\n封筒には、なぜか二枚目の切手が貼ってあった。","その夜、封筒に余った餃子の皮を数える人の名前があった。\n「一口だけ試そう」の通りにするか迷った末、予定外の相手まで巻き込んだ。\n毎回具が一個分だけ足りません。そこから思いもしないことが起きた。返事を見せたら、別の相談が始まった。\n最後の一行だけ、やけに字が大きかった。"]}},{"ja":{"from":"差出人：黒板消しを隠す優等生","body":"先生の字がきれいなので消したくありません。授業が三日分重なりました。","choices":["それも思い出になる","先生に相談しよう","友達と考えよう"],"ends":["雨が降った日、黒板消しを隠す優等生から追伸が来た。\n「それも思い出になる」を選んだことを伝えると、予定外の相手まで巻き込んだ。\n先生の字がきれいなので消したくありません――その話が、今度は別の意味で広まっている。その場では何も起きなかった。翌日になって効いてきた。\n追伸には「次は自分で決めてみます」とあった。","帰り道で、黒板消しを隠す優等生から二通目。\n「先生に相談しよう」を実行する前に、先生の字がきれいなので消したくありませんという話を思い出したらしい。\n少しだけ勇気を出してみた。それが新しい習慣になりそうだ。\n最後の一行だけ、やけに字が大きかった。","三日後、黒板消しを隠す優等生が、例の「先生の字がきれいなので消したくありません」について書いてきた。\n「友達と考えよう」の返事をきっかけに、さっそく試してみたそうだ。\nなぜか関係ない人が一番喜んだ。\n「続きができたら、また書きます」で終わっていた。"]},"en":{"from":"差出人：黒板消しを隠す優等生","body":"先生の字がきれいなので消したくありません。授業が三日分重なりました。","choices":["それも思い出になる","先生に相談しよう","友達と考えよう"],"ends":["雨が降った日、黒板消しを隠す優等生から追伸が来た。\n「それも思い出になる」を選んだことを伝えると、予定外の相手まで巻き込んだ。\n先生の字がきれいなので消したくありません――その話が、今度は別の意味で広まっている。その場では何も起きなかった。翌日になって効いてきた。\n追伸には「次は自分で決めてみます」とあった。","帰り道で、黒板消しを隠す優等生から二通目。\n「先生に相談しよう」を実行する前に、先生の字がきれいなので消したくありませんという話を思い出したらしい。\n少しだけ勇気を出してみた。それが新しい習慣になりそうだ。\n最後の一行だけ、やけに字が大きかった。","三日後、黒板消しを隠す優等生が、例の「先生の字がきれいなので消したくありません」について書いてきた。\n「友達と考えよう」の返事をきっかけに、さっそく試してみたそうだ。\nなぜか関係ない人が一番喜んだ。\n「続きができたら、また書きます」で終わっていた。"]}},{"ja":{"from":"差出人：放課後のチャイム係","body":"卒業式の日だけ鳴らすのを忘れました。みんなまだ教室にいます。","choices":["先生に相談しよう","友達と考えよう","それも思い出になる"],"ends":["その夜、放課後のチャイム係から追伸が来た。\n「先生に相談しよう」を選んだことを伝えると、予定外の相手まで巻き込んだ。\n卒業式の日だけ鳴らすのを忘れました――その話が、今度は別の意味で広まっている。返事を見せたら、別の相談が始まった。\n封筒には、なぜか二枚目の切手が貼ってあった。","次の月曜日、放課後のチャイム係から追伸が来た。\n「友達と考えよう」を選んだことを伝えると、最初は笑ったが、試してみた。\n卒業式の日だけ鳴らすのを忘れました――その話が、今度は別の意味で広まっている。誰も予想していない方向に話が進んだ。\n「これ、成功ってことでいいですか」と最後に書いてあった。","三日後、放課後のチャイム係が、例の「卒業式の日だけ鳴らすのを忘れました」について書いてきた。\n「それも思い出になる」の返事をきっかけに、まず紙に書き出してみた。\nところが、話を聞いていた人のほうが先に動いた。\n封筒の裏には、小さな丸が一つ描かれていた。"]},"en":{"from":"差出人：放課後のチャイム係","body":"卒業式の日だけ鳴らすのを忘れました。みんなまだ教室にいます。","choices":["先生に相談しよう","友達と考えよう","それも思い出になる"],"ends":["その夜、放課後のチャイム係から追伸が来た。\n「先生に相談しよう」を選んだことを伝えると、予定外の相手まで巻き込んだ。\n卒業式の日だけ鳴らすのを忘れました――その話が、今度は別の意味で広まっている。返事を見せたら、別の相談が始まった。\n封筒には、なぜか二枚目の切手が貼ってあった。","次の月曜日、放課後のチャイム係から追伸が来た。\n「友達と考えよう」を選んだことを伝えると、最初は笑ったが、試してみた。\n卒業式の日だけ鳴らすのを忘れました――その話が、今度は別の意味で広まっている。誰も予想していない方向に話が進んだ。\n「これ、成功ってことでいいですか」と最後に書いてあった。","三日後、放課後のチャイム係が、例の「卒業式の日だけ鳴らすのを忘れました」について書いてきた。\n「それも思い出になる」の返事をきっかけに、まず紙に書き出してみた。\nところが、話を聞いていた人のほうが先に動いた。\n封筒の裏には、小さな丸が一つ描かれていた。"]}},{"ja":{"from":"差出人：席替えのくじを作る生徒","body":"自分だけ毎回窓際です。不正を疑われていますが本当に偶然です。","choices":["友達と考えよう","それも思い出になる","先生に相談しよう"],"ends":["しばらくして、短い手紙が届いた。差出人は席替えのくじを作る生徒。\n「友達と考えよう」と返したら、一度はやめかけたが、結局実行した。\n例の「自分だけ毎回窓際です」の件は、その場では何も起きなかった。翌日になって効いてきた。\n結局、本人が一番楽しそうだった。","週末になって、席替えのくじを作る生徒が、例の「自分だけ毎回窓際です」について書いてきた。\n「それも思い出になる」の返事をきっかけに、思ったより真剣に受け取られた。\nなぜか関係ない人が一番喜んだ。\n追伸には「次は自分で決めてみます」とあった。","二日後、席替えのくじを作る生徒が、例の「自分だけ毎回窓際です」について書いてきた。\n「先生に相談しよう」の返事をきっかけに、思い切って口に出してみた。\nそれが新しい習慣になりそうだ。\n「続きができたら、また書きます」で終わっていた。"]},"en":{"from":"差出人：席替えのくじを作る生徒","body":"自分だけ毎回窓際です。不正を疑われていますが本当に偶然です。","choices": 出になる」の通りにするか迷った末、思い切って口に出してみた。\n白さを競っていたら友達が靴下で登校してきました。そこから思いもしないことが起きた。その場では何も起きなかった。翌日になって効いてきた。\n封筒の裏には、小さな丸が一つ描かれていた。"]},"en":{"from":"差出人：毎日上履きを洗う生徒","body":"白さを競っていたら友達が靴下で登校してきました。勝負は終わりですか。","choices":["先生に相談しよう","友達と考えよう","それも思い出になる"],"ends":["日付のない追伸が届いた。毎日上履きを洗う生徒から追伸が来た。\n「先生に相談しよう」を選んだことを伝えると、一度はやめかけたが、結局実行した。\n白さを競っていたら友達が靴下で登校してきました――その話が、今度は別の意味で広まっている。周囲は納得したが、本人だけ納得していない。\n最後の一行だけ、やけに字が大きかった。","返事を出した翌朝、毎日上履きを洗う生徒から追伸が来た。\n「友達と考えよう」を選んだことを伝えると、一度はやめかけたが、結局実行した。\n白さを競っていたら友達が靴下で登校してきました――その話が、今度は別の意味で広まっている。周囲は納得したが、本人だけ納得していない。\n最後の一行だけ、やけに字が大きかった。","雨が降った日、封筒に毎日上履きを洗う生徒の名前があった。\n「それも思い出になる」の通りにするか迷った末、思い切って口に出してみた。\n白さを競っていたら友達が靴下で登校してきました。そこから思いもしないことが起きた。その場では何も起きなかった。翌日になって効いてきた。\n封筒の裏には、小さな丸が一つ描かれていた。"]}},{"ja":{"from":"差出人：宿題の言い訳を研究する子","body":"完璧な言い訳を考えていたら宿題をする時間がなくなりました。","choices":["友達と考えよう","それも思い出になる","先生に相談しよう"],"ends":["一週間後、宿題の言い訳を研究する子から二通目。\n「友達と考えよう」を実行する前に、完璧な言い訳を考えていたら宿題をする時間がなくなりましたという話を思い出したらしい。\nさっそく試してみたそうだ。最初に笑った人が、最後は黙り込んだ。\n「続きができたら、また書きます」で終わっていた。","次の朝、封筒に宿題の言い訳を研究する子の名前があった。\n「それも思い出になる」の通りにするか迷った末、少しだけ勇気を出してみた。\n完璧な言い訳を考えていたら宿題をする時間がなくなりました。そこから思いもしないことが起きた。思わぬところで拍手が起きた。\n最後の一行だけ、やけに字が大きかった。","二日後、宿題の言い訳を研究する子が、例の「完璧な言い訳を考えていたら宿題をする時間がなくなりました」について書いてきた。\n「先生に相談しよう」の返事をきっかけに、まず紙に書き出してみた。\n一人だけ、まったく別の解釈をした。\n追伸には「次は自分で決めてみます」とあった。"]},"en":{"from":"差出人：宿題の言い訳を研究する子","body":"完璧な言い訳を考えていたら宿題をする時間がなくなりました。","choices":["友達と考えよう","それも思い出になる","先生に相談しよう"],"ends":["一週間後、宿題の言い訳を研究する子から二通目。\n「友達と考えよう」を実行する前に、完璧な言い訳を考えていたら宿題をする時間がなくなりましたという話を思い出したらしい。\nさっそく試してみたそうだ。最初に笑った人が、最後は黙り込んだ。\n「続きができたら、また書きます」で終わっていた。","次の朝、封筒に宿題の言い訳を研究する子の名前があった。\n「それも思い出になる」の通りにするか迷った末、少しだけ勇気を出してみた。\n完璧な言い訳を考えていたら宿題をする時間がなくなりました。そこから思いもしないことが起きた。思わぬところで拍手が起きた。\n最後の一行だけ、やけに字が大きかった。","二日後、宿題の言い訳を研究する子が、例の「完璧な言い訳を考えていたら宿題をする時間がなくなりました」について書いてきた。\n「先生に相談しよう」の返事をきっかけに、まず紙に書き出してみた。\n一人だけ、まったく別の解釈をした。\n追伸には「次は自分で決めてみます」とあった。"]}},{"ja":{"from":"差出人：文化祭の看板担当","body":"「ようこそ」を大きく書きすぎて、何の祭りかわからなくなりました。","choices":["それも思い出になる","先生に相談しよう","友達と考えよう"],"ends":["日付のない追伸が届いた。文化祭の看板担当が、例の「「ようこそ」を大きく書きすぎて、何の祭りかわからなくなりました」について書いてきた。\n「それも思い出になる」の返事をきっかけに、少しだけ勇気を出してみた。\n周囲は納得したが、本人だけ納得していない。\n追伸には「次は自分で決めてみます」とあった。","翌週、文化祭の看板担当から二通目。\n「先生に相談しよう」を実行する前に、「ようこそ」を大きく書きすぎて、何の祭りかわからなくなりましたという話を思い出したらしい。\n誰にも言わずに実行した。周囲は納得したが、本人だけ納得していない。\n封筒には、なぜか二枚目の切手が貼ってあった。","雨が降った日、封筒に文化祭の看板担当の名前があった。\n「友達と考えよう」の通りにするか迷った末、返事を見て、予定を変更した。\n「ようこそ」を大きく書きすぎて、何の祭りかわからなくなりました。そこから思いもしないことが起きた。周囲は納得したが、本人だけ納得していない。\n追伸には「次は自分で決めてみます」とあった。"]},"en":{"from":"差出人：文化祭の看板担当","body":"「ようこそ」を大きく書きすぎて、何の祭りかわからなくなりました。","choices":["それも思い出になる","先生に相談しよう","友達と考えよう"],"ends":["日付のない追伸が届いた。文化祭の看板担当が、例の「「ようこそ」を大きく書きすぎて、何の祭りかわからなくなりました」について書いてきた。\n「それも思い出になる」の返事をきっかけに、少しだけ勇気を出してみた。\n周囲は納得したが、本人だけ納得していない。\n追伸には「次は自分で決めてみます」とあった。","翌週、文化祭の看板担当から二通目。\n「先生に相談しよう」を実行する前に、「ようこそ」を大きく書きすぎて、何の祭りかわからなくなりましたという話を思い出したらしい。\n誰にも言わずに実行した。周囲は納得したが、本人だけ納得していない。\n封筒には、なぜか二枚目の切手が貼ってあった。","雨が降った日、封筒に文化祭の看板担当の名前があった。\n「友達と考えよう」の通りにするか迷った末、返事を見て、予定を変更した。\n「ようこそ」を大きく書きすぎて、何の祭りかわからなくなりました。そこから思いもしないことが起きた。周囲は納得したが、本人だけ納得していない。\n追伸には「次は自分で決めてみます」とあった。"]}},{"ja":{"from":"差出人：理科室の窓際担当","body":"育てている豆苗が私より先に卒業しそうです。卒業証書を作れますか。","choices":["先生に相談しよう","友達と考えよう","それも思い出になる"],"ends":["週末になって、理科室の窓際担当から二通目。\n「先生に相談しよう」を実行する前に、育てている豆苗が私より先に卒業しそうですという話を思い出したらしい。\nさっそく試してみたそうだ。最初に笑った人が、最後は黙り込んだ。\n「誰にも内緒にしてください」と、しっかり赤字で書かれていた。","返事を出した翌朝、封筒に理科室の窓際担当の名前があった。\n「友達と考えよう」の通りにするか迷った末、半信半疑で動いてみたらしい。\n育てている豆苗が私より先に卒業しそうです。そこから思いもしないことが起きた。なぜか小さな行列ができた。\n封筒には、なぜか二枚目の切手が貼ってあった。","数時間後、理科室の窓際担当が報告してきた。\n「それも思い出になる」という一言がきっかけで、誰にも言わずに実行した。\n「育てている豆苗が私より先に卒業しそうです」と悩んでいた頃とは、少し様子が違う。説明を求められ、余計に話が大きくなった。\n「たぶんこれでよかった」と短く締めくくられていた。"]},"en":{"from":"差出人：理科室の窓際担当","body":"育てている豆苗が私より先に卒業しそうです。卒業証書を作れますか。","choices":["先生に相談しよう","友達と考えよう","それも思い出になる"],"ends":["週末になって、理科室の窓際担当から二通目。\n「先生に相談しよう」を実行する前に、育てている豆苗が私より先に卒業しそうですという話を思い出したらしい。\nさっそく試してみたそうだ。最初に笑った人が、最後は黙り込んだ。\n「誰にも内緒にしてください」と、しっかり赤字で書かれていた。","返事を出した翌朝、封筒に理科室の窓際担当の名前があった。\n「友達と考えよう」の通りにするか迷った末、半信半疑で動いてみたらしい。\n育てている豆苗が私より先に卒業しそうです。そこから思いもしないことが起きた。なぜか小さな行列ができた。\n封筒には、なぜか二枚目の切手が貼ってあった。","数時間後、理科室の窓際担当が報告してきた。\n「それも思い出になる」という一言がきっかけで、誰にも言わずに実行した。\n「育てている豆苗が私より先に卒業しそうです」と悩んでいた頃とは、少し様子が違う。説明を求められ、余計に話が大きくなった。\n「たぶんこれでよかった」と短く締めくくられていた。"]}},{"ja":{"from":"差出人：校庭の端で歌う合唱部員","body":"声が小さいので一人で練習していたら、鳥が伴奏してくれるようになりました。","choices":["友達と考えよう","それも思い出になる","先生に相談しよう"],"ends":["三日後、校庭の端で歌う合唱部員が、例の「声が小さいので一人で練習していたら、鳥が伴奏してくれるようになりました」について書いてきた。\n「友達と考えよう」の返事をきっかけに、本当にその通りにしたらしい。\nその場では何も起きなかった。翌日になって効いてきた。\n「続きができたら、また書きます」で終わっていた。","数時間後、封筒に校庭の端で歌う合唱部員の名前があった。\n「それも思い出になる」の通りにするか迷った末、さっそく試してみたそうだ。\n声が小さいので一人で練習していたら、鳥が伴奏してくれるようになりました。そこから思いもしないことが起きた。なぜか関係ない人が一番喜んだ。\n追伸には「次は自分で決めてみます」とあった。","三日後、校庭の端で歌う合唱部員から追伸が来た。\n「先生に相談しよう」を選んだことを伝えると、一度はやめかけたが、結局実行した。\n声が小さいので一人で練習していたら、鳥が伴奏してくれるようになりました――その話が、今度は別の意味で広まっている。一人だけ、まったく別の解釈をした。\n次の手紙には、なぜか謝礼のつもりのシールが入っていた。"]},"en":{"from":"差出人：校庭の端で歌う合唱部員","body":"声が小さいので一人で練習していたら、鳥が伴奏してくれるようになりました。","choices":["友達と考えよう","それも思い出になる","先生に相談しよう"],"ends":["三日後、校庭の端で歌う合唱部員が、例の「声が小さいので一人で練習していたら、鳥が伴奏してくれるようになりました」について書いてきた。\n「友達と考えよう」の返事をきっかけに、本当にその通りにしたらしい。\nその場では何も起きなかった。翌日になって効いてきた。\n「続きができたら、また書きます」で終わっていた。","数時間後、封筒に校庭の端で歌う合唱部員の名前があった。\n「それも思い出になる」の通りにするか迷った末、さっそく試してみたそうだ。\n声が小さいので一人で練習していたら、鳥が伴奏してくれるようになりました。そこから思いもしないことが起きた。なぜか関係ない人が一番喜んだ。\n追伸には「次は自分で決めてみます」とあった。","三日後、校庭の端で歌う合唱部員から追伸が来た。\n「先生に相談しよう」を選んだことを伝えると、一度はやめかけたが、結局実行した。\n声が小さいので一人で練習していたら、鳥が伴奏してくれるようになりました――その話が、今度は別の意味で広まっている。一人だけ、まったく別の解釈をした。\n次の手紙には、なぜか謝礼のつもりのシールが入っていた。"]}},{"ja":{"from":"差出人：学級新聞の編集長","body":"今月のニュースが「消しゴムが見つかった」だけです。号外にしていいですか。","choices":["それも思い出になる","先生に相談しよう","友達と考えよう"],"ends":["帰り道で、学級新聞の編集長から二通目。\n「それも思い出になる」を実行する前に、今月のニュースが「消しゴムが見つかった」だけですという話を思い出したらしい。\n最初は笑ったが、試してみた。結果より、その途中の顔が忘れられないらしい。\n「これ、成功ってことでいいですか」と最後に書いてあった。","一週間後、学級新聞の編集長から追伸が来た。\n「先生に相談しよう」を選んだことを伝えると、本当にその通りにしたらしい。\n今月のニュースが「消しゴムが見つかった」だけです――その話が、今度は別の意味で広まっている。意外にも反対する人がいなかった。\n最後の一行だけ、やけに字が大きかった。","数時間後、短い手紙が届いた。差出人は学級新聞の編集長。\n「友達と考えよう」と返したら、最初は笑ったが、試してみた。\n例の「今月のニュースが「消しゴムが見つかった」だけです」の件は、ところが、話を聞いていた人のほうが先に動いた。\nその後どうなったかは、まだ誰も知らない。"]},"en":{"from":"差出人：学 。\n「家族に話してみよう」を実行する前に、家族の服をこっそり直してきましたという話を思い出したらしい。\n思い切って口に出してみた。いちばん驚いたのは本人だった。\nその後どうなったかは、まだ誰も知らない。"]}},{"ja":{"from":"差出人：兄弟で冷蔵庫の棚を分けた家","body":"一番上の棚が空いています。誰の領土かで毎晩会議になります。","choices":["今のままでもいい","家族に話してみよう","一緒に笑おう"],"ends":["二日後、封筒に兄弟で冷蔵庫の棚を分けた家の名前があった。\n「今のままでもいい」の通りにするか迷った末、最初は笑ったが、試してみた。\n一番上の棚が空いています。そこから思いもしないことが起きた。それが新しい習慣になりそうだ。\n次の手紙には、なぜか謝礼のつもりのシールが入っていた。","週末になって、兄弟で冷蔵庫の棚を分けた家が報告してきた。\n「家族に話してみよう」という一言がきっかけで、思ったより真剣に受け取られた。\n「一番上の棚が空いています」と悩んでいた頃とは、少し様子が違う。その場では何も起きなかった。翌日になって効いてきた。\n最後の一行だけ、やけに字が大きかった。","週末になって、兄弟で冷蔵庫の棚を分けた家が報告してきた。\n「一緒に笑おう」という一言がきっかけで、本当にその通りにしたらしい。\n「一番上の棚が空いています」と悩んでいた頃とは、少し様子が違う。結果より、その途中の顔が忘れられないらしい。\n最後の一行だけ、やけに字が大きかった。"]},"en":{"from":"差出人：兄弟で冷蔵庫の棚を分けた家","body":"一番上の棚が空いています。誰の領土かで毎晩会議になります。","choices":["今のままでもいい","家族に話してみよう","一緒に笑おう"],"ends":["二日後、封筒に兄弟で冷蔵庫の棚を分けた家の名前があった。\n「今のままでもいい」の通りにするか迷った末、最初は笑ったが、試してみた。\n一番上の棚が空いています。そこから思いもしないことが起きた。それが新しい習慣になりそうだ。\n次の手紙には、なぜか謝礼のつもりのシールが入っていた。","週末になって、兄弟で冷蔵庫の棚を分けた家が報告してきた。\n「家族に話してみよう」という一言がきっかけで、思ったより真剣に受け取られた。\n「一番上の棚が空いています」と悩んでいた頃とは、少し様子が違う。その場では何も起きなかった。翌日になって効いてきた。\n最後の一行だけ、やけに字が大きかった。","週末になって、兄弟で冷蔵庫の棚を分けた家が報告してきた。\n「一緒に笑おう」という一言がきっかけで、本当にその通りにしたらしい。\n「一番上の棚が空いています」と悩んでいた頃とは、少し様子が違う。結果より、その途中の顔が忘れられないらしい。\n最後の一行だけ、やけに字が大きかった。"]}},{"ja":{"from":"差出人：母の誕生日を毎月祝う子","body":"一度忘れたお詫びに毎月祝っています。母はもう年齢を数えたくないそうです。","choices":["家族に話してみよう","一緒に笑おう","今のままでもいい"],"ends":["次の月曜日、母の誕生日を毎月祝う子から追伸が来た。\n「家族に話してみよう」を選んだことを伝えると、一度はやめかけたが、結局実行した。\n一度忘れたお詫びに毎月祝っています――その話が、今度は別の意味で広まっている。それが新しい習慣になりそうだ。\n「今度はあなたの話も聞かせて」と書き添えられていた。","次の朝、母の誕生日を毎月祝う子から追伸が来た。\n「一緒に笑おう」を選んだことを伝えると、最初は笑ったが、試してみた。\n一度忘れたお詫びに毎月祝っています――その話が、今度は別の意味で広まっている。思わぬところで拍手が起きた。\n「今度はあなたの話も聞かせて」と書き添えられていた。","翌日の昼、短い手紙が届いた。差出人は母の誕生日を毎月祝う子。\n「今のままでもいい」と返したら、少しだけ勇気を出してみた。\n例の「一度忘れたお詫びに毎月祝っています」の件は、結果より、その途中の顔が忘れられないらしい。\n「これ、成功ってことでいいですか」と最後に書いてあった。"]},"en":{"from":"差出人：母の誕生日を毎月祝う子","body":"一度忘れたお詫びに毎月祝っています。母はもう年齢を数えたくないそうです。","choices":["家族に話してみよう","一緒に笑おう","今のままでもいい"],"ends":["次の月曜日、母の誕生日を毎月祝う子から追伸が来た。\n「家族に話してみよう」を選んだことを伝えると、一 様子が違う。誰も予想していない方向に話が進んだ。\nその後どうなったかは、まだ誰も知らない。"]},"en":{"from":"差出人：家族写真の撮影係","body":"十年間ずっと私だけ写っていません。三脚を買う勇気が出ません。","choices":["今のままでもいい","家族に話してみよう","一緒に笑おう"],"ends":["数時間後、家族写真の撮影係から追伸が来た。\n「今のままでもいい」を選んだことを伝えると、誰にも言わずに実行した。\n十年間ずっと私だけ写っていません――その話が、今度は別の意味で広まっている。その場では何も起きなかった。翌日になって効いてきた。\n「続きができたら、また書きます」で終わっていた。","翌日の昼、封筒に家族写真の撮影係の名前があった。\n「家族に話してみよう」の通りにするか迷った末、少しだけ勇気を出してみた。\n十年間ずっと私だけ写っていません。そこから思いもしないことが起きた。その場では何も起きなかった。翌日になって効いてきた。\n「今度はあなたの話も聞かせて」と書き添えられていた。","しばらくして、家族写真の撮影係が報告してきた。\n「一緒に笑おう」という一言がきっかけで、少しだけ勇気を出してみた。\n「十年間ずっと私だけ写っていません」と悩んでいた頃とは、少し様子が違う。誰も予想していない方向に話が進んだ。\nその後どうなったかは、まだ誰も知らない。"]}},{"ja":{"from":"差出人：お年玉を封筒ごと貯める子","body":"中身を数えずに大人になりました。今さら開けるのが怖いです。","choices":["家族に話してみよう","一緒に笑おう","今のままでもいい"],"ends":["数時間後、封筒にお年玉を封筒ごと貯める子の名前があった。\n「家族に話してみよう」の通りにするか迷った末、さっそく試してみたそうだ。\n中身を数えずに大人になりました。そこから思いもしないことが起きた。それが新しい習慣になりそうだ。\n追伸には「次は自分で決めてみます」とあった。","日付のない追伸が届いた。短い手紙が届いた。差出人はお年玉を封筒ごと貯める子。\n「一緒に笑おう」と返したら、一度はやめかけたが、結局実行した。\n例の「中身を数えずに大人になりました」の件は、相手が先に謝ってきた。\nその後どうなったかは、まだ誰も知らない。","二日後、封筒にお年玉を封筒ごと貯める子の名前があった。\n「今のままでもいい」の通りにするか迷った末、少しだけ勇気を出してみた。\n中身を数えずに大人になりました。そこから思いもしないことが起きた。いちばん驚いたのは本人だった。\n「誰にも内緒にしてください」と、しっかり赤字で書かれていた。"]},"en":{"from":"差出人：お年玉を封筒ごと貯める子","body":"中身を数えずに大人になりました。今さら開けるのが怖いです。","choices":["家族に話してみよう","一緒に笑おう","今のままでもいい"],"ends":["数時間後、封筒にお年玉を封筒ごと貯める子の名前があった。\n「家族に話してみよう」の通りにするか迷った末、さっそく試してみたそうだ。\n中身を数えずに大人になりました。そこから思いもしないことが起きた。それが新しい習慣になりそうだ。\n追伸には「次は自分で決めてみます」とあった。","日付のない追伸が届いた。短い手紙が届いた。差出人はお年玉を封筒ごと貯める子。\n「一緒に笑おう」と返したら、一度はやめかけたが、結局実行した。\n例の「中身を数えずに大人になりました」の件は、相手が先に謝ってきた。\nその後どうなったかは、まだ誰も知らない。","二日後、封筒にお年玉を封筒ごと貯める子の名前があった。\n「今のままでもいい」の通りにするか迷った末、少しだけ勇気を出してみた。\n中身を数えずに大人になりました。そこから思いもしないことが起きた。いちばん驚いたのは本人だった。\n「誰にも内緒にしてください」と、しっかり赤字で書かれていた。"]}},{"ja":{"from":"差出人：兄の部屋を借りる妹","body":"兄が独立して空いた部屋を借りました。壁の落書きだけ残すべきですか。","choices":["一緒に笑おう","今のままでもいい","家族に話してみよう"],"ends":["その日の夕方、兄の部屋を借りる妹が報告してきた。\n「一緒に笑おう」という一言がきっかけで、一度はやめかけたが、結局実行した。\n「兄が独立して空いた部屋を借りました」と悩んでいた頃とは、少し様子が違う。それが新しい習慣になりそうだ。\n封筒の裏には、小さな丸が一つ描かれていた。","次の朝、兄の部屋を借りる妹が報告してきた。\n「今のままでもいい」という一言がきっかけで、半信半疑で動いてみたらしい。\n「兄が独立して空いた部屋を借りました」と悩んでいた頃とは、少し様子が違う。一人だけ、まったく別の解釈をした。\nその後どうなったかは、まだ誰も知らない。","次の朝、兄の部屋を借りる妹から追伸が来た。\n「家族に話してみよう」を選んだことを伝えると、思ったより真剣に受け取られた。\n兄が独立して空いた部屋を借りました――その話が、今度は別の意味で広まっている。周囲は納得したが、本人だけ納得していない。\n結局、本人が一番楽しそうだった。"]},"en":{"from":"差出人：兄の部屋を借りる妹","body":"兄が独立して空いた部屋を借りました。壁の落書きだけ残すべきですか。","choices":["一緒に笑おう","今のままでもいい","家族に話してみよう"],"ends":["その日の夕方、兄の部屋を借りる妹が報告してきた。\n「一緒に笑おう」という一言がきっかけで、一度はやめかけたが、結局実行した。\n「兄が独立して空いた部屋を借りました」と悩んでいた頃とは、少し様子が違う。それが新しい習慣になりそうだ。\n封筒の裏には、小さな丸が一つ描かれていた。","次の朝、兄の部屋を借りる妹が報告してきた。\n「今のままでもいい」という一言がきっかけで、半信半疑で動いてみたらしい。\n「兄が独立して空いた部屋を借りました」と悩んでいた頃とは、少し様子が違う。一人だけ、まったく別の解釈をした。\nその後どうなったかは、まだ誰も知らない。","次の朝、兄の部屋を借りる妹から追伸が来た。\n「家族に話してみよう」を選んだことを伝えると、思ったより真剣に受け取られた。\n兄が独立して空いた部屋を借りました――その話が、今度は別の意味で広まっている。周囲は納得したが、本人だけ納得していない。\n結局、本人が一番楽しそうだった。"]}},{"ja":{"from":"差出人：父の日に父を探す父","body":"毎年自分が何をもらったか忘れます。今年は家族が写真を見せてくれました。","choices":["今のままでもいい","家族に話してみよう","一緒に笑おう"],"ends":["数時間後、父の日に父を探す父から追伸が来た。\n「今のままでもいい」を選んだことを伝えると、さっそく試してみたそうだ。\n毎年自分が何をもらったか忘れます――その話が、今度は別の意味で広まっている。返事を見せたら、別の相談が始まった。\n次の手紙には、なぜか謝礼のつもりのシールが入っていた。","二日後、短い手紙が届いた。差出人は父の日に父を探す父。\n「家族に話してみよう」と返したら、さっそく試してみたそうだ。\n例の「毎年自分が何をもらったか忘れます」の件は、その場では何も起きなかった。翌日になって効いてきた。\n「たぶんこれでよかった」と短く締めくくられていた。","数時間後、父の日に父を探す父から追伸が来た。\n「一緒に笑おう」を選んだことを伝えると、少しだけ勇気を出してみた。\n毎年自分が何をもらったか忘れます――その話が、今度は別の意味で広まっている。いちばん驚いたのは本人だった。\n「今度はあなたの話も聞かせて」と書き添えられていた。"]},"en":{"from":"差出人：父の日に父を探す父","body":"毎年自分が何をもらったか忘れます。今年は家族が写真を見せてくれました。","choices":["今のままでもいい","家族に話してみよう","一緒に笑おう"],"ends":["数時間後、父の日に父を探す父から追伸が来た。\n「今のままでもいい」を選んだことを伝えると、さっそく試してみたそうだ。\n毎年自分が何をもらったか忘れます――その話が、今度は別の意味で広まっている。返事を見せたら、別の相談が始まった。\n次の手紙には、なぜか謝礼のつもりのシールが入っていた。","二日後、短い手紙が届いた。差出人は父の日に父を探す父。\n「家族に話してみよう」と返したら、さっそく試してみたそうだ。\n例の「毎年自分が何をもらったか忘れます」の件は、その場では何も起きなかった。翌日になって効いてきた。\n「たぶんこれでよかった」と短く締めくくられていた。","数時間後、父の日に父を探す父から追伸が来た。\n「一緒に笑おう」を選んだことを伝えると、少しだけ勇気を出してみた。\n毎年自分が何をもらったか忘れます――その話が、今度は別の意味で広まっている。いちばん驚いたのは本人だった。\n「今度はあなたの話も聞かせて」と書き添えられていた。"]}},{"ja":{"from":"差出人：祖父の昔話を録音する孫","body":"同じ話が毎回少しずつ違います。どれを本当として残せばいいですか。","choices":["家族に話してみよう","一緒に笑おう","今のままでもいい"],"ends":["その日の夕方、封筒に祖父の昔話を録音する孫の名前があった。\n「家族に話してみよう」の通りにするか迷った末、まず紙に書き出してみた。\n同じ話が毎回少しずつ違います。そこから思いもしないことが起きた。周囲は納得したが、本人だけ納得していない。\n封筒の裏には、小さな丸が一つ描かれていた。","雨が降った日、祖父の昔話を録音する孫が報告してきた。\n「一緒に笑おう」という一言がきっかけで、一度はやめかけたが、結局実行した。\n「同じ話が毎回少しずつ違います」と悩んでいた頃とは、少し様子が違う。それが新しい習慣になりそうだ。\n最後の一行だけ、やけに字が大きかった。","数時間後、祖父の昔話を録音する孫が報告してきた。\n「今のままでもいい」という一言がきっかけで、まず紙に書き出してみた。\n「同じ話が毎回少しずつ違います」と悩んでいた頃とは、少し様子が違う。最初に笑った人が、最後は黙り込んだ。\n封筒の裏には、小さな丸が一つ描かれていた。"]},"en":{"from":"差出人：祖父の昔話を録音する孫","body":"同じ話が毎回少しずつ違います。どれを本当として残せばいいですか。","choices":["家族に話してみよう","一緒に笑おう","今のままでもいい"],"ends":["その日の夕方、封筒に祖父の昔話を録音する孫の名前があった。\n「家族に話してみよう」の通りにするか迷った末、まず紙に書き出してみた。\n同じ話が毎回少しずつ違います。そこから思いもしないことが起きた。周囲は納得したが、本人だけ納得していない。\n封筒の裏には、小さな丸が一つ描かれていた。","雨が降った日、祖父の昔話を録音する孫が報告してきた。\n「一緒に笑おう」という一言がきっかけで、一度はやめかけたが、結局実行した。\n「同じ話が毎回少しずつ違います」と悩んでいた頃とは、少し様子が違う。それが新しい習慣になりそうだ。\n最後の一行だけ、やけに字が大きかった。","数時間後、祖父の昔話を録音する孫が報告してきた。\n「今のままでもいい」という一言がきっかけで、まず紙に書き出してみた。\n「同じ話が毎回少しずつ違います」と悩んでいた頃とは、少し様子が違う。最初に笑った人が、最後は黙り込んだ。\n封筒の裏には、小さな丸が一つ描かれていた。"]}},{"ja":{"from":"差出人：家族会議の司会をする小学生","body":"議題が夕飯なのに父が予算案を持ってきます。議長権限で止められますか。","choices":["一緒に笑おう","今のままでもいい","家族に話してみよう"],"ends":["その日の夕方、封筒に家族会議の司会をする小学生の名前があった。\n「一緒に笑おう」の通りにするか迷った末、本当にその通りにしたらしい。\n議題が夕飯なのに父が予算案を持ってきます。そこから思いもしないことが起きた。ところが、話を聞いていた人のほうが先に動いた。\n「たぶんこれでよかった」と短く締めくくられていた。","その夜、封筒に家族会議の司会をする小学生の名前があった。\n「今のままでもいい」の通りにするか迷った末、誰にも言わずに実行した。\n議題が夕飯なのに父が予算案を持ってきます。そこから思いもしないことが起きた。説明を求められ、余計に話が大きくなった。\n封筒の裏には、小さな丸が一つ描かれていた。","翌日の昼、家族会議の司会をする小学生から追伸が来た。\n「家族に話してみよう」を選んだことを伝えると、さっそく試してみたそうだ。\n議題が夕飯なのに父が予算案を持ってきます――その話が、今度は別の意味で広まっている。なぜか関係ない人が一番喜んだ。\n結局、本人が一番楽しそうだった。"]},"en":{"from":"差出人：家族会議の司会をする小学生","body":"議題が夕飯なのに父が予算案を持ってきます。議長権限で止められますか。","choices":["一緒に笑おう","今のままでもいい","家族に話してみよう"],"ends":["その日の夕方、封筒に家族会議の司会をする小学生の名前があった。\n「一緒に笑おう」の通りにするか迷った末、本当にその通りにしたらしい。\n議題が夕飯なのに父が予算案を持ってきます。そこから思いもしないことが起きた。ところが、話を聞いていた人のほうが先に動いた。\n「たぶんこれでよかった」と短く締めくくられていた。","その夜、封筒に家族会議の司会をする小学生の名前があった。\n「今のままでもいい」の通りにするか迷った末、誰にも言わずに実行した。\n議題が夕飯なのに父が予算案を持ってきます。そこから思いもしないことが起きた。説明を求められ、余計に話が大きくなった。\n封筒の裏には、小さな丸が一つ描かれていた。","翌日の昼、家族会議の司会をする小学生から追伸が来た。\n「家族に話してみよう」を選んだことを伝えると、さっそく試してみたそうだ。\n議題が夕飯なのに父が予算案を持ってきます――その話が、今度は別の意味で広まっている。なぜか関係ない人が一番喜んだ。\n結局、本人が一番楽しそうだった。"]}},{"ja":{"from":"差出人：犬のほうが先に帰宅を知る母","body":"家族が帰る五分前に犬が玄関へ行きます。私の連絡網より優秀です。","choices":["今のままでもいい","家族に話してみよう","一緒に笑おう"],"ends":["返事を出した翌朝、犬のほうが先に帰宅を知る母から追伸が来た。\n「今のままでもいい」を選んだことを伝えると、一度はやめかけたが、結局実行した。\n家族が帰る五分前に犬が玄関へ行きます――その話が、今度は別の意味で広まっている。思わぬところで拍手が起きた。\n「続きができたら、また書きます」で終わっていた。","数時間後、封筒に犬のほうが先に帰宅を知る母の名前があった。\n「家族に話してみよう」の通りにするか迷った末、半信半疑で動いてみたらしい。\n家族が帰る五分前に犬が玄関へ行きます。そこから思いもしないことが起きた。相手が先に謝ってきた。\n追伸には「次は自分で決めてみます」とあった。","その日の夕方、犬のほうが先に帰宅を知る母が、例の「家族が帰る五分前に犬が玄関へ行きます」について書いてきた。\n「一緒に笑おう」の返事をきっかけに、半信半疑で動いてみたらしい。\n結果より、その途中の顔が忘れられないらしい。\n封筒の裏には、小さな丸が一つ描かれていた。"]},"en":{"from":"差出人：犬のほうが先に帰宅を知る母","body":"家族が帰る五分前に犬が玄関へ行きます。私の連絡網より優秀です。","choices":["今のままでもいい","家族に話してみよう","一緒に笑おう"],"ends":["返事を出した翌朝、犬のほうが先に帰宅を知る母から追伸が来た。\n「今のままでもいい」を選んだことを伝えると、一度はやめかけたが、結局実行した。\n家族が帰る五分前に犬が玄関へ行きます――その話が、今度は別の意味で広まっている。思わぬところで拍手が起きた。\n「続きができたら、また書きます」で終わっていた。","数時間後、封筒に犬のほうが先に帰宅を知る母の名前があった。\n「家族に話してみよう」の通りにするか迷った末、半信半疑で動いてみたらしい。\n家族が帰る五分前に犬が玄関へ行きます。そこから思いもしないことが起きた。相手が先に謝ってきた。\n追伸には「次は自分で決めてみます」とあった。","その日の夕方、犬のほうが先に帰宅を知る母が、例の「家族が帰る五分前に犬が玄関へ行きます」について書いてきた。\n「一緒に笑おう」の返事をきっかけに、半信半疑で動いてみたらしい。\n結果より、その途中の顔が忘れられないらしい。\n封筒の裏には、小さな丸が一つ描かれていた。"]}},{"ja":{"from":"差出人：初めて一人暮らしする父","body":"単身赴任で初めて自炊しました。卵焼きの写真を家族全員に送りました。","choices":["家族に話してみよう","一緒に笑おう","今のままでもいい"],"ends":["次の朝、初めて一人暮らしする父から二通目。\n「家族に話してみよう」を実行する前に、単身赴任で初めて自炊しましたという話を思い出したらしい。\n少しだけ勇気を出してみた。なぜか関係ない人が一番喜んだ。\n追伸には「次は自分で決めてみます」とあった。","その日の夕方、初めて一人暮らしする父から二通目。\n「一緒に笑おう」を実行する前に、単身赴任で初めて自炊しましたという話を思い出したらしい。\n半信半疑で動いてみたらしい。返事を見せたら、別の相談が始まった。\n追伸には「次は自分で決めてみます」とあった。","次の月曜日、封筒に初めて一人暮らしする父の名前があった。\n「今のままでもいい」の通りにするか迷った末、一度はやめかけたが、結局実行した。\n単身赴任で初めて自炊しました。そこから思いもしないことが起きた。相手が先に謝ってきた。\n「今度はあなたの話も聞かせて」と書き添えられていた。"]},"en":{"from":"差出人：初めて一人暮らしする父","body":"単身赴任で初めて自炊しました。卵焼きの写真を家族全員に送りました。","choices":["家族に話してみよう","一緒に笑おう","今のままでもいい"],"ends":["次の朝、初めて一人暮らしする父から二通目。\n「家族に話してみよう」を実行する前に、単身赴任で初めて自炊しましたという話を思い出したらしい。\n少しだけ勇気を出してみた。なぜか関係ない人が一番喜んだ。\n追伸には「次は自分で決めてみます」とあった。","その日の夕方、初めて一人暮らしする父から二通目。\n「一緒に笑おう」を実行する前に、単身赴任で初めて自炊しましたという話を思い出したらしい。\n半信半疑で動いてみたらしい。返事を見せたら、別の相談が始まった。\n追伸には「次は自分で決めてみます」とあった。","次の月曜日、封筒に初めて一人暮らしする父の名前があった。\n「今のままでもいい」の通りにするか迷った末、一度はやめかけたが、結局実行した。\n単身赴任で初めて自炊しました。そこから思いもしないことが起きた。相手が先に謝ってきた。\n「今度はあなたの話も聞かせて」と書き添えられていた。"]}},{"ja":{"from":"差出人：商店街の最後の写真屋","body":"証明写真よりペットの記念写真が増えました。背景を花畑にしていいですか。","choices":["小さく始めよう","町の宝物にしよう","常連に聞いてみよう"],"ends":["次の朝、商店街の最後の写真屋が報告してきた。\n「小さく始めよう」という一言がきっかけで、誰にも言わずに実行した。\n「証明写真よりペットの記念写真が増えました」と悩んでいた頃とは、少し様子が違う。それが新しい習慣になりそうだ。\n「今度はあなたの話も聞かせて」と書き添えられていた。","雨が降った日、短い手紙が届いた。差出人は商店街の最後の写真屋。\n「町の宝物にしよう」と返したら、誰にも言わずに実行した。\n例の「証明写真よりペットの記念写真が増えました」の件は、最初に笑った人が、最後は黙り込んだ。\n追伸には「次は自分で決めてみます」とあった。","翌週、短い手紙が届いた。差出人は商店街の最後の写真屋。\n「常連に聞いてみよう」と返したら、本当にその通りにしたらしい。\n例の「証明写真よりペットの記念写真が増えました」の件は、周囲は納得したが、本人だけ納得していない。\n「今度はあなたの話も聞かせて」と書き添えられていた。"]},"en":{"from":"差出人：商店街の最後の写真屋","body":"証明写真よりペットの記念写真が増えました。背景を花畑にしていいですか。","choices":["小さく始めよう","町の宝物にしよう","常連に聞いてみよう"],"ends":["次の朝、商店街の最後の写真屋が報告してきた。\n「小さく始めよう」という一言がきっかけで、誰にも言わずに実行した。\n「証明写真よりペットの記念写真が増えました」と悩んでいた頃とは、少し様子が違う。それが新しい習慣になりそうだ。\n「今度はあなたの話も聞かせて」と書き添えられていた。","雨が降った日、短い手紙が届いた。差出人は商店街の最後の写真屋。\n「町の宝物にしよう」と返したら、誰にも言わずに実行した。\n例の「証明写真よりペットの記念写真が増えました」の件は、最初に笑った人が、最後は黙り込んだ。\n追伸には「次は自分で決めてみます」とあった。","翌週、短い手紙が届いた。差出人は商店街の最後の写真屋。\n「常連に聞いてみよう」と返したら、本当にその通りにしたらしい。\n例の「証明写真よりペットの記念写真が増えました」の件は、周囲は納得したが、本人だけ納得していない。\n「今度はあなたの話も聞かせて」と書き添えられていた。"]}},{"ja":{"from":"差出人：信号を待つのが好きな老人","body":"青になっても渡らず景色を見ています。周りが心配するので困ります。","choices":["町の宝物にしよう","常連に聞いてみよう","小さく始めよう"],"ends":["帰り道で、信号を待つのが好きな老人が、例の「青になっても渡らず景色を見ています」について書いてきた。\n「町の宝物にしよう」の返事をきっかけに、さっそく試してみたそうだ。\nその場では何も起きなかった。翌日になって効いてきた。\nその後どうなったかは、まだ誰も知らない。","しばらくして、短い手紙が届いた。差出人は信号を待つのが好きな老人。\n「常連に聞いてみよう」と返したら、返事を見て、予定を変更した。\n例の「青になっても渡らず景色を見ています」の件は、思わぬところで拍手が起きた。\n次の手紙には、なぜか謝礼のつもりのシールが入っていた。","その夜、信号を待つのが好きな老人から二通目。\n「小さく始めよう」を実行する前に、青になっても渡らず景色を見ていますという話を思い出したらしい。\n一度はやめかけたが、結局実行した。周囲は納得したが、本人だけ納得していない。\n「これ、成功ってことでいいですか」と最後に書いてあった。"]},"en":{"from":"差出人：信号を待つのが好きな老人","body":"青になっても渡らず景色を見ています。周りが心配するので困ります。","choices":["町の宝物にしよう","常連に聞いてみよう","小さく始めよう"],"ends":["帰り道で、信号を待つのが好きな老人が、例の「青になっても渡らず景色を見ています」について書いてきた。\n「町の宝物にしよう」の返事をきっかけに、さっそく試してみたそうだ。\nその場では何も起きなかった。翌日になって効いてきた。\nその後どうなったかは、まだ誰も知らない。","しばらくして、短い手紙が届いた。差出人は信号を待つのが好きな老人。\n「常連に聞いてみよう」と返したら、返事を見て、予定を変更した。\n例の「青になっても渡らず景色を見ています」の件は、思わぬところで拍手が起きた。\n次の手紙には、なぜか謝礼のつもりのシールが入っていた。","その夜、信号を待つのが好きな老人から二通目。\n「小さく始めよう」を実行する前に、青になっても渡らず景色を見ていますという話を思い出したらしい。\n一度はやめかけたが、結局実行した。周囲は納得したが、本人だけ納得していない。\n「これ、成功ってことでいいですか」と最後に書いてあった。"]}},{"ja":{"from":"差出人：夜だけ開く花屋","body":"夜勤帰りの人が花を買っていきます。花の名前より眠り方を聞かれます。","choices":["常連に聞いてみよう","小さく始めよう","町の宝物にしよう"],"ends":["雨が降った日、夜だけ開く花屋から追伸が来た。\n「常連に聞いてみよう」を選んだことを伝えると、本当にその通りにしたらしい。\n夜勤帰りの人が花を買っていきます――その話が、今度は別の意味で広まっている。なぜか小さな行列ができた。\n「たぶんこれでよかった」と短く締めくくられていた。","二日後、夜だけ開く花屋から二通目。\n「小さく始めよう」を実行する前に、夜勤帰りの人が花を買っていきますという話を思い出したらしい。\n本当にその通りにしたらしい。最初に笑った人が、最後は黙り込んだ。\nその後どうなったかは、まだ誰も知らない。","帰り道で、夜だけ開く花屋から追伸が来た。\n「町の宝物にしよう」を選んだことを伝えると、少しだけ勇気を出してみた。\n夜勤帰りの人が花を買っていきます――その話が、今度は別の意味で広まっている。ところが、話を聞いていた人のほうが先に動いた。\n封筒の裏には、小さな丸が一つ描かれていた。"]},"en":{"from":"差出人：夜だけ開く花屋","body":"夜勤帰りの人が花を買っていきます。花の名前より眠り方を聞かれます。","choices":["常連に聞いてみよう","小さく始めよう","町の宝物にしよう"],"ends":["雨が降った日、夜だけ開く花屋から追伸が来た。\n「常連に聞いてみよう」を選んだことを伝えると、本当にその通りにしたらしい。\n夜勤帰りの人が花を買っていきます――その話が、今度は別の意味で広まっている。なぜか小さな行列ができた。\n「たぶんこれでよかった」と短く締めくくられていた。","二日後、夜だけ開く花屋から二通目。\n「小さく始めよう」を実行する前に、夜勤帰りの人が花を買っていきますという話を思い出したらしい。\n本当にその通りにしたらしい。最初に笑った人が、最後は黙り込んだ。\nその後どうなったかは、まだ誰も知らない。","帰り道で、夜だけ開く花屋から追伸が来た。\n「町の宝物にしよう」を選んだことを伝えると、少しだけ勇気を出してみた。\n夜勤帰りの人が花を買っていきます――その話が、今度は別の意味で広まっている。ところが、話を聞いていた人のほうが先に動いた。\n封筒の裏には、小さな丸が一つ描かれていた。"]}},{"ja":{"from":"差出人：公園の時計を直す職人","body":"五分遅れを直したら、毎朝の散歩仲間が会えなくなりました。","choices":["小さく始めよう","町の宝物にしよう","常連に聞いてみよう"],"ends":["帰り道で、短い手紙が届いた。差出人は公園の時計を直す職人。\n「小さく始めよう」と返したら、思ったより真剣に受け取られた。\n例の「五分遅れを直したら、毎朝の散歩仲間が会えなくなりました」の件は、返事を見せたら、別の相談が始まった。\n封筒には、なぜか二枚目の切手が貼ってあった。","しばらくして、公園の時計を直す職人から追伸が来た。\n「町の宝物にしよう」を選んだことを伝えると、さっそく試してみたそうだ。\n五分遅れを直したら、毎朝の散歩仲間が会えなくなりました――その話が、今度は別の意味で広まっている。結果より、その途中の顔が忘れられないらしい。\n「今度はあなたの話も聞かせて」と書き添えられていた。","その夜、公園の時計を直す職人から追伸が来た。\n「常連に聞いてみよう」を選んだことを伝えると、一度はやめかけたが、結局実行した。\n五分遅れを直したら、毎朝の散歩仲間が会えなくなりました――その話が、今度は別の意味で広まっている。一人だけ、まったく別の解釈をした。\n結局、本人が一番楽しそうだった。"]},"en":{"from":"差出人：公園の時計を直す職人","body":"五分遅れを直したら、毎朝の散歩仲間が会えなくなりました。","choices":["小さく始めよう","町の宝物にしよう","常連に聞いてみよう"],"ends":["帰り道で、短い手紙が届いた。差出人は公園の時計を直す職人。\n「小さく始めよう」と返したら、思ったより真剣に受け取られた。\n例の「五分遅れを直したら、毎朝の散歩仲間が会えなくなりました」の件は、返事を見せたら、別の相談が始まった。\n封筒には、なぜか二枚目の切手が貼ってあった。","しばらくして、公園の時計を直す職人から追伸が来た。\n「町の宝物にしよう」を選んだことを伝えると、さっそく試してみたそうだ。\n五分遅れを直したら、毎朝の散歩仲間が会えなくなりました――その話が、今度は別の意味で広まっている。結果より、その途中の顔が忘れられないらしい。\n「今度はあなたの話も聞かせて」と書き添えられていた。","その夜、公園の時計を直す職人から追伸が来た。\n「常連に聞いてみよう」を選んだことを伝えると、一度はやめかけたが、結局実行した。\n五分遅れを直したら、毎朝の散歩仲間が会えなくなりました――その話が、今度は別の意味で広まっている。一人だけ、まったく別の解釈をした。\n結局、本人が一番楽しそうだった。"]}},{"ja":{"from":"差出人：駅前で道を教える人","body":"毎日道案内をしていたら、自分がどこへ行く予定だったか忘れました。","choices":["町の宝物にしよう","常連に聞いてみよう","小さく始めよう"],"ends":["三日後、短い手紙が届いた。差出人は駅前で道を教える人。\n「町の宝物にしよう」と返したら、予定外の相手まで巻き込んだ。\n例の「毎日道案内をしていたら、自分がどこへ行く予定だったか忘れました」の件は、返事を見せたら、別の相談が始まった。\n封筒には、なぜか二枚目の切手が貼ってあった。","翌日の昼、駅前で道を教える人が報告してきた。\n「常連に聞いてみよう」という一言がきっかけで、誰にも言わずに実行した。\n「毎日道案内をしていたら、自分がどこへ行く予定だったか忘れました」と悩んでいた頃とは、少し様子が違う。周囲は納得したが、本人だけ納得していない。\n最後の一行だけ、やけに字が大きかった。","日付のない追伸が届いた。駅前で道を教える人が、例の「毎日道案内をしていたら、自分がどこへ行く予定だったか忘れました」について書いてきた。\n「小さく始めよう」の返事をきっかけに、少しだけ勇気を出してみた。\n相手が先に謝ってきた。\n「これ、成功ってことでいいですか」と最後に書いてあった。"]},"en":{"from":"差出人：駅前で道を教える人","body":"毎日道案内をしていたら、自分がどこへ行く予定だったか忘れました。","choices":["町の宝物にしよう","常連に聞いてみよう","小さく始めよう"],"ends":["三日後、短い手紙が届いた。差出人は駅前で道を教える人。\n「町の宝物にしよう」と返したら、予定外の相手まで巻き込んだ。\n例の「毎日道案内をしていたら、自分がどこへ行く予定だったか忘れました」の件は、返事を見せたら、別の相談が始まった。\n封筒には、なぜか二枚目の切手が貼ってあった。","翌日の昼、駅前で道を教える人が報告してきた。\n「常連に聞いてみよう」という一言がきっかけで、誰にも言わずに実行した。\n「毎日道案内をしていたら、自分がどこへ行く予定だったか忘れました」と悩んでいた頃とは、少し様子が違う。周囲は納得したが、本人だけ納得していない。\n最後の一行だけ、やけに字が大きかった。","日付のない追伸が届いた。駅前で道を教える人が、例の「毎日道案内をしていたら、自分がどこへ行く予定だったか忘れました」について書いてきた。\n「小さく始めよう」の返事をきっかけに、少しだけ勇気を出してみた。\n相手が先に謝ってきた。\n「これ、成功ってことでいいですか」と最後に書いてあった。"]}},{"ja":{"from":"差出人：古本市の値札係","body":"一番好きな本に安い値段を付けられません。売る気がないと怒られました。","choices":["常連に聞いてみよう","小さく始めよう","町の宝物にしよう"],"ends":["雨が降った日、古本市の値札係から追伸が来た。\n「常連に聞いてみよう」を選んだことを伝えると、返事を見て、予定を変更した。\n一番好きな本に安い値段を付けられません――その話が、今度は別の意味で広まっている。なぜか関係ない人が一番喜んだ。\n封筒には、なぜか二枚目の切手が貼ってあった。","二日後、封筒に古本市の値札係の名前があった。\n「小さく始めよう」の通りにするか迷った末、まず紙に書き出してみた。\n一番好きな本に安い値段を付けられません。そこから思いもしないことが起きた。結果より、その途中の顔が忘れられないらしい。\nその後どうなったかは、まだ誰も知らない。","二日後、古本市の値札係が、例の「一番好きな本に安い値段を付けられません」について書いてきた。\n「町の宝物にしよう」の返事をきっかけに、一度はやめかけたが、結局実行した。\n誰も予想していない方向に話が進んだ。\n最後の一行だけ、やけに字が大きかった。"]},"en":{"from":"差出人：古本市の値札係","body":"一番好きな本に安い値段を付けられません。売る気がないと怒られました。","choices":["常連に聞いてみよう","小さく始めよう","町の宝物にしよう"],"ends":["雨が降った日、古本市の値札係から追伸が来た。\n「常連に聞いてみよう」を選んだことを伝えると、返事を見て、予定を変更した。\n一番好きな本に安い値段を付けられません――その話が、今度は別の意味で広まっている。なぜか関係ない人が一番喜んだ。\n封筒には、なぜか二枚目の切手が貼ってあった。","二日後、封筒に古本市の値札係の名前があった。\n「小さく始めよう」の通りにするか迷った末、まず紙に書き出してみた。\n一番好きな本に安い値段を付けられません。そこから思いもしないことが起きた。結果より、その途中の顔が忘れられないらしい。\nその後どうなったかは、まだ誰も知らない。","二日後、古本市の値札係が、例の「一番好きな本に安い値段を付けられません」について書いてきた。\n「町の宝物にしよう」の返事をきっかけに、一度はやめかけたが、結局実行した。\n誰も予想していない方向に話が進んだ。\n最後の一行だけ、やけに字が大きかった。"]}},{"ja":{"from":"差出人：銭湯の番台の後継ぎ","body":"常連の名前は覚えましたが、背中だけではまだ見分けられません。","choices":["小さく始めよう","町の宝物にしよう","常連に聞いてみよう"],"ends":["三日後、封筒に銭湯の番台の後継ぎの名前があった。\n「小さく始めよう」の通りにするか迷った末、さっそく試してみたそうだ。\n常連の名前は覚えましたが、背中だけではまだ見分けられません。そこから思いもしないことが起きた。それが新しい習慣になりそうだ。\n「誰にも内緒にしてください」と、しっかり赤字で書かれていた。","帰り道で、銭湯の番台の後継ぎが、例の「常連の名前は覚えましたが、背中だけではまだ見分けられません」について書いてきた。\n「町の宝物にしよう」の返事をきっかけに、返事を見て、予定を変更した。\n意外にも反対する人がいなかった。\n結局、本人が一番楽しそうだった。","数時間後、銭湯の番台の後継ぎが、例の「常連の名前は覚えましたが、背中だけではまだ見分けられません」について書いてきた。\n「常連に聞いてみよう」の返事をきっかけに、半信半疑で動いてみたらしい。\n返事を見せたら、別の相談が始まった。\n「誰にも内緒にしてください」と、しっかり赤字で書かれていた。"]},"en":{"from":"差出人：銭湯の番台の後継ぎ","body":"常連の名前は覚えましたが、背中だけではまだ見分けられません。","choices":["小さく始めよう","町の宝物にしよう","常連に聞いてみよう"],"ends":["三日後、封筒に銭湯の番台の後継ぎの名前があった。\n「小さく始めよう」の通りにするか迷った末、さっそく試してみたそうだ。\n常連の名前は覚えましたが、背中だけではまだ見分けられません。そこから思いもしないことが起きた。それが新しい習慣になりそうだ。\n「誰にも内緒にしてください」と、しっかり赤字で書かれていた。","帰り道で、銭湯の番台の後継ぎが、例の「常連の名前は覚えましたが、背中だけではまだ見分けられません」について書いてきた。\n「町の宝物にしよう」の返事をきっかけに、返事を見て、予定を変更した。\n意外にも反対する人がいなかった。\n結局、本人が一番楽しそうだった。","数時間後、銭湯の番台の後継ぎが、例の「常連の名前は覚えましたが、背中だけではまだ見分けられません」について書いてきた。\n「常連に聞いてみよう」の返事をきっかけに、半信半疑で動いてみたらしい。\n返事を見せたら、別の相談が始まった。\n「誰にも内緒にしてください」と、しっかり赤字で書かれていた。"]}},{"ja":{"from":"差出人：朝市で声が小さい八百屋","body":"値段を叫べないので手書きの札を増やしたら、店が美術展みたいになりました。","choices":["町の宝物にしよう","常連に聞いてみよう","小さく始めよう"],"ends":["翌日の昼、封筒に朝市で声が小さい八百屋の名前があった。\n「町の宝物にしよう」の通りにするか迷った末、予定外の相手まで巻き込んだ。\n値段を叫べないので手書きの札を増やしたら、店が美術展みたいになりました。そこから思いもしないことが起きた。説明を求められ、余計に話が大きくなった。\n結局、本人が一番楽しそうだった。","一週間後、朝市で声が小さい八百屋が、例の「値段を叫べないので手書きの札を増やしたら、店が美術展みたいになりました」について書いてきた。\n「常連に聞いてみよう」の返事をきっかけに、一度はやめかけたが、結局実行した。\n意外にも反対する人がいなかった。\n「これ、成功ってことでいいですか」と最後に書いてあった。","その日の夕方、短い手紙が届いた。差出人は朝市で声が小さい八百屋。\n「小さく始めよう」と返したら、思い切って口に出してみた。\n例の「値段を叫べないので手書きの札を増やしたら、店が美術展みたいになりました」の件は、なぜか小さな行列ができた。\n「たぶんこれでよかった」と短く締めくくられていた。"]},"en":{"from":"差出人：朝市で声が小さい八百屋","body":"値段を叫べないので手書きの札を増やしたら、店が美術展みたいになりました。","choices":["町の宝物にしよう","常連に聞いてみよう","小さく始めよう"],"ends":["翌日の昼、封筒に朝市で声が小さい八百屋の名前があった。\n「町の宝物にしよう」の通りにするか迷った末、予定外の相手まで巻き込んだ。\n値段を叫べないので手書きの札を増やしたら、店が美術展みたいになりました。そこから思いもしないことが起きた。説明を求められ、余計に話が大きくなった。\n結局、本人が一番楽しそうだった。","一週間後、朝市で声が小さい八百屋が、例の「値段を叫べないので手書きの札を増やしたら、店が美術展みたいになりました」について書いてきた。\n「常連に聞いてみよう」の返事をきっかけに、一度はやめかけたが、結局実行した。\n意外にも反対する人がいなかった。\n「これ、成功ってことでいいですか」と最後に書いてあった。","その日の夕方、短い手紙が届いた。差出人は朝市で声が小さい八百屋。\n「小さく始めよう」と返したら、思い切って口に出してみた。\n例の「値段を叫べないので手書きの札を増やしたら、店が美術展みたいになりました」の件は、なぜか小さな行列ができた。\n「たぶんこれでよかった」と短く締めくくられていた。"]}},{"ja":{"from":"差出人：地下道の演奏家","body":"誰も足を止めない曲だけ、なぜか投げ銭が多いです。理由を聞いていいですか。","choices":["常連に聞いてみよう","小さく始めよう","町の宝物にしよう"],"ends":["二日後、封筒に地下道の演奏家の名前があった。\n「常連に聞いてみよう」の通りにするか迷った末、さっそく試してみたそうだ。\n誰も足を止めない曲だけ、なぜか投げ銭が多いです。そこから思いもしないことが起きた。一人だけ、まったく別の解釈をした。\n最後の一行だけ、やけに字が大きかった。","二日後、地下道の演奏家から二通目。\n「小さく始めよう」を実行する前に、誰も足を止めない曲だけ、なぜか投げ銭が多いですという話を思い出したらしい。\n予定外の相手まで巻き込んだ。結果より、その途中の顔が忘れられないらしい。\n追伸には「次は自分で決めてみます」とあった。","翌週、地下道の演奏家から二通目。\n「町の宝物にしよう」を実行する前に、誰も足を止めない曲だけ、なぜか投げ銭が多いですという話を思い出したらしい。\n思い切って口に出してみた。いちばん驚いたのは本人だった。\n追伸には「次は自分で決めてみます」とあった。"]},"en":{"from":"差出人：地下道の演奏家","body":"誰も足を止めない曲だけ、なぜか投げ銭が多いです。理由を聞いていいですか。","choices":["常連に聞いてみよう","小さく始めよう","町の宝物にしよう"],"ends":["二日後、封筒に地下道の演奏家の名前があった。\n「常連に聞いてみよう」の通りにするか迷った末、さっそく試してみたそうだ。\n誰も足を止めない曲だけ、なぜか投げ銭が多いです。そこから思いもしないことが起きた。一人だけ、まったく別の解釈をした。\n最後の一行だけ、やけに字が大きかった。","二日後、地下道の演奏家から二通目。\n「小さく始めよう」を実行する前に、誰も足を止めない曲だけ、なぜか投げ銭が多いですという話を思い出したらしい。\n予定外の相手まで巻き込んだ。結果より、その途中の顔が忘れられないらしい。\n追伸には「次は自分で決めてみます」とあった。","翌週、地下道の演奏家から二通目。\n「町の宝物にしよう」を実行する前に、誰も足を止めない曲だけ、なぜか投げ銭が多いですという話を思い出したらしい。\n思い切って口に出してみた。いちばん驚いたのは本人だった。\n追伸には「次は自分で決めてみます」とあった。"]}},{"ja":{"from":"差出人：バス停の時刻表を守る人","body":"毎日同じ時間に来る人が、今日は花束を持っています。声をかけたいです。","choices":["小さく始めよう","町の宝物にしよう","常連に聞いてみよう"],"ends":["翌週、封筒にバス停の時刻表を守る人の名前があった。\n「小さく始めよう」の通りにするか迷った末、さっそく試してみたそうだ。\n毎日同じ時間に来る人が、今日は花束を持っています。そこから思いもしないことが起きた。なぜか小さな行列ができた。\nその後どうなったかは、まだ誰も知らない。","帰り道で、バス停の時刻表を守る人から二通目。\n「町の宝物にしよう」を実行する前に、毎日同じ時間に来る人が、今日は花束を持っていますという話を思い出したらしい。\nまず紙に書き出してみた。周囲は納得したが、本人だけ納得していない。\n封筒の裏には、小さな丸が一つ描かれていた。","数時間後、バス停の時刻表を守る人が、例の「毎日同じ時間に来る人が、今日は花束を持っています」について書いてきた。\n「常連に聞いてみよう」の返事をきっかけに、返事を見て、予定を変更した。\n返事を見せたら、別の相談が始まった。\n封筒には、なぜか二枚目の切手が貼ってあった。"]},"en":{"from":"差出人：バス停の時刻表を守る人","body":"毎日同じ時間に来る人が、今日は花束を持っています。声をかけたいです。","choices":["小さく始めよう","町の宝物にしよう","常連に聞いてみよう"],"ends":["翌週、封筒にバス停の時刻表を守る人の名前があった。\n「小さく始めよう」の通りにするか迷った末、さっそく試してみたそうだ。\n毎日同じ時間に来る人が、今日は花束を持っています。そこから思いもしないことが起きた。なぜか小さな行列ができた。\nその後どうなったかは、まだ誰も知らない。","帰り道で、バス停の時刻表を守る人から二通目。\n「町の宝物にしよう」を実行する前に、毎日同じ時間に来る人が、今日は花束を持っていますという話を思い出したらしい。\nまず紙に書き出してみた。周囲は納得したが、本人だけ納得していない。\n封筒の裏には、小さな丸が一つ描かれていた。","数時間後、バス停の時刻表を守る人が、例の「毎日同じ時間に来る人が、今日は花束を持っています」について書いてきた。\n「常連に聞いてみよう」の返事をきっかけに、返事を見て、予定を変更した。\n返事を見せたら、別の相談が始まった。\n封筒には、なぜか二枚目の切手が貼ってあった。"]}},{"ja":{"from":"差出人：雨の日だけ忙しい靴修理屋","body":"晴れの日は暇なので、靴に雨乞いをしてしまいます。職業病でしょうか。","choices":["町の宝物にしよう","常連に聞いてみよう","小さく始めよう"],"ends":["数時間後、雨の日だけ忙しい靴修理屋が報告してきた。\n「町の宝物にしよう」という一言がきっかけで、少しだけ勇気を出してみた。\n「晴れの日は暇なので、靴に雨乞いをしてしまいます」と悩んでいた頃とは、少し様子が違う。誰も予想していない方向に話が進んだ。\n結局、本人が一番楽しそうだった。","翌週、雨の日だけ忙しい靴修理屋から追伸が来た。\n「常連に聞いてみよう」を選んだことを伝えると、誰にも言わずに実行した。\n晴れの日は暇なので、靴に雨乞いをしてしまいます――その話が、今度は別の意味で広まっている。意外にも反対する人がいなかった。\n次の手紙には、なぜか謝礼のつもりのシールが入っていた。","日付のない追伸が届いた。短い手紙が届いた。差出人は雨の日だけ忙しい靴修理屋。\n「小さく始めよう」と返したら、少しだけ勇気を出してみた。\n例の「晴れの日は暇なので、靴に雨乞いをしてしまいます」の件は、意外にも反対する人がいなかった。\n「これ、成功ってことでいいですか」と最後に書いてあった。"]},"en":{"from":"差出人：雨の日だけ忙しい靴修理屋","body":"晴れの日は暇なので、靴に雨乞いをしてしまいます。職業病でしょうか。","choices":["町の宝物にしよう","常連に聞いてみよう","小さく始めよう"],"ends":["数時間後、雨の日だけ忙しい靴修理屋が報告してきた。\n「町の宝物にしよう」という一言がきっかけで、少しだけ勇気を出してみた。\n「晴れの日は暇なので、靴に雨乞いをしてしまいます」と悩んでいた頃とは、少し様子が違う。誰も予想していない方向に話が進んだ。\n結局、本人が一番楽しそうだった。","翌週、雨の日だけ忙しい靴修理屋から追伸が来た。\n「常連に聞いてみよう」を選んだことを伝えると、誰にも言わずに実行した。\n晴れの日は暇なので、靴に雨乞いをしてしまいます――その話が、今度は別の意味で広まっている。意外にも反対する人がいなかった。\n次の手紙には、なぜか謝礼のつもりのシールが入っていた。","日付のない追伸が届いた。短い手紙が届いた。差出人は雨の日だけ忙しい靴修理屋。\n「小さく始めよう」と返したら、少しだけ勇気を出してみた。\n例の「晴れの日は暇なので、靴に雨乞いをしてしまいます」の件は、意外にも反対する人がいなかった。\n「これ、成功ってことでいいですか」と最後に書いてあった。"]}},{"ja":{"from":"差出人：夜景を見ない展望台スタッフ","body":"仕事中はずっと床の掃除をしています。最後に夜景を見たのはいつでしょう。","choices":["常連に聞いてみよう","小さく始めよう","町の宝物にしよう"],"ends":["その夜、夜景を見ない展望台スタッフから二通目。\n「常連に聞いてみよう」を実行する前に、仕事中はずっと床の掃除をしていますという話を思い出したらしい。\n最初は笑ったが、試してみた。いちばん驚いたのは本人だった。\n「誰にも内緒にしてください」と、しっかり赤字で書かれていた。","帰り道で、短い手紙が届いた。差出人は夜景を見ない展望台スタッフ。\n「小さく始めよう」と返したら、思ったより真剣に受け取られた。\n例の「仕事中はずっと床の掃除をしています」の件は、その場では何も起きなかった。翌日になって効いてきた。\n「たぶんこれでよかった」と短く締めくくられていた。","しばらくして、夜景を見ない展望台スタッフが報告してきた。\n「町の宝物にしよう」という一言がきっかけで、少しだけ勇気を出してみた。\n「仕事中はずっと床の掃除をしています」と悩んでいた頃とは、少し様子が違う。思わぬところで拍手が起きた。\n「たぶんこれでよかった」と短く締めくくられていた。"]},"en":{"from":"差出人：夜景を見ない展望台スタッフ","body":"仕事中はずっと床の掃除をしています。最後に夜景を見たのはいつでしょう。","choices":["常連に聞いてみよう","小さく始めよう","町の宝物にしよう"],"ends":["その夜、夜景を見ない展望台スタッフから二通目。\n「常連に聞いてみよう」を実行する前に、仕事中はずっと床の掃除をしていますという話を思い出したらしい。\n最初は笑ったが、試してみた。いちばん驚いたのは本人だった。\n「誰にも内緒にしてください」と、しっかり赤字で書かれていた。","帰り道で、短い手紙が届いた。差出人は夜景を見ない展望台スタッフ。\n「小さく始めよう」と返したら、思ったより真剣に受け取られた。\n例の「仕事中はずっと床の掃除をしています」の件は、その場では何も起きなかった。翌日になって効いてきた。\n「たぶんこれでよかった」と短く締めくくられていた。","しばらくして、夜景を見ない展望台スタッフが報告してきた。\n「町の宝物にしよう」という一言がきっかけで、少しだけ勇気を出してみた。\n「仕事中はずっと床の掃除をしています」と悩んでいた頃とは、少し様子が違う。思わぬところで拍手が起きた。\n「たぶんこれでよかった」と短く締めくくられていた。"]}},{"ja":{"from":"差出人：地域猫の名前を集める人","body":"同じ猫が町で五つの名前を持っています。どれで呼べばいいですか。","choices":["小さく始めよう","町の宝物にしよう","常連に聞いてみよう"],"ends":["日付のない追伸が届いた。地域猫の名前を集める人から二通目。\n「小さく始めよう」を実行する前に、同じ猫が町で五つの名前を持っていますという話を思い出したらしい。\n一度はやめかけたが、結局実行した。周囲は納得したが、本人だけ納得していない。\n「今度はあなたの話も聞かせて」と書き添えられていた。","その日の夕方、短い手紙が届いた。差出人は地域猫の名前を集める人。\n「町の宝物にしよう」と返したら、返事を見て、予定を変更した。\n例の「同じ猫が町で五つの名前を持っています」の件は、意外にも反対する人がいなかった。\n封筒には、なぜか二枚目の切手が貼ってあった。","数時間後、封筒に地域猫の名前を集める人の名前があった。\n「常連に聞いてみよう」の通りにするか迷った末、思い切って口に出してみた。\n同じ猫が町で五つの名前を持っています。そこから思いもしないことが起きた。最初に笑った人が、最後は黙り込んだ。\n次の手紙には、なぜか謝礼のつもりのシールが入っていた。"]},"en":{"from":"差出人：地域猫の名前を集める人","body":"同じ猫が町で五つの名前を持っています。どれで呼べばいいですか。","choices":["小さく始めよう","町の宝物にしよう","常連に聞いてみよう"],"ends":["日付のない追伸が届いた。地域猫の名前を集める人から二通目。\n「小さく始めよう」を実行する前に、同じ猫が町で五つの名前を持っていますという話を思い出したらしい。\n一度はやめかけたが、結局実行した。周囲は納得したが、本人だけ納得していない。\n「今度はあなたの話も聞かせて」と書き添えられていた。","その日の夕方、短い手紙が届いた。差出人は地域猫の名前を集める人。\n「町の宝物にしよう」と返したら、返事を見て、予定を変更した。\n例の「同じ猫が町で五つの名前を持っています」の件は、意外にも反対する人がいなかった。\n封筒には、なぜか二枚目の切手が貼ってあった。","数時間後、封筒に地域猫の名前を集める人の名前があった。\n「常連に聞いてみよう」の通りにするか迷った末、思い切って口に出してみた。\n同じ猫が町で五つの名前を持っています。そこから思いもしないことが起きた。最初に笑った人が、最後は黙り込んだ。\n次の手紙には、なぜか謝礼のつもりのシールが入っていた。"]}},{"ja":{"from":"差出人：空港で毎回見送る人","body":"旅行より見送りが好きです。手を振るだけで少し旅した気分になります。","choices":["その景色を覚えておこう","寄り道も旅だよ","予定を変えてみよう"],"ends":["三日後、空港で毎回見送る人が、例の「旅行より見送りが好きです」について書いてきた。\n「その景色を覚えておこう」の返事をきっかけに、本当にその通りにしたらしい。\nそれが新しい習慣になりそうだ。\n「これ、成功ってことでいいですか」と最後に書いてあった。","その日の夕方、空港で毎回見送る人が報告してきた。\n「寄り道も旅だよ」という一言がきっかけで、思い切って口に出してみた。\n「旅行より見送りが好きです」と悩んでいた頃とは、少し様子が違う。いちばん驚いたのは本人だった。\n次の手紙には、なぜか謝礼のつもりのシールが入っていた。","その夜、空港で毎回見送る人から追伸が来た。\n「予定を変えてみよう」を選んだことを伝えると、まず紙に書き出してみた。\n旅行より見送りが好きです――その話が、今度は別の意味で広まっている。相手が先に謝ってきた。\n次の手紙には、なぜか謝礼のつもりのシールが入っていた。"]},"en":{"from":"差出人：空港で毎回見送る人","body":"旅行より見送りが好きです。手を振るだけで少し旅した気分になります。","choices":["その景色を覚えておこう","寄り道も旅だよ","予定を変えてみよう"],"ends":["三日後、空港で毎回見送る人が、例の「旅行より見送りが好きです」について書いてきた。\n「その景色を覚えておこう」の返事をきっかけに、本当にその通りにしたらしい。\nそれが新しい習慣になりそうだ。\n「これ、成功ってことでいいですか」と最後に書いてあった。","その日の夕方、空港で毎回見送る人が報告してきた。\n「寄り道も旅だよ」という一言がきっかけで、思い切って口に出してみた。\n「旅行より見送りが好きです」と悩んでいた頃とは、少し様子が違う。いちばん驚いたのは本人だった。\n次の手紙には、なぜか謝礼のつもりのシールが入っていた。","その夜、空港で毎回見送る人から追伸が来た。\n「予定を変えてみよう」を選んだことを伝えると、まず紙に書き出してみた。\n旅行より見送りが好きです――その話が、今度は別の意味で広まっている。相手が先に謝ってきた。\n次の手紙には、なぜか謝礼のつもりのシールが入っていた。"]}},{"ja":{"from":"差出人：温泉の入り方を忘れた旅館客","body":"久しぶりの旅行で、まず脱衣所で深呼吸を十回しました。緊張しすぎですか。","choices":["寄り道も旅だよ","予定を変えてみよう","その景色を覚えておこう"],"ends":["日付のない追伸が届いた。温泉の入り方を忘れた旅館客から二通目。\n「寄り道も旅だよ」を実行する前に、久しぶりの旅行で、まず脱衣所で深呼吸を十回しましたという話を思い出したらしい。\n予定外の相手まで巻き込んだ。思わぬところで拍手が起きた。\n「今度はあなたの話も聞かせて」と書き添えられていた。","週末になって、封筒に温泉の入り方を忘れた旅館客の名前があった。\n「予定を変えてみよう」の通りにするか迷った末、少しだけ勇気を出してみた。\n久しぶりの旅行で、まず脱衣所で深呼吸を十回しました。そこから思いもしないことが起きた。それが新しい習慣になりそうだ。\n封筒には、なぜか二枚目の切手が貼ってあった。","三日後、温泉の入り方を忘れた旅館客から追伸が来た。\n「その景色を覚えておこう」を選んだことを伝えると、思ったより真剣に受け取られた。\n久しぶりの旅行で、まず脱衣所で深呼吸を十回しました――その話が、今度は別の意味で広まっている。相手が先に謝ってきた。\n最後の一行だけ、やけに字が大きかった。"]},"en":{"from":"差出人：温泉の入り方を忘れた旅館客","body":"久しぶりの旅行で、まず脱衣所で深呼吸を十回しました。緊張しすぎですか。","choices":["寄り道も旅だよ","予定を変えてみよう","その景色を覚えておこう"],"ends":["日付のない追伸が届いた。温泉の入り方を忘れた旅館客から二通目。\n「寄り道も旅だよ」を実行する前に、久しぶりの旅行で、まず脱衣所で深呼吸を十回しましたという話を思い出したらしい。\n予定外の相手まで巻き込んだ。思わぬところで拍手が起きた。\n「今度はあなたの話も聞かせて」と書き添えられていた。","週末になって、封筒に温泉の入り方を忘れた旅館客の名前があった。\n「予定を変えてみよう」の通りにするか迷った末、少しだけ勇気を出してみた。\n久しぶりの旅行で、まず脱衣所で深呼吸を十回しました。そこから思いもしないことが起きた。それが新しい習慣になりそうだ。\n封筒には、なぜか二枚目の切手が貼ってあった。","三日後、温泉の入り方を忘れた旅館客から追伸が来た。\n「その景色を覚えておこう」を選んだことを伝えると、思ったより真剣に受け取られた。\n久しぶりの旅行で、まず脱衣所で深呼吸を十回しました――その話が、今度は別の意味で広まっている。相手が先に謝ってきた。\n最後の一行だけ、やけに字が大きかった。"]}},{"ja":{"from":"差出人：切符を記念に残す旅人","body":"改札で回収されるたびに少し寂しいです。旅の証拠は何に残せばいいですか。","choices":["予定を変えてみよう","その景色を覚えておこう","寄り道も旅だよ"],"ends":["次の朝、封筒に切符を記念に残す旅人の名前があった。\n「予定を変えてみよう」の通りにするか迷った末、一度はやめかけたが、結局実行した。\n改札で回収されるたびに少し寂しいです。そこから思いもしないことが起きた。結果より、その途中の顔が忘れられないらしい。\n「今度はあなたの話も聞かせて」と書き添えられていた。","その日の夕方、短い手紙が届いた。差出人は切符を記念に残す旅人。\n「その景色を覚えておこう」と返したら、本当にその通りにしたらしい。\n例の「改札で回収されるたびに少し寂しいです」の件は、ところが、話を聞いていた人のほうが先に動いた。\n封筒には、なぜか二枚目の切手が貼ってあった。","帰り道で、短い手紙が届いた。差出人は切符を記念に残す旅人。\n「寄り道も旅だよ」と返したら、予定外の相手まで巻き込んだ。\n例の「改札で回収されるたびに少し寂しいです」の件は、その場では何も起きなかった。翌日になって効いてきた。\n最後の一行だけ、やけに字が大きかった。"]},"en":{"from":"差出人：切符を記念に残す旅人","body":"改札で回収されるた から逆算しています」と悩んでいた頃とは、少し様子が違う。一人だけ、まったく別の解釈をした。\n「たぶんこれでよかった」と短く締めくくられていた。","しばらくして、宿の朝食を楽しみにする客から二通目。\n「その景色を覚えておこう」を実行する前に、観光の予定を全部朝食の時間から逆算していますという話を思い出したらしい。\n返事を見て、予定を変更した。一人だけ、まったく別の解釈をした。\n「たぶんこれでよかった」と短く締めくくられていた。"]},"en":{"from":"差出人：宿の朝食を楽しみにする客","body":"観光の予定を全部朝食の時間から逆算しています。旅の目的を見失っていますか。","choices":["寄り道も旅だよ","予定を変えてみよう","その景色を覚えておこう"],"ends":["翌日の昼、宿の朝食を楽しみにする客が、例の「観光の予定を全部朝食の時間から逆算しています」について書いてきた。\n「寄り道も旅だよ」の返事をきっかけに、一度はやめかけたが、結局実行した。\n説明を求められ、余計に話が大きくなった。\nその後どうなったかは、まだ誰も知らない。","次の月曜日、宿の朝食を楽しみにする客が報告してきた。\n「予定を変えてみよう」という一言がきっかけで、思ったより真剣に受け取られた。\n「観光の予定を全部朝食の時間から逆算しています」と悩んでいた頃とは、少し様子が違う。一人だけ、まったく別の解釈をした。\n「たぶんこれでよかった」と短く締めくくられていた。","しばらくして、宿の朝食を楽しみにする客から二通目。\n「その景色を覚えておこう」を実行する前に、観光の予定を全部朝食の時間から逆算していますという話を思い出したらしい。\n返事を見て、予定を変更した。一人だけ、まったく別の解釈をした。\n「たぶんこれでよかった」と短く締めくくられていた。"]}},{"ja":{"from":"差出人：旅先で洗濯する人","body":"知らない町のコインランドリーに座るのが好きです。観光名所より落ち着きます。","choices":["予定を変えてみよう","その景色を覚えておこう","寄り道も旅だよ"],"ends":["帰り道で、旅先で洗濯する人が報告してきた。\n「予定を変えてみよう」という一言がきっかけで、予定外の相手まで巻き込んだ。\n「知らない町のコインランドリーに座るのが好きです」と悩んでいた頃とは、少し様子が違う。なぜか小さな行列ができた。\n「これ、成功ってことでいいですか」と最後に書いてあった。","その夜、短い手紙が届いた。差出人は旅先で洗濯する人。\n「その景色を覚えておこう」と返したら、本当にその通りにしたらしい。\n例の「知らない町のコインランドリーに座るのが好きです」の件は、なぜか小さな行列ができた。\n最後の一行だけ、やけに字が大きかった。","数時間後、旅先で洗濯する人が、例の「知らない町のコインランドリーに座るのが好きです」について書いてきた。\n「寄り道も旅だよ」の返事をきっかけに、思ったより真剣に受け取られた。\n最初に笑った人が、最後は黙り込んだ。\n「たぶんこれでよかった」と短く締めくくられていた。"]},"en":{"from":"差出人：旅先で洗濯する人","body":"知らない町のコインランドリーに座るのが好きです。観光名所より落ち着きます。","choices":["予定を変えてみよう","その景色を覚えておこう","寄り道も旅だよ"],"ends":["帰り道で、旅先で洗濯する人が報告してきた。\n「予定を変えてみよう」という一言がきっかけで、予定外の相手まで巻き込んだ。\n「知らない町のコインランドリーに座るのが好きです」と悩んでいた頃とは、少し様子が違う。なぜか小さな行列ができた。\n「これ、成功ってことでいいですか」と最後に書いてあった。","その夜、短い手紙が届いた。差出人は旅先で洗濯する人。\n「その景色を覚えておこう」と返したら、本当にその通りにしたらしい。\n例の「知らない町のコインランドリーに座るのが好きです」の件は、なぜか小さな行列ができた。\n最後の一行だけ、やけに字が大きかった。","数時間後、旅先で洗濯する人が、例の「知らない町のコインランドリーに座るのが好きです」について書いてきた。\n「寄り道も旅だよ」の返事をきっかけに、思ったより真剣に受け取られた。\n最初に笑った人が、最後は黙り込んだ。\n「たぶんこれでよかった」と短く締めくくられていた。"]}},{"ja":{"from":"差出人：帰りの土産を先に買う人","body":"出発前に土産を買いました。帰ってきた気分で旅が始まりません。","choices":["その景色を覚えておこう","寄り道も旅だよ","予定を変えてみよう"],"ends":["次の月曜日、帰りの土産を先に買う人から二通目。\n「その景色を覚えておこう」を実行する前に、出発前に土産を買いましたという話を思い出したらしい。\nさっそく試してみたそうだ。相手が先に謝ってきた。\n「今度はあなたの話も聞かせて」と書き添えられていた。","帰り道で、封筒に帰りの土産を先に買う人の名前があった。\n「寄り道も旅だよ」の通りにするか迷った末、半信半疑で動いてみたらしい。\n出発前に土産を買いました。そこから思いもしないことが起きた。周囲は納得したが、本人だけ納得していない。\n追伸には「次は自分で決めてみます」とあった。","数時間後、封筒に帰りの土産を先に買う人の名前があった。\n「予定を変えてみよう」の通りにするか迷った末、一度はやめかけたが、結局実行した。\n出発前に土産を買いました。そこから思いもしないことが起きた。周囲は納得したが、本人だけ納得していない。\n「誰にも内緒にしてください」と、しっかり赤字で書かれていた。"]},"en":{"from":"差出人：帰りの土産を先に買う人","body":"出発前に土産を買いました。帰ってきた気分で旅が始まりません。","choices":["その景色を覚えておこう","寄り道も旅だよ","予定を変えてみよう"],"ends":["次の月曜日、帰りの土産を先に買う人から二通目。\n「その景色を覚えておこう」を実行する前に、出発前に土産を買いましたという話を思い出したらしい。\nさっそく試してみたそうだ。相手が先に謝ってきた。\n「今度はあなたの話も聞かせて」と書き添えられていた。","帰り道で、封筒に帰りの土産を先に買う人の名前があった。\n「寄り道も旅だよ」の通りにするか迷った末、半信半疑で動いてみたらしい。\n出発前に土産を買いました。そこから思いもしないことが起きた。周囲は納得したが、本人だけ納得していない。\n追伸には「次は自分で決めてみます」とあった。","数時間後、封筒に帰りの土産を先に買う人の名前があった。\n「予定を変えてみよう」の通りにするか迷った末、一度はやめかけたが、結局実行した。\n出発前に土産を買いました。そこから思いもしないことが起きた。周囲は納得したが、本人だけ納得していない。\n「誰にも内緒にしてください」と、しっかり赤字で書かれていた。"]}},{"ja":{"from":"差出人：知らない駅で降りる会社員","body":"一駅だけ冒険するつもりが、知らない祭りに参加して帰ってきました。","choices":["寄り道も旅だよ","予定を変えてみよう","その景色を覚えておこう"],"ends":["しばらくして、短い手紙が届いた。差出人は知らない駅で降りる会社員。\n「寄り道も旅だよ」と返したら、思い切って口に出してみた。\n例の「一駅だけ冒険するつもりが、知らない祭りに参加して帰ってきました」の件は、最初に笑った人が、最後は黙り込んだ。\n「たぶんこれでよかった」と短く締めくくられていた。","次の朝、封筒に知らない駅で降りる会社員の名前があった。\n「予定を変えてみよう」の通りにするか迷った末、思ったより真剣に受け取られた。\n一駅だけ冒険するつもりが、知らない祭りに参加して帰ってきました。そこから思いもしないことが起きた。いちばん驚いたのは本人だった。\n「たぶんこれでよかった」と短く締めくくられていた。","その夜、知らない駅で降りる会社員から追伸が来た。\n「その景色を覚えておこう」を選んだことを伝えると、本当にその通りにしたらしい。\n一駅だけ冒険するつもりが、知らない祭りに参加して帰ってきました――その話が、今度は別の意味で広まっている。結果より、その途中の顔が忘れられないらしい。\n「これ、成功ってことでいいですか」と最後に書いてあった。"]},"en":{"from":"差出人：知らない駅で降りる会社員","body":"一駅だけ冒険するつもりが、知らない祭りに参加して帰ってきました。","choices":["寄り道も旅だよ","予定を変えてみよう","その景色を覚えておこう"],"ends":["しばらくして、短い手紙が届いた。差出人は知らない駅で降りる会社員。\n「寄り道も旅だよ」と返したら、思い切って口に出してみた。\n例の「一駅だけ冒険するつもりが、知らない祭りに参加して帰ってきました」の件は、最初に笑った人が、最後は黙り込んだ。\n「たぶんこれでよかった」と短く締めくくられていた。","次の朝、封筒に知らない駅で降りる会社員の名前があった。\n「予定を変えてみよう」の通りにするか迷った末、思ったより真剣に受け取られた。\n一駅だけ冒険するつもりが、知らない祭りに参加して帰ってきました。そこから思いもしないことが起きた。いちばん驚いたのは本人だった。\n「たぶんこれでよかった」と短く締めくくられていた。","その夜、知らない駅で降りる会社員から追伸が来た。\n「その景色を覚えておこう」を選んだことを伝えると、本当にその通りにしたらしい。\n一駅だけ冒険するつもりが、知らない祭りに参加して帰ってきました――その話が、今度は別の意味で広まっている。結果より、その途中の顔が忘れられないらしい。\n「これ、成功ってことでいいですか」と最後に書いてあった。"]}},{"ja":{"from":"差出人：観光地で地元の新聞を買う人","body":"名所より求人広告を読んでしまいます。住むつもりはないのに。","choices":["予定を変えてみよう","その景色を覚えておこう","寄り道も旅だよ"],"ends":["週末になって、観光地で地元の新聞を買う人が、例の「名所より求人広告を読んでしまいます」について書いてきた。\n「予定を変えてみよう」の返事をきっかけに、思ったより真剣に受け取られた。\n相手が先に謝ってきた。\n「今度はあなたの話も聞かせて」と書き添えられていた。","帰り道で、観光地で地元の新聞を買う人から二通目。\n「その景色を覚えておこう」を実行する前に、名所より求人広告を読んでしまいますという話を思い出したらしい。\nさっそく試してみたそうだ。誰も予想していない方向に話が進んだ。\n「これ、成功ってことでいいですか」と最後に書いてあった。","三日後、観光地で地元の新聞を買う人が、例の「名所より求人広告を読んでしまいます」について書いてきた。\n「寄り道も旅だよ」の返事をきっかけに、予定外の相手まで巻き込んだ。\n意外にも反対する人がいなかった。\n封筒の裏には、小さな丸が一つ描かれていた。"]},"en":{"from":"差出人：観光地で地元の新聞を買う人","body":"名所より求人広告を読んでしまいます。住むつもりはないのに。","choices":["予定を変えてみよう","その景色を覚えておこう","寄り道も旅だよ"],"ends":["週末になって、観光地で地元の新聞を買う人が、例の「名所より求人広告を読んでしまいます」について書いてきた。\n「予定を変えてみよう」の返事をきっかけに、思ったより真剣に受け取られた。\n相手が先に謝ってきた。\n「今度はあなたの話も聞かせて」と書き添えられていた。","帰り道で、観光地で地元の新聞を買う人から二通目。\n「その景色を覚えておこう」を実行する前に、名所より求人広告を読んでしまいますという話を思い出したらしい。\nさっそく試してみたそうだ。誰も予想していない方向に話が進んだ。\n「これ、成功ってことでいいですか」と最後に書いてあった。","三日後、観光地で地元の新聞を買う人が、例の「名所より求人広告を読んでしまいます」について書いてきた。\n「寄り道も旅だよ」の返事をきっかけに、予定外の相手まで巻き込んだ。\n意外にも反対する人がいなかった。\n封筒の裏には、小さな丸が一つ描かれていた。"]}},{"ja":{"from":"差出人：船酔いする船長の息子","body":"海が好きなのに船に乗れません。港で待つ仕事はありますか。","choices":["その景色を覚えておこう","寄り道も旅だよ","予定を変えてみよう"],"ends":["翌日の昼、船酔いする船長の息子から二通目。\n「その景色を覚えておこう」を実行する前に、海が好きなのに船に乗れませんという話を思い出したらしい。\n思い切って口に出してみた。最初に笑った人が、最後は黙り込んだ。\n「たぶんこれでよかった」と短く締めくくられていた。","その夜、船酔いする船長の息子が、例の「海が好きなのに船に乗れません」について書いてきた。\n「寄り道も旅だよ」の返事をきっかけに、最初は笑ったが、試してみた。\nその場では何も起きなかった。翌日になって効いてきた。\n「たぶんこれでよかった」と短く締めくくられていた。","その夜、船酔いする船長の息子が報告してきた。\n「予定を変えてみよう」という一言がきっかけで、さっそく試してみたそうだ。\n「海が好きなのに船に乗れません」と悩んでいた頃とは、少し様子が違う。返事を見せたら、別の相談が始まった。\n「続きができたら、また書きます」で終わっていた。"]},"en":{"from":"差出人：船酔いする船長の息子","body":"海が好きなのに船に乗れません。港で待つ仕事はありますか。","choices":["その景色を覚えておこう","寄り道も旅だよ 三年かけた塔が天井に届きました」の件は、説明を求められ、余計に話が大きくなった。\n封筒の裏には、小さな丸が一つ描かれていた。","雨が降った日、封筒に積み木を崩せない大人の名前があった。\n「誰かに見せてみよう」の通りにするか迷った末、少しだけ勇気を出してみた。\n三年かけた塔が天井に届きました。そこから思いもしないことが起きた。いちばん驚いたのは本人だった。\n「続きができたら、また書きます」で終わっていた。"]},"en":{"from":"差出人：積み木を崩せない大人","body":"三年かけた塔が天井に届きました。壊す勇気も引っ越す予定もありません。","choices":["完成させてみよう","好きなままでいい","誰かに見せてみよう"],"ends":["日付のない追伸が届いた。積み木を崩せない大人が報告してきた。\n「完成させてみよう」という一言がきっかけで、最初は笑ったが、試してみた。\n「三年かけた塔が天井に届きました」と悩んでいた頃とは、少し様子が違う。最初に笑った人が、最後は黙り込んだ。\n「今度はあなたの話も聞かせて」と書き添えられていた。","三日後、短い手紙が届いた。差出人は積み木を崩せない大人。\n「好きなままでいい」と返したら、本当にその通りにしたらしい。\n例の「三年かけた塔が天井に届きました」の件は、説明を求められ、余計に話が大きくなった。\n封筒の裏には、小さな丸が一つ描かれていた。","雨が降った日、封筒に積み木を崩せない大人の名前があった。\n「誰かに見せてみよう」の通りにするか迷った末、少しだけ勇気を出してみた。\n三年かけた塔が天井に届きました。そこから思いもしないことが起きた。いちばん驚いたのは本人だった。\n「続きができたら、また書きます」で終わっていた。"]}},{"ja":{"from":"差出人：編み物をほどくのが好きな人","body":"完成品よりほどく時間が好きです。家族にはずっと未完成だと思われています。","choices":["好きなままでいい","誰かに見せてみよう","完成させてみよう"],"ends":["その日の夕方、編み物をほどくのが好きな人から二通目。\n「好きなままでいい」を実行する前に、完成品よりほどく時間が好きですという話を思い出したらしい。\n半信半疑で動いてみたらしい。相手が先に謝ってきた。\n追伸には「次は自分で決めてみます」とあった。","その日の夕方、封筒に編み物をほどくのが好きな人の名前があった。\n「誰かに見せてみよう」の通りにするか迷った末、本当にその通りにしたらしい。\n完成品よりほどく時間が好きです。そこから思いもしないことが起きた。最初に笑った人が、最後は黙り込んだ。\n最後の一行だけ、やけに字が大きかった。","雨が降った日、短い手紙が届いた。差出人は編み物をほどくのが好きな人。\n「完成させてみよう」と返したら、まず紙に書き出してみた。\n例の「完成品よりほどく時間が好きです」の件は、ところが、話を聞いていた人のほうが先に動いた。\n封筒には、なぜか二枚目の切手が貼ってあった。"]},"en":{"from":"差出人：編み物をほどくのが好きな人","body":"完成品よりほどく時間が好きです。家族にはずっと未完成だと思われています。","choices":["好きなままでいい","誰かに見せてみよう","完成させてみよう"],"ends":["その日の夕方、編み物をほどくのが好きな人から二通目。\n「好きなままでいい」を実行する前に、完成品よりほどく時間が好きですという話を思い出したらしい。\n半信半疑で動いてみたらしい。相手が先に謝ってきた。\n追伸には「次は自分で決めてみます」とあった。","その日の夕方、封筒に編み物をほどくのが好きな人の名前があった。\n「誰かに見せてみよう」の通りにするか迷った末、本当にその通りにしたらしい。\n完成品よりほどく時間が好きです。そこから思いもしないことが起きた。最初に笑った人が、最後は黙り込んだ。\n最後の一行だけ、やけに字が大きかった。","雨が降った日、短い手紙が届いた。差出人は編み物をほどくのが好きな人。\n「完成させてみよう」と返したら、まず紙に書き出してみた。\n例の「完成品よりほどく時間が好きです」の件は、ところが、話を聞いていた人のほうが先に動いた。\n封筒には、なぜか二枚目の切手が貼ってあった。"]}},{"ja":{"from":"差出人：模型の窓だけ作る職人","body":"家の模型を頼まれたのに窓が百個できました。壁はまだありません。","choices":["誰かに見せてみよう","完成させてみよう","好きなままでいい"],"ends":["返事を出した翌朝、模型の窓だけ作る職人から二通目。\n「誰かに見せてみよう」を実行する前に、家の模型を頼まれたのに窓が百個できましたという話を思い出したらしい。\n返事を見て、予定を変更した。思わぬところで拍手が起きた。\n結局、本人が一番楽しそうだった。","翌日の昼、模型の窓だけ作る職人が、例の「家の模型を頼まれたのに窓が百個できました」について書いてきた。\n「完成させてみよう」の返事をきっかけに、返事を見て、予定を変更した。\n周囲は納得したが、本人だけ納得していない。\n封筒の裏には、小さな丸が一つ描かれていた。","その夜、模型の窓だけ作る職人から二通目。\n「好きなままでいい」を実行する前に、家の模型を頼まれたのに窓が百個できましたという話を思い出したらしい。\n予定外の相手まで巻き込んだ。結果より、その途中の顔が忘れられないらしい。\n結局、本人が一番楽しそうだった。"]},"en":{"from":"差出人：模型の窓だけ作る職人","body":"家の模型を頼まれたのに窓が百個できました。壁はまだありません。","choices":["誰かに見せてみよう","完成させてみよう","好きなままでいい"],"ends":["返事を出した翌朝、模型の窓だけ作る職人から二通目。\n「誰かに見せてみよう」を実行する前に、家の模型を頼まれたのに窓が百個できましたという話を思い出したらしい。\n返事を見て、予定を変更した。思わぬところで拍手が起きた。\n結局、本人が一番楽しそうだった。","翌日の昼、模型の窓だけ作る職人が、例の「家の模型を頼まれたのに窓が百個できました」について書いてきた。\n「完成させてみよう」の返事をきっかけに、返事を見て、予定を変更した。\n周囲は納得したが、本人だけ納得していない。\n封筒の裏には、小さな丸が一つ描かれていた。","その夜、模型の窓だけ作る職人から二通目。\n「好きなままでいい」を実行する前に、家の模型を頼まれたのに窓が百個できましたという話を思い出したらしい。\n予定外の相手まで巻き込んだ。結果より、その途中の顔が忘れられないらしい。\n結局、本人が一番楽しそうだった。"]}},{"ja":{"from":"差出人：星座を自作する天文部員","body":"星をつないだら毎回焼き魚になります。空腹が原因でしょうか。","choices":["完成させてみよう","好きなままでいい","誰かに見せてみよう"],"ends":["次の月曜日、封筒に星座を自作する天文部員の名前があった。\n「完成させてみよう」の通りにするか迷った末、さっそく試してみたそうだ。\n星をつないだら毎回焼き魚になります。そこから思いもしないことが起きた。思わぬところで拍手が起きた。\n封筒には、なぜか二枚目の切手が貼ってあった。","次の朝、星座を自作する天文部員が報告してきた。\n「好きなままでいい」という一言がきっかけで、最初は笑ったが、試してみた。\n「星をつないだら毎回焼き魚になります」と悩んでいた頃とは、少し様子が違う。説明を求められ、余計に話が大きくなった。\n「これ、成功ってことでいいですか」と最後に書いてあった。","返事を出した翌朝、星座を自作する天文部員から二通目。\n「誰かに見せてみよう」を実行する前に、星をつないだら毎回焼き魚になりますという話を思い出したらしい。\n少しだけ勇気を出してみた。最初に笑った人が、最後は黙り込んだ。\n追伸には「次は自分で決めてみます」とあった。"]},"en":{"from":"差出人：星座を自作する天文部員","body":"星をつないだら毎回焼き魚になります。空腹が原因でしょうか。","choices":["完成させてみよう","好きなままでいい","誰かに見せてみよう"],"ends":["次の月曜日、封筒に星座を自作する天文部員の名前があった。\n「完成させてみよう」の通りにするか迷った末、さっそく試してみたそうだ。\n星をつないだら毎回焼き魚になります。そこから思いもしないことが起きた。思わぬところで拍手が起きた。\n封筒には、なぜか二枚目の切手が貼ってあった。","次の朝、星座を自作する天文部員が報告してきた。\n「好きなままでいい」という一言がきっかけで、最初は笑ったが、試してみた。\n「星をつないだら毎回焼き魚になります」と悩んでいた頃とは、少し様子が違う。説明を求められ、余計に話が大きくなった。\n「これ、成功ってことでいいですか」と最後に書いてあった。","返事を出した翌朝、星座を自作する天文部員から二通目。\n「誰かに見せてみよう」を実行する前に、星をつないだら毎回焼き魚になりますという話を思い出したらしい。\n少しだけ勇気を出してみた。最初に笑った人が、最後は黙り込んだ。\n追伸には「次は自分で決めてみます」とあった。"]}},{"ja":{"from":"差出人：日記の天気だけ書く人","body":"十年分の日記が晴れと雨だけです。読み返すと意外と泣けます。","choices":["好きなままでいい","誰かに見せてみよう","完成させてみよう"],"ends":["その日の夕方、日記の天気だけ書く人が報告してきた。\n「好きなままでいい」という一言がきっかけで、少しだけ勇気を出してみた。\n「十年分の日記が晴れと雨だけです」と悩んでいた頃とは、少し様子が違う。ところが、話を聞いていた人のほうが先に動いた。\n封筒には、なぜか二枚目の切手が貼ってあった。","しばらくして、日記の天気だけ書く人から追伸が来た。\n「誰かに見せてみよう」を選んだことを伝えると、本当にその通りにしたらしい。\n十年分の日記が晴れと雨だけです――その話が、今度は別の意味で広まっている。最初に笑った人が、最後は黙り込んだ。\n「今度はあなたの話も聞かせて」と書き添えられていた。","一週間後、日記の天気だけ書く人が、例の「十年分の日記が晴れと雨だけです」について書いてきた。\n「完成させてみよう」の返事をきっかけに、さっそく試してみたそうだ。\n周囲は納得したが、本人だけ納得していない。\n結局、本人が一番楽しそうだった。"]},"en":{"from":"差出人：日記の天気だけ書く人","body":"十年分の日記が晴れと雨だけです。読み返すと意外と泣けます。","choices":["好きなままでいい","誰かに見せてみよう","完成させてみよう"],"ends":["その日の夕方、日記の天気だけ書く人が報告してきた。\n「好きなままでいい」という一言がきっかけで、少しだけ勇気を出してみた。\n「十年分の日記が晴れと雨だけです」と悩んでいた頃とは、少し様子が違う。ところが、話を聞いていた人のほうが先に動いた。\n封筒には、なぜか二枚目の切手が貼ってあった。","しばらくして、日記の天気だけ書く人から追伸が来た。\n「誰かに見せてみよう」を選んだことを伝えると、本当にその通りにしたらしい。\n十年分の日記が晴れと雨だけです――その話が、今度は別の意味で広まっている。最初に笑った人が、最後は黙り込んだ。\n「今度はあなたの話も聞かせて」と書き添えられていた。","一週間後、日記の天気だけ書く人が、例の「十年分の日記が晴れと雨だけです」について書いてきた。\n「完成させてみよう」の返事をきっかけに、さっそく試してみたそうだ。\n周囲は納得したが、本人だけ納得していない。\n結局、本人が一番楽しそうだった。"]}},{"ja":{"from":"差出人：釣りに行かない釣り好き","body":"道具を磨くのが好きで一度も釣っていません。魚に失礼でしょうか。","choices":["誰かに見せてみよう","完成させてみよう","好きなままでいい"],"ends":["雨が降った日、釣りに行かない釣り好きから追伸が来た。\n「誰かに見せてみよう」を選んだことを伝えると、最初は笑ったが、試してみた。\n道具を磨くのが好きで一度も釣っていません――その話が、今度は別の意味で広まっている。なぜか関係ない人が一番喜んだ。\n追伸には「次は自分で決めてみます」とあった。","その日の夕方、釣りに行かない釣り好きから追伸が来た。\n「完成させてみよう」を選んだことを伝えると、予定外の相手まで巻き込んだ。\n道具を磨くのが好きで一度も釣っていません――その話が、今度は別の意味で広まっている。返事を見せたら、別の相談が始まった。\n最後の一行だけ、やけに字が大きかった。","次の月曜日、釣りに行かない釣り好きが、例の「道具を磨くのが好きで一度も釣っていません」について書いてきた。\n「好きなままでいい」の返事をきっかけに、誰にも言わずに実行した。\n誰も予想していない方向に話が進んだ。\n「続きができたら、また書きます」で終わっていた。"]},"en":{"from":"差出人：釣りに行かない釣り好き","body":"道具を磨くのが好きで一度も釣っていません。魚に失礼でしょうか。","choices":["誰かに見せてみよう","完成させてみよう","好きなままでいい"],"ends":["雨が降った日、釣りに行かない釣り好きから追伸が来た。\n「誰かに見せてみよう」を選んだことを伝えると、最初は笑ったが、試してみた。\n道具を磨くのが好きで一度も釣っていません――その話が、今度は別の意味で広まっている。なぜか関係ない人が一番喜んだ。\n追伸には「次は自分で決めてみます」とあった。","その日の夕方、釣りに行かない釣り好きから追伸が来た。\n「完成させてみよう」を選んだことを伝えると、予定外の相手まで巻き込んだ。\n道具を磨くのが好きで一度も釣っていません――その話が、今度は別の意味で広まっている。返事を見せたら、別の相談が始まった。\n最後の一行だけ、やけに字が大きかった。","次の月曜日、釣りに行かない釣り好きが、例の「道具を磨くのが好きで一度も釣っていません」について書いてきた。\n「好きなままでいい」の返事をきっかけに、誰にも言わずに実行した。\n誰も予想していない方向に話が進んだ。\n「続きができたら、また書きます」で終わっていた。"]}},{"ja":{"from":"差出人：レコードの片面しか聴かない人","body":"裏返す前に眠ってしまいます。名盤の半分しか知りません。","choices":["完成させてみよう","好きなままでいい","誰かに見せてみよう"],"ends":["一週間後、レコードの片面しか聴かない人から追伸が来た。\n「完成させてみよう」を選んだことを伝えると、半信半疑で動いてみたらしい。\n裏返す前に眠ってしまいます――その話が、今度は別の意味で広まっている。意外にも反対する人がいなかった。\n「たぶんこれでよかった」と短く締めくくられていた。","その夜、レコードの片面しか聴かない人が報告してきた。\n「好きなままでいい」という一言がきっかけで、まず紙に書き出してみた。\n「裏返す前に眠ってしまいます」と悩んでいた頃とは、少し様子が違う。一人だけ、まったく別の解釈をした。\nその後どうなったかは、まだ誰も知らない。","一週間後、レコードの片面しか聴かない人から追伸が来た。\n「誰かに見せてみよう」を選んだことを伝えると、返事を見て、予定を変更した。\n裏返す前に眠ってしまいます――その話が、今度は別の意味で広まっている。返事を見せたら、別の相談が始まった。\n封筒には、なぜか二枚目の切手が貼ってあった。"]},"en":{"from":"差出人：レコードの片面しか聴かない人","body":"裏返す前に眠ってしまいます。名盤の半分しか知りません。","choices":["完成させてみよう","好きなままでいい","誰かに見せてみよう"],"ends":["一週間後、レコードの片面しか聴かない人から追伸が来た。\n「完成させてみよう」を選んだことを伝えると、半信半疑で動いてみたらしい。\n裏返す前に眠ってしまいます――その話が、今度は別の意味で広まっている。意外にも反対する人がいなかった。\n「たぶんこれでよかった」と短く締めくくられていた。","その夜、レコードの片面しか聴かない人が報告してきた。\n「好きなままでいい」という一言がきっかけで、まず紙に書き出してみた。\n「裏返す前に眠ってしまいます」と悩んでいた頃とは、少し様子が違う。一人だけ、まったく別の解釈をした。\nその後どうなったかは、まだ誰も知らない。","一週間後、レコードの片面しか聴かない人から追伸が来た。\n「誰かに見せてみよう」を選んだことを伝えると、返事を見て、予定を変更した。\n裏返す前に眠ってしまいます――その話が、今度は別の意味で広まっている。返事を見せたら、別の相談が始まった。\n封筒には、なぜか二枚目の切手が貼ってあった。"]}},{"ja":{"from":"差出人：将棋盤を集める棋士","body":"駒より盤が好きです。家の床が全部将棋盤になりそうです。","choices":["好きなままでいい","誰かに見せてみよう","完成させてみよう"],"ends":["二日後、将棋盤を集める棋士が報告してきた。\n「好きなままでいい」という一言がきっかけで、少しだけ勇気を出してみた。\n「駒より盤が好きです」と悩んでいた頃とは、少し様子が違う。結果より、その途中の顔が忘れられないらしい。\n「たぶんこれでよかった」と短く締めくくられていた。","二日後、将棋盤を集める棋士が報告してきた。\n「誰かに見せてみよう」という一言がきっかけで、最初は笑ったが、試してみた。\n「駒より盤が好きです」と悩んでいた頃とは、少し様子が違う。説明を求められ、余計に話が大きくなった。\n「続きができたら、また書きます」で終わっていた。","日付のない追伸が届いた。短い手紙が届いた。差出人は将棋盤を集める棋士。\n「完成させてみよう」と返したら、まず紙に書き出してみた。\n例の「駒より盤が好きです」の件は、結果より、その途中の顔が忘れられないらしい。\n「誰にも内緒にしてください」と、しっかり赤字で書かれていた。"]},"en":{"from":"差出人：将棋盤を集める棋士","body":"駒より盤が好きです。家の床が全部将棋盤になりそうです。","choices":["好きなままでいい","誰かに見せてみよう","完成させてみよう"],"ends":["二日後、将棋盤を集める棋士が報告してきた。\n「好きなままでいい」という一言がきっかけで、少しだけ勇気を出してみた。\n「駒より盤が好きです」と悩んでいた頃とは、少し様子が違う。結果より、その途中の顔が忘れられないらしい。\n「たぶんこれでよかった」と短く締めくくられていた。","二日後、将棋盤を集める棋士が報告してきた。\n「誰かに見せてみよう」という一言がきっかけで、最初は笑ったが、試してみた。\n「駒より盤が好きです」と悩んでいた頃とは、少し様子が違う。説明を求められ、余計に話が大きくなった。\n「続きができたら、また書きます」で終わっていた。","日付のない追伸が届いた。短い手紙が届いた。差出人は将棋盤を集める棋士。\n「完成させてみよう」と返したら、まず紙に書き出してみた。\n例の「駒より盤が好きです」の件は、結果より、その途中の顔が忘れられないらしい。\n「誰にも内緒にしてください」と、しっかり赤字で書かれていた。"]}},{"ja":{"from":"差出人：押し花を贈れない人","body":"押した花に思い出がありすぎて、手紙に入れられません。","choices":["誰かに見せてみよう","完成させてみよう","好きなままでいい"],"ends":["翌週、押し花を贈れない人から追伸が来た。\n「誰かに見せてみよう」を選んだことを伝えると、少しだけ勇気を出してみた。\n押した花に思い出がありすぎて、手紙に入れられません――その話が、今度は別の意味で広まっている。意外にも反対する人がいなかった。\n「これ、成功ってことでいいですか」と最後に書いてあった。","翌週、押し花を贈れない人から二通目。\n「完成させてみよう」を実行する前に、押した花に思い出がありすぎて、手紙に入れられませんという話を思い出したらしい。\n返事を見て、予定を変更した。説明を求められ、余計に話が大きくなった。\n「たぶんこれでよかった」と短く締めくくられていた。","しばらくして、押し花を贈れない人が、例の「押した花に思い出がありすぎて、手紙に入れられません」について書いてきた。\n「好きなままでいい」の返事をきっかけに、予定外の相手まで巻き込んだ。\nその場では何も起きなかった。翌日になって効いてきた。\n「誰にも内緒にしてください」と、しっかり赤字で書かれていた。"]},"en":{"from":"差出人：押し花を贈れない人","body":"押した花に思い出がありすぎて、手紙に入れられません。","choices":["誰かに見せてみよう","完成させてみよう","好きなままでいい"],"ends":["翌週、押し花を贈れない人から追伸が来た。\n「誰かに見せてみよう」を選んだことを伝えると、少しだけ勇気を出してみた。\n押した花に思い出がありすぎて、手紙に入れられません――その話が、今度は別の意味で広まっている。意外にも反対する人がいなかった。\n「これ、成功ってことでいいですか」と最後に書いてあった。","翌週、押し花を贈れない人から二通目。\n「完成させてみよう」を実行する前に、押した花に思い出がありすぎて、手紙に入れられませんという話を思い出したらしい。\n返事を見て、予定を変更した。説明を求められ、余計に話が大きくなった。\n「たぶんこれでよかった」と短く締めくくられていた。","しばらくして、押し花を贈れない人が、例の「押した花に思い出がありすぎて、手紙に入れられません」について書いてきた。\n「好きなままでいい」の返事をきっかけに、予定外の相手まで巻き込んだ。\nその場では何も起きなかった。翌日になって効いてきた。\n「誰にも内緒にしてください」と、しっかり赤字で書かれていた。"]}},{"ja":{"from":"差出人：自転車のベルを集める人","body":"鳴らす相手がいないので家で一人で鳴らしています。近所に音楽家だと思われました。","choices":["完成させてみよう","好きなままでいい","誰かに見せてみよう"],"ends":["三日後、自転車のベルを集める人から二通目。\n「完成させてみよう」を実行する前に、鳴らす相手がいないので家で一人で鳴らしていますという話を思い出したらしい。\n予定外の相手まで巻き込んだ。それが新しい習慣になりそうだ。\n「今度はあなたの話も聞かせて」と書き添えられていた。","その夜、短い手紙が届いた。差出人は自転車のベルを集める人。\n「好きなままでいい」と返したら、半信半疑で動いてみたらしい。\n例の「鳴らす相手がいないので家で一人で鳴らしています」の件は、いちばん驚いたのは本人だった。\n追伸には「次は自分で決めてみます」とあった。","しばらくして、自転車のベルを集める人から追伸が来た。\n「誰かに見せてみよう」を選んだことを伝えると、思い切って口に出してみた。\n鳴らす相手がいないので家で一人で鳴らしています――その話が、今度は別の意味で広まっている。誰も予想していない方向に話が進んだ。\nその後どうなったかは、まだ誰も知らない。"]},"en":{"from":"差出人：自転車のベルを集める人","body":"鳴らす相手がいないので家で一人で鳴らしています。近所に音楽家だと思われました。","choices":["完成させてみよう","好きなままでいい","誰かに見せてみよう"],"ends":["三日後、自転車のベルを集める人から二通目。\n「完成させてみよう」を実行する前に、鳴らす相手がいないので家で一人で鳴らしていますという話を思い出したらしい。\n予定外の相手まで巻き込んだ。それが新しい習慣になりそうだ。\n「今度はあなたの話も聞かせて」と書き添えられていた。","その夜、短い手紙が届いた。差出人は自転車のベルを集める人。\n「好きなままでいい」と返したら、半信半疑で動いてみたらしい。\n例の「鳴らす相手がいないので家で一人で鳴らしています」の件は、いちばん驚いたのは本人だった。\n追伸には「次は自分で決めてみます」とあった。","しばらくして、自転車のベルを集める人から追伸が来た。\n「誰かに見せてみよう」を選んだことを伝えると、思い切って口に出してみた。\n鳴らす相手がいないので家で一人で鳴らしています――その話が、今度は別の意味で広まっている。誰も予想していない方向に話が進んだ。\nその後どうなったかは、まだ誰も知らない。"]}},{"ja":{"from":"差出人：絵の具の白だけ減る画家","body":"雪景色ばかり描いています。夏になっても画面は真っ白です。","choices":["好きなままでいい","誰かに見せてみよう","完成させてみよう"],"ends":["三日後、絵の具の白だけ減る画家が報告してきた。\n「好きなままでいい」という一言がきっかけで、少しだけ勇気を出してみた。\n「雪景色ばかり描いています」と悩んでいた頃とは、少し様子が違う。最初に笑った人が、最後は黙り込んだ。\n「誰にも内緒にしてください」と、しっかり赤字で書かれていた。","その日の夕方、絵の具の白だけ減る画家から二通目。\n「誰かに見せてみよう」を実行する前に、雪景色ばかり描いていますという話を思い出したらしい。\n最初は笑ったが、試してみた。返事を見せたら、別の相談が始まった。\n「誰にも内緒にしてください」と、しっかり赤字で書かれていた。","返事を出した翌朝、絵の具の白だけ減る画家が、例の「雪景色ばかり描いています」について書いてきた。\n「完成させてみよう」の返事をきっかけに、思い切って口に出してみた。\n結果より、その途中の顔が忘れられないらしい。\nその後どうなったかは、まだ誰も知らない。"]},"en":{"from":"差出人：絵の具の白だけ減る画家","body":"雪景色ばかり描いています。夏になっても画面は真っ白です。","choices":["好きなままでいい","誰かに見せてみよう","完成させてみよう"],"ends":["三日後、絵の具の白だけ減る画家が報告してきた。\n「好きなままでいい」という一言がきっかけで、少しだけ勇気を出してみた。\n「雪景色ばかり描いています」と悩んでいた頃とは、少し様子が違う。最初に笑った人が、最後は黙り込んだ。\n「誰にも内緒にしてください」と、しっかり赤字で書かれていた。","その日の夕方、絵の具の白だけ減る画家から二通目。\n「誰かに見せてみよう」を実行する前に、雪景色ばかり描いていますという話を思い出したらしい。\n最初は笑ったが、試してみた。返事を見せたら、別の相談が始まった。\n「誰にも内緒にしてください」と、しっかり赤字で書かれていた。","返事を出した翌朝、絵の具の白だけ減る画家が、例の「雪景色ばかり描いています」について書いてきた。\n「完成させてみよう」の返事をきっかけに、思い切って口に出してみた。\n結果より、その途中の顔が忘れられないらしい。\nその後どうなったかは、まだ誰も知らない。"]}},{"ja":{"from":"差出人：古いゲーム機を修理する人","body":"直すたびに遊ぶ時間がなくなります。壊れたままのほうが幸せですか。","choices":["誰かに見せてみよう","完成させてみよう","好きなままでいい"],"ends":["三日後、短い手紙が届いた。差出人は古いゲーム機を修理する人。\n「誰かに見せてみよう」と返したら、半信半疑で動いてみたらしい。\n例の「直すたびに遊ぶ時間がなくなります」の件は、それが新しい習慣になりそうだ。\n結局、本人が一番楽しそうだった。","しばらくして、古いゲーム機を修理する人から追伸が来た。\n「完成させてみよう」を選んだことを伝えると、最初は笑ったが、試してみた。\n直すたびに遊ぶ時間がなくなります――その話が、今度は別の意味で広まっている。最初に笑った人が、最後は黙り込んだ。\n「誰にも内緒にしてください」と、しっかり赤字で書かれていた。","翌週、古いゲーム機を修理する人から追伸が来た。\n「好きなままでいい」を選んだことを伝えると、思い切って口に出してみた。\n直すたびに遊ぶ時間がなくなります――その話が、今度は別の意味で広まっている。誰も予想していない方向に話が進んだ。\n「これ、成功ってことでいいですか」と最後に書いてあった。"]},"en":{"from":"差出人：古いゲーム機を修理する人","body":"直すたびに遊ぶ時間がなくなります。壊れたままのほうが幸せですか。","choices":["誰かに見せてみよう","完成させてみよう","好きなままでいい"],"ends":["三日後、短い手紙が届いた。差出人は古いゲーム機を修理する人。\n「誰かに見せてみよう」と返したら、半信半疑で動いてみたらしい。\n例の「直すたびに遊ぶ時間がなくなります」の件は、それが新しい習慣になりそうだ。\n結局、本人が一番楽しそうだった。","しばらくして、古いゲーム機を修理する人から追伸が来た。\n「完成させてみよう」を選んだことを伝えると、最初は笑ったが、試してみた。\n直すたびに遊ぶ時間がなくなります――その話が、今度は別の意味で広まっている。最初に笑った人が、最後は黙り込んだ。\n「誰にも内緒にしてください」と、しっかり赤字で書かれていた。","翌週、古いゲーム機を修理する人から追伸が来た。\n「好きなままでいい」を選んだことを伝えると、思い切って口に出してみた。\n直すたびに遊ぶ時間がなくなります――その話が、今度は別の意味で広まっている。誰も予想していない方向に話が進んだ。\n「これ、成功ってことでいいですか」と最後に書いてあった。"]}},{"ja":{"from":"差出人：パズルの最後をはめない人","body":"完成する瞬間が惜しくて最後の一片を箱に戻します。家族が勝手にはめました。","choices":["完成させてみよう","好きなままでいい","誰かに見せてみよう"],"ends":["二日後、封筒にパズルの最後をはめない人の名前があった。\n「完成させてみよう」の通りにするか迷った末、思い切って口に出してみた。\n完成する瞬間が惜しくて最後の一片を箱に戻します。そこから思いもしないことが起きた。最初に笑った人が、最後は黙り込んだ。\nその後どうなったかは、まだ誰も知らない。","返事を出した翌朝、パズルの最後をはめない人から追伸が来た。\n「好きなままでいい」を選んだことを伝えると、最初は笑ったが、試してみた。\n完成する瞬間が惜しくて最後の一片を箱に戻します――その話が、今度は別の意味で広まっている。周囲は納得したが、本人だけ納得していない。\n封筒の裏には、小さな丸が一つ描かれていた。","しばらくして、パズルの最後をはめない人が報告してきた。\n「誰かに見せてみよう」という一言がきっかけで、予定外の相手まで巻き込んだ。\n「完成する瞬間が惜しくて最後の一片を箱に戻します」と悩んでいた頃とは、少し様子が違う。思わぬところで拍手が起きた。\n「たぶんこれでよかった」と短く締めくくられていた。"]},"en":{"from":"差出人：パズルの最後をはめない人","body":"完成する瞬間が惜しくて最後の一片を箱に戻します。家族が勝手にはめました。","choices":["完成させてみよう","好きなままでいい","誰かに見せてみよう"],"ends":["二日後、封筒にパズルの最後をはめない人の名前があった。\n「完成させてみよう」の通りにするか迷った末、思い切って口に出してみた。\n完成する瞬間が惜しくて最後の一片を箱に戻します。そこから思いもしないことが起きた。最初に笑った人が、最後は黙り込んだ。\nその後どうなったかは、まだ誰も知らない。","返事を出した翌朝、パズルの最後をはめない人から追伸が来た。\n「好きなままでいい」を選んだことを伝えると、最初は笑ったが、試してみた。\n完成する瞬間が惜しくて最後の一片を箱に戻します――その話が、今度は別 う」を選んだことを伝えると、思い切って口に出してみた。\n靴がすぐ浮いてしまいます――その話が、今度は別の意味で広まっている。ところが、話を聞いていた人のほうが先に動いた。\n結局、本人が一番楽しそうだった。","雨が降った日、封筒に重力が弱い町の靴屋の名前があった。\n「まず記録を残そう」の通りにするか迷った末、さっそく試してみたそうだ。\n靴がすぐ浮いてしまいます。そこから思いもしないことが起きた。説明を求められ、余計に話が大きくなった。\n次の手紙には、なぜか謝礼のつもりのシールが入っていた。"]}},{"ja":{"from":"差出人：地球最後の留守番","body":"みんな宇宙へ移住しました。宅配便が来る予定なので私は残っています。","choices":["未来に任せよう","まず記録を残そう","地球に聞いてみよう"],"ends":["その日の夕方、地球最後の留守番から二通目。\n「未来に任せよう」を実行する前に、みんな宇宙へ移住しましたという話を思い出したらしい。\nまず紙に書き出してみた。説明を求められ、余計に話が大きくなった。\n封筒には、なぜか二枚目の切手が貼ってあった。","その日の夕方、地球最後の留守番が報告してきた。\n「まず記録を残そう」という一言がきっかけで、まず紙に書き出してみた。\n「みんな宇宙へ移住しました」と悩んでいた頃とは、少し様子が違う。なぜか小さな行列ができた。\n「誰にも内緒にしてください」と、しっかり赤字で書かれていた。","翌日の昼、地球最後の留守番から二通目。\n「地球に聞いてみよう」を実行する前に、みんな宇宙へ移住しましたという話を思い出したらしい。\n本当にその通りにしたらしい。結果より、その途中の顔が忘れられないらしい。\n「続きができたら、また書きます」で終わっていた。"]},"en":{"from":"差出人：地球最後の留守番","body":"みんな宇宙へ移住しました。宅配便が来る予定なので私は残っています。","choices":["未来に任せよう","まず記録を残そう","地球に聞いてみよう"],"ends":["その日の夕方、地球最後の留守番から二通目。\n「未来に任せよう」を実行する前に、みんな宇宙へ移住しましたという話を思い出したらしい。\nまず紙に書き出してみた。説明を求められ、余計に話が大きくなった。\n封筒には、なぜか二枚目の切手が貼ってあった。","その日の夕方、地球最後の留守番が報告してきた。\n「まず記録を残そう」という一言がきっかけで、まず紙に書き出してみた。\n「みんな宇宙へ移住しました」と悩んでいた頃とは、少し様子が違う。なぜか小さな行列ができた。\n「誰にも内緒にしてください」と、しっかり赤字で書かれていた。","翌日の昼、地球最後の留守番から二通目。\n「地球に聞いてみよう」を実行する前に、みんな宇宙へ移住しましたという話を思い出したらしい。\n本当にその通りにしたらしい。結果より、その途中の顔が忘れられないらしい。\n「続きができたら、また書きます」で終わっていた。"]}},{"ja":{"from":"差出人：感情を翻訳する機械の整備士","body":"「大丈夫」を翻訳すると毎回違う言葉になります。故障でしょうか。","choices":["まず記録を残そう","地球に聞いてみよう","未来に任せよう"],"ends":["次の朝、感情を翻訳する機械の整備士から二通目。\n「まず記録を残そう」を実行する前に、「大丈夫」を翻訳すると毎回違う言葉になりますという話を思い出したらしい。\n半信半疑で動いてみたらしい。意外にも反対する人がいなかった。\n封筒には、なぜか二枚目の切手が貼ってあった。","翌日の昼、感情を翻訳する機械の整備士から追伸が来た。\n「地球に聞いてみよう」を選んだことを伝えると、予定外の相手まで巻き込んだ。\n「大丈夫」を翻訳すると毎回違う言葉になります――その話が、今度は別の意味で広まっている。結果より、その途中の顔が忘れられないらしい。\nその後どうなったかは、まだ誰も知らない。","雨が降った日、感情を翻訳する機械の整備士が、例の「「大丈夫」を翻訳すると毎回違う言葉になります」について書いてきた。\n「未来に任せよう」の返事をきっかけに、最初は笑ったが、試してみた。\nところが、話を聞いていた人のほうが先に動いた。\n追伸には「次は自分で決めてみます」とあった。"]},"en":{"from":"差出人：感情を翻訳する機械の整備士","body":"「大丈夫」を翻訳すると毎回違う言葉になります。故障でしょうか。","choices":["まず記録を残そう","地球に聞いてみよう","未来に任せよう 」を実行する前に、花びらの封筒が風で飛んでいきますという話を思い出したらしい。\nさっそく試してみたそうだ。説明を求められ、余計に話が大きくなった。\nその後どうなったかは、まだ誰も知らない。"]},"en":{"from":"差出人：妖精の郵便配達員","body":"花びらの封筒が風で飛んでいきます。配達より追跡が仕事になっています。","choices":["師匠に聞いてみよう","それも伝説になる","魔法なしで考えよう"],"ends":["しばらくして、妖精の郵便配達員が報告してきた。\n「師匠に聞いてみよう」という一言がきっかけで、まず紙に書き出してみた。\n「花びらの封筒が風で飛んでいきます」と悩んでいた頃とは、少し様子が違う。相手が先に謝ってきた。\n封筒の裏には、小さな丸が一つ描かれていた。","翌日の昼、妖精の郵便配達員が報告してきた。\n「それも伝説になる」という一言がきっかけで、半信半疑で動いてみたらしい。\n「花びらの封筒が風で飛んでいきます」と悩んでいた頃とは、少し様子が違う。説明を求められ、余計に話が大きくなった。\n次の手紙には、なぜか謝礼のつもりのシールが入っていた。","日付のない追伸が届いた。妖精の郵便配達員から二通目。\n「魔法なしで考えよう」を実行する前に、花びらの封筒が風で飛んでいきますという話を思い出したらしい。\nさっそく試してみたそうだ。説明を求められ、余計に話が大きくなった。\nその後どうなったかは、まだ誰も知らない。"]}},{"ja":{"from":"差出人：雪男の夏休み担当","body":"雪男に海へ行こうと言われました。かき氷屋を紹介するのが無難ですか。","choices":["それも伝説になる","魔法なしで考えよう","師匠に聞いてみよう"],"ends":["返事を出した翌朝、封筒に雪男の夏休み担当の名前があった。\n「それも伝説になる」の通りにするか迷った末、一度はやめかけたが、結局実行した。\n雪男に海へ行こうと言われました。そこから思いもしないことが起きた。なぜか関係ない人が一番喜んだ。\n結局、本人が一番楽しそうだった。","二日後、短い手紙が届いた。差出人は雪男の夏休み担当。\n「魔法なしで考えよう」と返したら、まず紙に書き出してみた。\n例の「雪男に海へ行こうと言われました」の件は、説明を求められ、余計に話が大きくなった。\n封筒の裏には、小さな丸が一つ描かれていた。","二日後、雪男の夏休み担当から追伸が来た。\n「師匠に聞いてみよう」を選んだことを伝えると、最初は笑ったが、試してみた。\n雪男に海へ行こうと言われました――その話が、今度は別の意味で広まっている。意外にも反対する人がいなかった。\n「誰にも内緒にしてください」と、しっかり赤字で書かれていた。"]},"en":{"from":"差出人：雪男の夏休み担当","body":"雪男に海へ行こうと言われました。かき氷屋を紹介するのが無難ですか。","choices":["それも伝説になる","魔法なしで考えよう","師匠に聞いてみよう"],"ends":["返事を出した翌朝、封筒に雪男の夏休み担当の名前があった。\n「それも伝説になる」の通りにするか迷った末、一度はやめかけたが、結局実行した。\n雪男に海へ行こうと言われました。そこから思いもしないことが起きた。なぜか関係ない人が一番喜んだ。\n結局、本人が一番楽しそうだった。","二日後、短い手紙が届いた。差出人は雪男の夏休み担当。\n「魔法なしで考えよう」と返したら、まず紙に書き出してみた。\n例の「雪男に海へ行こうと言われました」の件は、説明を求められ、余計に話が大きくなった。\n封筒の裏には、小さな丸が一つ描かれていた。","二日後、雪男の夏休み担当から追伸が来た。\n「師匠に聞いてみよう」を選んだことを伝えると、最初は笑ったが、試してみた。\n雪男に海へ行こうと言われました――その話が、今度は別の意味で広まっている。意外にも反対する人がいなかった。\n「誰にも内緒にしてください」と、しっかり赤字で書かれていた。"]}},{"ja":{"from":"差出人：魔法の鏡の修理工","body":"鏡が「今日もいい顔」としか言わなくなりました。修理する必要がありますか。","choices":["魔法なしで考えよう","師匠に聞いてみよう","それも伝説になる"],"ends":["その日の夕方、封筒に魔法の鏡の修理工の名前があった。\n「魔法なしで考えよう」の通りにするか迷った末、最初は笑ったが、試してみた。\n鏡が「今日もいい顔」としか言わなくなりました。そこから思いもしないことが起きた。一人だけ、まったく別の解釈をした。\n「誰にも内緒にしてください」と、しっかり赤字で書かれていた。","日付のない追伸が届いた。魔法の鏡の修理工から追伸が来た。\n「師匠に聞いてみよう」を選んだことを伝えると、少しだけ勇気を出してみた。\n鏡が「今日もいい顔」としか言わなくなりました――その話が、今度は別の意味で広まっている。最初に笑った人が、最後は黙り込んだ。\n「誰にも内緒にしてください」と、しっかり赤字で書かれていた。","一週間後、魔法の鏡の修理工が報告してきた。\n「それも伝説になる」という一言がきっかけで、予定外の相手まで巻き込んだ。\n「鏡が「今日もいい顔」としか言わなくなりました」と悩んでいた頃とは、少し様子が違う。誰も予想していない方向に話が進んだ。\n結局、本人が一番楽しそうだった。"]},"en":{"from":"差出人：魔法の鏡の修理工","body":"鏡が「今日もいい顔」としか言わなくなりました。修理する必要がありますか。","choices":["魔法なしで考えよう","師匠に聞いてみよう","それも伝説になる"],"ends":["その日の夕方、封筒に魔法の鏡の修理工の名前があった。\n「魔法なしで考えよう」の通りにするか迷った末、最初は笑ったが、試してみた。\n鏡が「今日もいい顔」としか言わなくなりました。そこから思いもしないことが起きた。一人だけ、まったく別の解釈をした。\n「誰にも内緒にしてください」と、しっかり赤字で書かれていた。","日付のない追伸が届いた。魔法の鏡の修理工から追伸が来た。\n「師匠に聞いてみよう」を選んだことを伝えると、少しだけ勇気を出してみた。\n鏡が「今日もいい顔」としか言わなくなりました――その話が、今度は別の意味で広まっている。最初に笑った人が、最後は黙り込んだ。\n「誰にも内緒にしてください」と、しっかり赤字で書かれていた。","一週間後、魔法の鏡の修理工が報告してきた。\n「それも伝説になる」という一言がきっかけで、予定外の相手まで巻き込んだ。\n「鏡が「今日もいい顔」としか言わなくなりました」と悩んでいた頃とは、少し様子が違う。誰も予想していない方向に話が進んだ。\n結局、本人が一番楽しそうだった。"]}},{"ja":{"from":"差出人：迷宮の地図職人","body":"出口を描くと迷宮の価値がなくなると言われました。地図の仕事とは何でしょう。","choices":["師匠に聞いてみよう","それも伝説になる","魔法なしで考えよう"],"ends":["その夜、迷宮の地図職人から二通目。\n「師匠に聞いてみよう」を実行する前に、出口を描くと迷宮の価値がなくなると言われましたという話を思い出したらしい。\n誰にも言わずに実行した。説明を求められ、余計に話が大きくなった。\n封筒には、なぜか二枚目の切手が貼ってあった。","二日後、短い手紙が届いた。差出人は迷宮の地図職人。\n「それも伝説になる」と返したら、少しだけ勇気を出してみた。\n例の「出口を描くと迷宮の価値がなくなると言われました」の件は、周囲は納得したが、本人だけ納得していない。\n「続きができたら、また書きます」で終わっていた。","雨が降った日、迷宮の地図職人が報告してきた。\n「魔法なしで考えよう」という一言がきっかけで、半信半疑で動いてみたらしい。\n「出口を描くと迷宮の価値がなくなると言われました」と悩んでいた頃とは、少し様子が違う。なぜか小さな行列ができた。\n「たぶんこれでよかった」と短く締めくくられていた。"]},"en":{"from":"差出人：迷宮の地図職人","body":"出口を描くと迷宮の価値がなくなると言われました。地図の仕事とは何でしょう。","choices":["師匠に聞いてみよう","それも伝説になる","魔法なしで考えよう"],"ends":["その夜、迷宮の地図職人から二通目。\n「師匠に聞いてみよう」を実行する前に、出口を描くと迷宮の価値がなくなると言われましたという話を思い出したらしい。\n誰にも言わずに実行した。説明を求められ、余計に話が大きくなった。\n封筒には、なぜか二枚目の切手が貼ってあった。","二日後、短い手紙が届いた。差出人は迷宮の地図職人。\n「それも伝説になる」と返したら、少しだけ勇気を出してみた。\n例の「出口を描くと迷宮の価値がなくなると言われました」の件は、周囲は納得したが、本人だけ納得していない。\n「続きができたら、また書きます」で終わっていた。","雨が降った日、迷宮の地図職人が報告してきた。\n「魔法なしで考えよう」という一言がきっかけで、半信半疑で動いてみたらしい。\n「出口を描くと迷宮の価値がなくなると言われました」と悩んでいた頃とは、少し
