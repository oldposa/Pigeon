"choices":["誰かに相談してみよう","いったんお茶にしよう","そのまま続けよう"],"ends":["返事を出した翌朝、短い手紙が届いた。差出人は沈黙を録音する音楽家。\n「誰かに相談してみよう」と返したら、誰にも言わずに実行した。\n例の「静かな場所ほど冷蔵庫の音が入ります」の件は、一人だけ、まったく別の解釈をした。\n封筒には、なぜか二枚目の切手が貼ってあった。","返事を出した翌朝、沈黙を録音する音楽家が、例の「静かな場所ほど冷蔵庫の音が入ります」について書いてきた。\n「いったんお茶にしよう」の返事をきっかけに、最初は笑ったが、試してみた。\n周囲は納得したが、本人だけ納得していない。\n「たぶんこれでよかった」と短く締めくくられていた。","二日後、沈黙を録音する音楽家が報告してきた。\n「そのまま続けよう」という一言がきっかけで、まず紙に書き出してみた。\n「静かな場所ほど冷蔵庫の音が入ります」と悩んでいた頃とは、少し様子が違う。それが新しい習慣になりそうだ。\n最後の一行だけ、やけに字が大きかった。"]}},{"ja":{"from":"差出人：階段を数える探偵","body":"毎日同じ階段の段数が違う気がします。犯人は疲労でしょうか。","choices":["いったんお茶にしよう","そのまま続けよう","誰かに相談してみよう"],"ends":["二日後、階段を数える探偵から二通目。\n「いったんお茶にしよう」を実行する前に、毎日同じ階段の段数が違う気がしますという話を思い出したらしい。\n誰にも言わずに実行した。周囲は納得したが、本人だけ納得していない。\n「続きができたら、また書きます」で終わっていた。","一週間後、短い手紙が届いた。差出人は階段を数える探偵。\n「そのまま続けよう」と返したら、思ったより真剣に受け取られた。\n例の「毎日同じ階段の段数が違う気がします」の件は、返事を見せたら、別の相談が始まった。\n追伸には「次は自分で決めてみます」とあった。","翌日の昼、階段を数える探偵が、例の「毎日同じ階段の段数が違う気がします」について書いてきた。\n「誰かに相談してみよう」の返事をきっかけに、少しだけ勇気を出してみた。\n説明を求められ、余計に話が大きくなった。\n次の手紙には、なぜか謝礼のつもりのシールが入っていた。"]},"en":{"from":"差出人：階段を数える探偵","body":"毎日同じ階段の段数が違う気がします。犯人は疲労でしょうか。","choices":["いったんお茶にしよう","そのまま続けよう","誰かに相談してみよう"],"ends":["二日後、階段を数える探偵から二通目。\n「いったんお茶にしよう」を実行する前に、毎日同じ階段の段数が違う気がしますという話を思い出したらしい。\n誰にも言わずに実行した。周囲は納得したが、本人だけ納得していない。\n「続きができたら、また書きます」で終わっていた。","一週間後、短い手紙が届いた。差出人は階段を数える探偵。\n「そのまま続けよう」と返したら、思ったより真剣に受け取られた。\n例の「毎日同じ階段の段数が違う気がします」の件は、返事を見せたら、別の相談が始まった。\n追伸には「次は自分で決めてみます」とあった。","翌日の昼、階段を数える探偵が、例の「毎日同じ階段の段数が違う気がします」について書いてきた。\n「誰かに相談してみよう」の返事をきっかけに、少しだけ勇気を出してみた。\n説明を求められ、余計に話が大きくなった。\n次の手紙には、なぜか謝礼のつもりのシールが入っていた。"]}},{"ja":{"from":"差出人：予定のない秘書","body":"予定がないことを毎朝確認しています。上司は忙しそうに感謝します。","choices":["そのまま続けよう","誰かに相談してみよう","いったんお茶にしよう"],"ends":["数時間後、予定のない秘書が報告してきた。\n「そのまま続けよう」という一言がきっかけで、本当にその通りにしたらしい。\n「予定がないことを毎朝確認しています」と悩んでいた頃とは、少し様子が違う。結果より、その途中の顔が忘れられないらしい。\n「今度はあなたの話も聞かせて」と書き添えられていた。","二日後、短い手紙が届いた。差出人は予定のない秘書。\n「誰かに相談してみよう」と返したら、誰にも言わずに実行した。\n例の「予定がないことを毎朝確認しています」の件は、最初に笑った人が、最後は黙り込んだ。\nその後どうなったかは、まだ誰も知らない。","二日後、予定のない秘書が、例の「予定がないことを毎朝確認しています」について書いてきた。\n「いったんお茶にしよう」の返事をきっかけに、思い切って口に出してみた。\n返事を見せたら、別の相談が始まった。\n「続きができたら、また書きます」で終わっていた。"]},"en":{"from":"差出人：予定のない秘書","body":"予定がないことを毎朝確認しています。上司は忙しそうに感謝します。","choices":["そのまま続けよう","誰かに相談してみよう","いったんお茶にしよう"],"ends":["数時間後、予定のない秘書が報告してきた。\n「そのまま続けよう」という一言がきっかけで、本当にその通りにしたらしい。\n「予定がないことを毎朝確認しています」と悩んでいた頃とは、少し様子が違う。結果より、その途中の顔が忘れられないらしい。\n「今度はあなたの話も聞かせて」と書き添えられていた。","二日後、短い手紙が届いた。差出人は予定のない秘書。\n「誰かに相談してみよう」と返したら、誰にも言わずに実行した。\n例の「予定がないことを毎朝確認しています」の件は、最初に笑った人が、最後は黙り込んだ。\nその後どうなったかは、まだ誰も知らない。","二日後、予定のない秘書が、例の「予定がないことを毎朝確認しています」について書いてきた。\n「いったんお茶にしよう」の返事をきっかけに、思い切って口に出してみた。\n返事を見せたら、別の相談が始まった。\n「続きができたら、また書きます」で終わっていた。"]}},{"ja":{"from":"差出人：失敗談を集める司会者","body":"みんな成功談しか話しません。自分の失敗から始めるべきですか。","choices":["誰かに相談してみよう","いったんお茶にしよう","そのまま続けよう"],"ends":["一週間後、失敗談を集める司会者が、例の「みんな成功談しか話しません」について書いてきた。\n「誰かに相談してみよう」の返事をきっかけに、半信半疑で動いてみたらしい。\nいちばん驚いたのは本人だった。\n「たぶんこれでよかった」と短く締めくくられていた。","二日後、失敗談を集める司会者が報告してきた。\n「いったんお茶にしよう」という一言がきっかけで、思い切って口に出してみた。\n「みんな成功談しか話しません」と悩んでいた頃とは、少し様子が違う。返事を見せたら、別の相談が始まった。\n「誰にも内緒にしてください」と、しっかり赤字で書かれていた。","日付のない追伸が届いた。封筒に失敗談を集める司会者の名前があった。\n「そのまま続けよう」の通りにするか迷った末、返事を見て、予定を変更した。\nみんな成功談しか話しません。そこから思いもしないことが起きた。ところが、話を聞いていた人のほうが先に動いた。\n「続きができたら、また書きます」で終わっていた。"]},"en":{"from":"差出人：失敗談を集める司会者","body":"みんな成功談しか話しません。自分の失敗から始めるべきですか。","choices":["誰かに相談してみよう","いったんお茶にしよう","そのまま続けよう"],"ends":["一週間後、失敗談を集める司会者が、例の「みんな成功談しか話しません」について書いてきた。\n「誰かに相談してみよう」の返事をきっかけに、半信半疑で動いてみたらしい。\nいちばん驚いたのは本人だった。\n「たぶんこれでよかった」と短く締めくくられていた。","二日後、失敗談を集める司会者が報告してきた。\n「いったんお茶にしよう」という一言がきっかけで、思い切って口に出してみた。\n「みんな成功談しか話しません」と悩んでいた頃とは、少し様子が違う。返事を見せたら、別の相談が始まった。\n「誰にも内緒にしてください」と、しっかり赤字で書かれていた。","日付のない追伸が届いた。封筒に失敗談を集める司会者の名前があった。\n「そのまま続けよう」の通りにするか迷った末、返事を見て、予定を変更した。\nみんな成功談しか話しません。そこから思いもしないことが起きた。ところが、話を聞いていた人のほうが先に動いた。\n「続きができたら、また書きます」で終わっていた。"]}},{"ja":{"from":"差出人：くしゃみの予告係","body":"くしゃみが出る直前に知らせる仕事です。予告した瞬間に止まります。","choices":["いったんお茶にしよう","そのまま続けよう","誰かに相談してみよう"],"ends":["翌日の昼、くしゃみの予告係から追伸が来た。\n「いったんお茶にしよう」を選んだことを伝えると、思ったより真剣に受け取られた。\nくしゃみが出る直前に知らせる仕事です――その話が、今度は別の意味で広まっている。説明を求められ、余計に話が大きくなった。\n最後の一行だけ、やけに字が大きかった。","次の朝、くしゃみの予告係から二通目。\n「そのまま続けよう」を実行する前に、くしゃみが出る直前に知らせる仕事ですという話を思い出したらしい。\n一度はやめかけたが、結局実行した。思わぬところで拍手が起きた。\n次の手紙には、なぜか謝礼のつもりのシールが入っていた。","一週間後、くしゃみの予告係から追伸が来た。\n「誰かに相談してみよう」を選んだことを伝えると、さっそく試してみたそうだ。\nくしゃみが出る直前に知らせる仕事です――その話が、今度は別の意味で広まっている。誰も予想していない方向に話が進んだ。\n追伸には「次は自分で決めてみます」とあった。"]},"en":{"from":"差出人：くしゃみの予告係","body":"くしゃみが出る直前に知らせる仕事です。予告した瞬間に止まります。","choices":["いったんお茶にしよう","そのまま続けよう","誰かに相談してみよう"],"ends":["翌日の昼、くしゃみの予告係から追伸が来た。\n「いったんお茶にしよう」を選んだことを伝えると、思ったより真剣に受け取られた。\nくしゃみが出る直前に知らせる仕事です――その話が、今度は別の意味で広まっている。説明を求められ、余計に話が大きくなった。\n最後の一行だけ、やけに字が大きかった。","次の朝、くしゃみの予告係から二通目。\n「そのまま続けよう」を実行する前に、くしゃみが出る直前に知らせる仕事ですという話を思い出したらしい。\n一度はやめかけたが、結局実行した。思わぬところで拍手が起きた。\n次の手紙には、なぜか謝礼のつもりのシールが入っていた。","一週間後、くしゃみの予告係から追伸が来た。\n「誰かに相談してみよう」を選んだことを伝えると、さっそく試してみたそうだ。\nくしゃみが出る直前に知らせる仕事です――その話が、今度は別の意味で広まっている。誰も予想していない方向に話が進んだ。\n追伸には「次は自分で決めてみます」とあった。"]}},{"ja":{"from":"差出人：閉会式だけ呼ばれる司会者","body":"開会式を見たことがありません。毎回何が終わったのか知りません。","choices":["そのまま続けよう","誰かに相談してみよう","いったんお茶にしよう"],"ends":["返事を出した翌朝、閉会式だけ呼ばれる司会者から追伸が来た。\n「そのまま続けよう」を選んだことを伝えると、一度はやめかけたが、結局実行した。\n開会式を見たことがありません――その話が、今度は別の意味で広まっている。最初に笑った人が、最後は黙り込んだ。\n「たぶんこれでよかった」と短く締めくくられていた。","日付のない追伸が届いた。封筒に閉会式だけ呼ばれる司会者の名前があった。\n「誰かに相談してみよう」の通りにするか迷った末、思ったより真剣に受け取られた。\n開会式を見たことがありません。そこから思いもしないことが起きた。説明を求められ、余計に話が大きくなった。\n追伸には「次は自分で決めてみます」とあった。","日付のない追伸が届いた。閉会式だけ呼ばれる司会者から二通目。\n「いったんお茶にしよう」を実行する前に、開会式を見たことがありませんという話を思い出したらしい。\n予定外の相手まで巻き込んだ。それが新しい習慣になりそうだ。\n「続きができたら、また書きます」で終わっていた。"]},"en":{"from":"差出人：閉会式だけ呼ばれる司会者","body":"開会式を見たことがありません。毎回何が終わったのか知りません。","choices":["そのまま続けよう","誰かに相談してみよう","いったんお茶にしよう"],"ends":["返事を出した翌朝、閉会式だけ呼ばれる司会者から追伸が来た。\n「そのまま続けよう」を選んだことを伝えると、一度はやめかけたが、結局実行した。\n開会式を見たことがありません――その話が、今度は別の意味で広まっている。最初に笑った人が、最後は黙り込んだ。\n「たぶんこれでよかった」と短く締めくくられていた。","日付のない追伸が届いた。封筒に閉会式だけ呼ばれる司会者の名前があった。\n「誰かに相談してみよう」の通りにするか迷った末、思ったより真剣に受け取られた。\n開会式を見たことがありません。そこから思いもしないことが起きた。説明を求められ、余計に話が大きくなった。\n追伸には「次は自分で決めてみます」とあった。","日付のない追伸が届いた。閉会式だけ呼ばれる司会者から二通目。\n「いったんお茶にしよう」を実行する前に、開会式を見たことがありませんという話を思い出したらしい。\n予定外の相手まで巻き込んだ。それが新しい習慣になりそうだ。\n「続きができたら、また書きます」で終わっていた。"]}},{"ja":{"from":"差出人：夢の中の税理士","body":"夢で稼いだお金を申告すべきか相談されます。起きると帳簿が消えます。","choices":["誰かに相談してみよう","いったんお茶にしよう","そのまま続けよう"],"ends":["その夜、短い手紙が届いた。差出人は夢の中の税理士。\n「誰かに相談してみよう」と返したら、誰にも言わずに実行した。\n例の「夢で稼いだお金を申告すべきか相談されます」の件は、一人だけ、まったく別の解釈をした。\n追伸には「次は自分で決めてみます」とあった。","翌日の昼、夢の中の税理士から追伸が来た。\n「いったんお茶にしよう」を選んだことを伝えると、誰にも言わずに実行した。\n夢で稼いだお金を申告すべきか相談されます――その話が、今度は別の意味で広まっている。ところが、話を聞いていた人のほうが先に動いた。\n「誰にも内緒にしてください」と、しっかり赤字で書かれていた。","その夜、短い手紙が届いた。差出人は夢の中の税理士。\n「そのまま続けよう」と返したら、少しだけ勇気を出してみた。\n例の「夢で稼いだお金を申告すべきか相談されます」の件は、周囲は納得したが、本人だけ納得していない。\n次の手紙には、なぜか謝礼のつもりのシールが入っていた。"]},"en":{"from":"差出人：夢の中の税理士","body":"夢で稼いだお金を申告すべきか相談されます。起きると帳簿が消えます。","choices":["誰かに相談してみよう","いったんお茶にしよう","そのまま続けよう"],"ends":["その夜、短い手紙が届いた。差出人は夢の中の税理士。\n「誰かに相談してみよう」と返したら、誰にも言わずに実行した。\n例の「夢で稼いだお金を申告すべきか相談されます」の件は、一人だけ、まったく別の解釈をした。\n追伸には「次は自分で決めてみます」とあった。","翌日の昼、夢の中の税理士から追伸が来た。\n「いったんお茶にしよう」を選んだことを伝えると、誰にも言わずに実行した。\n夢で稼いだお金を申告すべきか相談されます――その話が、今度は別の意味で広まっている。ところが、話を聞いていた人のほうが先に動いた。\n「誰にも内緒にしてください」と、しっかり赤字で書かれていた。","その夜、短い手紙が届いた。差出人は夢の中の税理士。\n「そのまま続けよう」と返したら、少しだけ勇気を出してみた。\n例の「夢で稼いだお金を申告すべきか相談されます」の件は、周囲は納得したが、本人だけ納得していない。\n次の手紙には、なぜか謝礼のつもりのシールが入っていた。"]}},{"ja":{"from":"差出人：未来の自分の代理人","body":"十年後の自分から謝罪の手紙が届きました。理由は書いてありません。","choices":["いったんお茶にしよう","そのまま続けよう","誰かに相談してみよう"],"ends":["二日後、未来の自分の代理人が、例の「十年後の自分から謝罪の手紙が届きました」について書いてきた。\n「いったんお茶にしよう」の返事をきっかけに、本当にその通りにしたらしい。\n説明を求められ、余計に話が大きくなった。\n封筒には、なぜか二枚目の切手が貼ってあった。","三日後、未来の自分の代理人から二通目。\n「そのまま続けよう」を実行する前に、十年後の自分から謝罪の手紙が届きましたという話を思い出したらしい。\n返事を見て、予定を変更した。思わぬところで拍手が起きた。\n「今度はあなたの話も聞かせて」と書き添えられていた。","次の月曜日、未来の自分の代理人から二通目。\n「誰かに相談してみよう」を実行する前に、十年後の自分から謝罪の手紙が届きましたという話を思い出したらしい。\nまず紙に書き出してみた。相手が先に謝ってきた。\n追伸には「次は自分で決めてみます」とあった。"]},"en":{"from":"差出人：未来の自分の代理人","body":"十年後の自分から謝罪の手紙が届きました。理由は書いてありません。","choices":["いったんお茶にしよう","そのまま続けよう","誰かに相談してみよう"],"ends":["二日後、未来の自分の代理人が、例の「十年後の自分から謝罪の手紙が届きました」について書いてきた。\n「いったんお茶にしよう」の返事をきっかけに、本当にその通りにしたらしい。\n説明を求められ、余計に話が大きくなった。\n封筒には、なぜか二枚目の切手が貼ってあった。","三日後、未来の自分の代理人から二通目。\n「そのまま続けよう」を実行する前に、十年後の自分から謝罪の手紙が届きましたという話を思い出したらしい。\n返事を見て、予定を変更した。思わぬところで拍手が起きた。\n「今度はあなたの話も聞かせて」と書き添えられていた。","次の月曜日、未来の自分の代理人から二通目。\n「誰かに相談してみよう」を実行する前に、十年後の自分から謝罪の手紙が届きましたという話を思い出したらしい。\nまず紙に書き出してみた。相手が先に謝ってきた。\n追伸には「次は自分で決めてみます」とあった。"]}},{"ja":{"from":"差出人：昨日の忘れ物を探す係","body":"みんな昨日を忘れたと言います。どこに落としたか聞いても答えません。","choices":["そのまま続けよう","誰かに相談してみよう","いったんお茶にしよう"],"ends":["返事を出した翌朝、昨日の忘れ物を探す係から二通目。\n「そのまま続けよう」を実行する前に、みんな昨日を忘れたと言いますという話を思い出したらしい。\n思い切って口に出してみた。返事を見せたら、別の相談が始まった。\nその後どうなったかは、まだ誰も知らない。","次の朝、昨日の忘れ物を探す係が、例の「みんな昨日を忘れたと言います」について書いてきた。\n「誰かに相談してみよう」の返事をきっかけに、返事を見て、予定を変更した。\n一人だけ、まったく別の解釈をした。\nその後どうなったかは、まだ誰も知らない。","二日後、短い手紙が届いた。差出人は昨日の忘れ物を探す係。\n「いったんお茶にしよう」と返したら、返事を見て、予定を変更した。\n例の「みんな昨日を忘れたと言います」の件は、いちばん驚いたのは本人だった。\n「今度はあなたの話も聞かせて」と書き添えられていた。"]},"en":{"from":"差出人：昨日の忘れ物を探す係","body":"みんな昨日を忘れたと言います。どこに落としたか聞いても答えません。","choices":["そのまま続けよう","誰かに相談してみよう","いったんお茶にしよう"],"ends":["返事を出した翌朝、昨日の忘れ物を探す係から二通目。\n「そのまま続けよう」を実行する前に、みんな昨日を忘れたと言いますという話を思い出したらしい。\n思い切って口に出してみた。返事を見せたら、別の相談が始まった。\nその後どうなったかは、まだ誰も知らない。","次の朝、昨日の忘れ物を探す係が、例の「みんな昨日を忘れたと言います」について書いてきた。\n「誰かに相談してみよう」の返事をきっかけに、返事を見て、予定を変更した。\n一人だけ、まったく別の解釈をした。\nその後どうなったかは、まだ誰も知らない。","二日後、短い手紙が届いた。差出人は昨日の忘れ物を探す係。\n「いったんお茶にしよう」と返したら、返事を見て、予定を変更した。\n例の「みんな昨日を忘れたと言います」の件は、いちばん驚いたのは本人だった。\n「今度はあなたの話も聞かせて」と書き添えられていた。"]}},{"ja":{"from":"差出人：名前のない表彰式の受賞者","body":"何をしたか分からないまま表彰されました。辞退するにも理由がありません。","choices":["誰かに相談してみよう","いったんお茶にしよう","そのまま続けよう"],"ends":["一週間後、名前のない表彰式の受賞者が報告してきた。\n「誰かに相談してみよう」という一言がきっかけで、最初は笑ったが、試してみた。\n「何をしたか分からないまま表彰されました」と悩んでいた頃とは、少し様子が違う。相手が先に謝ってきた。\n最後の一行だけ、やけに字が大きかった。","次の月曜日、名前のない表彰式の受賞者から二通目。\n「いったんお茶にしよう」を実行する前に、何をしたか分からないまま表彰されましたという話を思い出したらしい。\n思ったより真剣に受け取られた。結果より、その途中の顔が忘れられないらしい。\n「続きができたら、また書きます」で終わっていた。","その日の夕方、名前のない表彰式の受賞者から二通目。\n「そのまま続けよう」を実行する前に、何をしたか分からないまま表彰されましたという話を思い出したらしい。\n予定外の相手まで巻き込んだ。最初に笑った人が、最後は黙り込んだ。\n「これ、成功ってことでいいですか」と最後に書いてあった。"]},"en":{"from":"差出人：名前のない表彰式の受賞者","body":"何をしたか分からないまま表彰されました。辞退するにも理由がありません。","choices":["誰かに相談してみよう","いったんお茶にしよう","そのまま続けよう"],"ends":["一週間後、名前のない表彰式の受賞者が報告してきた。\n「誰かに相談してみよう」という一言がきっか "from":"差出人：自動返信に嫉妬する社員","body":"私より丁寧な返信を機械が書きます。友達まで機械に相談し始めました。","choices":["その不便も面白い","設定を見直そう","人に聞いてみよう"],"ends":["日付のない追伸が届いた。封筒に自動返信に嫉妬する社員の名前があった。\n「その不便も面白い」の通りにするか迷った末、予定外の相手まで巻き込んだ。\n私より丁寧な返信を機械が書きます。そこから思いもしないことが起きた。その場では何も起きなかった。翌日になって効いてきた。\n「たぶんこれでよかった」と短く締めくくられていた。","数時間後、自動返信に嫉妬する社員が報告してきた。\n「設定を見直そう」という一言がきっかけで、少しだけ勇気を出してみた。\n「私より丁寧な返信を機械が書きます」と悩んでいた頃とは、少し様子が違う。誰も予想していない方向に話が進んだ。\n封筒には、なぜか二枚目の切手が貼ってあった。","しばらくして、自動返信に嫉妬する社員から二通目。\n「人に聞いてみよう」を実行する前に、私より丁寧な返信を機械が書きますという話を思い出したらしい。\n半信半疑で動いてみたらしい。いちばん驚いたのは本人だった。\n「これ、成功ってことでいいですか」と最後に書いてあった。"]},"en":{"from":"差出人：自動返信に嫉妬する社員","body":"私より丁寧な返信を機械が書きます。友達まで機械に相談し始めました。","choices":["その不便も面白い","設定を見直そう","人に聞いてみよう"],"ends":["日付のない追伸が届いた。封筒に自動返信に嫉妬する社員の名前があった。\n「その不便も面白い」の通りにするか迷った末、予定外の相手まで巻き込んだ。\n私より丁寧な返信を機械が書きます。そこから思いもしないことが起きた。その場では何も起きなかった。翌日になって効いてきた。\n「たぶんこれでよかった」と短く締めくくられていた。","数時間後、自動返信に嫉妬する社員が報告してきた。\n「設定を見直そう」という一言がきっかけで、少しだけ勇気を出してみた。\n「私より丁寧な返信を機械が書きます」と悩んでいた頃とは、少し様子が違う。誰も予想していない方向に話が進んだ。\n封筒には、なぜか二枚目の切手が貼ってあった。","しばらくして、自動返信に嫉妬する社員から二通目。\n「人に聞いてみよう」を実行する前に、私より丁寧な返信を機械が書きますという話を思い出したらしい。\n半信半疑で動いてみたらしい。いちばん驚いたのは本人だった。\n「これ、成功ってことでいいですか」と最後に書いてあった。"]}},{"ja":{"from":"差出人：古い携帯を充電する人","body":"十年前のメールが残っています。読む前に充電が切れそうです。","choices":["設定を見直そう","人に聞いてみよう","その不便も面白い"],"ends":["次の朝、古い携帯を充電する人から追伸が来た。\n「設定を見直そう」を選んだことを伝えると、思ったより真剣に受け取られた。\n十年前のメールが残っています――その話が、今度は別の意味で広まっている。いちばん驚いたのは本人だった。\n封筒には、なぜか二枚目の切手が貼ってあった。","その日の夕方、古い携帯を充電する人が報告してきた。\n「人に聞いてみよう」という一言がきっかけで、誰にも言わずに実行した。\n「十年前のメールが残っています」と悩んでいた頃とは、少し様子が違う。説明を求められ、余計に話が大きくなった。\n追伸には「次は自分で決めてみます」とあった。","その夜、古い携帯を充電する人が報告してきた。\n「その不便も面白い」という一言がきっかけで、最初は笑ったが、試してみた。\n「十年前のメールが残っています」と悩んでいた頃とは、少し様子が違う。その場では何も起きなかった。翌日になって効いてきた。\nその後どうなったかは、まだ誰も知らない。"]},"en":{"from":"差出人：古い携帯を充電する人","body":"十年前のメールが残っています。読む前に充電が切れそうです。","choices":["設定を見直そう","人に聞いてみよう","その不便も面白い"],"ends":["次の朝、古い携帯を充電する人から追伸が来た。\n「設定を見直そう」を選んだことを伝えると、思ったより真剣に受け取られた。\n十年前のメールが残っています――その話が、今度は別の意味で広まっている。いちばん驚いたのは本人だった。\n封筒には、なぜか二枚目の切手が貼ってあった。","その日の夕方、古い携帯を充電する人が報告してきた。\n「人に聞いてみよう」という一言がきっかけで、誰にも言わずに実行した。\n「十年前のメールが残っています」と悩んでいた頃とは、少し様子が違う。説明を求められ、余計に話が大きくなった。\n追伸には「次は自分で決めてみます」とあった。","その夜、古い携帯を充電する人が報告してきた。\n「その不便も面白い」という一言がきっかけで、最初は笑ったが、試してみた。\n「十年前のメールが残っています」と悩んでいた頃とは、少し様子が違う。その場では何も起きなかった。翌日になって効いてきた。\nその後どうなったかは、まだ誰も知らない。"]}},{"ja":{"from":"差出人：画面共有が苦手な講師","body":"説明より「見えていますか」を多く言っています。授業名を変えるべきですか。","choices":["人に聞いてみよう","その不便も面白い","設定を見直そう"],"ends":["数時間後、画面共有が苦手な講師が報告してきた。\n「人に聞いてみよう」という一言がきっかけで、さっそく試してみたそうだ。\n「説明より「見えていますか」を多く言っています」と悩んでいた頃とは、少し様子が違う。思わぬところで拍手が起きた。\n「誰にも内緒にしてください」と、しっかり赤字で書かれていた。","雨が降った日、画面共有が苦手な講師から二通目。\n「その不便も面白い」を実行する前に、説明より「見えていますか」を多く言っていますという話を思い出したらしい。\n返事を見て、予定を変更した。一人だけ、まったく別の解釈をした。\n最後の一行だけ、やけに字が大きかった。","週末になって、短い手紙が届いた。差出人は画面共有が苦手な講師。\n「設定を見直そう」と返したら、さっそく試してみたそうだ。\n例の「説明より「見えていますか」を多く言っています」の件は、思わぬところで拍手が起きた。\n追伸には「次は自分で決めてみます」とあった。"]},"en":{"from":"差出人：画面共有が苦手な講師","body":"説明より「見えていますか」を多く言っています。授業名を変えるべきですか。","choices":["人に聞いてみよう","その不便も面白い","設定を見直そう"],"ends":["数時間後、画面共有が苦手な講師が報告してきた。\n「人に聞いてみよう」という一言がきっかけで、さっそく試してみたそうだ。\n「説明より「見えていますか」を多く言っています」と悩んでいた頃とは、少し様子が違う。思わぬところで拍手が起きた。\n「誰にも内緒にしてください」と、しっかり赤字で書かれていた。","雨が降った日、画面共有が苦手な講師から二通目。\n「その不便も面白い」を実行する前に、説明より「見えていますか」を多く言っていますという話を思い出したらしい。\n返事を見て、予定を変更した。一人だけ、まったく別の解釈をした。\n最後の一行だけ、やけに字が大きかった。","週末になって、短い手紙が届いた。差出人は画面共有が苦手な講師。\n「設定を見直そう」と返したら、さっそく試してみたそうだ。\n例の「説明より「見えていますか」を多く言っています」の件は、思わぬところで拍手が起きた。\n追伸には「次は自分で決めてみます」とあった。"]}},{"ja":{"from":"差出人：検索しない研究者","body":"答えを探す前に考えるのが好きです。気づくと一日終わっています。","choices":["その不便も面白い","設定を見直そう","人に聞いてみよう"],"ends":["二日後、封筒に検索しない研究者の名前があった。\n「その不便も面白い」の通りにするか迷った末、半信半疑で動いてみたらしい。\n答えを探す前に考えるのが好きです。そこから思いもしないことが起きた。その場では何も起きなかった。翌日になって効いてきた。\n「誰にも内緒にしてください」と、しっかり赤字で書かれていた。","翌日の昼、封筒に検索しない研究者の名前があった。\n「設定を見直そう」の通りにするか迷った末、返事を見て、予定を変更した。\n答えを探す前に考えるのが好きです。そこから思いもしないことが起きた。なぜか関係ない人が一番喜んだ。\n「今度はあなたの話も聞かせて」と書き添えられていた。","しばらくして、封筒に検索しない研究者の名前があった。\n「人に聞いてみよう」の通りにするか迷った末、少しだけ勇気を出してみた。\n答えを探す前に考えるのが好きです。そこから思いもしないことが起きた。意外にも反対する人がいなかった。\n封筒には、なぜか二枚目の切手が貼ってあった。"]},"en":{"from":"差出人：検索しない研究者","body":"答えを探す前に考えるのが好きです。気づくと一日終わっています。","choices":["その不便も面白い","設定を見直そう","人に聞いてみよう"],"ends":["二日後、封筒に検索しない研究者の名前があった。\n「その不便も面白い」の通りにするか迷った末、半信半疑で動いてみたらしい。\n答えを探す前に考えるのが好きです。そこから思いもしないことが起きた。その場では何も起きなかった。翌日になって効いてきた。\n「誰にも内緒にしてください」と、しっかり赤字で書かれていた。","翌日の昼、封筒に検索しない研究者の名前があった。\n「設定を見直そう」の通りにするか迷った末、返事を見て、予定を変更した。\n答えを探す前に考えるのが好きです。そこから思いもしないことが起きた。なぜか関係ない人が一番喜んだ。\n「今度はあなたの話も聞かせて」と書き添えられていた。","しばらくして、封筒に検索しない研究者の名前があった。\n「人に聞いてみよう」の通りにするか迷った末、少しだけ勇気を出してみた。\n答えを探す前に考えるのが好きです。そこから思いもしないことが起きた。意外にも反対する人がいなかった。\n封筒には、なぜか二枚目の切手が貼ってあった。"]}},{"ja":{"from":"差出人：キーボードの音を録る作曲家","body":"友人のタイピングが一番いいリズムです。本人は締切に追われています。","choices":["設定を見直そう","人に聞いてみよう","その不便も面白い"],"ends":["一週間後、キーボードの音を録る作曲家が報告してきた。\n「設定を見直そう」という一言がきっかけで、まず紙に書き出してみた。\n「友人のタイピングが一番いいリズムです」と悩んでいた頃とは、少し様子が違う。意外にも反対する人がいなかった。\nその後どうなったかは、まだ誰も知らない。","次の月曜日、キーボードの音を録る作曲家から二通目。\n「人に聞いてみよう」を実行する前に、友人のタイピングが一番いいリズムですという話を思い出したらしい。\n思い切って口に出してみた。相手が先に謝ってきた。\n「たぶんこれでよかった」と短く締めくくられていた。","次の月曜日、キーボードの音を録る作曲家から二通目。\n「その不便も面白い」を実行する前に、友人のタイピングが一番いいリズムですという話を思い出したらしい。\nまず紙に書き出してみた。ところが、話を聞いていた人のほうが先に動いた。\n封筒には、なぜか二枚目の切手が貼ってあった。"]},"en":{"from":"差出人：キーボードの音を録る作曲家","body":"友人のタイピングが一番いいリズムです。本人は締切に追われています。","choices":["設定を見直そう","人に聞いてみよう","その不便も面白い"],"ends":["一週間後、キーボードの音を録る作曲家が報告してきた。\n「設定を見直そう」という一言がきっかけで、まず紙に書き出してみた。\n「友人のタイピングが一番いいリズムです」と悩んでいた頃とは、少し様子が違う。意外にも反対する人がいなかった。\nその後どうなったかは、まだ誰も知らない。","次の月曜日、キーボードの音を録る作曲家から二通目。\n「人に聞いてみよう」を実行する前に、友人のタイピングが一番いいリズムですという話を思い出したらしい。\n思い切って口に出してみた。相手が先に謝ってきた。\n「たぶんこれでよかった」と短く締めくくられていた。","次の月曜日、キーボードの音を録る作曲家から二通目。\n「その不便も面白い」を実行する前に、友人のタイピングが一番いいリズムですという話を思い出したらしい。\nまず紙に書き出してみた。ところが、話を聞いていた人のほうが先に動いた。\n封筒には、なぜか二枚目の切手が貼ってあった。"]}},{"ja":{"from":"差出人：充電器を持ち歩く案内人","body":"道を聞かれるより充電を頼まれます。駅前の電源になりそうです。","choices":["人に聞いてみよう","その不便も面白い","設定を見直そう"],"ends":["雨が降った日、短い手紙が届いた。差出人は充電器を持ち歩く案内人。\n「人に聞いてみよう」と返したら、本当にその通りにしたらしい。\n例の「道を聞かれるより充電を頼まれます」の件は、説明を求められ、余計に話が大きくなった。\n結局、本人が一番楽しそうだった。","翌週、充電器を持ち歩く案内人が、例の「道を聞かれるより充電を頼まれます」について書いてきた。\n「その不便も面白い」の返事をきっかけに、まず紙に書き出してみた。\n一人だけ、まったく別の解釈をした。\n結局、本人が一番楽しそうだった。","次の朝、充電器を持ち歩く案内人から二通目。\n「設定を見直そう」を実行する前に、道を聞かれるより充電を頼まれますという話を思い出したらしい。\n返事を見て、予定を変更した。相手が先に謝ってきた。\n最後の一行だけ、やけに字が大きかった。"]},"en":{"from":"差出人：充電器を持ち歩く案内人","body":"道を聞かれるより充電を頼まれます。駅前の電源になりそうです。","choices":["人に聞いてみよう","その不便も面白い","設定を見直そう"],"ends":["雨が降った日、短い手紙が届いた。差出人は充電器を持ち歩く案内人。\n「人に聞いてみよう」と返したら、本当にその通りにしたらしい。\n例の「道を聞かれるより充電を頼まれます」の件は、説明を求められ、余計に話が大きくなった。\n結局、本人が一番楽しそうだった。","翌週、充電器を持ち歩く案内人が、例の「道を聞かれるより充電を頼まれます」について書いてきた。\n「その不便も面白い」の返事をきっかけに、まず紙に書き出してみた。\n一人だけ、まったく別の解釈をした。\n結局、本人が一番楽しそうだった。","次の朝、充電器を持ち歩く案内人から二通目。\n「設定を見直そう」を実行する前に、道を聞かれるより充電を頼まれますという話を思い出したらしい。\n返事を見て、予定を変更した。相手が先に謝ってきた。\n最後の一行だけ、やけに字が大きかった。"]}},{"ja":{"from":"差出人：音声入力で日記を書く人","body":"日記に毎日「えーっと」が入ります。人生を迷っているように見えます。","choices":["その不便も面白い","設定を見直そう","人に聞いてみよう"],"ends":["翌週、音声入力で日記を書く人が報告してきた。\n「その不便も面白い」という一言がきっかけで、返事を見て、予定を変更した。\n「日記に毎日「えーっと」が入ります」と悩んでいた頃とは、少し様子が違う。ところが、話を聞いていた人のほうが先に動いた。\n結局、本人が一番楽しそうだった。","三日後、音声入力で日記を書く人から二通目。\n「設定を見直そう」を実行する前に、日記に毎日「えーっと」が入りますという話を思い出したらしい。\n本当にその通りにしたらしい。一人だけ、まったく別の解釈をした。\n封筒には、なぜか二枚目の切手が貼ってあった。","二日後、音声入力で日記を書く人が、例の「日記に毎日「えーっと」が入ります」について書いてきた。\n「人に聞いてみよう」の返事をきっかけに、少しだけ勇気を出してみた。\nなぜか関係ない人が一番喜んだ。\n最後の一行だけ、やけに字が大きかった。"]},"en":{"from":"差出人：音声入力で日記を書く人","body":"日記に毎日「えーっと」が入ります。人生を迷っているように見えます。","choices":["その不便も面白い","設定を見直そう","人に聞いてみよう"],"ends":["翌週、音声入力で日記を書く人が報告してきた。\n「その不便も面白い」という一言がきっかけで、返事を見て、予定を変更した。\n「日記に毎日「えーっと」が入ります」と悩んでいた頃とは、少し様子が違う。ところが、話を聞いていた人のほうが先に動いた。\n結局、本人が一番楽しそうだった。","三日後、音声入力で日記を書く人から二通目。\n「設定を見直そう」を実行する前に、日記に毎日「えーっと」が入りますという話を思い出したらしい。\n本当にその通りにしたらしい。一人だけ、まったく別の解釈をした。\n封筒には、なぜか二枚目の切手が貼ってあった。","二日後、音声入力で日記を書く人が、例の「日記に毎日「えーっと」が入ります」について書いてきた。\n「人に聞いてみよう」の返事をきっかけに、少しだけ勇気を出してみた。\nなぜか関係ない人が一番喜んだ。\n最後の一行だけ、やけに字が大きかった。"]}},{"ja":{"from":"差出人：壊れた時計を直さない技師","body":"父の形見の時計だけ直せません。止まった時刻を忘れたくないんです。","choices":["設定を見直そう","人に聞いてみよう","その不便も面白い"],"ends":["しばらくして、封筒に壊れた時計を直さない技師の名前があった。\n「設定を見直そう」の通りにするか迷った末、本当にその通りにしたらしい。\n父の形見の時計だけ直せません。そこから思いもしないことが起きた。返事を見せたら、別の相談が始まった。\n「たぶんこれでよかった」と短く締めくくられていた。","三日後、短い手紙が届いた。差出人は壊れた時計を直さない技師。\n「人に聞いてみよう」と返したら、半信半疑で動いてみたらしい。\n例の「父の形見の時計だけ直せません」の件は、それが新しい習慣になりそうだ。\n最後の一行だけ、やけに字が大きかった。","週末になって、壊れた時計を直さない技師から二通目。\n「その不便も面白い」を実行する前に、父の形見の時計だけ直せませんという話を思い出したらしい。\n本当にその通りにしたらしい。ところが、話を聞いていた人のほうが先に動いた。\n次の手紙には、なぜか謝礼のつもりのシールが入っていた。"]},"en":{"from":"差出人：壊れた時計を直さない技師","body":"父の形見の時計だけ直せません。止まった時刻を忘れたくないんです。","choices":["設定を見直そう","人に聞いてみよう","その不便も面白い"],"ends":["しばらくして、封筒に壊れた時計を直さない技師の名前があった。\n「設定を見直そう」の通りにするか迷った末、本当にその通りにしたらしい。\n父の形見の時計だけ直せません。そこから思いもしないことが起きた。返事を見せたら、別の相談が始まった。\n「たぶんこれでよかった」と短く締めくくられていた。","三日後、短い手紙が届いた。差出人は壊れた時計を直さない技師。\n「人に聞いてみよう」と返したら、半信半疑で動いてみたらしい。\n例の「父の形見の時計だけ直せません」の件は、それが新しい習慣になりそうだ。\n最後の一行だけ、やけに字が大きかった。","週末になって、壊れた時計を直さない技師から二通目。\n「その不便も面白い」を実行する前に、父の形見の時計だけ直せませんという話を思い出したらしい。\n本当にその通りにしたらしい。ところが、話を聞いていた人のほうが先に動いた。\n次の手紙には、なぜか謝礼のつもりのシールが入っていた。"]}},{"ja":{"from":"差出人：AIに名前を付ける老人","body":"毎日違う名前で呼んでいたら、機械のほうが私を覚えました。","choices":["人に聞いてみよう","その不便も面白い","設定を見直そう"],"ends":["三日後、短い手紙が届いた。差出人はAIに名前を付ける老人。\n「人に聞いてみよう」と返したら、誰にも言わずに実行した。\n例の「毎日違う名前で呼んでいたら、機械のほうが私を覚えました」の件は、誰も予想していない方向に話が進んだ。\n「たぶんこれでよかった」と短く締めくくられていた。","雨が降った日、AIに名前を付ける老人から追伸が来た。\n「その不便も面白い」を選んだことを伝えると、半信半疑で動いてみたらしい。\n毎日違う名前で呼んでいたら、機械のほうが私を覚えました――その話が、今度は別の意味で広まっている。思わぬところで拍手が起きた。\n最後の一行だけ、やけに字が大きかった。","週末になって、短い手紙が届いた。差出人はAIに名前を付ける老人。\n「設定を見直そう」と返したら、一度はやめかけたが、結局実行した。\n例の「毎日違う名前で呼んでいたら、機械のほうが私を覚えました」の件は、最初に笑った人が、最後は黙り込んだ。\n「たぶんこれでよかった」と短く締めくくられていた。"]},"en":{"from":"差出人：AIに名前を付ける老人","body":"毎日違う名前で呼んでいたら、機械のほうが私を覚えました。","choices":["人に聞いてみよう","その不便も面白い","設定を見直そう"],"ends":["三日後、短い手紙が届いた。差出人はAIに名前を付ける老人。\n「人に聞いてみよう」と返したら、誰にも言わずに実行した。\n例の「毎日違う名前で呼んでいたら、機械のほうが私を覚えました」の件は、誰も予想していない方向に話が進んだ。\n「たぶんこれでよかった」と短く締めくくられていた。","雨が降った日、AIに名前を付ける老人から追伸が来た。\n「その不便も面白い」を選んだことを伝えると、半信半疑で動いてみたらしい。\n毎日違う名前で呼んでいたら、機械のほうが私を覚えました――その話が、今度は別の意味で広まっている。思わぬところで拍手が起きた。\n最後の一行だけ、やけに字が大きかった。","週末になって、短い手紙が届いた。差出人はAIに名前を付ける老人。\n「設定を見直そう」と返したら、一度はやめかけたが、結局実行した。\n例の「毎日違う名前で呼んでいたら、機械のほうが私を覚えました」の件は、最初に笑った人が、最後は黙り込んだ。\n「たぶんこれでよかった」と短く締めくくられていた。"]}},{"ja":{"from":"差出人：桜の開花を待つ警備員","body":"毎朝同じつぼみを見ています。咲いた日に休みを取りたいです。","choices":["季節に任せよう","来年も楽しみにしよう","今日だけ特別にしよう"],"ends":["翌日の昼、封筒に桜の開花を待つ警備員の名前があった。\n「季節に任せよう」の通りにするか迷った末、思い切って口に出してみた。\n毎朝同じつぼみを見ています。そこから思いもしないことが起きた。結果より、その途中の顔が忘れられないらしい。\n封筒の裏には、小さな丸が一つ描かれていた。","週末になって、短い手紙が届いた。差出人は桜の開花を待つ警備員。\n「来年も楽しみにしよう」と返したら、本当にその通りにしたらしい。\n例の「毎朝同じつぼみを見ています」の件は、周囲は納得したが、本人だけ納得していない。\n次の手紙には、なぜか謝礼のつもりのシールが入っていた。","次の月曜日、桜の開花を待つ警備員が報告してきた。\n「今日だけ特別にしよう」という一言がきっかけで、本当にその通りにしたらしい。\n「毎朝同じつぼみを見ています」と悩んでいた頃とは、少し様子が違う。それが新しい習慣になりそうだ。\n「たぶんこれでよかった」と短く締めくくられていた。"]},"en":{"from":"差出人：桜の開花を待つ警備員","body":"毎朝同じつぼみを見ています。咲いた日に休みを取りたいです。","choices":["季節に任せよう","来年も楽しみにしよう","今日だけ特別にしよう"],"ends":["翌日の昼、封筒に桜の開花を待つ警備員の名前があった。\n「季節に任せよう」の通りにするか迷った末、思い切って口に出してみた。\n毎朝同じつぼみを見ています。そこから思いもしないことが起きた。結果より、その途中の顔が忘れられないらしい。\n封筒の裏には、小さな丸が一つ描かれていた。","週末になって、短い手紙が届いた。差出人は桜の開花を待つ警備員。\n「来年も楽しみにしよう」と返したら、本当にその通りにしたらしい。\n例の「毎朝同じつぼみを見ています」の件は、周囲は納得したが、本人だけ納得していない。\n次の手紙には、なぜか謝礼のつもりのシールが入っていた。","次の月曜日、桜の開花を待つ警備員が報告してきた。\n「今日だけ特別にしよう」という一言がきっかけで、本当にその通りにしたらしい。\n「毎朝同じつぼみを見ています」と悩んでいた頃とは、少し様子が違う。それが新しい習慣になりそうだ。\n「たぶんこれでよかった」と短く締めくくられていた。"]}},{"ja":{"from":"差出人：夏祭りの提灯係","body":"祭りが終わっても提灯を片付けたくありません。町が少し暗くなるからです。","choices":["来年も楽しみにしよう","今日だけ特別にしよう","季節に任せよう"],"ends":["翌週、夏祭りの提灯係が報告してきた。\n「来年も楽しみにしよう」という一言がきっかけで、最初は笑ったが、試してみた。\n「祭りが終わっても提灯を片付けたくありません」と悩んでいた頃とは、少し様子が違う。周囲は納得したが、本人だけ納得していない。\n次の手紙には、なぜか謝礼のつもりのシールが入っていた。","週末になって、夏祭りの提灯係が、例の「祭りが終わっても提灯を片付けたくありません」について書いてきた。\n「今日だけ特別にしよう」の返事をきっかけに、さっそく試してみたそうだ。\n周囲は納得したが、本人だけ納得していない。\n「たぶんこれでよかった」と短く締めくくられていた。","しばらくして、短い手紙が届いた。差出人は夏祭りの提灯係。\n「季節に任せよう」と返したら、まず紙に書き出してみた。\n例の「祭りが終わっても提灯を片付けたくありません」の件は、返事を見せたら、別の相談が始まった。\n「続きができたら、また書きます」で終わっていた。"]},"en":{"from":"差出人：夏祭りの提灯係","body":"祭りが終わっても提灯を片付けたくありません。町が少し暗くなるからです。","choices":["来年も楽しみにしよう","今日だけ特別にしよう","季節に任せよう"],"ends":["翌週、夏祭りの提灯係が報告してきた。\n「来年も楽しみにしよう」という一言がきっかけで、最初は笑ったが、試してみた。\n「祭りが終わっても提灯を片付けたくありません」と悩んでいた頃とは、少し様子が違う。周囲は納得したが、本人だけ納得していない。\n次の手紙には、なぜか謝礼のつもりのシールが入っていた。","週末になって、夏祭りの提灯係が、例の「祭りが終わっても提灯を片付けたくありません」について書いてきた。\n「今日だけ特別にしよう」の返事をきっかけに、さっそく試してみたそうだ。\n周囲は納得したが、本人だけ納得していない。\n「たぶんこれでよかった」と短く締めくくられていた。","しばらくして、短い手紙が届いた。差出人は夏祭りの提灯係。\n「季節に nds":["一週間後、短い手紙が届いた。差出人は節分の鬼役を辞めたい父。\n「今日だけ特別にしよう」と返したら、最初は笑ったが、試してみた。\n例の「毎年子どもが本気で豆を投げます」の件は、結果より、その途中の顔が忘れられないらしい。\n結局、本人が一番楽しそうだった。","翌日の昼、封筒に節分の鬼役を辞めたい父の名前があった。\n「季節に任せよう」の通りにするか迷った末、少しだけ勇気を出してみた。\n毎年子どもが本気で豆を投げます。そこから思いもしないことが起きた。誰も予想していない方向に話が進んだ。\n封筒の裏には、小さな丸が一つ描かれていた。","返事を出した翌朝、節分の鬼役を辞めたい父から追伸が来た。\n「来年も楽しみにしよう」を選んだことを伝えると、予定外の相手まで巻き込んだ。\n毎年子どもが本気で豆を投げます――その話が、今度は別の意味で広まっている。最初に笑った人が、最後は黙り込んだ。\n「誰にも内緒にしてください」と、しっかり赤字で書かれていた。"]}},{"ja":{"from":"差出人：花粉の季節の合唱団員","body":"くしゃみのタイミングが合唱に混ざります。指揮者は新しい奏法だと言います。","choices":["季節に任せよう","来年も楽しみにしよう","今日だけ特別にしよう"],"ends":["翌日の昼、花粉の季節の合唱団員が、例の「くしゃみのタイミングが合唱に混ざります」について書いてきた。\n「季節に任せよう」の返事をきっかけに、まず紙に書き出してみた。\nところが、話を聞いていた人のほうが先に動いた。\n「たぶんこれでよかった」と短く締めくくられていた。","次の月曜日、花粉の季節の合唱団員が報告してきた。\n「来年も楽しみにしよう」という一言がきっかけで、思い切って口に出してみた。\n「くしゃみのタイミングが合唱に混ざります」と悩んでいた頃とは、少し様子が違う。意外にも反対する人がいなかった。\n「これ、成功ってことでいいですか」と最後に書いてあった。","週末になって、花粉の季節の合唱団員から二通目。\n「今日だけ特別にしよう」を実行する前に、くしゃみのタイミングが合唱に混ざりますという話を思い出したらしい。\n少しだけ勇気を出してみた。それが新しい習慣になりそうだ。\n「たぶんこれでよかった」と短く締めくくられていた。"]},"en":{"from":"差出人：花粉の季節の合唱団員","body":"くしゃみのタイミングが合唱に混ざります。指揮者は新しい奏法だと言います。","choices":["季節に任せよう","来年も楽しみにしよう","今日だけ特別にしよう"],"ends":["翌日の昼、花粉の季節の合唱団員が、例の「くしゃみのタイミングが合唱に混ざります」について書いてきた。\n「季節に任せよう」の返事をきっかけに、まず紙に書き出してみた。\nところが、話を聞いていた人のほうが先に動いた。\n「たぶんこれでよかった」と短く締めくくられていた。","次の月曜日、花粉の季節の合唱団員が報告してきた。\n「来年も楽しみにしよう」という一言がきっかけで、思い切って口に出してみた。\n「くしゃみのタイミングが合唱に混ざります」と悩んでいた頃とは、少し様子が違う。意外にも反対する人がいなかった。\n「これ、成功ってことでいいですか」と最後に書いてあった。","週末になって、花粉の季節の合唱団員から二通目。\n「今日だけ特別にしよう」を実行する前に、くしゃみのタイミングが合唱に混ざりますという話を思い出したらしい。\n少しだけ勇気を出してみた。それが新しい習慣になりそうだ。\n「たぶんこれでよかった」と短く締めくくられていた。"]}},{"ja":{"from":"差出人：冬至のゆずを育てる人","body":"一年かけて育てたゆずをお風呂に入れる勇気が出ません。","choices":["来年も楽しみにしよう","今日だけ特別にしよう","季節に任せよう"],"ends":["次の月曜日、冬至のゆずを育てる人が、例の「一年かけて育てたゆずをお風呂に入れる勇気が出ません」について書いてきた。\n「来年も楽しみにしよう」の返事をきっかけに、少しだけ勇気を出してみた。\n意外にも反対する人がいなかった。\n次の手紙には、なぜか謝礼のつもりのシールが入っていた。","次の月曜日、封筒に冬至のゆずを育てる人の名前があった。\n「今日だけ特別にしよう」の通りにするか迷った末、誰にも言わずに実行した。\n一年かけて育てたゆずをお風呂に入れる勇気が出ません。そこから思いもしないことが起きた。返事を見せたら、別の相談が始まった。\n封筒には、なぜか二枚目の切手が貼ってあった。","その夜、冬至のゆずを育てる人から追伸が来た。\n「季節に任せよう」を選んだことを伝えると、半信半疑で動いてみたらしい。\n一年かけて育てたゆずをお風呂に入れる勇気が出ません――その話が、今度は別の意味で広まっている。説明を求められ、余計に話が大きくなった。\n「今度はあなたの話も聞かせて」と書き添えられていた。"]},"en":{"from":"差出人：冬至のゆずを育てる人","body":"一年かけて育てたゆずをお風呂に入れる勇気が出ません。","choices":["来年も楽しみにしよう","今日だけ特別にしよう","季節に任せよう"],"ends":["次の月曜日、冬至のゆずを育てる人が、例の「一年かけて育てたゆずをお風呂に入れる勇気が出ません」について書いてきた。\n「来年も楽しみにしよう」の返事をきっかけに、少しだけ勇気を出してみた。\n意外にも反対する人がいなかった。\n次の手紙には、なぜか謝礼のつもりのシールが入っていた。","次の月曜日、封筒に冬至のゆずを育てる人の名前があった。\n「今日だけ特別にしよう」の通りにするか迷った末、誰にも言わずに実行した。\n一年かけて育てたゆずをお風呂に入れる勇気が出ません。そこから思いもしないことが起きた。返事を見せたら、別の相談が始まった。\n封筒には、なぜか二枚目の切手が貼ってあった。","その夜、冬至のゆずを育てる人から追伸が来た。\n「季節に任せよう」を選んだことを伝えると、半信半疑で動いてみたらしい。\n一年かけて育てたゆずをお風呂に入れる勇気が出ません――その話が、今度は別の意味で広まっている。説明を求められ、余計に話が大きくなった。\n「今度はあなたの話も聞かせて」と書き添えられていた。"]}},{"ja":{"from":"差出人：七夕の短冊を回収する人","body":"願い事を読むたびに、誰かの味方になりたくなります。","choices":["今日だけ特別にしよう","季節に任せよう","来年も楽しみにしよう"],"ends":["雨が降った日、七夕の短冊を回収する人から二通目。\n「今日だけ特別にしよう」を実行する前に、願い事を読むたびに、誰かの味方になりたくなりますという話を思い出したらしい。\n本当にその通りにしたらしい。その場では何も起きなかった。翌日になって効いてきた。\n最後の一行だけ、やけに字が大きかった。","翌日の昼、七夕の短冊を回収する人から追伸が来た。\n「季節に任せよう」を選んだことを伝えると、誰にも言わずに実行した。\n願い事を読むたびに、誰かの味方になりたくなります――その話が、今度は別の意味で広まっている。説明を求められ、余計に話が大きくなった。\n「これ、成功ってことでいいですか」と最後に書いてあった。","次の月曜日、七夕の短冊を回収する人から追伸が来た。\n「来年も楽しみにしよう」を選んだことを伝えると、まず紙に書き出してみた。\n願い事を読むたびに、誰かの味方になりたくなります――その話が、今度は別の意味で広まっている。意外にも反対する人がいなかった。\n「続きができたら、また書きます」で終わっていた。"]},"en":{"from":"差出人：七夕の短冊を回収する人","body":"願い事を読むたびに、誰かの味方になりたくなります。","choices":["今日だけ特別にしよう","季節に任せよう","来年も楽しみにしよう"],"ends":["雨が降った日、七夕の短冊を回収する人から二通目。\n「今日だけ特別にしよう」を実行する前に、願い事を読むたびに、誰かの味方になりたくなりますという話を思い出したらしい。\n本当にその通りにしたらしい。その場では何も起きなかった。翌日になって効いてきた。\n最後の一行だけ、やけに字が大きかった。","翌日の昼、七夕の短冊を回収する人から追伸が来た。\n「季節に任せよう」を選んだことを伝えると、誰にも言わずに実行した。\n願い事を読むたびに、誰かの味方になりたくなります――その話が、今度は別の意味で広まっている。説明を求められ、余計に話が大きくなった。\n「これ、成功ってことでいいですか」と最後に書いてあった。","次の月曜日、七夕の短冊を回収する人から追伸が来た。\n「来年も楽しみにしよう」を選んだことを伝えると、まず紙に書き出してみた。\n願い事を読むたびに、誰かの味方になりたくなります――その話が、今度は別の意味で広まっている。意外にも反対する人がいなかった。\n「続きができたら、また書きます」で終わっていた。"]}},{"ja":{"from":"差出人：秋の落ち葉を掃く人","body":"毎朝掃いても夕方には戻ります。木と終わらない文通をしている気分です。","choices":["季節に任せよう","来年も楽しみにしよう","今日だけ特別にしよう"],"ends":["その日の夕方、短い手紙が届いた。差出人は秋の落ち葉を掃く人。\n「季節に任せよう」と返したら、まず紙に書き出してみた。\n例の「毎朝掃いても夕方には戻ります」の件は、一人だけ、まったく別の解釈をした。\n封筒の裏には、小さな丸が一つ描かれていた。","その日の夕方、秋の落ち葉を掃く人から追伸が来た。\n「来年も楽しみにしよう」を選んだことを伝えると、さっそく試してみたそうだ。\n毎朝掃いても夕方には戻ります――その話が、今度は別の意味で広まっている。その場では何も起きなかった。翌日になって効いてきた。\nその後どうなったかは、まだ誰も知らない。","三日後、秋の落ち葉を掃く人が、例の「毎朝掃いても夕方には戻ります」について書いてきた。\n「今日だけ特別にしよう」の返事をきっかけに、少しだけ勇気を出してみた。\n周囲は納得したが、本人だけ納得していない。\n封筒の裏には、小さな丸が一つ描かれていた。"]},"en":{"from":"差出人：秋の落ち葉を掃く人","body":"毎朝掃いても夕方には戻ります。木と終わらない文通をしている気分です。","choices":["季節に任せよう","来年も楽しみにしよう","今日だけ特別にしよう"],"ends":["その日の夕方、短い手紙が届いた。差出人は秋の落ち葉を掃く人。\n「季節に任せよう」と返したら、まず紙に書き出してみた。\n例の「毎朝掃いても夕方には戻ります」の件は、一人だけ、まったく別の解釈をした。\n封筒の裏には、小さな丸が一つ描かれていた。","その日の夕方、秋の落ち葉を掃く人から追伸が来た。\n「来年も楽しみにしよう」を選んだことを伝えると、さっそく試してみたそうだ。\n毎朝掃いても夕方には戻ります――その話が、今度は別の意味で広まっている。その場では何も起きなかった。翌日になって効いてきた。\nその後どうなったかは、まだ誰も知らない。","三日後、秋の落ち葉を掃く人が、例の「毎朝掃いても夕方には戻ります」について書いてきた。\n「今日だけ特別にしよう」の返事をきっかけに、少しだけ勇気を出してみた。\n周囲は納得したが、本人だけ納得していない。\n封筒の裏には、小さな丸が一つ描かれていた。"]}},{"ja":{"from":"差出人：春休みの宿題を待つ先生","body":"宿題を出さなかったら、生徒が何をすればいいか聞いてきました。","choices":["来年も楽しみにしよう","今日だけ特別にしよう","季節に任せよう"],"ends":["帰り道で、封筒に春休みの宿題を待つ先生の名前があった。\n「来年も楽しみにしよう」の通りにするか迷った末、一度はやめかけたが、結局実行した。\n宿題を出さなかったら、生徒が何をすればいいか聞いてきました。そこから思いもしないことが起きた。一人だけ、まったく別の解釈をした。\n封筒には、なぜか二枚目の切手が貼ってあった。","その夜、春休みの宿題を待つ先生から二通目。\n「今日だけ特別にしよう」を実行する前に、宿題を出さなかったら、生徒が何をすればいいか聞いてきましたという話を思い出したらしい。\nまず紙に書き出してみた。その場では何も起きなかった。翌日になって効いてきた。\n次の手紙には、なぜか謝礼のつもりのシールが入っていた。","返事を出した翌朝、春休みの宿題を待つ先生から追伸が来た。\n「季節に任せよう」を選んだことを伝えると、思い切って口に出してみた。\n宿題を出さなかったら、生徒が何をすればいいか聞いてきました――その話が、今度は別の意味で広まっている。最初に笑った人が、最後は黙り込んだ。\n「たぶんこれでよかった」と短く締めくくられていた。"]},"en":{"from":"差出人：春休みの宿題を待つ先生","body":"宿題を出さなかったら、生徒が何をすればいいか聞いてきました。","choices":["来年も楽しみにしよう","今日だけ特別にしよう","季節に任せよう"],"ends":["帰り道で、封筒に春休みの宿題を待つ先生の名前があった。\n「来年も楽しみにしよう」の通りにするか迷った末、一度はやめかけたが、結局実行した。\n宿題を出さなかったら、生徒が何をすればいいか聞いてきました。そこから思いもしないことが起きた。一人だけ、まったく別の解釈をした。\n封筒には、なぜか二枚目の切手が貼ってあった。","その夜、春休みの宿題を待つ先生から二通目。\n「今日だけ特別にしよう」を実行する前に、宿題を出さなかったら、生徒が何をすればいいか聞いてきましたという話を思い出したらしい。\nまず紙に書き出してみた。その場では何も起きなかった。翌日になって効いてきた。\n次の手紙には、なぜか謝礼のつもりのシールが入っていた。","返事を出した翌朝、春休みの宿題を待つ先生から追伸が来た。\n「季節に任せよう」を選んだことを伝えると、思い切って口に出してみた。\n宿題を出さなかったら、生徒が何をすればいいか聞いてきました――その話が、今度は別の意味で広まっている。最初に笑った人が、最後は黙り込んだ。\n「たぶんこれでよかった」と短く締めくくられていた。"]}},{"ja":{"from":"差出人：花火の音だけ聞く住民","body":"窓から花火は見えません。音で色を想像するのが好きです。","choices":["今日だけ特別にしよう","季節に任せよう","来年も楽しみにしよう"],"ends":["返事を出した翌朝、封筒に花火の音だけ聞く住民の名前があった。\n「今日だけ特別にしよう」の通りにするか迷った末、さっそく試してみたそうだ。\n窓から花火は見えません。そこから思いもしないことが起きた。なぜか関係ない人が一番喜んだ。\n「たぶんこれでよかった」と短く締めくくられていた。","二日後、花火の音だけ聞く住民から追伸が来た。\n「季節に任せよう」を選んだことを伝えると、思い切って口に出してみた。\n窓から花火は見えません――その話が、今度は別の意味で広まっている。それが新しい習慣になりそうだ。\n「たぶんこれでよかった」と短く締めくくられていた。","次の月曜日、花火の音だけ聞く住民が報告してきた。\n「来年も楽しみにしよう」という一言がきっかけで、半信半疑で動いてみたらしい。\n「窓から花火は見えません」と悩んでいた頃とは、少し様子が違う。誰も予想していない方向に話が進んだ。\nその後どうなったかは、まだ誰も知らない。"]},"en":{"from":"差出人：花火の音だけ聞く住民","body":"窓から花火は見えません。音で色を想像するのが好きです。","choices":["今日だけ特別にしよう","季節に任せよう","来年も楽しみにしよう"],"ends":["返事を出した翌朝、封筒に花火の音だけ聞く住民の名前があった。\n「今日だけ特別にしよう」の通りにするか迷った末、さっそく試してみたそうだ。\n窓から花火は見えません。そこから思いもしないことが起きた。なぜか関係ない人が一番喜んだ。\n「たぶんこれでよかった」と短く締めくくられていた。","二日後、花火の音だけ聞く住民から追伸が来た。\n「季節に任せよう」を選んだことを伝えると、思い切って口に出してみた。\n窓から花火は見えません――その話が、今度は別の意味で広まっている。それが新しい習慣になりそうだ。\n「たぶんこれでよかった」と短く締めくくられていた。","次の月曜日、花火の音だけ聞く住民が報告してきた。\n「来年も楽しみにしよう」という一言がきっかけで、半信半疑で動いてみたらしい。\n「窓から花火は見えません」と悩んでいた頃とは、少し様子が違う。誰も予想していない方向に話が進んだ。\nその後どうなったかは、まだ誰も知らない。"]}},{"ja":{"from":"差出人：クリスマス後の飾り係","body":"片付けると町が急に静かになります。ひとつだけ残してもいいですか。","choices":["季節に任せよう","来年も楽しみにしよう","今日だけ特別にしよう"],"ends":["一週間後、クリスマス後の飾り係が、例の「片付けると町が急に静かになります」について書いてきた。\n「季節に任せよう」の返事をきっかけに、一度はやめかけたが、結局実行した。\nいちばん驚いたのは本人だった。\n「続きができたら、また書きます」で終わっていた。","その夜、短い手紙が届いた。差出人はクリスマス後の飾り係。\n「来年も楽しみにしよう」と返したら、最初は笑ったが、試してみた。\n例の「片付けると町が急に静かになります」の件は、相手が先に謝ってきた。\n「今度はあなたの話も聞かせて」と書き添えられていた。","次の朝、クリスマス後の飾り係から追伸が来た。\n「今日だけ特別にしよう」を選んだことを伝えると、少しだけ勇気を出してみた。\n片付けると町が急に静かになります――その話が、今度は別の意味で広まっている。結果より、その途中の顔が忘れられないらしい。\n「続きができたら、また書きます」で終わっていた。"]},"en":{"from":"差出人：クリスマス後の飾り係","body":"片付けると町が急に静かになります。ひとつだけ残してもいいですか。","choices":["季節に任せよう","来年も楽しみにしよう","今日だけ特別にしよう"],"ends":["一週間後、クリスマス後の飾り係が、例の「片付けると町が急に静かになります」について書いてきた。\n「季節に任せよう」の返事をきっかけに、一度はやめかけたが、結局実行した。\nいちばん驚いたのは本人だった。\n「続きができたら、また書きます」で終わっていた。","その夜、短い手紙が届いた。差出人はクリスマス後の飾り係。\n「来年も楽しみにしよう」と返したら、最初は笑ったが、試してみた。\n例の「片付けると町が急に静かになります」の件は、相手が先に謝ってきた。\n「今度はあなたの話も聞かせて」と書き添えられていた。","次の朝、クリスマス後の飾り係から追伸が来た。\n「今日だけ特別にしよう」を選んだことを伝えると、少しだけ勇気を出してみた。\n片付けると町が急に静かになります――その話が、今度は別の意味で広まっている。結果より、その途中の顔が忘れられないらしい。\n「続きができたら、また書きます」で終わっていた。"]}},{"ja":{"from":"差出人：補欠席の温め役","body":"試合に出ないままベンチの座り心地だけ詳しくなりました。これも貢献ですか。","choices":["次の試合で試そう","仲間に話そう","それも才能だよ"],"ends":["次の月曜日、補欠席の温め役から追伸が来た。\n「次の試合で試そう」を選んだことを伝えると、半信半疑で動いてみたらしい。\n試合に出ないままベンチの座り心地だけ詳しくなりました――その話が、今度は別の意味で広まっている。結果より、その途中の顔が忘れられないらしい。\n「続きができたら、また書きます」で終わっていた。","返事を出した翌朝、補欠席の温め役が報告してきた。\n「仲間に話そう」という一言がきっかけで、誰にも言わずに実行した。\n「試合に出ないままベンチの座り心地だけ詳しくなりました」と悩んでいた頃とは、少し様子が違う。思わぬところで拍手が起きた。\n封筒の裏には、小さな丸が一つ描かれていた。","三日後、封筒に補欠席の温め役の名前があった。\n「それも才能だよ」の通りにするか迷った末、最初は笑ったが、試してみた。\n試合に出ないままベンチの座り心地だけ詳しくなりました。そこから思いもしないことが起きた。その場では何も起きなかった。翌日になって効いてきた。\n「これ、成功ってことでいいですか」と最後に書いてあった。"]},"en":{"from":"差出人：補欠席の温め役","body":"試合に出ないままベンチの座り心地だけ詳しくなりました。これも貢献ですか。","choices":["次の試合で試そう","仲間に話そう","それも才能だよ"],"ends":["次の月曜日、補欠席の温め役から追伸が来た。\n「次の試合で試そう」を選んだことを伝えると、半信半疑で動いてみたらしい。\n試合に出ないままベンチの座り心地だけ詳しくなりました――その話が、今度は別の意味で広まっている。結果より、その途中の顔が忘れられないらしい。\n「続きができたら、また書きます」で終わっていた。","返事を出した翌朝、補欠席の温め役が報告してきた。\n「仲間に話そう」という一言がきっかけで、誰にも言わずに実行した。\n「試合に出ないままベンチの座り心地だけ詳しくなりました」と悩んでいた頃とは、少し様子が違う。思わぬところで拍手が起きた。\n封筒の裏には、小さな丸が一つ描かれていた。","三日後、封筒に補欠席の温め役の名前があった。\n「それも才能だよ」の通りにするか迷った末、最初は笑ったが、試してみた。\n試合に出ないままベンチの座り心地だけ詳しくなりました。そこから思いもしないことが起きた。その場では何も起きなかった。翌日になって効いてきた。\n「これ、成功ってことでいいですか」と最後に書いてあった。"]}},{"ja":{"from":"差出人：ゴール後に転ぶランナー","body":"ゴールまでは完璧なのに毎回最後に転びます。写真だけが問題です。","choices":["仲間に話そう","それも才能だよ","次の試合で試そう"],"ends":["次の月曜日、ゴール後に転ぶランナーが報告してきた。\n「仲間に話そう」という一言がきっかけで、予定外の相手まで巻き込んだ。\n「ゴールまでは完璧なのに毎回最後に転びます」と悩んでいた頃とは、少し様子が違う。なぜか関係ない人が一番喜んだ。\n「続きができたら、また書きます」で終わっていた。","返事を出した翌朝、ゴール後に転ぶランナーが報告してきた。\n「それも才能だよ」という一言がきっかけで、半信半疑で動いてみたらしい。\n「ゴールまでは完璧なのに毎回最後に転びます」と悩んでいた頃とは、少し様子が違う。最初に笑った人が、最後は黙り込んだ。\nその後どうなったかは、まだ誰も知らない。","返事を出した翌朝、ゴール後に転ぶランナーが報告してきた。\n「次の試合で試そう」という一言がきっかけで、最初は笑ったが、試してみた。\n「ゴールまでは完璧なのに毎回最後に転びます」と悩んでいた頃とは、少し様子が違う。周囲は納得したが、本人だけ納得していない。\n結局、本人が一番楽しそうだった。"]},"en":{"from":"差出人：ゴール後に転ぶランナー","body":"ゴールまでは完璧なのに毎回最後に転びます。写真だけが問題です。","choices":["仲間に話そう","それも才能だよ","次の試合で試そう"],"ends":["次の月曜日、ゴール後に転ぶランナーが報告してきた。\n「仲間に話そう」という一言がきっかけで、予定外の相手まで巻き込んだ。\n「ゴールまでは完璧なのに毎回最後に転びます」と悩んでいた頃とは、少し様子が違う。なぜか関係ない人が一番喜んだ。\n「続きができたら、また書きます」で終わっていた。","返事を出した翌朝、ゴール後に転ぶランナーが報告してきた。\n「それも才能だよ」という一言がきっかけで、半信半疑で動いてみたらしい。\n「ゴールまでは完璧なのに毎回最後に転びます」と悩んでいた頃とは、少し様子が違う。最初に笑った人が、最後は黙り込んだ。\nその後どうなったかは、まだ誰も知らない。","返事を出した翌朝、ゴール後に転ぶランナーが報告してきた。\n「次の試合で試そう」という一言がきっかけで、最初は笑ったが、試してみた。\n「ゴールまでは完璧なのに毎回最後に転びます」と悩んでいた頃とは、少し様子が違う。周囲は納得したが、本人だけ納得していない。\n結局、本人が一番楽しそうだった。"]}},{"ja":{"from":"差出人：泳ぐ前に謝る水泳部員","body":"水を跳ねさせるのが申し訳なくて、毎回プールに一礼しています。","choices":["それも才能だよ","次の試合で試そう","仲間に話そう"],"ends":["その日の夕方、封筒に泳ぐ前に謝る水泳部員の名前があった。\n「それも才能だよ」の通りにするか迷った末、本当にその通りにしたらしい。\n水を跳ねさせるのが申し訳なくて、毎回プールに一礼しています。そこから思いもしないことが起きた。思わぬところで拍手が起きた。\n追伸には「次は自分で決めてみます」とあった。","次の月曜日、泳ぐ前に謝る水泳部員から追伸が来た。\n「次の試合で試そう」を選んだことを伝えると、思い切って口に出してみた。\n水を跳ねさせるのが申し訳なくて、毎回プールに一礼しています――その話が、今度は別の意味で広まっている。返事を見せたら、別の相談が始まった。\nその後どうなったかは、まだ誰も知らない。","翌日の昼、泳ぐ前に謝る水泳部員が、例の「水を跳ねさせるのが申し訳なくて、毎回プールに一礼しています」について書いてきた。\n「仲間に話そう」の返事をきっかけに、最初は笑ったが、試してみた。\n相手が先に謝ってきた。\n「これ、成功ってことでいいですか」と最後に書いてあった。"]},"en":{"from":"差出人：泳ぐ前に謝る水泳部員","body":"水を跳ねさせるのが申し訳なくて、毎回プールに一礼しています。","choices":["それも才能だよ","次の試合で試そう","仲間に話そう"],"ends":["その日の夕方、封筒に泳ぐ前に謝る水泳部員の名前があった。\n「それも才能だよ」の通りにするか迷った末、本当にその通りにしたらしい。\n水を跳ねさせるのが申し訳なくて、毎回プールに一礼しています。そこから思いもしないことが起きた。思わぬところで拍手が起きた。\n追伸には「次は自分で決めてみます」とあった。","次の月曜日、泳ぐ前に謝る水泳部員から追伸が来た。\n「次の試合で試そう」を選んだことを伝えると、思い切って口に出してみた。\n水を跳ねさせるのが申し訳なくて、毎回プールに一礼しています――その話が、今度は別の意味で広まっている。返事を見せたら、別の相談が始まった。\nその後どうなったかは、まだ誰も知らない。","翌日の昼、泳ぐ前に謝る水泳部員が、例の「水を跳ねさせるのが申し訳なくて、毎回プールに一礼しています」について書いてきた。\n「仲間に話そう」の返事をきっかけに、最初は笑ったが、試してみた。\n相手が先に謝ってきた。\n「これ、成功ってことでいいですか」と最後に書いてあった。"]}},{"ja":{"from":"差出人：応援歌を忘れる野球部員","body":"肝心なところで歌詞が出ず、選手の名前を連呼しています。","choices":["次の試合で試そう","仲間に話そう" せたら、別の相談が始まった。\n「続きができたら、また書きます」で終わっていた。","三日後、短い手紙が届いた。差出人はテニスのボール拾い名人。\n「それも才能だよ」と返したら、本当にその通りにしたらしい。\n例の「試合より拾う動きが速いです」の件は、その場では何も起きなかった。翌日になって効いてきた。\n「今度はあなたの話も聞かせて」と書き添えられていた。"]}},{"ja":{"from":"差出人：卓球のラリーを数える人","body":"数えるのに夢中で点数を見失います。誰が勝ったか毎回わかりません。","choices":["仲間に話そう","それも才能だよ","次の試合で試そう"],"ends":["翌週、卓球のラリーを数える人から追伸が来た。\n「仲間に話そう」を選んだことを伝えると、思い切って口に出してみた。\n数えるのに夢中で点数を見失います――その話が、今度は別の意味で広まっている。結果より、その途中の顔が忘れられないらしい。\n最後の一行だけ、やけに字が大きかった。","三日後、封筒に卓球のラリーを数える人の名前があった。\n「それも才能だよ」の通りにするか迷った末、半信半疑で動いてみたらしい。\n数えるのに夢中で点数を見失います。そこから思いもしないことが起きた。それが新しい習慣になりそうだ。\n封筒の裏には、小さな丸が一つ描かれていた。","翌週、封筒に卓球のラリーを数える人の名前があった。\n「次の試合で試そう」の通りにするか迷った末、返事を見て、予定を変更した。\n数えるのに夢中で点数を見失います。そこから思いもしないことが起きた。相手が先に謝ってきた。\n「これ、成功ってことでいいですか」と最後に書いてあった。"]},"en":{"from":"差出人：卓球のラリーを数える人","body":"数えるのに夢中で点数を見失います。誰が勝ったか毎回わかりません。","choices":["仲間に話そう","それも才能だよ","次の試合で試そう"],"ends":["翌週、卓球のラリーを数える人から追伸が来た。\n「仲間に話そう」を選んだことを伝えると、思い切って口に出してみた。\n数えるのに夢中で点数を見失います――その話が、今度は別の意味で広まっている。結果より、その途中の顔が忘れられないらしい。\n最後の一行だけ、やけに字が大きかった。","三日後、封筒に卓球のラリーを数える人の名前があった。\n「それも才能だよ」の通りにするか迷った末、半信半疑で動いてみたらしい。\n数えるのに夢中で点数を見失います。そこから思いもしないことが起きた。それが新しい習慣になりそうだ。\n封筒の裏には、小さな丸が一つ描かれていた。","翌週、封筒に卓球のラリーを数える人の名前があった。\n「次の試合で試そう」の通りにするか迷った末、返事を見て、予定を変更した。\n数えるのに夢中で点数を見失います。そこから思いもしないことが起きた。相手が先に謝ってきた。\n「これ、成功ってことでいいですか」と最後に書いてあった。"]}},{"ja":{"from":"差出人：登山口で待つ案内人","body":"山頂へ行ったことがありません。帰ってきた人の顔を見るのが仕事です。","choices":["それも才能だよ","次の試合で試そう","仲間に話そう"],"ends":["週末になって、登山口で待つ案内人から追伸が来た。\n「それも才能だよ」を選んだことを伝えると、誰にも言わずに実行した。\n山頂へ行ったことがありません――その話が、今度は別の意味で広まっている。思わぬところで拍手が起きた。\n次の手紙には、なぜか謝礼のつもりのシールが入っていた。","週末になって、登山口で待つ案内人から追伸が来た。\n「次の試合で試そう」を選んだことを伝えると、思ったより真剣に受け取られた。\n山頂へ行ったことがありません――その話が、今度は別の意味で広まっている。説明を求められ、余計に話が大きくなった。\n封筒には、なぜか二枚目の切手が貼ってあった。","雨が降った日、登山口で待つ案内人が報告してきた。\n「仲間に話そう」という一言がきっかけで、一度はやめかけたが、結局実行した。\n「山頂へ行ったことがありません」と悩んでいた頃とは、少し様子が違う。いちばん驚いたのは本人だった。\n「誰にも内緒にしてください」と、しっかり赤字で書かれていた。"]},"en":{"from":"差出人：登山口で待つ案内人","body":"山頂へ行ったことがありません。帰ってきた人の顔を見るのが仕事です。","choices":["それも才能だよ","次の試合で試そう","仲間に話そう"],"ends":["週末になって、登山口で待つ案内人から追伸が来た。\n「それも才能だよ」を選んだことを伝えると、誰にも言わずに実行した。\n山頂へ行ったことがありません――その話が、今度は別の意味で広まっている。思わぬところで拍手が起きた。\n次の手紙には、なぜか謝礼のつもりのシールが入っていた。","週末になって、登山口で待つ案内人から追伸が来た。\n「次の試合で試そう」を選んだことを伝えると、思ったより真剣に受け取られた。\n山頂へ行ったことがありません――その話が、今度は別の意味で広まっている。説明を求められ、余計に話が大きくなった。\n封筒には、なぜか二枚目の切手が貼ってあった。","雨が降った日、登山口で待つ案内人が報告してきた。\n「仲間に話そう」という一言がきっかけで、一度はやめかけたが、結局実行した。\n「山頂へ行ったことがありません」と悩んでいた頃とは、少し様子が違う。いちばん驚いたのは本人だった。\n「誰にも内緒にしてください」と、しっかり赤字で書かれていた。"]}},{"ja":{"from":"差出人：サッカーの靴紐係","body":"試合前に全員の靴紐を結びます。自分の靴だけほどけています。","choices":["次の試合で試そう","仲間に話そう","それも才能だよ"],"ends":["翌日の昼、サッカーの靴紐係から追伸が来た。\n「次の試合で試そう」を選んだことを伝えると、最初は笑ったが、試してみた。\n試合前に全員の靴紐を結びます――その話が、今度は別の意味で広まっている。結果より、その途中の顔が忘れられないらしい。\n追伸には「次は自分で決めてみます」とあった。","雨が降った日、封筒にサッカーの靴紐係の名前があった。\n「仲間に話そう」の通りにするか迷った末、本当にその通りにしたらしい。\n試合前に全員の靴紐を結びます。そこから思いもしないことが起きた。説明を求められ、余計に話が大きくなった。\n「続きができたら、また書きます」で終わっていた。","帰り道で、サッカーの靴紐係から二通目。\n「それも才能だよ」を実行する前に、試合前に全員の靴紐を結びますという話を思い出したらしい。\n返事を見て、予定を変更した。最初に笑った人が、最後は黙り込んだ。\n封筒には、なぜか二枚目の切手が貼ってあった。"]},"en":{"from":"差出人：サッカーの靴紐係","body":"試合前に全員の靴紐を結びます。自分の靴だけほどけています。","choices":["次の試合で試そう","仲間に話そう","それも才能だよ"],"ends":["翌日の昼、サッカーの靴紐係から追伸が来た。\n「次の試合で試そう」を選んだことを伝えると、最初は笑ったが、試してみた。\n試合前に全員の靴紐を結びます――その話が、今度は別の意味で広まっている。結果より、その途中の顔が忘れられないらしい。\n追伸には「次は自分で決めてみます」とあった。","雨が降った日、封筒にサッカーの靴紐係の名前があった。\n「仲間に話そう」の通りにするか迷った末、本当にその通りにしたらしい。\n試合前に全員の靴紐を結びます。そこから思いもしないことが起きた。説明を求められ、余計に話が大きくなった。\n「続きができたら、また書きます」で終わっていた。","帰り道で、サッカーの靴紐係から二通目。\n「それも才能だよ」を実行する前に、試合前に全員の靴紐を結びますという話を思い出したらしい。\n返事を見て、予定を変更した。最初に笑った人が、最後は黙り込んだ。\n封筒には、なぜか二枚目の切手が貼ってあった。"]}},{"ja":{"from":"差出人：柔道着を洗うマネージャー","body":"洗濯物の山を見て、今日の練習の激しさがわかります。","choices":["仲間に話そう","それも才能だよ","次の試合で試そう"],"ends":["日付のない追伸が届いた。柔道着を洗うマネージャーが報告してきた。\n「仲間に話そう」という一言がきっかけで、思ったより真剣に受け取られた。\n「洗濯物の山を見て、今日の練習の激しさがわかります」と悩んでいた頃とは、少し様子が違う。なぜか小さな行列ができた。\n封筒の裏には、小さな丸が一つ描かれていた。","次の朝、柔道着を洗うマネージャーが、例の「洗濯物の山を見て、今日の練習の激しさがわかります」について書いてきた。\n「それも才能だよ」の返事をきっかけに、思い切って口に出してみた。\nところが、話を聞いていた人のほうが先に動いた。\n次の手紙には、なぜか謝礼のつもりのシールが入っていた。","数時間後、柔道着を洗うマネージャーが報告してきた。\n「次の試合で試そう」という一言がきっかけで、半信半疑で動いてみたらしい。\n「洗濯物の山を見て、今日の練習の激しさが その音を大切に","一度録音してみよう","誰かと奏でよう"],"ends":["数時間後、無音の指揮者から追伸が来た。\n「その音を大切に」を選んだことを伝えると、思い切って口に出してみた。\n演奏前の静けさが一番好きです――その話が、今度は別の意味で広まっている。返事を見せたら、別の相談が始まった。\n封筒には、なぜか二枚目の切手が貼ってあった。","返事を出した翌朝、無音の指揮者から二通目。\n「一度録音してみよう」を実行する前に、演奏前の静けさが一番好きですという話を思い出したらしい。\n本当にその通りにしたらしい。なぜか関係ない人が一番喜んだ。\nその後どうなったかは、まだ誰も知らない。","次の月曜日、無音の指揮者が報告してきた。\n「誰かと奏でよう」という一言がきっかけで、一度はやめかけたが、結局実行した。\n「演奏前の静けさが一番好きです」と悩んでいた頃とは、少し様子が違う。なぜか小さな行列ができた。\nその後どうなったかは、まだ誰も知らない。"]},"en":{"from":"差出人：無音の指揮者","body":"演奏前の静けさが一番好きです。指揮棒を下ろしたくありません。","choices":["その音を大切に","一度録音してみよう","誰かと奏でよう"],"ends":["数時間後、無音の指揮者から追伸が来た。\n「その音を大切に」を選んだことを伝えると、思い切って口に出してみた。\n演奏前の静けさが一番好きです――その話が、今度は別の意味で広まっている。返事を見せたら、別の相談が始まった。\n封筒には、なぜか二枚目の切手が貼ってあった。","返事を出した翌朝、無音の指揮者から二通目。\n「一度録音してみよう」を実行する前に、演奏前の静けさが一番好きですという話を思い出したらしい。\n本当にその通りにしたらしい。なぜか関係ない人が一番喜んだ。\nその後どうなったかは、まだ誰も知らない。","次の月曜日、無音の指揮者が報告してきた。\n「誰かと奏でよう」という一言がきっかけで、一度はやめかけたが、結局実行した。\n「演奏前の静けさが一番好きです」と悩んでいた頃とは、少し様子が違う。なぜか小さな行列ができた。\nその後どうなったかは、まだ誰も知らない。"]}},{"ja":{"from":"差出人：ピアノの黒鍵だけ好きな子","body":"白鍵を弾くと落ち着きません。先生はまだ理由を聞いてくれません。","choices":["一度録音してみよう","誰かと奏でよう","その音を大切に"],"ends":["一週間後、ピアノの黒鍵だけ好きな子が、例の「白鍵を弾くと落ち着きません」について書いてきた。\n「一度録音してみよう」の返事をきっかけに、返事を見て、予定を変更した。\n思わぬところで拍手が起きた。\n「今度はあなたの話も聞かせて」と書き添えられていた。","三日後、短い手紙が届いた。差出人はピアノの黒鍵だけ好きな子。\n「誰かと奏でよう」と返したら、少しだけ勇気を出してみた。\n例の「白鍵を弾くと落ち着きません」の件は、結果より、その途中の顔が忘れられないらしい。\n最後の一行だけ、やけに字が大きかった。","翌日の昼、ピアノの黒鍵だけ好きな子から追伸が来た。\n「その音を大切に」を選んだことを伝えると、最初は笑ったが、試してみた。\n白鍵を弾くと落ち着きません――その話が、今度は別の意味で広まっている。いちばん驚いたのは本人だった。\n「続きができたら、また書きます」で終わっていた。"]},"en":{"from":"差出人：ピアノの黒鍵だけ好きな子","body":"白鍵を弾くと落ち着きません。先生はまだ理由を聞いてくれません。","choices":["一度録音してみよう","誰かと奏でよう","その音を大切に"],"ends":["一週間後、ピアノの黒鍵だけ好きな子が、例の「白鍵を弾くと落ち着きません」について書いてきた。\n「一度録音してみよう」の返事をきっかけに、返事を見て、予定を変更した。\n思わぬところで拍手が起きた。\n「今度はあなたの話も聞かせて」と書き添えられていた。","三日後、短い手紙が届いた。差出人はピアノの黒鍵だけ好きな子。\n「誰かと奏でよう」と返したら、少しだけ勇気を出してみた。\n例の「白鍵を弾くと落ち着きません」の件は、結果より、その途中の顔が忘れられないらしい。\n最後の一行だけ、やけに字が大きかった。","翌日の昼、ピアノの黒鍵だけ好きな子から追伸が来た。\n「その音を大切に」を選んだことを伝えると、最初は笑ったが、試してみた。\n白鍵を弾くと落ち着きません――その話が、今度は別の意味で広まっている。いちばん驚いたのは本人だった。\n「続きができたら、また書きます」で終わっていた。"]}},{"ja":{"from":"差出人：ライブで拍手を忘れるファン","body":"感動すると手が止まります。演奏者に伝わっているでしょうか。","choices":["誰かと奏でよう","その音を大切に","一度録音してみよう"],"ends":["翌週、ライブで拍手を忘れるファンが報告してきた。\n「誰かと奏でよう」という一言がきっかけで、まず紙に書き出してみた。\n「感動すると手が止まります」と悩んでいた頃とは、少し様子が違う。思わぬところで拍手が起きた。\n次の手紙には、なぜか謝礼のつもりのシールが入っていた。","週末になって、ライブで拍手を忘れるファンが報告してきた。\n「その音を大切に」という一言がきっかけで、最初は笑ったが、試してみた。\n「感動すると手が止まります」と悩んでいた頃とは、少し様子が違う。結果より、その途中の顔が忘れられないらしい。\n「誰にも内緒にしてください」と、しっかり赤字で書かれていた。","日付のない追伸が届いた。ライブで拍手を忘れるファンが、例の「感動すると手が止まります」について書いてきた。\n「一度録音してみよう」の返事をきっかけに、誰にも言わずに実行した。\nその場では何も起きなかった。翌日になって効いてきた。\n「今度はあなたの話も聞かせて」と書き添えられていた。"]},"en":{"from":"差出人：ライブで拍手を忘れるファン","body":"感動すると手が止まります。演奏者に伝わっているでしょうか。","choices":["誰かと奏でよう","その音を大切に","一度録音してみよう"],"ends":["翌週、ライブで拍手を忘れるファンが報告してきた。\n「誰かと奏でよう」という一言がきっかけで、まず紙に書き出してみた。\n「感動すると手が止まります」と悩んでいた頃とは、少し様子が違う。思わぬところで拍手が起きた。\n次の手紙には、なぜか謝礼のつもりのシールが入っていた。","週末になって、ライブで拍手を忘れるファンが報告してきた。\n「その音を大切に」という一言がきっかけで、最初は笑ったが、試してみた。\n「感動すると手が止まります」と悩んでいた頃とは、少し様子が違う。結果より、その途中の顔が忘れられないらしい。\n「誰にも内緒にしてください」と、しっかり赤字で書かれていた。","日付のない追伸が届いた。ライブで拍手を忘れるファンが、例の「感動すると手が止まります」について書いてきた。\n「一度録音してみよう」の返事をきっかけに、誰にも言わずに実行した。\nその場では何も起きなかった。翌日になって効いてきた。\n「今度はあなたの話も聞かせて」と書き添えられていた。"]}},{"ja":{"from":"差出人：路上ライブの雨男","body":"歌い始めると必ず雨が降ります。傘を差したお客さんだけ残ります。","choices":["その音を大切に","一度録音してみよう","誰かと奏でよう"],"ends":["次の朝、短い手紙が届いた。差出人は路上ライブの雨男。\n「その音を大切に」と返したら、思ったより真剣に受け取られた。\n例の「歌い始めると必ず雨が降ります」の件は、最初に笑った人が、最後は黙り込んだ。\n封筒の裏には、小さな丸が一つ描かれていた。","帰り道で、路上ライブの雨男が、例の「歌い始めると必ず雨が降ります」について書いてきた。\n「一度録音してみよう」の返事をきっかけに、半信半疑で動いてみたらしい。\nいちばん驚いたのは本人だった。\n「誰にも内緒にしてください」と、しっかり赤字で書かれていた。","一週間後、短い手紙が届いた。差出人は路上ライブの雨男。\n「誰かと奏でよう」と返したら、思ったより真剣に受け取られた。\n例の「歌い始めると必ず雨が降ります」の件は、なぜか関係ない人が一番喜んだ。\n「これ、成功ってことでいいですか」と最後に書いてあった。"]},"en":{"from":"差出人：路上ライブの雨男","body":"歌い始めると必ず雨が降ります。傘を差したお客さんだけ残ります。","choices":["その音を大切に","一度録音してみよう","誰かと奏でよう"],"ends":["次の朝、短い手紙が届いた。差出人は路上ライブの雨男。\n「その音を大切に」と返したら、思ったより真剣に受け取られた。\n例の「歌い始めると必ず雨が降ります」の件は、最初に笑った人が、最後は黙り込んだ。\n封筒の裏には、小さな丸が一つ描かれていた。","帰り道で、路上ライブの雨男が、例の「歌い始めると必ず雨が降ります」について書いてきた。\n「一度録音してみよう」の返事をきっかけに、半信半疑で動いてみたらしい。\nいちばん驚いたのは本人だった。\n「誰にも内緒にしてください」と、しっかり赤字で書かれていた。","一週間後、短い手紙が届いた。差出人は路上ライブの雨男。\n「誰かと奏でよう」と返したら、思ったより真剣に受け取られた。\n例の「歌い始めると必ず雨が降ります」の件は、なぜか関係ない人が一番喜んだ。\n「これ、成功ってことでいいですか」と最後に書いてあった。"]}},{"ja":{"from":"差出人：合唱団の口パク係","body":"声が出ない日も舞台に立っています。隣の人が気づいて手を握ってくれました。","choices":["一度録音してみよう","誰かと奏でよう","その音を大切に"],"ends":["翌日の昼、封筒に合唱団の口パク係の名前があった。\n「一度録音してみよう」の通りにするか迷った末、返事を見て、予定を変更した。\n声が出ない日も舞台に立っています。そこから思いもしないことが起きた。誰も予想していない方向に話が進んだ。\n最後の一行だけ、やけに字が大きかった。","二日後、合唱団の口パク係が報告してきた。\n「誰かと奏でよう」という一言がきっかけで、返事を見て、予定を変更した。\n「声が出ない日も舞台に立っています」と悩んでいた頃とは、少し様子が違う。その場では何も起きなかった。翌日になって効いてきた。\n「誰にも内緒にしてください」と、しっかり赤字で書かれていた。","一週間後、合唱団の口パク係が報告してきた。\n「その音を大切に」という一言がきっかけで、予定外の相手まで巻き込んだ。\n「声が出ない日も舞台に立っています」と悩んでいた頃とは、少し様子が違う。周囲は納得したが、本人だけ納得していない。\n最後の一行だけ、やけに字が大きかった。"]},"en":{"from":"差出人：合唱団の口パク係","body":"声が出ない日も舞台に立っています。隣の人が気づいて手を握ってくれました。","choices":["一度録音してみよう","誰かと奏でよう","その音を大切に"],"ends":["翌日の昼、封筒に合唱団の口パク係の名前があった。\n「一度録音してみよう」の通りにするか迷った末、返事を見て、予定を変更した。\n声が出ない日も舞台に立っています。そこから思いもしないことが起きた。誰も予想していない方向に話が進んだ。\n最後の一行だけ、やけに字が大きかった。","二日後、合唱団の口パク係が報告してきた。\n「誰かと奏でよう」という一言がきっかけで、返事を見て、予定を変更した。\n「声が出ない日も舞台に立っています」と悩んでいた頃とは、少し様子が違う。その場では何も起きなかった。翌日になって効いてきた。\n「誰にも内緒にしてください」と、しっかり赤字で書かれていた。","一週間後、合唱団の口パク係が報告してきた。\n「その音を大切に」という一言がきっかけで、予定外の相手まで巻き込んだ。\n「声が出ない日も舞台に立っています」と悩んでいた頃とは、少し様子が違う。周囲は納得したが、本人だけ納得していない。\n最後の一行だけ、やけに字が大きかった。"]}},{"ja":{"from":"差出人：音叉を集める調律師","body":"音を合わせる仕事なのに家では全部違う音を鳴らしています。","choices":["誰かと奏でよう","その音を大切に","一度録音してみよう"],"ends":["次の朝、封筒に音叉を集める調律師の名前があった。\n「誰かと奏でよう」の通りにするか迷った末、思ったより真剣に受け取られた。\n音を合わせる仕事なのに家では全部違う音を鳴らしています。そこから思いもしないことが起きた。思わぬところで拍手が起きた。\n封筒には、なぜか二枚目の切手が貼ってあった。","帰り道で、音叉を集める調律師から追伸が来た。\n「その音を大切に」を選んだことを伝えると、最初は笑ったが、試してみた。\n音を合わせる仕事なのに家では全部違う音を鳴らしています――その話が、今度は別の意味で広まっている。ところが、話を聞いていた人のほうが先に動いた。\n封筒には、なぜか二枚目の切手が貼ってあった。","三日後、短い手紙が届いた。差出人は音叉を集める調律師。\n「一度録音してみよう」と返したら、一度はやめかけたが、結局実行した。\n例の「音を合わせる仕事なのに家では全部違う音を鳴らしています」の件は、ところが、話を聞いていた人のほうが先に動いた。\n「誰にも内緒にしてください」と、しっかり赤字で書かれていた。"]},"en":{"from":"差出人：音叉を集める調律師","body":"音を合わせる仕事なのに家では全部違う音を鳴らしています。","choices":["誰かと奏でよう","その音を 人だけ、まったく別の解釈をした。\n封筒の裏には、小さな丸が一つ描かれていた。","翌週、封筒に楽譜に絵を描く作曲家の名前があった。\n「その音を大切に」の通りにするか迷った末、まず紙に書き出してみた。\n音符の横に猫を描いたら、演奏者が猫っぽく弾いてくれました。そこから思いもしないことが起きた。ところが、話を聞いていた人のほうが先に動いた。\n「たぶんこれでよかった」と短く締めくくられていた。"]},"en":{"from":"差出人：楽譜に絵を描く作曲家","body":"音符の横に猫を描いたら、演奏者が猫っぽく弾いてくれました。","choices":["一度録音してみよう","誰かと奏でよう","その音を大切に"],"ends":["二日後、楽譜に絵を描く作曲家から二通目。\n「一度録音してみよう」を実行する前に、音符の横に猫を描いたら、演奏者が猫っぽく弾いてくれましたという話を思い出したらしい。\n少しだけ勇気を出してみた。なぜか小さな行列ができた。\n次の手紙には、なぜか謝礼のつもりのシールが入っていた。","雨が降った日、短い手紙が届いた。差出人は楽譜に絵を描く作曲家。\n「誰かと奏でよう」と返したら、まず紙に書き出してみた。\n例の「音符の横に猫を描いたら、演奏者が猫っぽく弾いてくれました」の件は、一人だけ、まったく別の解釈をした。\n封筒の裏には、小さな丸が一つ描かれていた。","翌週、封筒に楽譜に絵を描く作曲家の名前があった。\n「その音を大切に」の通りにするか迷った末、まず紙に書き出してみた。\n音符の横に猫を描いたら、演奏者が猫っぽく弾いてくれました。そこから思いもしないことが起きた。ところが、話を聞いていた人のほうが先に動いた。\n「たぶんこれでよかった」と短く締めくくられていた。"]}},{"ja":{"from":"差出人：太鼓の音を怖がる祭り好き","body":"祭りは好きですが太鼓が鳴ると隠れます。毎年屋台の裏から見ています。","choices":["誰かと奏でよう","その音を大切に","一度録音してみよう"],"ends":["その夜、太鼓の音を怖がる祭り好きから二通目。\n「誰かと奏でよう」を実行する前に、祭りは好きですが太鼓が鳴ると隠れますという話を思い出したらしい。\n予定外の相手まで巻き込んだ。説明を求められ、余計に話が大きくなった。\n結局、本人が一番楽しそうだった。","返事を出した翌朝、太鼓の音を怖がる祭り好きが報告してきた。\n「その音を大切に」という一言がきっかけで、最初は笑ったが、試してみた。\n「祭りは好きですが太鼓が鳴ると隠れます」と悩んでいた頃とは、少し様子が違う。返事を見せたら、別の相談が始まった。\n追伸には「次は自分で決めてみます」とあった。","翌週、太鼓の音を怖がる祭り好きから追伸が来た。\n「一度録音してみよう」を選んだことを伝えると、まず紙に書き出してみた。\n祭りは好きですが太鼓が鳴ると隠れます――その話が、今度は別の意味で広まっている。いちばん驚いたのは本人だった。\n「たぶんこれでよかった」と短く締めくくられていた。"]},"en":{"from":"差出人：太鼓の音を怖がる祭り好き","body":"祭りは好きですが太鼓が鳴ると隠れます。毎年屋台の裏から見ています。","choices":["誰かと奏でよう","その音を大切に","一度録音してみよう"],"ends":["その夜、太鼓の音を怖がる祭り好きから二通目。\n「誰かと奏でよう」を実行する前に、祭りは好きですが太鼓が鳴ると隠れますという話を思い出したらしい。\n予定外の相手まで巻き込んだ。説明を求められ、余計に話が大きくなった。\n結局、本人が一番楽しそうだった。","返事を出した翌朝、太鼓の音を怖がる祭り好きが報告してきた。\n「その音を大切に」という一言がきっかけで、最初は笑ったが、試してみた。\n「祭りは好きですが太鼓が鳴ると隠れます」と悩んでいた頃とは、少し様子が違う。返事を見せたら、別の相談が始まった。\n追伸には「次は自分で決めてみます」とあった。","翌週、太鼓の音を怖がる祭り好きから追伸が来た。\n「一度録音してみよう」を選んだことを伝えると、まず紙に書き出してみた。\n祭りは好きですが太鼓が鳴ると隠れます――その話が、今度は別の意味で広まっている。いちばん驚いたのは本人だった。\n「たぶんこれでよかった」と短く締めくくられていた。"]}},{"ja":{"from":"差出人：レッスンを辞めたくない先生","body":"生徒がみんな上達して卒業します。うれしいのに少し寂しいです。","choices":["その音を大切に","一度録音してみよう","誰かと奏でよう"],"ends":["翌日の昼、レッスンを辞めたくない先生から二通目。\n「その音を大切に」を実行する前に、生徒がみんな上達して卒業しますという話を思い出したらしい。\n最初は笑ったが、試してみた。最初に笑った人が、最後は黙り込んだ。\n「今度はあなたの話も聞かせて」と書き添えられていた。","返事を出した翌朝、レッスンを辞めたくない先生が、例の「生徒がみんな上達して卒業します」について書いてきた。\n「一度録音してみよう」の返事をきっかけに、思ったより真剣に受け取られた。\n相手が先に謝ってきた。\n「これ、成功ってことでいいですか」と最後に書いてあった。","返事を出した翌朝、封筒にレッスンを辞めたくない先生の名前があった。\n「誰かと奏でよう」の通りにするか迷った末、思い切って口に出してみた。\n生徒がみんな上達して卒業します。そこから思いもしないことが起きた。意外にも反対する人がいなかった。\n封筒には、なぜか二枚目の切手が貼ってあった。"]},"en":{"from":"差出人：レッスンを辞めたくない先生","body":"生徒がみんな上達して卒業します。うれしいのに少し寂しいです。","choices":["その音を大切に","一度録音してみよう","誰かと奏でよう"],"ends":["翌日の昼、レッスンを辞めたくない先生から二通目。\n「その音を大切に」を実行する前に、生徒がみんな上達して卒業しますという話を思い出したらしい。\n最初は笑ったが、試してみた。最初に笑った人が、最後は黙り込んだ。\n「今度はあなたの話も聞かせて」と書き添えられていた。","返事を出した翌朝、レッスンを辞めたくない先生が、例の「生徒がみんな上達して卒業します」について書いてきた。\n「一度録音してみよう」の返事をきっかけに、思ったより真剣に受け取られた。\n相手が先に謝ってきた。\n「これ、成功ってことでいいですか」と最後に書いてあった。","返事を出した翌朝、封筒にレッスンを辞めたくない先生の名前があった。\n「誰かと奏でよう」の通りにするか迷った末、思い切って口に出してみた。\n生徒がみんな上達して卒業します。そこから思いもしないことが起きた。意外にも反対する人がいなかった。\n封筒には、なぜか二枚目の切手が貼ってあった。"]}},{"ja":{"from":"差出人：壊れたオルゴールを持つ人","body":"最後の一音だけ鳴りません。自分で続きを歌うのが習慣になりました。","choices":["一度録音してみよう","誰かと奏でよう","その音を大切に"],"ends":["雨が降った日、封筒に壊れたオルゴールを持つ人の名前があった。\n「一度録音してみよう」の通りにするか迷った末、思い切って口に出してみた。\n最後の一音だけ鳴りません。そこから思いもしないことが起きた。返事を見せたら、別の相談が始まった。\n結局、本人が一番楽しそうだった。","日付のない追伸が届いた。壊れたオルゴールを持つ人から二通目。\n「誰かと奏でよう」を実行する前に、最後の一音だけ鳴りませんという話を思い出したらしい。\nさっそく試してみたそうだ。誰も予想していない方向に話が進んだ。\n「誰にも内緒にしてください」と、しっかり赤字で書かれていた。","しばらくして、壊れたオルゴールを持つ人から追伸が来た。\n「その音を大切に」を選んだことを伝えると、返事を見て、予定を変更した。\n最後の一音だけ鳴りません――その話が、今度は別の意味で広まっている。結果より、その途中の顔が忘れられないらしい。\n「誰にも内緒にしてください」と、しっかり赤字で書かれていた。"]},"en":{"from":"差出人：壊れたオルゴールを持つ人","body":"最後の一音だけ鳴りません。自分で続きを歌うのが習慣になりました。","choices":["一度録音してみよう","誰かと奏でよう","その音を大切に"],"ends":["雨が降った日、封筒に壊れたオルゴールを持つ人の名前があった。\n「一度録音してみよう」の通りにするか迷った末、思い切って口に出してみた。\n最後の一音だけ鳴りません。そこから思いもしないことが起きた。返事を見せたら、別の相談が始まった。\n結局、本人が一番楽しそうだった。","日付のない追伸が届いた。壊れたオルゴールを持つ人から二通目。\n「誰かと奏でよう」を実行する前に、最後の一音だけ鳴りませんという話を思い出したらしい。\nさっそく試してみたそうだ。誰も予想していない方向に話が進んだ。\n「誰にも内緒にしてください」と、しっかり赤字で書かれていた。","しばらくして、壊れたオルゴールを持つ人から追伸が来た。\n「その音を大切に」 れないらしい。\n封筒には、なぜか二枚目の切手が貼ってあった。","帰り道で、古文書のしみを読む学芸員が報告してきた。\n「記録を残そう」という一言がきっかけで、思い切って口に出してみた。\n「文字よりコーヒーのしみが気になります」と悩んでいた頃とは、少し様子が違う。意外にも反対する人がいなかった。\n封筒には、なぜか二枚目の切手が貼ってあった。","一週間後、古文書のしみを読む学芸員が、例の「文字よりコーヒーのしみが気になります」について書いてきた。\n「昔の人に敬意を」の返事をきっかけに、半信半疑で動いてみたらしい。\n結果より、その途中の顔が忘れられないらしい。\n封筒の裏には、小さな丸が一つ描かれていた。"]}},{"ja":{"from":"差出人：城跡の草刈り係","body":"観光客は石垣を見ます。私は毎年同じ場所に咲く小さな花を見ています。","choices":["記録を残そう","昔の人に敬意を","今のまま守ろう"],"ends":["週末になって、城跡の草刈り係が、例の「観光客は石垣を見ます」について書いてきた。\n「記録を残そう」の返事をきっかけに、返事を見て、予定を変更した。\n相手が先に謝ってきた。\n封筒の裏には、小さな丸が一つ描かれていた。","しばらくして、城跡の草刈り係が報告してきた。\n「昔の人に敬意を」という一言がきっかけで、思ったより真剣に受け取られた。\n「観光客は石垣を見ます」と悩んでいた頃とは、少し様子が違う。一人だけ、まったく別の解釈をした。\n「たぶんこれでよかった」と短く締めくくられていた。","帰り道で、封筒に城跡の草刈り係の名前があった。\n「今のまま守ろう」の通りにするか迷った末、まず紙に書き出してみた。\n観光客は石垣を見ます。そこから思いもしないことが起きた。結果より、その途中の顔が忘れられないらしい。\nその後どうなったかは、まだ誰も知らない。"]},"en":{"from":"差出人：城跡の草刈り係","body":"観光客は石垣を見ます。私は毎年同じ場所に咲く小さな花を見ています。","choices":["記録を残そう","昔の人に敬意を","今のまま守ろう"],"ends":["週末になって、城跡の草刈り係が、例の「観光客は石垣を見ます」について書いてきた。\n「記録を残そう」の返事をきっかけに、返事を見て、予定を変更した。\n相手が先に謝ってきた。\n封筒の裏には、小さな丸が一つ描かれていた。","しばらくして、城跡の草刈り係が報告してきた。\n「昔の人に敬意を」という一言がきっかけで、思ったより真剣に受け取られた。\n「観光客は石垣を見ます」と悩んでいた頃とは、少し様子が違う。一人だけ、まったく別の解釈をした。\n「たぶんこれでよかった」と短く締めくくられていた。","帰り道で、封筒に城跡の草刈り係の名前があった。\n「今のまま守ろう」の通りにするか迷った末、まず紙に書き出してみた。\n観光客は石垣を見ます。そこから思いもしないことが起きた。結果より、その途中の顔が忘れられないらしい。\nその後どうなったかは、まだ誰も知らない。"]}},{"ja":{"from":"差出人：古い写真の名前を探す人","body":"誰かわからない笑顔が百枚あります。写真に名前がなくても残していいですか。","choices":["昔の人に敬意を","今のまま守ろう","記録を残そう"],"ends":["週末になって、古い写真の名前を探す人が報告してきた。\n「昔の人に敬意を」という一言がきっかけで、思い切って口に出してみた。\n「誰かわからない笑顔が百枚あります」と悩んでいた頃とは、少し様子が違う。なぜか関係ない人が一番喜んだ。\n「誰にも内緒にしてください」と、しっかり赤字で書かれていた。","その日の夕方、古い写真の名前を探す人が報告してきた。\n「今のまま守ろう」という一言がきっかけで、最初は笑ったが、試してみた。\n「誰かわからない笑顔が百枚あります」と悩んでいた頃とは、少し様子が違う。意外にも反対する人がいなかった。\n封筒には、なぜか二枚目の切手が貼ってあった。","日付のない追伸が届いた。短い手紙が届いた。差出人は古い写真の名前を探す人。\n「記録を残そう」と返したら、予定外の相手まで巻き込んだ。\n例の「誰かわからない笑顔が百枚あります」の件は、なぜか小さな行列ができた。\n封筒には、なぜか二枚目の切手が貼ってあった。"]},"en":{"from":"差出人：古い写真の名前を探す人","body":"誰かわからない笑顔が百枚あります。写真に名前がなくても残していいですか。","choices":["昔の人に敬意を","今のまま守ろう","記録 るか迷った末、半信半疑で動いてみたらしい。\n毎日一分ずつ遅れています。そこから思いもしないことが起きた。返事を見せたら、別の相談が始まった。\n結局、本人が一番楽しそうだった。","数時間後、古時計の鐘を聞く住職が、例の「毎日一分ずつ遅れています」について書いてきた。\n「記録を残そう」の返事をきっかけに、半信半疑で動いてみたらしい。\nところが、話を聞いていた人のほうが先に動いた。\n結局、本人が一番楽しそうだった。","週末になって、古時計の鐘を聞く住職から追伸が来た。\n「昔の人に敬意を」を選んだことを伝えると、予定外の相手まで巻き込んだ。\n毎日一分ずつ遅れています――その話が、今度は別の意味で広まっている。ところが、話を聞いていた人のほうが先に動いた。\n追伸には「次は自分で決めてみます」とあった。"]},"en":{"from":"差出人：古時計の鐘を聞く住職","body":"毎日一分ずつ遅れています。直すと寺の朝が変わってしまいます。","choices":["今のまま守ろう","記録を残そう","昔の人に敬意を"],"ends":["帰り道で、封筒に古時計の鐘を聞く住職の名前があった。\n「今のまま守ろう」の通りにするか迷った末、半信半疑で動いてみたらしい。\n毎日一分ずつ遅れています。そこから思いもしないことが起きた。返事を見せたら、別の相談が始まった。\n結局、本人が一番楽しそうだった。","数時間後、古時計の鐘を聞く住職が、例の「毎日一分ずつ遅れています」について書いてきた。\n「記録を残そう」の返事をきっかけに、半信半疑で動いてみたらしい。\nところが、話を聞いていた人のほうが先に動いた。\n結局、本人が一番楽しそうだった。","週末になって、古時計の鐘を聞く住職から追伸が来た。\n「昔の人に敬意を」を選んだことを伝えると、予定外の相手まで巻き込んだ。\n毎日一分ずつ遅れています――その話が、今度は別の意味で広まっている。ところが、話を聞いていた人のほうが先に動いた。\n追伸には「次は自分で決めてみます」とあった。"]}},{"ja":{"from":"差出人：昔の遊びを教える祖父","body":"孫に教えた竹とんぼが私より遠くへ飛びました。少し悔しいです。","choices":["記録を残そう","昔の人に敬意を","今のまま守ろう"],"ends":["翌週、昔の遊びを教える祖父が、例の「孫に教えた竹とんぼが私より遠くへ飛びました」について書いてきた。\n「記録を残そう」の返事をきっかけに、返事を見て、予定を変更した。\nその場では何も起きなかった。翌日になって効いてきた。\n「続きができたら、また書きます」で終わっていた。","次の朝、昔の遊びを教える祖父から二通目。\n「昔の人に敬意を」を実行する前に、孫に教えた竹とんぼが私より遠くへ飛びましたという話を思い出したらしい。\n誰にも言わずに実行した。意外にも反対する人がいなかった。\nその後どうなったかは、まだ誰も知らない。","数時間後、昔の遊びを教える祖父から追伸が来た。\n「今のまま守ろう」を選んだことを伝えると、本当にその通りにしたらしい。\n孫に教えた竹とんぼが私より遠くへ飛びました――その話が、今度は別の意味で広まっている。返事を見せたら、別の相談が始まった。\n「たぶんこれでよかった」と短く締めくくられていた。"]},"en":{"from":"差出人：昔の遊びを教える祖父","body":"孫に教えた竹とんぼが私より遠くへ飛びました。少し悔しいです。","choices":["記録を残そう","昔の人に敬意を","今のまま守ろう"],"ends":["翌週、昔の遊びを教える祖父が、例の「孫に教えた竹とんぼが私より遠くへ飛びました」について書いてきた。\n「記録を残そう」の返事をきっかけに、返事を見て、予定を変更した。\nその場では何も起きなかった。翌日になって効いてきた。\n「続きができたら、また書きます」で終わっていた。","次の朝、昔の遊びを教える祖父から二通目。\n「昔の人に敬意を」を実行する前に、孫に教えた竹とんぼが私より遠くへ飛びましたという話を思い出したらしい。\n誰にも言わずに実行した。意外にも反対する人がいなかった。\nその後どうなったかは、まだ誰も知らない。","数時間後、昔の遊びを教える祖父から追伸が来た。\n「今のまま守ろう」を選んだことを伝えると、本当にその通りにしたらしい。\n孫に教えた竹とんぼが私より遠くへ飛びました――その話が、今度は別の意味で広まっている。返事を見せたら、別の相談が始まった。\n「たぶんこれでよかった」と短く締めくくられていた。"]}},{"ja":{"from":"差出人： う。その場では何も起きなかった。翌日になって効いてきた。\n「たぶんこれでよかった」と短く締めくくられていた。","三日後、廃線跡を歩く人から追伸が来た。\n「昔の人に敬意を」を選んだことを伝えると、半信半疑で動いてみたらしい。\n線路がなくても駅名を口にします――その話が、今度は別の意味で広まっている。なぜか小さな行列ができた。\n封筒には、なぜか二枚目の切手が貼ってあった。"]}},{"ja":{"from":"差出人：発掘現場の弁当係","body":"遺跡より昼休みの話が好きです。みんな土の話しかしません。","choices":["記録を残そう","昔の人に敬意を","今のまま守ろう"],"ends":["日付のない追伸が届いた。短い手紙が届いた。差出人は発掘現場の弁当係。\n「記録を残そう」と返したら、予定外の相手まで巻き込んだ。\n例の「遺跡より昼休みの話が好きです」の件は、なぜか関係ない人が一番喜んだ。\n「たぶんこれでよかった」と短く締めくくられていた。","数時間後、発掘現場の弁当係が報告してきた。\n「昔の人に敬意を」という一言がきっかけで、思ったより真剣に受け取られた。\n「遺跡より昼休みの話が好きです」と悩んでいた頃とは、少し様子が違う。それが新しい習慣になりそうだ。\n「たぶんこれでよかった」と短く締めくくられていた。","翌日の昼、発掘現場の弁当係から追伸が来た。\n「今のまま守ろう」を選んだことを伝えると、予定外の相手まで巻き込んだ。\n遺跡より昼休みの話が好きです――その話が、今度は別の意味で広まっている。それが新しい習慣になりそうだ。\n結局、本人が一番楽しそうだった。"]},"en":{"from":"差出人：発掘現場の弁当係","body":"遺跡より昼休みの話が好きです。みんな土の話しかしません。","choices":["記録を残そう","昔の人に敬意を","今のまま守ろう"],"ends":["日付のない追伸が届いた。短い手紙が届いた。差出人は発掘現場の弁当係。\n「記録を残そう」と返したら、予定外の相手まで巻き込んだ。\n例の「遺跡より昼休みの話が好きです」の件は、なぜか関係ない人が一番喜んだ。\n「たぶんこれでよかった」と短く締めくくられていた。","数時間後、発掘現場の弁当係が報告してきた。\n「昔の人に敬意を」という一言がきっかけで、思ったより真剣に受け取られた。\n「遺跡より昼休みの話が好きです」と悩んでいた頃とは、少し様子が違う。それが新しい習慣になりそうだ。\n「たぶんこれでよかった」と短く締めくくられていた。","翌日の昼、発掘現場の弁当係から追伸が来た。\n「今のまま守ろう」を選んだことを伝えると、予定外の相手まで巻き込んだ。\n遺跡より昼休みの話が好きです――その話が、今度は別の意味で広まっている。それが新しい習慣になりそうだ。\n結局、本人が一番楽しそうだった。"]}},{"ja":{"from":"差出人：手紙の切手を研究する人","body":"切手の絵は覚えましたが、手紙の中身は一度も読めません。","choices":["昔の人に敬意を","今のまま守ろう","記録を残そう"],"ends":["日付のない追伸が届いた。手紙の切手を研究する人から追伸が来た。\n「昔の人に敬意を」を選んだことを伝えると、本当にその通りにしたらしい。\n切手の絵は覚えましたが、手紙の中身は一度も読めません――その話が、今度は別の意味で広まっている。それが新しい習慣になりそうだ。\n「誰にも内緒にしてください」と、しっかり赤字で書かれていた。","その日の夕方、手紙の切手を研究する人が、例の「切手の絵は覚えましたが、手紙の中身は一度も読めません」について書いてきた。\n「今のまま守ろう」の返事をきっかけに、返事を見て、予定を変更した。\nその場では何も起きなかった。翌日になって効いてきた。\n「たぶんこれでよかった」と短く締めくくられていた。","翌週、手紙の切手を研究する人が報告してきた。\n「記録を残そう」という一言がきっかけで、返事を見て、予定を変更した。\n「切手の絵は覚えましたが、手紙の中身は一度も読めません」と悩んでいた頃とは、少し様子が違う。なぜか小さな行列ができた。\n最後の一行だけ、やけに字が大きかった。"]},"en":{"from":"差出人：手紙の切手を研究する人","body":"切手の絵は覚えましたが、手紙の中身は一度も読めません。","choices":["昔の人に敬意を","今のまま守ろう","記録を残そう"],"ends":["日付のない追伸が届いた。手紙の切手を研究する人から追伸が来た。\n「昔の人に敬意を」を選んだことを伝えると、本当に 捨てるつもりだったそうです――その話が、今度は別の意味で広まっている。結果より、その途中の顔が忘れられないらしい。\n「これ、成功ってことでいいですか」と最後に書いてあった。"]},"en":{"from":"差出人：傘の骨を直す職人","body":"持ち主は捨てるつもりだったそうです。直した傘がまた雨を待っています。","choices":["使う人に聞いてみよう","手を動かしてみよう","その味を残そう"],"ends":["週末になって、封筒に傘の骨を直す職人の名前があった。\n「使う人に聞いてみよう」の通りにするか迷った末、誰にも言わずに実行した。\n持ち主は捨てるつもりだったそうです。そこから思いもしないことが起きた。最初に笑った人が、最後は黙り込んだ。\n最後の一行だけ、やけに字が大きかった。","翌週、傘の骨を直す職人が報告してきた。\n「手を動かしてみよう」という一言がきっかけで、さっそく試してみたそうだ。\n「持ち主は捨てるつもりだったそうです」と悩んでいた頃とは、少し様子が違う。なぜか関係ない人が一番喜んだ。\n追伸には「次は自分で決めてみます」とあった。","次の月曜日、傘の骨を直す職人から追伸が来た。\n「その味を残そう」を選んだことを伝えると、返事を見て、予定を変更した。\n持ち主は捨てるつもりだったそうです――その話が、今度は別の意味で広まっている。結果より、その途中の顔が忘れられないらしい。\n「これ、成功ってことでいいですか」と最後に書いてあった。"]}},{"ja":{"from":"差出人：靴の音を聞く修理屋","body":"歩き方だけで誰かわかります。本人に言うと少し怖がられます。","choices":["手を動かしてみよう","その味を残そう","使う人に聞いてみよう"],"ends":["返事を出した翌朝、靴の音を聞く修理屋が、例の「歩き方だけで誰かわかります」について書いてきた。\n「手を動かしてみよう」の返事をきっかけに、予定外の相手まで巻き込んだ。\n周囲は納得したが、本人だけ納得していない。\n「これ、成功ってことでいいですか」と最後に書いてあった。","二日後、封筒に靴の音を聞く修理屋の名前があった。\n「その味を残そう」の通りにするか迷った末、最初は笑ったが、試してみた。\n歩き方だけで誰かわかります。そこから思いもしないことが起きた。結果より、その途中の顔が忘れられないらしい。\n「これ、成功ってことでいいですか」と最後に書いてあった。","次の朝、短い手紙が届いた。差出人は靴の音を聞く修理屋。\n「使う人に聞いてみよう」と返したら、返事を見て、予定を変更した。\n例の「歩き方だけで誰かわかります」の件は、なぜか小さな行列ができた。\n次の手紙には、なぜか謝礼のつもりのシールが入っていた。"]},"en":{"from":"差出人：靴の音を聞く修理屋","body":"歩き方だけで誰かわかります。本人に言うと少し怖がられます。","choices":["手を動かしてみよう","その味を残そう","使う人に聞いてみよう"],"ends":["返事を出した翌朝、靴の音を聞く修理屋が、例の「歩き方だけで誰かわかります」について書いてきた。\n「手を動かしてみよう」の返事をきっかけに、予定外の相手まで巻き込んだ。\n周囲は納得したが、本人だけ納得していない。\n「これ、成功ってことでいいですか」と最後に書いてあった。","二日後、封筒に靴の音を聞く修理屋の名前があった。\n「その味を残そう」の通りにするか迷った末、最初は笑ったが、試してみた。\n歩き方だけで誰かわかります。そこから思いもしないことが起きた。結果より、その途中の顔が忘れられないらしい。\n「これ、成功ってことでいいですか」と最後に書いてあった。","次の朝、短い手紙が届いた。差出人は靴の音を聞く修理屋。\n「使う人に聞いてみよう」と返したら、返事を見て、予定を変更した。\n例の「歩き方だけで誰かわかります」の件は、なぜか小さな行列ができた。\n次の手紙には、なぜか謝礼のつもりのシールが入っていた。"]}},{"ja":{"from":"差出人：本の背表紙を直す人","body":"読まれすぎて壊れた本を見ると、少しうれしくなってしまいます。","choices":["その味を残そう","使う人に聞いてみよう","手を動かしてみよう"],"ends":["雨が降った日、本の背表紙を直す人から追伸が来た。\n「その味を残そう」を選んだことを伝えると、最初は笑ったが、試してみた。\n読まれすぎて壊れた本を見ると、少しうれしくなってしまいます――その話が、今度は別の意味で広まっている。説明を求められ、余計に話が大きくなった。\n結局、本人が一番楽しそうだった。","次の月曜日、本の背表紙を直す人から二通目。\n「使う人に聞いてみよう」を実行する前に、読まれすぎて壊れた本を見ると、少しうれしくなってしまいますという話を思い出したらしい。\n半信半疑で動いてみたらしい。その場では何も起きなかった。翌日になって効いてきた。\n最後の一行だけ、やけに字が大きかった。","二日後、封筒に本の背表紙を直す人の名前があった。\n「手を動かしてみよう」の通りにするか迷った末、誰にも言わずに実行した。\n読まれすぎて壊れた本を見ると、少しうれしくなってしまいます。そこから思いもしないことが起きた。その場では何も起きなかった。翌日になって効いてきた。\nその後どうなったかは、まだ誰も知らない。"]},"en":{"from":"差出人：本の背表紙を直す人","body":"読まれすぎて壊れた本を見ると、少しうれしくなってしまいます。","choices":["その味を残そう","使う人に聞いてみよう","手を動かしてみよう"],"ends":["雨が降った日、本の背表紙を直す人から追伸が来た。\n「その味を残そう」を選んだことを伝えると、最初は笑ったが、試してみた。\n読まれすぎて壊れた本を見ると、少しうれしくなってしまいます――その話が、今度は別の意味で広まっている。説明を求められ、余計に話が大きくなった。\n結局、本人が一番楽しそうだった。","次の月曜日、本の背表紙を直す人から二通目。\n「使う人に聞いてみよう」を実行する前に、読まれすぎて壊れた本を見ると、少しうれしくなってしまいますという話を思い出したらしい。\n半信半疑で動いてみたらしい。その場では何も起きなかった。翌日になって効いてきた。\n最後の一行だけ、やけに字が大きかった。","二日後、封筒に本の背表紙を直す人の名前があった。\n「手を動かしてみよう」の通りにするか迷った末、誰にも言わずに実行した。\n読まれすぎて壊れた本を見ると、少しうれしくなってしまいます。そこから思いもしないことが起きた。その場では何も起きなかった。翌日になって効いてきた。\nその後どうなったかは、まだ誰も知らない。"]}},{"ja":{"from":"差出人：鍵を作る見習い","body":"毎日鍵を作っていますが、自分の部屋の鍵だけよくなくします。","choices":["使う人に聞いてみよう","手を動かしてみよう","その味を残そう"],"ends":["一週間後、鍵を作る見習いが、例の「毎日鍵を作っていますが、自分の部屋の鍵だけよくなくします」について書いてきた。\n「使う人に聞いてみよう」の返事をきっかけに、返事を見て、予定を変更した。\n最初に笑った人が、最後は黙り込んだ。\n「これ、成功ってことでいいですか」と最後に書いてあった。","週末になって、鍵を作る見習いから追伸が来た。\n「手を動かしてみよう」を選んだことを伝えると、最初は笑ったが、試してみた。\n毎日鍵を作っていますが、自分の部屋の鍵だけよくなくします――その話が、今度は別の意味で広まっている。ところが、話を聞いていた人のほうが先に動いた。\n封筒には、なぜか二枚目の切手が貼ってあった。","翌日の昼、鍵を作る見習いが、例の「毎日鍵を作っていますが、自分の部屋の鍵だけよくなくします」について書いてきた。\n「その味を残そう」の返事をきっかけに、最初は笑ったが、試してみた。\nいちばん驚いたのは本人だった。\n「たぶんこれでよかった」と短く締めくくられていた。"]},"en":{"from":"差出人：鍵を作る見習い","body":"毎日鍵を作っていますが、自分の部屋の鍵だけよくなくします。","choices":["使う人に聞いてみよう","手を動かしてみよう","その味を残そう"],"ends":["一週間後、鍵を作る見習いが、例の「毎日鍵を作っていますが、自分の部屋の鍵だけよくなくします」について書いてきた。\n「使う人に聞いてみよう」の返事をきっかけに、返事を見て、予定を変更した。\n最初に笑った人が、最後は黙り込んだ。\n「これ、成功ってことでいいですか」と最後に書いてあった。","週末になって、鍵を作る見習いから追伸が来た。\n「手を動かしてみよう」を選んだことを伝えると、最初は笑ったが、試してみた。\n毎日鍵を作っていますが、自分の部屋の鍵だけよくなくします――その話が、今度は別の意味で広まっている。ところが、話を聞いていた人のほうが先に動いた。\n封筒には、なぜか二枚目の切手が貼ってあった。","翌日の昼、鍵を作る見習いが、例の「毎日鍵を作っていますが、自分の部屋の鍵だけよくなくします」について書いてきた。\n「その味を残そう」の返事をきっかけに、最初は笑ったが、試してみた。\nいちばん驚いたのは本人だった。\n「たぶんこれでよかった」と短く締めくくられていた。"]}},{"ja":{"from":"差出人：畳の香りを確かめる職人","body":"新しい畳の匂いが好きで、仕事が終わっても帰れません。","choices":["手を動かしてみよう","その味を残そう","使う人に聞いてみよう"],"ends":["次の朝、畳の香りを確かめる職人から二通目。\n「手を動かしてみよう」を実行する前に、新しい畳の匂いが好きで、仕事が終わっても帰れませんという話を思い出したらしい。\n半信半疑で動いてみたらしい。その場では何も起きなかった。翌日になって効いてきた。\n最後の一行だけ、やけに字が大きかった。","三日後、畳の香りを確かめる職人が報告してきた。\n「その味を残そう」という一言がきっかけで、本当にその通りにしたらしい。\n「新しい畳の匂いが好きで、仕事が終わっても帰れません」と悩んでいた頃とは、少し様子が違う。誰も予想していない方向に話が進んだ。\n結局、本人が一番楽しそうだった。","しばらくして、畳の香りを確かめる職人から追伸が来た。\n「使う人に聞いてみよう」を選んだことを伝えると、半信半疑で動いてみたらしい。\n新しい畳の匂いが好きで、仕事が終わっても帰れません――その話が、今度は別の意味で広まっている。返事を見せたら、別の相談が始まった。\n「これ、成功ってことでいいですか」と最後に書いてあった。"]},"en":{"from":"差出人：畳の香りを確かめる職人","body":"新しい畳の匂いが好きで、仕事が終わっても帰れません。","choices":["手を動かしてみよう","その味を残そう","使う人に聞いてみよう"],"ends":["次の朝、畳の香りを確かめる職人から二通目。\n「手を動かしてみよう」を実行する前に、新しい畳の匂いが好きで、仕事が終わっても帰れませんという話を思い出したらしい。\n半信半疑で動いてみたらしい。その場では何も起きなかった。翌日になって効いてきた。\n最後の一行だけ、やけに字が大きかった。","三日後、畳の香りを確かめる職人が報告してきた。\n「その味を残そう」という一言がきっかけで、本当にその通りにしたらしい。\n「新しい畳の匂いが好きで、仕事が終わっても帰れません」と悩んでいた頃とは、少し様子が違う。誰も予想していない方向に話が進んだ。\n結局、本人が一番楽しそうだった。","しばらくして、畳の香りを確かめる職人から追伸が来た。\n「使う人に聞いてみよう」を選んだことを伝えると、半信半疑で動いてみたらしい。\n新しい畳の匂いが好きで、仕事が終わっても帰れません――その話が、今度は別の意味で広まっている。返事を見せたら、別の相談が始まった。\n「これ、成功ってことでいいですか」と最後に書いてあった。"]}},{"ja":{"from":"差出人：ガラスの泡を残す職人","body":"完璧な透明より小さな泡が好きです。注文主に説明するのが難しいです。","choices":["その味を残そう","使う人に聞いてみよう","手を動かしてみよう"],"ends":["三日後、短い手紙が届いた。差出人はガラスの泡を残す職人。\n「その味を残そう」と返したら、返事を見て、予定を変更した。\n例の「完璧な透明より小さな泡が好きです」の件は、それが新しい習慣になりそうだ。\n最後の一行だけ、やけに字が大きかった。","数時間後、ガラスの泡を残す職人が報告してきた。\n「使う人に聞いてみよう」という一言がきっかけで、予定外の相手まで巻き込んだ。\n「完璧な透明より小さな泡が好きです」と悩んでいた頃とは、少し様子が違う。ところが、話を聞いていた人のほうが先に動いた。\n封筒の裏には、小さな丸が一つ描かれていた。","次の月曜日、ガラスの泡を残す職人から追伸が来た。\n「手を動かしてみよう」を選んだことを伝えると、最初は笑ったが、試してみた。\n完璧な透明より小さな泡が好きです――その話が、今度は別の意味で広まっている。説明を求められ、余計に話が大きくなった。\nその後どうなったかは、まだ誰も知らない。"]},"en":{"from":"差出人：ガラスの泡を残す職人","body":"完璧な透明より小さな泡が好きです。注文主に説明するのが難しいです。","choices":["その味を残そう","使う人に聞いてみよう","手を動かしてみよう"],"ends":["三日後、短い手紙が届いた。差出人はガラスの泡を残す職人。\n「その味を残そう」と返したら、返事を見て、予定を変更した。\n例の「完璧な透明より小さな泡が好きです」の件は、それが新しい習慣になりそうだ。\n最後の一行だけ、やけに字が大きかった。","数時間後、ガラスの泡を残す職人が報告してきた。\n「使う人に聞いてみよう」という一言がきっかけで、予定外の相手まで巻き込んだ。\n「完璧な透明より小さな泡が好きです」と悩んでいた頃とは、少し様子が違う。ところが、話を聞いていた人のほうが先に動いた。\n封筒の裏には、小さな丸が一つ描かれていた。","次の月曜日、ガラスの泡を残す職人から追伸が来た。\n「手を動かしてみよう」を選んだことを伝えると、最初は笑ったが、試してみた。\n完璧な透明より小さな泡が好きです――その話が、今度は別の意味で広まっている。説明を求められ、余計に話が大きくなった。\nその後どうなったかは、まだ誰も知らない。"]}},{"ja":{"from":"差出人：鉛筆を削る専門家","body":"短くなった鉛筆ほどよく書ける気がします。捨て時がわかりません。","choices":["使う人に聞いてみよう","手を動かしてみよう","その味を残そう"],"ends":["一週間後、封筒に鉛筆を削る専門家の名前があった。\n「使う人に聞いてみよう」の通りにするか迷った末、半信半疑で動いてみたらしい。\n短くなった鉛筆ほどよく書ける気がします。そこから思いもしないことが起きた。周囲は納得したが、本人だけ納得していない。\n「たぶんこれでよかった」と短く締めくくられていた。","翌週、鉛筆を削る専門家から追伸が来た。\n「手を動かしてみよう」を選んだことを伝えると、思い切って口に出してみた。\n短くなった鉛筆ほどよく書ける気がします――その話が、今度は別の意味で広まっている。その場では何も起きなかった。翌日になって効いてきた。\n「これ、成功ってことでいいですか」と最後に書いてあった。","二日後、短い手紙が届いた。差出人は鉛筆を削る専門家。\n「その味を残そう」と返したら、少しだけ勇気を出してみた。\n例の「短くなった鉛筆ほどよく書ける気がします」の件は、なぜか小さな行列ができた。\nその後どうなったかは、まだ誰も知らない。"]},"en":{"from":"差出人：鉛筆を削る専門家","body":"短くなった鉛筆ほどよく書ける気がします。捨て時がわかりません。","choices":["使う人に聞いてみよう","手を動かしてみよう","その味を残そう"],"ends":["一週間後、封筒に鉛筆を削る専門家の名前があった。\n「使う人に聞いてみよう」の通りにするか迷った末、半信半疑で動いてみたらしい。\n短くなった鉛筆ほどよく書ける気がします。そこから思いもしないことが起きた。周囲は納得したが、本人だけ納得していない。\n「たぶんこれでよかった」と短く締めくくられていた。","翌週、鉛筆を削る専門家から追伸が来た。\n「手を動かしてみよう」を選んだことを伝えると、思い切って口に出してみた。\n短くなった鉛筆ほどよく書ける気がします――その話が、今度は別の意味で広まっている。その場では何も起きなかった。翌日になって効いてきた。\n「これ、成功ってことでいいですか」と最後に書いてあった。","二日後、短い手紙が届いた。差出人は鉛筆を削る専門家。\n「その味を残そう」と返したら、少しだけ勇気を出してみた。\n例の「短くなった鉛筆ほどよく書ける気がします」の件は、なぜか小さな行列ができた。\nその後どうなったかは、まだ誰も知らない。"]}},{"ja":{"from":"差出人：時計の針を描く画家","body":"文字盤を描く仕事です。いつも三時のおやつの時間にしてしまいます。","choices":["手を動かしてみよう","その味を残そう","使う人に聞いてみよう"],"ends":["帰り道で、時計の針を描く画家が報告してきた。\n「手を動かしてみよう」という一言がきっかけで、思ったより真剣に受け取られた。\n「文字盤を描く仕事です」と悩んでいた頃とは、少し様子が違う。なぜか関係ない人が一番喜んだ。\n結局、本人が一番楽しそうだった。","帰り道で、時計の針を描く画家が、例の「文字盤を描く仕事です」について書いてきた。\n「その味を残そう」の返事をきっかけに、本当にその通りにしたらしい。\nそれが新しい習慣になりそうだ。\n次の手紙には、なぜか謝礼のつもりのシールが入っていた。","翌日の昼、時計の針を描く画家が、例の「文字盤を描く仕事です」について書いてきた。\n「使う人に聞いてみよう」の返事をきっかけに、まず紙に書き出してみた。\n説明を求められ、余計に話が大きくなった。\n「誰にも内緒にしてください」と、しっかり赤字で書かれていた。"]},"en":{"from":"差出人：時計の針を描く画家","body":"文字盤を描く仕事です。いつも三時のおやつの時間にしてしまいます。","choices":["手を動かしてみよう","その味を残そう","使う人に聞いてみよう"],"ends":["帰り道で、時計の針を描く画家が報告してきた。\n「手を動かしてみよう」という一言がきっかけで、思ったより真剣に受け取られた。\n「文字盤を描く仕事です」と悩んでいた頃とは、少し様子が違う。なぜか関係ない人が一番喜んだ。\n結局、本人が一番楽しそうだった。","帰り道で、時計の針を描く画家が、例の「文字盤を描く仕事です」について書いてきた。\n「その味を残そう」の返事をきっかけに、本当にその通りにしたらしい。\nそれが新しい習慣になりそうだ。\n次の手紙には、なぜか謝礼のつもりのシールが入っていた。","翌日の昼、時計の針を描く画家が、例の「文字盤を描く仕事です」について書いてきた。\n「使う人に聞いてみよう」の返事をきっかけに、まず紙に書き出してみた。\n説明を求められ、余計に話が大きくなった。\n「誰にも内緒にしてください」と、しっかり赤字で書かれていた。"]}},{"ja":{"from":"差出人：自転車のカゴを編む人","body":"荷物より花を入れる人が多いです。丈夫さより見た目を褒められます。","choices":["その味を残そう","使う人に聞いてみよう","手を動かしてみよう"],"ends":["帰り道で、自転車のカゴを編む人が、例の「荷物より花を入れる人が多いです」について書いてきた。\n「その味を残そう」の返事をきっかけに、半信半疑で動いてみたらしい。\n意外にも反対する人がいなかった。\n「続きができたら、また書きます」で終わっていた。","その夜、自転車のカゴを編む人が、例の「荷物より花を入れる人が多いです」について書いてきた。\n「使う人に聞いてみよう」の返事をきっかけに、さっそく試してみたそうだ。\n一人だけ、まったく別の解釈をした。\n封筒の裏には、小さな丸が一つ描かれていた。","雨が降った日、短い手紙が届いた。差出人は自転車のカゴを編む人。\n「手を動かしてみよう」と返したら、少しだけ勇気を出してみた。\n例の「荷物より花を入れる人が多いです」の件は、誰も予想していない方向に話が進んだ。\n追伸には「次は自分で決めてみます」とあった。"]},"en":{"from":"差出人：自転車のカゴを編む人","body":"荷物より花を入れる人が多いです。丈夫さより見た目を褒められます。","choices":["その味を残そう","使う人に聞いてみよう","手を動かしてみよう"],"ends":["帰り道で、自転車のカゴを編む人が、例の「荷物より花を入れる人が多いです」について書いてきた。\n「その味を残そう」の返事をきっかけに、半信半疑で動いてみたらしい。\n意外にも反対する人がいなかった。\n「続きができたら、また書きます」で終わっていた。","その夜、自転車のカゴを編む人が、例の「荷物より花を入れる人が多いです」について書いてきた。\n「使う人に聞いてみよう」の返事をきっかけに、さっそく試してみたそうだ。\n一人だけ、まったく別の解釈をした。\n封筒の裏には、小さな丸が一つ描かれていた。","雨が降った日、短い手紙が届いた。差出人は自転車のカゴを編む人。\n「手を動かしてみよう」と返したら、少しだけ勇気を出してみた。\n例の「荷物より花を入れる人が多いです」の件は、誰も予想していない方向に話が進んだ。\n追伸には「次は自分で決めてみます」とあった。"]}},{"ja":{"from":"差出人：和紙を干す職人","body":"風の強い日だけ紙が踊ります。失敗なのに少し見とれます。","choices":["使う人に聞いてみよう","手を動かしてみよう","その味を残そう"],"ends":["翌週、短い手紙が届いた。差出人は和紙を干す職人。\n「使う人に聞いてみよう」と返したら、誰にも言わずに実行した。\n例の「風の強い日だけ紙が踊ります」の件は、最初に笑った人が、最後は黙り込んだ。\n封筒には、なぜか二枚目の切手が貼ってあった。","しばらくして、短い手紙が届いた。差出人は和紙を干す職人。\n「手を動かしてみよう」と返したら、思い切って口に出してみた。\n例の「風の強い日だけ紙が踊ります」の件は、説明を求められ、余計に話が大きくなった。\n「今度はあなたの話も聞かせて」と書き添えられていた。","二日後、和紙を干す職人から二通目。\n「その味を残そう」を実行する前に、風の強い日だけ紙が踊りますという話を思い出したらしい。\nまず紙に書き出してみた。最初に笑った人が、最後は黙り込んだ。\n追伸には「次は自分で決めてみます」とあった。"]},"en":{"from":"差出人：和紙を干す職人","body":"風の強い日だけ紙が踊ります。失敗なのに少し見とれます。","choices":["使う人に聞いてみよう","手を動かしてみよう","その味を残そう"],"ends":["翌週、短い手紙が届いた。差出人は和紙を干す職人。\n「使う人に聞いてみよう」と返したら、誰にも言わずに実行した。\n例の「風の強い日だけ紙が踊ります」の件は、最初に笑った人が、最後は黙り込んだ。\n封筒には、なぜか二枚目の切手が貼ってあった。","しばらくして、短い手紙が届いた。差出人は和紙を干す職人。\n「手を動かしてみよう」と返したら、思い切って口に出してみた。\n例の「風の強い日だけ紙が踊ります」の件は、説明を求められ、余計に話が大きくなった。\n「今度はあなたの話も聞かせて」と書き添えられていた。","二日後、和紙を干す職人から二通目。\n「その味を残そう」を実行する前に、風の強い日だけ紙が踊りますという話を思い出したらしい。\nまず紙に書き出してみた。最初に笑った人が、最後は黙り込んだ。\n追伸には「次は自分で決めてみます」とあった。"]}},{"ja":{"from":"差出人：印鑑を彫る新人","body":"名前を一文字間違える夢ばかり見ます。寝る前も漢字を練習しています。","choices":["手を動かしてみよう","その味を残そう","使う人に聞いてみよう"],"ends":["翌日の昼、印鑑を彫る新人が、例の「名前を一文字間違える夢ばかり見ます」について書いてきた。\n「手を動かしてみよう」の返事をきっかけに、まず紙に書き出してみた。\nそれが新しい習慣になりそうだ。\n「たぶんこれでよかった」と短く締めくくられていた。","返事を出した翌朝、印鑑を彫る新人から追伸が来た。\n「その味を残そう」を選んだことを伝えると、少しだけ勇気を出してみた。\n名前を一文字間違える夢ばかり見ます――その話が、今度は別の意味で広まっている。思わぬところで拍手が起きた。\n次の手紙には、なぜか謝礼のつもりのシールが入っていた。","次の朝、封筒に印鑑を彫る新人の名前があった。\n「使う人に聞いてみよう」の通りにするか迷った末、まず紙に書き出してみた。\n名前を一文字間違える夢ばかり見ます。そこから思いもしないことが起きた。一人だけ、まったく別の解釈をした。\n「誰にも内緒にしてください」と、しっかり赤字で書かれていた。"]},"en":{"from":"差出人：印鑑を彫る新人","body":"名前を一文字間違える夢ばかり見ます。寝る前も漢字を練習しています。","choices":["手を動かしてみよう","その味を残そう","使う人に聞いてみよう"],"ends":["翌日の昼、印鑑を彫る新人が、例の「名前を一文字間違える夢ばかり見ます」について書いてきた。\n「手を動かしてみよう」の返事をきっかけに、まず紙に書き出してみた。\nそれが新しい習慣になりそうだ。\n「たぶんこれでよかった」と短く締めくくられていた。","返事を出した翌朝、印鑑を彫る新人から追伸が来た。\n「その味を残そう」を選んだことを伝えると、少しだけ勇気を出してみた。\n名前を一文字間違える夢ばかり見ます――その話が、今度は別の意味で広まっている。思わぬところで拍手が起きた。\n次の手紙には、なぜか謝礼のつもりのシールが入っていた。","次の朝、封筒に印鑑を彫る新人の名前があった。\n「使う人に聞いてみよう」の通りにするか迷った末、まず紙に書き出してみた。\n名前を一文字間違える夢ばかり見ます。そこから思いもしないことが起きた。一人だけ、まったく別の解釈をした。\n「誰にも内緒にしてください」と、しっかり赤字で書かれていた。"]}},{"ja":{"from":"差出人：椅子の脚を直す大工","body":"座る人の体重より、思い出の重さを聞かされます。","choices":["その味を残そう","使う人に聞いてみよう","手を動かしてみよう"],"ends":["週末になって、椅子の脚を直す大工から追伸が来た。\n「その味を残そう」を選んだことを伝えると、まず紙に書き出してみた。\n座る人の体重より、思い出の重さを聞かされます――その話が、今度は別の意味で広まっている。結果より、その途中の顔が忘れられないらしい。\n結局、本人が一番楽しそうだった。","その夜、椅子の脚を直す大工が、例の「座る人の体重より、思い出の重さを聞かされます」について書いてきた。\n「使う人に聞いてみよう」の返事をきっかけに、予定外の相   for(const ch of Array.from(value)){if(ch==='\n'||ctx.measureText(line+ch).width>maxWidth){if(line){ctx.fillText(line,x,y+n*lineHeight);n++;line=''}if(n>=maxLines)return y+n*lineHeight;if(ch==='\n')continue;}line+=ch}
  if(line&&n<maxLines){ctx.fillText(line,x,y+n*lineHeight);n++}return y+n*lineHeight;
 }
 let y=260;y=wrap(s.from,80,y,920,48,2,'bold 33px sans-serif','#79634e')+50;
 y=wrap(s.body,80,y,920,62,10,'38px sans-serif','#273451')+90;
 const reply=savedReply|| (choice>=0?s.choices[choice]:'');
 if(reply){ctx.fillStyle='#d9c9b0';ctx.fillRect(80,y-38,920,2);y+=25;ctx.font='bold 29px sans-serif';ctx.fillStyle='#8b7965';ctx.fillText('わたしの返事',80,y);y+=65;wrap(reply,80,y,920,58,5,'bold 37px sans-serif','#273451')}
 ctx.font='28px sans-serif';ctx.fillStyle='#8b7965';ctx.fillText('あなたなら何て返す？',80,1250);
 ctx.font='23px Georgia, serif';ctx.fillText('Pigeon  ·  '+location.origin+location.pathname,80,1294);
 const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/png'));
 if(!blob){el('status').textContent='画像を作成できませんでした';return}
 const file=new File([blob],'pigeon-letter.png',{type:'image/png'});
 try{if(navigator.canShare&&navigator.canShare({files:[file]})&&navigator.share){await navigator.share({files:[file],title:'Pigeon'});return}}catch(e){if(e.name==='AbortError')return}
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='pigeon-letter.png';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),3000);
 el('status').textContent='画像を保存したよ。SNSに投稿してね 🕊️';
}

el('shareLetter').onclick=shareLetter;el('copyLetter').onclick=copyLetter;el('birdButton').onclick=newLetter;el('write').onclick=write;el('writeDirect').onclick=write;el('noReply').onclick=()=>finish(false);el('send').onclick=async()=>{const value=el('reply').value.trim();if(!value)return;savedReply=value;finish(true);await shareLetter()};el('skip').onclick=()=>finish(false);el('next').onclick=newLetter;el('nextLetter').onclick=newLetter;el('homeNow').onclick=goHome;el('lang').onclick=()=>{language=language==='ja'?'en':'ja';localStorage.setItem('pigeon-lang',language);stopSpeech();ui()};el('sound').onclick=()=>{sound=!sound;localStorage.setItem('pigeon-sound',sound?'on':'off');if(!sound){stopSpeech();musicStop()}else{musicStart();if(current)speak(choice<0?current[language].body:current[language].ends[choice])}ui()};window.addEventListener('pagehide',()=>{stopSpeech();musicStop()});ui();const params=new URL(location.href).searchParams;const shared=params.get('letter');if(shared&&/^\d+$/.test(shared)&&Number(shared)>=1&&Number(shared)<=stories.length){idx=Number(shared)-1;current=stories[idx];incomingReply=decodeReply(params.get('reply')||'');hide('home');show('panel');renderLetter();el('status').textContent=t('友達から手紙が届いたよ 🕊️','A friend sent you a letter 🕊️')}
